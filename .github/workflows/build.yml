name: Build DocReader APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: Accept SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > $ANDROID_HOME/licenses/android-sdk-license
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > $ANDROID_HOME/licenses/android-sdk-preview-license
          printf '33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n' > $ANDROID_HOME/licenses/android-googletv-license

      - name: Write all project files
        run: |
          python3 -c "import base64; exec(base64.b64decode('').decode())"

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: DocReader-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
