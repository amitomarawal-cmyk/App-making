          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.GridLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import java.util.ArrayList;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Set;
          public class DockManagerActivity extends Activity {
              private SharedPreferences prefs;
              private List<AppInfo> allApps=new ArrayList<>();
              private LinearLayout currentDockView;
              private List<String> dockPkgs=new ArrayList<>();
              private TextView dockCount;
              private static final int MAX=6;
              @Override protected void onCreate(Bundle s){
                  super.onCreate(s);setContentView(R.layout.activity_dock_manager);
                  prefs=getSharedPreferences("dock_prefs",MODE_PRIVATE);
                  currentDockView=findViewById(R.id.currentDockView);
                  dockCount=findViewById(R.id.dockCount);
                  Set<String> saved=prefs.getStringSet("dock_apps",null);
                  if(saved!=null)dockPkgs.addAll(saved);
                  RecyclerView rv=findViewById(R.id.allAppsForDock);
                  rv.setLayoutManager(new GridLayoutManager(this,4));
                  loadAllApps(rv);
                  findViewById(R.id.btnDockBack).setOnClickListener(v->{
                      prefs.edit().putStringSet("dock_apps",new LinkedHashSet<>(dockPkgs)).apply();
                      setResult(RESULT_OK);finish();
                  });
              }
              private void loadAllApps(RecyclerView rv){
                  new Thread(()->{
                      Intent intent=new Intent(Intent.ACTION_MAIN,null);intent.addCategory(Intent.CATEGORY_LAUNCHER);
                      PackageManager pm=getPackageManager();
                      List<ResolveInfo> res=pm.queryIntentActivities(intent,0);
                      for(ResolveInfo ri:res){
                          String pkg=ri.activityInfo.packageName;
                          if(!pkg.equals(getPackageName()))
                              allApps.add(new AppInfo(ri.loadLabel(pm).toString(),pkg,ri.loadIcon(pm),0,false));
                      }
                      allApps.sort((a,b)->a.label.compareToIgnoreCase(b.label));
                      runOnUiThread(()->{
                          rv.setAdapter(new RecyclerView.Adapter<RecyclerView.ViewHolder>(){
                              @NonNull @Override public RecyclerView.ViewHolder onCreateViewHolder(@NonNull ViewGroup p,int t){
                                  return new RecyclerView.ViewHolder(LayoutInflater.from(p.getContext()).inflate(R.layout.item_dock_app,p,false)){};
                              }
                              @Override public void onBindViewHolder(@NonNull RecyclerView.ViewHolder h,int pos){
                                  AppInfo a=allApps.get(pos);
                                  ((ImageView)h.itemView.findViewById(R.id.dockIcon)).setImageDrawable(a.icon);
                                  ((TextView)h.itemView.findViewById(R.id.dockName)).setText(a.label);
                                  boolean in=dockPkgs.contains(a.packageName);
                                  h.itemView.setAlpha(in?0.35f:1f);
                                  h.itemView.setOnClickListener(v->{
                                      if(dockPkgs.contains(a.packageName)){Toast.makeText(DockManagerActivity.this,"Already in dock",Toast.LENGTH_SHORT).show();return;}
                                      if(dockPkgs.size()>=MAX){Toast.makeText(DockManagerActivity.this,"Max "+MAX+" apps",Toast.LENGTH_SHORT).show();return;}
                                      dockPkgs.add(a.packageName);notifyItemChanged(pos);refreshDock();
                                  });
                              }
                              @Override public int getItemCount(){return allApps.size();}
                          });
                          refreshDock();
                      });
                  }).start();
              }
              private void refreshDock(){
                  currentDockView.removeAllViews();
                  dockCount.setText(dockPkgs.size()+"/"+MAX);
                  PackageManager pm=getPackageManager();
                  for(String pkg:new ArrayList<>(dockPkgs)){
                      LinearLayout cell=new LinearLayout(this);
                      cell.setOrientation(LinearLayout.VERTICAL);cell.setGravity(android.view.Gravity.CENTER);
                      LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(0,LinearLayout.LayoutParams.MATCH_PARENT,1f);cell.setLayoutParams(lp);
                      try{
                          ImageView iv=new ImageView(this);iv.setImageDrawable(pm.getApplicationIcon(pkg));
                          iv.setLayoutParams(new LinearLayout.LayoutParams(44,44));iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                          cell.addView(iv);
                          TextView rm=new TextView(this);rm.setText("✕");rm.setTextColor(0xFFEF5350);rm.setTextSize(10);
                          rm.setGravity(android.view.Gravity.CENTER);cell.addView(rm);
                      }catch(PackageManager.NameNotFoundException ignored){}
                      cell.setOnClickListener(v->{dockPkgs.remove(pkg);refreshDock();});
                      currentDockView.addView(cell);
                  }
              }
          }
          EOF

