     float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
     float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
     vec3 tx(vec2 d){return texture2D(uS,vT+vD*d.x+vE*d.y).rgb;}
     void main(){
     vec2 u=vU,d=vec2(0.);
     if(uP[16]>0.){vec2 n=vec2(uP[16],uP[16]/uAs);d=(floor(u*n)+.5)/n-u;}
     if(uP[17]>0.){float bd=step(.96,h(vec2(floor(u.y*30.),floor(uTm*8.))));d.x+=uP[17]*(bd*.03*(h(vec2(u.y,uTm))-.5)*2.+sin(u.y*40.+uTm*5.)*.0015);}
     float sh=uP[10];
     vec3 c=vec3(tx(d+vec2(sh,0.)).r,tx(d).g,tx(d-vec2(sh,0.)).b);
     float z=uP[14];
     if(z>0.){vec3 a=(tx(d+vec2(.012,.012))+tx(d+vec2(-.012,.012))+tx(d+vec2(.012,-.012))+tx(d+vec2(-.012,-.012)))*.25;c=mix(c,a,z*.5)+max(a-.55,0.)*z;}
     if(uDro>0.){c=pow(max(c,vec3(0.)),vec3(1.-.35*uDro));c=c/(1.+.25*uDro*c)*(1.+.25*uDro);}
     vec3 tn=vec3(uP[3],uP[4],uP[5]);
     c*=vec3(1.+uWb*.3,1.,1.-uWb*.3)*tn;
