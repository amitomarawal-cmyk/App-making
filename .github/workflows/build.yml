      - name: Gradle wrapper
        run: |
          if ! (curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew && curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar); then
            curl -fsSL -o gradle-dist.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q gradle-dist.zip
            ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Awal-PDF-Reader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
