package com.awal.pdfreader;
import android.Manifest;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.database.Cursor;
import android.net.Uri;
import android.os.Build;
import android.os.Bundle;
import android.provider.OpenableColumns;
import android.widget.Button;
import androidx.appcompat.app.AppCompatActivity;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;
import androidx.recyclerview.widget.LinearLayoutManager;
import androidx.recyclerview.widget.RecyclerView;
import java.util.List;
public class MainActivity extends AppCompatActivity {
    private static final int REQ_PICK = 1001, REQ_PERM = 1002;
    private RecentFilesManager manager;
    private RecentAdapter adapter;
    private List<RecentFile> files;
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        manager = new RecentFilesManager(this);
        files = manager.getAll();
        RecyclerView rv = findViewById(R.id.rv_recent);
        rv.setLayoutManager(new LinearLayoutManager(this));
        adapter = new RecentAdapter(files, new RecentAdapter.OnItemClick() {
            @Override public void onOpen(RecentFile f) { openViewer(Uri.parse(f.path), f.name); }
            @Override public void onDelete(RecentFile f, int pos) { manager.remove(f.path); adapter.remove(pos); }
        });
        rv.setAdapter(adapter);
        Button btn = findViewById(R.id.btn_open);
        btn.setOnClickListener(v -> checkPermAndPick());
        Intent intent = getIntent();
        if (Intent.ACTION_VIEW.equals(intent.getAction()) && intent.getData() != null)
            openViewer(intent.getData(), getFileName(intent.getData()));
    }
    @Override
    protected void onResume() {
        super.onResume();
        files.clear(); files.addAll(manager.getAll()); adapter.notifyDataSetChanged();
    }
    private void checkPermAndPick() {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) { pickPdf(); return; }
        if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE)
            == PackageManager.PERMISSION_GRANTED) { pickPdf(); return; }
        ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, REQ_PERM);
    }
    @Override
    public void onRequestPermissionsResult(int req, String[] perms, int[] results) {
        super.onRequestPermissionsResult(req, perms, results);
        if (req == REQ_PERM && results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED) pickPdf();
    }
    private void pickPdf() {
        Intent i = new Intent(Intent.ACTION_GET_CONTENT);
        i.setType("application/pdf"); i.addCategory(Intent.CATEGORY_OPENABLE);
        startActivityForResult(Intent.createChooser(i, "Select PDF"), REQ_PICK);
    }
    @Override
    protected void onActivityResult(int req, int res, Intent data) {
        super.onActivityResult(req, res, data);
        if (req == REQ_PICK && res == RESULT_OK && data != null && data.getData() != null)
            openViewer(data.getData(), getFileName(data.getData()));
    }
    private void openViewer(Uri uri, String name) {
        Intent i = new Intent(this, PdfViewerActivity.class);
        i.putExtra("uri", uri.toString()); i.putExtra("name", name); startActivity(i);
    }
    private String getFileName(Uri uri) {
        String name = "document.pdf";
        try (Cursor c = getContentResolver().query(uri, null, null, null, null)) {
            if (c != null && c.moveToFirst()) {
                int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                if (idx >= 0) name = c.getString(idx);
            }
        } catch (Exception ignored) {}
        return name;
    }
}
