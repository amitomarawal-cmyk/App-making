                  cGal.setOnClickListener(v -> startActivity(new Intent(this, GalleryActivity.class)));
                  sh.setOnClickListener(v -> shoot());
                  zoom.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar b, int p, boolean u) {
                          if (u && cam != null) cam.getCameraControl().setLinearZoom(p / 100f);
                      }
                      public void onStartTrackingTouch(SeekBar b) { }
                      public void onStopTrackingTouch(SeekBar b) { }
                  });
                  exp.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar b, int p, boolean u) {
                          if (u && cam != null) cam.getCameraControl().setExposureCompensationIndex(p + expLo);
                      }
                      public void onStartTrackingTouch(SeekBar b) { }
                      public void onStopTrackingTouch(SeekBar b) { }
                  });
                  final ScaleGestureDetector sg = new ScaleGestureDetector(this, new ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      @Override
                      public boolean onScale(ScaleGestureDetector d) {
                          if (cam != null) {
                              ZoomState z = cam.getCameraInfo().getZoomState().getValue();
                              float r = z.getZoomRatio() * d.getScaleFactor();
                              r = Math.max(z.getMinZoomRatio(), Math.min(z.getMaxZoomRatio(), r));
                              cam.getCameraControl().setZoomRatio(r);
                          }
                          return true;
                      }
                  });
                  final GestureDetector gdt = new GestureDetector(this, new GestureDetector.SimpleOnGestureListener() {
                      @Override
                      public boolean onSingleTapUp(MotionEvent e) {
                          focusAt(e.getX(), e.getY());
                          return true;
                      }
                  });
                  pv.setOnTouchListener((v, e) -> { sg.onTouchEvent(e); gdt.onTouchEvent(e); return true; });

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) startCam();
                  else ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, 1);
              }

              @Override
              public void onRequestPermissionsResult(int rc, String[] p, int[] r) {
                  super.onRequestPermissionsResult(rc, p, r);
                  if (r.length > 0 && r[0] == PackageManager.PERMISSION_GRANTED) startCam();
              }

              void startCam() {
                  final var f = ProcessCameraProvider.getInstance(this);
                  f.addListener(() -> {
                      try { prov = f.get(); bind(); } catch (Exception e) { }
                  }, ContextCompat.getMainExecutor(this));
              }

              void bind() {
                  if (prov == null) return;
                  try {
                      Preview pr = new Preview.Builder().build();
                      pr.setSurfaceProvider(pv.getSurfaceProvider());
                      ic = new ImageCapture.Builder().setFlashMode(FM[fl]).build();
                      ImageAnalysis ia = new ImageAnalysis.Builder().setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST).build();
                      ia.setAnalyzer(ax, img -> {
                          if (collecting) { try { grab(img); } catch (Exception e) { } }
                          img.close();
                      });
                      ViewPort vp = new ViewPort.Builder(RAT[ri], Surface.ROTATION_0).build();
                      UseCaseGroup g = new UseCaseGroup.Builder().setViewPort(vp).addUseCase(pr).addUseCase(ic).addUseCase(ia).build();
                      prov.unbindAll();
                      cam = prov.bindToLifecycle(this, front ? CameraSelector.DEFAULT_FRONT_CAMERA : CameraSelector.DEFAULT_BACK_CAMERA, g);
                      ExposureState es = cam.getCameraInfo().getExposureState();
                      Range<Integer> r = es.getExposureCompensationRange();
                      expLo = r.getLower();
                      exp.setEnabled(r.getUpper() > r.getLower());
                      exp.setMax(Math.max(1, r.getUpper() - r.getLower()));
                      exp.setProgress(es.getExposureCompensationIndex() - expLo);
                      zoom.setProgress(0);
                  } catch (Exception e) {
                      toast("Camera error");
                  }
              }

              void focusAt(float x, float y) {
                  if (cam == null) return;
                  MeteringPoint p = pv.getMeteringPointFactory().createPoint(x, y);
                  cam.getCameraControl().startFocusAndMetering(new FocusMeteringAction.Builder(p).disableAutoCancel().build());
                  ov.ring(x, y);
              }

              void grab(ImageProxy img) {
                  Rect cr = img.getCropRect();
                  int rot = img.getImageInfo().getRotationDegrees();
                  ImageProxy.PlaneProxy pl = img.getPlanes()[0];
                  ByteBuffer bb = pl.getBuffer();
                  int rs = pl.getRowStride(), ps = pl.getPixelStride();
                  int cw = cr.width(), ch = cr.height();
                  boolean sw = rot == 90 || rot == 270;
                  int UW = sw ? ch : cw, UH = sw ? cw : ch;
                  int fw = FW, fh = Math.max(16, Math.round(FW * (float) UH / UW));
                  byte[] o = new byte[fw * fh];
                  for (int y = 0; y < fh; y++) {
                      for (int x = 0; x < fw; x++) {
                          int ix = Math.min(UW - 1, (int) ((x + 0.5f) * UW / fw)), iy = Math.min(UH - 1, (int) ((y + 0.5f) * UH / fh));
                          int sx, sy;
                          switch (rot) {
                              case 90: sx = iy; sy = ch - 1 - ix; break;
                              case 180: sx = cw - 1 - ix; sy = ch - 1 - iy; break;
                              case 270: sx = cw - 1 - iy; sy = ix; break;
                              default: sx = ix; sy = iy;
                          }
                          sx = Math.max(0, Math.min(cw - 1, sx));
                          sy = Math.max(0, Math.min(ch - 1, sy));
                          o[y * fw + x] = bb.get((cr.top + sy) * rs + (cr.left + sx) * ps);
                      }
                  }
                  ffw = fw;
                  ffh = fh;
                  frames.add(o);
              }

              void shoot() {
                  if (ic == null) return;
                  final File out = new File(getExternalFilesDir("photos"), System.currentTimeMillis() + ".jpg");
                  ic.takePicture(new ImageCapture.OutputFileOptions.Builder(out).build(), ContextCompat.getMainExecutor(this),
                          new ImageCapture.OnImageSavedCallback() {
                              @Override
                              public void onImageSaved(ImageCapture.OutputFileResults r) {
                                  Processor.enqueue(out);
                                  if (sweep) shake(out); else toast("Saved. Depth processing in background");
                              }

                              @Override
                              public void onError(ImageCaptureException e) { toast("Capture failed"); }
                          });
              }

              void shake(final File out) {
                  frames.clear();
                  collecting = true;
                  msg.setText("\u2194 Shake phone gently \u2195");
                  msg.setVisibility(View.VISIBLE);
                  h.postDelayed(() -> {
                      collecting = false;
                      msg.setVisibility(View.GONE);
                      final List<byte[]> fr = new ArrayList<>(frames);
                      final int w = ffw, hh = ffh;
                      Processor.Q.execute(() -> {
                          try {
                              int[] sz = new int[2];
                              byte[] d = Motion.depth(fr, w, hh, sz);
                              if (d != null) {
                                  try (DataOutputStream o = new DataOutputStream(new FileOutputStream(new File(out.getPath() + ".d")))) {
                                      o.writeInt(sz[0]);
                                      o.writeInt(sz[1]);
                                      o.write(d);
                                  }
                              }
                              final String m = d != null ? "Motion depth ready" : "Not enough motion: using AI mask only";
                              h.post(() -> toast(m));
                          } catch (Exception e) { }
                      });
                  }, 1600);
              }
          }
          EOF

