              private final HandlerThread thread;
              private final Handler handler;
              public final Executor executor;

              public interface GainListener {
                  void onGain(float gain);
              }

              private volatile boolean autoOn = true;
              private volatile GainListener gainListener;
              private float gain = 1f, lastReported = 1f;
              private int frameCount = 0;
              private int fbo, fboTex;
              private int uGain, uGamma;
              private final ByteBuffer pix = ByteBuffer.allocateDirect(32 * 32 * 4).order(ByteOrder.nativeOrder());
              private final Consumer<Throwable> errorCb;

              private volatile Filter filter;
              private Filter cachedFor;
              private final float[] mat3 = new float[9];
              private final float[] off = new float[3];

              private EGLDisplay dpy = EGL14.EGL_NO_DISPLAY;
              private EGLContext ctx = EGL14.EGL_NO_CONTEXT;
              private EGLConfig cfg;
              private EGLSurface pbuf = EGL14.EGL_NO_SURFACE;
              private boolean glReady = false;
              private volatile boolean released = false;

              private int prog, oesTex;
              private int uTexM, uColor, uOff, uVig, uLeak, uSide, uGrain, uRes, uTime;
              private FloatBuffer quad;

              private SurfaceTexture inTex;
              private Surface inSurface;
              private final float[] texMat = new float[16];
              private final List<Out> outs = new ArrayList<>();

              public VideoFx(Consumer<Throwable> errorCb) {
                  this.errorCb = errorCb;
                  thread = new HandlerThread("RetroLensGL");
                  thread.start();
                  handler = new Handler(thread.getLooper());
                  executor = r -> handler.post(r);
              }

              public void setFilter(Filter f) {
                  filter = f;
              }

              public void setAutoBrighten(boolean on) {
                  autoOn = on;
              }

              public void setGainListener(GainListener l) {
                  gainListener = l;
              }

              public void close() {
                  handler.postDelayed(() -> {
                      released = true;
                      try {
                          for (Out o : new ArrayList<>(outs)) {
                              destroySurface(o.es);
                              try { o.out.close(); } catch (Exception ignored) { }
                          }
                          outs.clear();
                          if (inTex != null) { inTex.setOnFrameAvailableListener(null); }
                          if (glReady) {
                              destroySurface(pbuf);
                              if (ctx != EGL14.EGL_NO_CONTEXT) {
                                  EGL14.eglMakeCurrent(dpy, EGL14.EGL_NO_SURFACE, EGL14.EGL_NO_SURFACE, EGL14.EGL_NO_CONTEXT);
                                  EGL14.eglDestroyContext(dpy, ctx);
                              }
                          }
                      } catch (Exception ignored) {
                      }
                      thread.quitSafely();
                  }, 1500);
              }

              // ---------------------------------------------------------------- SurfaceProcessor

              @Override
              public void onInputSurface(final SurfaceRequest request) {
                  try {
                      ensureGl();
                      Size size = request.getResolution();
                      final SurfaceTexture st = new SurfaceTexture(oesTex);
                      st.setDefaultBufferSize(size.getWidth(), size.getHeight());
                      final Surface surface = new Surface(st);
                      inTex = st;
                      inSurface = surface;
                      st.setOnFrameAvailableListener(t -> drawFrame(), handler);
                      request.provideSurface(surface, executor, result -> {
                          try {
                              st.setOnFrameAvailableListener(null);
                              st.release();
                              surface.release();
                          } catch (Exception ignored) {
                          }
                          if (inTex == st) {
                              inTex = null;
                              inSurface = null;
                          }
                      });
                  } catch (Throwable t) {
                      fail(t);
                      request.willNotProvideSurface();
                  }
              }

              @Override
              public void onOutputSurface(final SurfaceOutput output) {
                  try {
                      ensureGl();
                      final Out o = new Out();
                      o.out = output;
                      Surface s = output.getSurface(executor, ev -> {
                          outs.remove(o);
                          destroySurface(o.es);
                          output.close();
                      });
                      int[] a = {EGL14.EGL_NONE};
                      o.es = EGL14.eglCreateWindowSurface(dpy, cfg, s, a, 0);
                      outs.add(o);
                  } catch (Throwable t) {
                      fail(t);
                  }
              }

              private void fail(Throwable t) {
                  try {
                      errorCb.accept(t);
                  } catch (Exception ignored) {
                  }
              }

              // ---------------------------------------------------------------- GL

              private void ensureGl() {
                  if (glReady) return;
                  dpy = EGL14.eglGetDisplay(EGL14.EGL_DEFAULT_DISPLAY);
                  int[] ver = new int[2];
                  EGL14.eglInitialize(dpy, ver, 0, ver, 1);
                  EGLConfig[] cfgs = new EGLConfig[1];
                  int[] n = new int[1];
                  int[] withRec = {EGL14.EGL_RED_SIZE, 8, EGL14.EGL_GREEN_SIZE, 8, EGL14.EGL_BLUE_SIZE, 8,
                          EGL14.EGL_ALPHA_SIZE, 8, EGL14.EGL_RENDERABLE_TYPE, EGL14.EGL_OPENGL_ES2_BIT,
                          EGLExt.EGL_RECORDABLE_ANDROID, 1, EGL14.EGL_NONE};
                  int[] noRec = {EGL14.EGL_RED_SIZE, 8, EGL14.EGL_GREEN_SIZE, 8, EGL14.EGL_BLUE_SIZE, 8,
                          EGL14.EGL_ALPHA_SIZE, 8, EGL14.EGL_RENDERABLE_TYPE, EGL14.EGL_OPENGL_ES2_BIT,
                          EGL14.EGL_NONE};
                  if (!EGL14.eglChooseConfig(dpy, withRec, 0, cfgs, 0, 1, n, 0) || n[0] == 0) {
                      if (!EGL14.eglChooseConfig(dpy, noRec, 0, cfgs, 0, 1, n, 0) || n[0] == 0) {
                          throw new RuntimeException("No EGL config");
                      }
                  }
                  cfg = cfgs[0];
                  int[] ca = {EGL14.EGL_CONTEXT_CLIENT_VERSION, 2, EGL14.EGL_NONE};
                  ctx = EGL14.eglCreateContext(dpy, cfg, EGL14.EGL_NO_CONTEXT, ca, 0);
                  int[] pa = {EGL14.EGL_WIDTH, 1, EGL14.EGL_HEIGHT, 1, EGL14.EGL_NONE};
                  pbuf = EGL14.eglCreatePbufferSurface(dpy, cfg, pa, 0);
                  if (!EGL14.eglMakeCurrent(dpy, pbuf, pbuf, ctx)) throw new RuntimeException("eglMakeCurrent failed");

                  int[] t = new int[1];
                  GLES20.glGenTextures(1, t, 0);
                  oesTex = t[0];
                  GLES20.glBindTexture(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, oesTex);
                  GLES20.glTexParameteri(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR);
                  GLES20.glTexParameteri(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR);
                  GLES20.glTexParameteri(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE);
                  GLES20.glTexParameteri(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE);

                  int vs = compile(GLES20.GL_VERTEX_SHADER, VS);
                  int fs = compile(GLES20.GL_FRAGMENT_SHADER, FS);
                  prog = GLES20.glCreateProgram();
                  GLES20.glAttachShader(prog, vs);
                  GLES20.glAttachShader(prog, fs);
                  GLES20.glLinkProgram(prog);
                  int[] ok = new int[1];
                  GLES20.glGetProgramiv(prog, GLES20.GL_LINK_STATUS, ok, 0);
                  if (ok[0] == 0) throw new RuntimeException("link: " + GLES20.glGetProgramInfoLog(prog));
                  uTexM = GLES20.glGetUniformLocation(prog, "uTexM");
                  uColor = GLES20.glGetUniformLocation(prog, "uColor");
                  uOff = GLES20.glGetUniformLocation(prog, "uOff");
                  uVig = GLES20.glGetUniformLocation(prog, "uVig");
                  uLeak = GLES20.glGetUniformLocation(prog, "uLeak");
                  uSide = GLES20.glGetUniformLocation(prog, "uSide");
                  uGrain = GLES20.glGetUniformLocation(prog, "uGrain");
                  uRes = GLES20.glGetUniformLocation(prog, "uRes");
                  uTime = GLES20.glGetUniformLocation(prog, "uTime");
                  uGain = GLES20.glGetUniformLocation(prog, "uGain");
                  uGamma = GLES20.glGetUniformLocation(prog, "uGamma");

                  int[] tx = new int[1];
                  GLES20.glGenTextures(1, tx, 0);
                  fboTex = tx[0];
                  GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, fboTex);
                  GLES20.glTexImage2D(GLES20.GL_TEXTURE_2D, 0, GLES20.GL_RGBA, 32, 32, 0,
                          GLES20.GL_RGBA, GLES20.GL_UNSIGNED_BYTE, null);
                  GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR);
                  GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR);
                  GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE);
                  GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE);
                  int[] fb = new int[1];
                  GLES20.glGenFramebuffers(1, fb, 0);
                  fbo = fb[0];
                  GLES20.glBindFramebuffer(GLES20.GL_FRAMEBUFFER, fbo);
                  GLES20.glFramebufferTexture2D(GLES20.GL_FRAMEBUFFER, GLES20.GL_COLOR_ATTACHMENT0,
                          GLES20.GL_TEXTURE_2D, fboTex, 0);
                  GLES20.glBindFramebuffer(GLES20.GL_FRAMEBUFFER, 0);

                  float[] v = {
                          -1f, -1f, 0f, 0f,
                          1f, -1f, 1f, 0f,
                          -1f, 1f, 0f, 1f,
                          1f, 1f, 1f, 1f};
