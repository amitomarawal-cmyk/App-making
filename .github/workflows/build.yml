import 'dart:io';
import 'dart:isolate';
import 'package:flutter/material.dart';
import 'package:archive/archive_io.dart';
import 'package:xml/xml.dart';
import 'package:hive_flutter/hive_flutter.dart';

Future<List<Map<String, dynamic>>> _parsePptx(String path) async {
  final bytes = File(path).readAsBytesSync();
  final archive = ZipDecoder().decodeBytes(bytes);
  final slides = <Map<String, dynamic>>[];
  int i = 1;
  while (true) {
    final f = archive.findFile('ppt/slides/slide$i.xml');
    if (f == null) break;
    final xmlStr = String.fromCharCodes(f.content as List<int>);
    final doc = XmlDocument.parse(xmlStr);
    final texts = doc
        .findAllElements('a:t')
        .map((e) => e.innerText.trim())
        .where((t) => t.isNotEmpty)
        .toList();
    slides.add({'index': i, 'texts': texts});
    i++;
  }
  return slides;
}

class PptxViewerScreen extends StatefulWidget {
  final String filePath;
  const PptxViewerScreen({super.key, required this.filePath});
  @override
  State<PptxViewerScreen> createState() => _PptxViewerScreenState();
}

class _PptxViewerScreenState extends State<PptxViewerScreen> {
  List<Map<String, dynamic>> _slides = [];
  int _currentSlide = 0;
  bool _loading = true;
  String? _error;
  late PageController _pageCtrl;

  @override
  void initState() {
    super.initState();
    final saved = Hive.box('filePositions').get(widget.filePath);
    _currentSlide = (saved is Map ? saved['page'] as int? : null) ?? 0;
    _pageCtrl = PageController(initialPage: _currentSlide);
    _load();
  }

  Future<void> _load() async {
    try {
      final slides = await Isolate.run(() => _parsePptx(widget.filePath));
      setState(() {
        _slides = slides;
        _loading = false;
      });
    } catch (e) {
      setState(() {
        _error = 'Cannot open PPTX: $e';
        _loading = false;
      });
    }
  }

  void _savePosition(int page) {
    Hive.box('filePositions').put(widget.filePath, {'page': page});
  }

  @override
  void dispose() {
    _pageCtrl.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: Text(_slides.isNotEmpty
            ? 'Slide ${_currentSlide + 1} / ${_slides.length}'
            : 'PPTX Viewer'),
      ),
      body: _loading
          ? const Center(child: CircularProgressIndicator())
          : _error != null
              ? Center(
                  child: Text(_error!,
                      style: const TextStyle(color: Colors.red),
                      textAlign: TextAlign.center))
              : _slides.isEmpty
                  ? const Center(child: Text('No slides found'))
                  : PageView.builder(
                      controller: _pageCtrl,
                      itemCount: _slides.length,
                      onPageChanged: (i) {
                        setState(() => _currentSlide = i);
                        _savePosition(i);
                      },
                      itemBuilder: (_, idx) {
                        final slide = _slides[idx];
                        final texts =
                            (slide['texts'] as List).cast<String>();
                        return Container(
                          margin: const EdgeInsets.all(16),
                          decoration: BoxDecoration(
                            gradient: LinearGradient(
                              colors: [
                                Colors.indigo.shade700,
                                Colors.indigo.shade400
                              ],
                              begin: Alignment.topLeft,
                              end: Alignment.bottomRight,
                            ),
                            borderRadius: BorderRadius.circular(12),
                          ),
                          child: Padding(
                            padding: const EdgeInsets.all(24),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(
                                  'Slide ${slide['index']}',
                                  style: const TextStyle(
                                      color: Colors.white54, fontSize: 13),
                                ),
                                const SizedBox(height: 12),
                                ...texts.asMap().entries.map((e) => Padding(
                                      padding: const EdgeInsets.symmetric(
                                          vertical: 4),
                                      child: Text(
                                        e.value,
                                        style: TextStyle(
                                          color: Colors.white,
                                          fontSize:
                                              e.key == 0 ? 22 : 16,
                                          fontWeight: e.key == 0
                                              ? FontWeight.bold
                                              : FontWeight.normal,
                                        ),
                                      ),
                                    )),
                              ],
                            ),
                          ),
                        );
                      },
                    ),
      bottomNavigationBar: _slides.isNotEmpty
          ? BottomAppBar(
              child: Row(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  IconButton(
                      icon: const Icon(Icons.arrow_back_ios),
                      onPressed: _currentSlide > 0
                          ? () => _pageCtrl.previousPage(
                              duration: const Duration(milliseconds: 300),
                              curve: Curves.easeInOut)
                          : null),
                  Text('${_currentSlide + 1} / ${_slides.length}',
                      style: const TextStyle(fontSize: 16)),
                  IconButton(
                      icon: const Icon(Icons.arrow_forward_ios),
                      onPressed: _currentSlide < _slides.length - 1
                          ? () => _pageCtrl.nextPage(
                              duration: const Duration(milliseconds: 300),
                              curve: Curves.easeInOut)
                          : null),
                ],
              ),
            )
          : null,
    );
  }
}
