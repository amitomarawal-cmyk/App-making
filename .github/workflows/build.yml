          package com.awal.launcher;
          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.animation.AnimationUtils;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Locale;

          public class CalendarActivity extends Activity {
              private GridLayout calGrid, dayHeaders;
              private TextView monthYear;
              private Calendar showing;
              private int todayDay, todayMonth, todayYear;

              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_calendar);
                  calGrid = findViewById(R.id.calGrid);
                  dayHeaders = findViewById(R.id.dayHeaders);
                  monthYear = findViewById(R.id.monthYear);
                  Calendar now = Calendar.getInstance();
                  todayDay = now.get(Calendar.DAY_OF_MONTH);
                  todayMonth = now.get(Calendar.MONTH);
                  todayYear = now.get(Calendar.YEAR);
                  showing = (Calendar) now.clone();
                  View card = findViewById(R.id.calCard);
                  card.startAnimation(AnimationUtils.loadAnimation(this, R.anim.fade_in));
                  buildHeaders();
                  buildGrid();
                  findViewById(R.id.btnPrev).setOnClickListener(v -> { showing.add(Calendar.MONTH, -1); buildGrid(); });
                  findViewById(R.id.btnNext).setOnClickListener(v -> { showing.add(Calendar.MONTH, 1); buildGrid(); });
                  findViewById(R.id.btnClose).setOnClickListener(v -> finish());
                  findViewById(R.id.calCard).setOnClickListener(null);
                  getWindow().getDecorView().setOnClickListener(v -> finish());
              }

              private void buildHeaders() {
                  dayHeaders.removeAllViews();
                  String[] days = {"Su","Mo","Tu","We","Th","Fr","Sa"};
                  int w = getResources().getDisplayMetrics().widthPixels;
                  int cell = (w - 80) / 7;
                  for (String d : days) {
                      TextView tv = new TextView(this);
                      tv.setText(d);
                      tv.setTextColor(0xAA4FC3F7);
                      tv.setTextSize(12);
                      tv.setGravity(Gravity.CENTER);
                      tv.setTypeface(null, Typeface.BOLD);
                      GridLayout.LayoutParams lp = new GridLayout.LayoutParams();
                      lp.width = cell; lp.height = GridLayout.LayoutParams.WRAP_CONTENT;
                      tv.setLayoutParams(lp);
                      dayHeaders.addView(tv);
                  }
              }

              private void buildGrid() {
                  calGrid.removeAllViews();
                  SimpleDateFormat fmt = new SimpleDateFormat("MMMM yyyy", Locale.ENGLISH);
                  monthYear.setText(fmt.format(showing.getTime()));
                  int w = getResources().getDisplayMetrics().widthPixels;
                  int cell = (w - 80) / 7;
                  Calendar c = (Calendar) showing.clone();
                  c.set(Calendar.DAY_OF_MONTH, 1);
                  int first = c.get(Calendar.DAY_OF_WEEK) - 1;
                  int max = c.getActualMaximum(Calendar.DAY_OF_MONTH);
                  int curM = showing.get(Calendar.MONTH);
                  int curY = showing.get(Calendar.YEAR);
                  for (int i = 0; i < first; i++) addCell("", cell, false, false);
                  for (int d = 1; d <= max; d++) {
                      boolean isToday = (d == todayDay && curM == todayMonth && curY == todayYear);
                      addCell(String.valueOf(d), cell, isToday, true);
                  }
              }

              private void addCell(String text, int size, boolean today, boolean active) {
                  FrameLayout fl = new FrameLayout(this);
                  GridLayout.LayoutParams lp = new GridLayout.LayoutParams();
                  lp.width = size; lp.height = size;
                  fl.setLayoutParams(lp);
                  if (!text.isEmpty()) {
                      TextView tv = new TextView(this);
                      tv.setText(text);
                      tv.setGravity(Gravity.CENTER);
                      tv.setLayoutParams(new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT));
                      if (today) {
                          tv.setBackground(getDrawable(R.drawable.today_circle));
                          tv.setTextColor(Color.WHITE);
                          tv.setTypeface(null, Typeface.BOLD);
                          tv.setTextSize(13);
                      } else {
                          tv.setTextColor(active ? 0xFFFFFFFF : 0x44FFFFFF);
                          tv.setTextSize(13);
                      }
                      fl.addView(tv);
                  }
                  calGrid.addView(fl);
              }
          }
          // Needed inner FrameLayout
          class FrameLayout extends android.widget.FrameLayout {
              public FrameLayout(android.content.Context c){super(c);}
          }
          EOF

