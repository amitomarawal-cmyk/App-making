          cat > app/src/main/java/com/awal/pdfreader/Store.java << 'EOF'
          package com.awal.pdfreader;

          import android.content.Context;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.Arrays;

          public class Store {
              public static class Stroke {
                  public int page, color, n;
                  public float w;
                  public float[] p = new float[32];

                  public void add(float x, float y) {
                      if (n + 2 > p.length) p = Arrays.copyOf(p, p.length * 2);
                      p[n++] = x;
                      p[n++] = y;
                  }
              }

              public static class Txt {
                  public int page, color;
                  public float x, y, size;
                  public String t;
              }

              public static class Doc {
                  public String key, name, uri;
                  public int page, rot, mode, pages;
                  public float frac, zoom = 1f, txn;
                  public ArrayList<Integer> marks = new ArrayList<>();
                  public ArrayList<Stroke> strokes = new ArrayList<>();
                  public ArrayList<Txt> texts = new ArrayList<>();
              }

              public static class Entry {
                  public String key, name, uri;
                  public int page, pages;
                  public long time;
              }

              static final int MAX = 100;

              static File dir(Context c) {
                  File d = new File(c.getFilesDir(), "docs");
                  d.mkdirs();
                  return d;
              }

              public static String hash(String s) {
                  try {
                      byte[] b = MessageDigest.getInstance("SHA-1").digest(s.getBytes("UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      for (byte x : b) sb.append(String.format("%02x", x));
                      return sb.toString();
                  } catch (Exception e) {
                      return Integer.toHexString(s.hashCode());
                  }
              }

              static String read(File f) throws IOException {
                  FileInputStream in = new FileInputStream(f);
                  try {
                      ByteArrayOutputStream o = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int r;
                      while ((r = in.read(buf)) > 0) o.write(buf, 0, r);
                      return o.toString("UTF-8");
                  } finally {
                      in.close();
                  }
              }

              static void write(File f, String s) throws IOException {
                  File t = new File(f.getPath() + ".tmp");
                  FileOutputStream o = new FileOutputStream(t);
                  try {
                      o.write(s.getBytes("UTF-8"));
                  } finally {
                      o.close();
                  }
                  if (!t.renameTo(f)) {
                      f.delete();
                      t.renameTo(f);
                  }
              }

              static JSONArray index(Context c) {
                  try {
                      File f = new File(dir(c), "index.json");
                      if (f.exists()) return new JSONArray(read(f));
                  } catch (Exception e) {
                  }
                  return new JSONArray();
              }

              public static ArrayList<Entry> list(Context c) {
                  ArrayList<Entry> r = new ArrayList<>();
                  JSONArray a = index(c);
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o == null) continue;
                      Entry e = new Entry();
                      e.key = o.optString("k");
                      e.name = o.optString("n");
                      e.uri = o.optString("u");
                      e.page = o.optInt("p");
                      e.pages = o.optInt("c");
                      e.time = o.optLong("t");
                      r.add(e);
                  }
                  return r;
              }

              public static Doc load(Context c, String key, String name, String uri) {
                  Doc d = new Doc();
                  d.key = key;
                  d.name = name;
                  d.uri = uri;
                  try {
                      File f = new File(dir(c), key + ".json");
                      if (!f.exists()) return d;
                      JSONObject o = new JSONObject(read(f));
                      d.page = o.optInt("page");
                      d.rot = o.optInt("rot");
                      d.mode = o.optInt("mode");
                      d.pages = o.optInt("pages");
                      d.frac = (float) o.optDouble("frac", 0);
                      d.zoom = (float) o.optDouble("zoom", 1);
                      d.txn = (float) o.optDouble("txn", 0);
                      JSONArray m = o.optJSONArray("marks");
                      if (m != null) for (int i = 0; i < m.length(); i++) d.marks.add(m.getInt(i));
                      JSONArray s = o.optJSONArray("strokes");
                      if (s != null) {
                          for (int i = 0; i < s.length(); i++) {
                              JSONObject so = s.getJSONObject(i);
                              Stroke st = new Stroke();
                              st.page = so.getInt("p");
                              st.color = so.getInt("c");
                              st.w = (float) so.getDouble("w");
                              JSONArray pa = so.getJSONArray("d");
                              for (int j = 0; j + 1 < pa.length(); j += 2) st.add((float) pa.getDouble(j), (float) pa.getDouble(j + 1));
                              d.strokes.add(st);
                          }
                      }
                      JSONArray ta = o.optJSONArray("texts");
                      if (ta != null) {
                          for (int i = 0; i < ta.length(); i++) {
                              JSONObject to = ta.getJSONObject(i);
                              Txt t = new Txt();
                              t.page = to.getInt("p");
                              t.color = to.getInt("c");
                              t.x = (float) to.getDouble("x");
                              t.y = (float) to.getDouble("y");
                              t.size = (float) to.getDouble("s");
                              t.t = to.getString("t");
                              d.texts.add(t);
                          }
                      }
                  } catch (Exception e) {
                  }
                  return d;
              }

              public static synchronized void save(Context c, Doc d) {
                  try {
                      JSONObject o = new JSONObject();
                      o.put("page", d.page);
                      o.put("rot", d.rot);
                      o.put("mode", d.mode);
                      o.put("pages", d.pages);
                      o.put("frac", Float.isNaN(d.frac) ? 0 : d.frac);
                      o.put("zoom", Float.isNaN(d.zoom) ? 1 : d.zoom);
                      o.put("txn", Float.isNaN(d.txn) ? 0 : d.txn);
                      JSONArray m = new JSONArray();
                      for (int x : d.marks) m.put(x);
                      o.put("marks", m);
                      JSONArray s = new JSONArray();
                      for (Stroke st : d.strokes) {
                          JSONObject so = new JSONObject();
                          so.put("p", st.page);
                          so.put("c", st.color);
                          so.put("w", st.w);
                          JSONArray pa = new JSONArray();
                          for (int i = 0; i < st.n; i++) pa.put(Math.round(st.p[i] * 10000f) / 10000.0);
                          so.put("d", pa);
                          s.put(so);
                      }
                      o.put("strokes", s);
                      JSONArray ta = new JSONArray();
                      for (Txt t : d.texts) {
                          JSONObject to = new JSONObject();
                          to.put("p", t.page);
                          to.put("c", t.color);
                          to.put("x", t.x);
                          to.put("y", t.y);
                          to.put("s", t.size);
                          to.put("t", t.t);
                          ta.put(to);
                      }
                      o.put("texts", ta);
                      write(new File(dir(c), d.key + ".json"), o.toString());
                      JSONArray a = index(c);
                      JSONArray n = new JSONArray();
                      JSONObject e = new JSONObject();
                      e.put("k", d.key);
                      e.put("n", d.name);
                      e.put("u", d.uri == null ? "" : d.uri);
                      e.put("p", d.page);
                      e.put("c", d.pages);
                      e.put("t", System.currentTimeMillis());
                      n.put(e);
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject x = a.optJSONObject(i);
                          if (x != null && !d.key.equals(x.optString("k"))) n.put(x);
                      }
                      while (n.length() > MAX) {
                          JSONObject x = n.getJSONObject(n.length() - 1);
                          forget(c, x.optString("k"));
                          n.remove(n.length() - 1);
                      }
                      write(new File(dir(c), "index.json"), n.toString());
                  } catch (Exception e) {
                  }
              }

              static void forget(Context c, String key) {
                  new File(dir(c), key + ".json").delete();
                  new File(new File(c.getCacheDir(), "pdfs"), key + ".pdf").delete();
              }

              public static synchronized void delete(Context c, String key) {
                  try {
                      JSONArray a = index(c);
                      JSONArray n = new JSONArray();
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject x = a.optJSONObject(i);
                          if (x != null && !key.equals(x.optString("k"))) n.put(x);
                      }
                      forget(c, key);
                      write(new File(dir(c), "index.json"), n.toString());
                  } catch (Exception e) {
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/awal/pdfreader/DocConv.java << 'EOF'
          package com.awal.pdfreader;

          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.pdf.PdfDocument;
          import android.text.Layout;
          import android.text.StaticLayout;
          import android.text.TextPaint;
          import android.util.Xml;
          import org.xmlpull.v1.XmlPullParser;
          import java.io.BufferedInputStream;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          public class DocConv {
              public static void toPdf(File src, File out) throws Exception {
                  byte[] xml = null;
                  ZipInputStream z = new ZipInputStream(new BufferedInputStream(new FileInputStream(src)));
                  try {
                      ZipEntry e;
                      while ((e = z.getNextEntry()) != null) {
                          if (e.getName().equals("word/document.xml")) {
                              ByteArrayOutputStream bo = new ByteArrayOutputStream();
                              byte[] b = new byte[8192];
                              int r;
                              while ((r = z.read(b)) > 0) bo.write(b, 0, r);
                              xml = bo.toByteArray();
                              break;
                          }
                      }
                  } finally {
                      z.close();
                  }
                  if (xml == null) throw new IOException("no document");
                  StringBuilder sb = new StringBuilder();
                  XmlPullParser p = Xml.newPullParser();
                  p.setInput(new ByteArrayInputStream(xml), "UTF-8");
                  boolean inT = false;
                  int ev = p.getEventType();
                  while (ev != XmlPullParser.END_DOCUMENT) {
                      if (ev == XmlPullParser.START_TAG) {
                          String nm = p.getName();
                          if ("w:t".equals(nm)) inT = true;
                          else if ("w:tab".equals(nm)) sb.append('\t');
                          else if ("w:br".equals(nm) || "w:cr".equals(nm)) sb.append('\n');
                      } else if (ev == XmlPullParser.TEXT) {
                          if (inT) sb.append(p.getText());
                      } else if (ev == XmlPullParser.END_TAG) {
                          String nm = p.getName();
                          if ("w:t".equals(nm)) inT = false;
                          else if ("w:p".equals(nm)) sb.append('\n');
                          else if ("w:tc".equals(nm)) sb.append('\t');
                      }
                      ev = p.next();
                  }
                  String text = sb.toString();
                  if (text.trim().isEmpty()) text = " ";
                  int pw = 595, ph = 842, mg = 40, tw = pw - 2 * mg, maxH = ph - 2 * mg;
                  TextPaint tp = new TextPaint(Paint.ANTI_ALIAS_FLAG);
                  tp.setTextSize(13);
                  tp.setColor(Color.BLACK);
                  StaticLayout sl = new StaticLayout(text, tp, tw, Layout.Alignment.ALIGN_NORMAL, 1.25f, 0f, false);
                  PdfDocument doc = new PdfDocument();
                  try {
                      int lines = sl.getLineCount();
                      int i = 0, pageNo = 1;
                      do {
                          int startTop = i < lines ? sl.getLineTop(i) : 0;
                          int j = i;
                          while (j < lines && sl.getLineBottom(j) - startTop <= maxH) j++;
                          if (j == i && i < lines) j = i + 1;
                          int endBottom = j > i ? sl.getLineBottom(j - 1) : 0;
                          PdfDocument.PageInfo info = new PdfDocument.PageInfo.Builder(pw, ph, pageNo).create();
                          PdfDocument.Page pg = doc.startPage(info);
                          Canvas c = pg.getCanvas();
                          if (j > i) {
                              c.save();
                              c.translate(mg, mg - startTop);
                              c.clipRect(0, startTop, tw, endBottom);
                              sl.draw(c);
                              c.restore();
                          }
                          doc.finishPage(pg);
                          i = j;
                          pageNo++;
                      } while (i < lines);
                      FileOutputStream fo = new FileOutputStream(out);
                      try {
                          doc.writeTo(fo);
                      } finally {
                          fo.close();
                      }
                  } finally {
                      doc.close();
                  }
              }
          }
          EOF

