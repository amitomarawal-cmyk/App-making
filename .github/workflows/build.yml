          cat > app/src/main/java/com/awal/keyboard/Avro.java <<'EOF'
          package com.awal.keyboard;

          import java.util.*;

          public class Avro {
           static final HashMap<String,String> CJ = new HashMap<>(), CN = new HashMap<>();
           static final HashMap<String,String[]> VW = new HashMap<>();
           static String[] kc, kn, kv;

           static void cj(String... a) { for (int i = 0; i + 1 < a.length; i += 2) CJ.put(a[i], a[i + 1]); }
           static void cn(String... a) { for (int i = 0; i + 1 < a.length; i += 2) CN.put(a[i], a[i + 1]); }
           static void vw(String k, String a, String b) { VW.put(k, new String[]{a, b}); }
           static String[] srt(Set<String> s) {
            String[] a = s.toArray(new String[0]);
            Arrays.sort(a, (x, y) -> y.length() - x.length());
            return a;
           }

           static {
            cj("gg","জ্ঞ","GG","জ্ঞ","ksh","ক্ষ","kkh","ক্ষ","kSh","ক্ষ","kshm","ক্ষ্ম","kt","ক্ত","kk","ক্ক","kl","ক্ল","ks","ক্স","kT","ক্ট");
            cj("gn","গ্ন","gdh","গ্ধ","gm","গ্ম","gl","গ্ল","ngk","ঙ্ক","ngkh","ঙ্খ","ngg","ঙ্গ","nggh","ঙ্ঘ","ngm","ঙ্ম");
            cj("cch","চ্ছ","cc","চ্চ","jj","জ্জ","jjh","জ্ঝ","NGc","ঞ্চ","NGch","ঞ্ছ","NGj","ঞ্জ");
            cj("TT","ট্ট","DD","ড্ড","NT","ণ্ট","ND","ণ্ড","NN","ণ্ণ","NTh","ণ্ঠ","NDh","ণ্ঢ","Nm","ণ্ম");
            cj("tt","ত্ত","tth","ত্থ","tn","ত্ন","tm","ত্ম","dd","দ্দ","ddh","দ্ধ","db","দ্ব","dbh","দ্ভ","dm","দ্ম","dg","দ্গ","dgh","দ্ঘ","dhn","ধ্ন","dhm","ধ্ম");
            cj("nt","ন্ত","nth","ন্থ","nd","ন্দ","ndh","ন্ধ","nn","ন্ন","ns","ন্স","nm","ন্ম","nj","ন্জ","nc","ন্চ","nch","ন্ছ");
            cj("pt","প্ত","pp","প্প","pl","প্ল","ps","প্স","pn","প্ন","bj","ব্জ","bd","ব্দ","bdh","ব্ধ","bb","ব্ব","bl","ব্ল");
            cj("mp","ম্প","mph","ম্ফ","mb","ম্ব","mbh","ম্ভ","mm","ম্ম","ml","ম্ল","mn","ম্ন");
            cj("lk","ল্ক","lg","ল্গ","lT","ল্ট","lp","ল্প","lph","ল্ফ","lb","ল্ব","lm","ল্ম","ll","ল্ল","ld","ল্দ");
            cj("shc","শ্চ","shch","শ্ছ","shn","শ্ন","shm","শ্ম","shl","শ্ল","sht","শ্ত","shth","শ্থ","shb","শ্ব");
            cj("ShT","ষ্ট","ShTh","ষ্ঠ","ShN","ষ্ণ","Shk","ষ্ক","Shp","ষ্প","Shph","ষ্ফ","Shm","ষ্ম");
            cj("sk","স্ক","skh","স্খ","st","স্ত","sth","স্থ","sn","স্ন","sp","স্প","sph","স্ফ","sm","স্ম","sl","স্ল","ss","স্স","sT","স্ট");
            cj("hn","হ্ন","hm","হ্ম","hl","হ্ল");
            cn("Ng","ঙ","NG","ঞ","kh","খ","gh","ঘ","ch","ছ","jh","ঝ","Th","ঠ","Dh","ঢ","th","থ","dh","ধ","ph","ফ","bh","ভ","sh","শ","Sh","ষ","Rh","ঢ়","ng","ং");
            cn("k","ক","g","গ","c","চ","j","জ","T","ট","D","ড","N","ণ","t","ত","d","দ","n","ন","p","প","f","ফ","b","ব","v","ভ","m","ম","z","য","r","র","l","ল","s","স","h","হ");
            cn("R","ড়","y","য়","Y","য়","w","ওয়","q","ক","x","ক্স","J","জ","Z","্য","S","শ");
            vw("rri","ঋ","ৃ"); vw("OI","ঐ","ৈ"); vw("OU","ঔ","ৌ"); vw("ii","ঈ","ী"); vw("uu","ঊ","ূ");
            vw("o","অ",""); vw("O","ও","ো"); vw("a","আ","া"); vw("i","ই","ি"); vw("I","ঈ","ী");
            vw("u","উ","ু"); vw("U","ঊ","ূ"); vw("e","এ","ে");
            kc = srt(CJ.keySet()); kn = srt(CN.keySet()); kv = srt(VW.keySet());
           }

           static String mt(String[] keys, String s, int i) {
            for (String k : keys) if (s.startsWith(k, i)) return k;
            return null;
           }

           static String conv(String s) {
            StringBuilder o = new StringBuilder();
            boolean ac = false;
            int u = 0, i = 0;
            while (i < s.length()) {
             String m = mt(kc, s, i);
             if (m != null) { o.append(CJ.get(m)); i += m.length(); ac = true; u += 2; continue; }
             m = mt(kv, s, i);
             if (m != null) {
              String[] v = VW.get(m);
              i += m.length();
              if (ac) {
               if (m.equals("o") && i == s.length() && u >= 2) o.append("ো");
               else o.append(v[1]);
              } else o.append(v[0]);
              ac = false; u++; continue;
             }
             if (s.startsWith("rr", i)) { o.append("র্"); i += 2; ac = false; u++; continue; }
             m = mt(kn, s, i);
             if (m != null) {
              i += m.length();
              if (ac && m.equals("r")) o.append("্র");
              else if (ac && (m.equals("y") || m.equals("Z"))) o.append("্য");
              else if (ac && m.equals("w")) o.append("্ব");
              else { o.append(CN.get(m)); ac = !m.equals("ng"); }
              u++; continue;
             }
             char ch = s.charAt(i);
             if (Character.isUpperCase(ch)) {
              s = s.substring(0, i) + Character.toLowerCase(ch) + s.substring(i + 1);
              continue;
             }
             o.append(ch); i++; ac = false; u++;
            }
            return o.toString();
           }
          }
          EOF

          cat > app/src/main/java/com/awal/keyboard/Suggest.java <<'EOF'
          package com.awal.keyboard;

          import android.content.Context;
          import java.io.*;
          import java.util.*;

          public class Suggest {
           HashMap<String,Integer> u = new HashMap<>();
           HashMap<String,HashMap<String,Integer>> b = new HashMap<>(), t = new HashMap<>();
           File f;
           int dirty;

           Suggest(Context c) {
            f = new File(c.getFilesDir(), "dict.txt");
            load();
            if (u.isEmpty()) seed();
           }

           static void inc(HashMap<String,Integer> m, String k, int n) {
            Integer v = m.get(k);
            m.put(k, v == null ? n : v + n);
           }

           void learn(String p2, String p1, String w) {
            inc(u, w, 3);
            if (p1 != null) {
             inc(b.computeIfAbsent(p1, x -> new HashMap<>()), w, 1);
             if (p2 != null) inc(t.computeIfAbsent(p2 + "\u0001" + p1, x -> new HashMap<>()), w, 1);
            }
            if (++dirty >= 20) {
             if (u.size() > 15000) prune();
             save();
            }
           }

           void prune() {
            Iterator<Map.Entry<String,Integer>> it = u.entrySet().iterator();
            while (it.hasNext()) if (it.next().getValue() <= 3) it.remove();
            for (HashMap<String,HashMap<String,Integer>> m : Arrays.asList(b, t)) {
             Iterator<Map.Entry<String,HashMap<String,Integer>>> i2 = m.entrySet().iterator();
             while (i2.hasNext()) {
              HashMap<String,Integer> in = i2.next().getValue();
              Iterator<Map.Entry<String,Integer>> i3 = in.entrySet().iterator();
              while (i3.hasNext()) if (i3.next().getValue() <= 1) i3.remove();
              if (in.isEmpty()) i2.remove();
             }
            }
           }

           void save() {
            try {
             File tmp = new File(f.getPath() + ".tmp");
             BufferedWriter w = new BufferedWriter(new OutputStreamWriter(new FileOutputStream(tmp), "UTF-8"));
             for (Map.Entry<String,Integer> e : u.entrySet()) w.write("u\t" + e.getKey() + "\t" + e.getValue() + "\n");
             for (Map.Entry<String,HashMap<String,Integer>> e : b.entrySet())
              for (Map.Entry<String,Integer> g : e.getValue().entrySet())
               w.write("b\t" + e.getKey() + "\t" + g.getKey() + "\t" + g.getValue() + "\n");
             for (Map.Entry<String,HashMap<String,Integer>> e : t.entrySet())
              for (Map.Entry<String,Integer> g : e.getValue().entrySet())
               w.write("t\t" + e.getKey().replace('\u0001', '\t') + "\t" + g.getKey() + "\t" + g.getValue() + "\n");
             w.close();
             tmp.renameTo(f);
             dirty = 0;
            } catch (Exception e) { }
           }

           void load() {
            try {
             if (!f.exists()) return;
             BufferedReader r = new BufferedReader(new InputStreamReader(new FileInputStream(f), "UTF-8"));
             String line;
             while ((line = r.readLine()) != null) {
              String[] p = line.split("\t");
              try {
               if (p[0].equals("u") && p.length == 3) u.put(p[1], Integer.parseInt(p[2]));
               else if (p[0].equals("b") && p.length == 4) inc(b.computeIfAbsent(p[1], x -> new HashMap<>()), p[2], Integer.parseInt(p[3]));
               else if (p[0].equals("t") && p.length == 5) inc(t.computeIfAbsent(p[1] + "\u0001" + p[2], x -> new HashMap<>()), p[3], Integer.parseInt(p[4]));
              } catch (NumberFormatException e) { }
             }
             r.close();
            } catch (Exception e) { }
           }

           void pair(String p, String w) { inc(b.computeIfAbsent(p, x -> new HashMap<>()), w, 2); }

           void seed() {
            String[] en = {"the","and","you","that","for","are","with","this","have","what","how","your","not","but","can","will","hello","thanks","thank","please","good","morning","night","okay","where","when","why","who","love","friend","going","coming","today","tomorrow","yesterday","bro","sorry","welcome","yes","no","time","home","work","know","see","call","message","tell","come","now"};
            String[] bn = {"আমি","তুমি","আপনি","কেমন","আছো","আছি","ভালো","আছেন","আজ","কাল","না","হ্যাঁ","কি","কী","কেন","কোথায়","কখন","কে","এখন","তারপর","ঠিক","আছে","হবে","যাবো","আসবো","করছি","করো","খেয়েছো","ধন্যবাদ","সালাম","আসসালামু","আলাইকুম","ওয়ালাইকুম","বন্ধু","ভাই","আপু","বাসা","বাড়ি","কাজ","সময়","দেখা","কথা","বলো","বলছি","পারবো","পারছি","নাই","আমার","তোমার","তোর","আমাকে","তোমাকে","অনেক","একটু","সুন্দর","মন","ভালোবাসি","শুভ","সকাল","রাত","সন্ধ্যা"};
            for (String w : en) inc(u, w, 1);
            for (String w : bn) inc(u, w, 1);
            pair("thank", "you"); pair("how", "are"); pair("are", "you"); pair("good", "morning"); pair("good", "night");
            pair("আসসালামু", "আলাইকুম"); pair("কেমন", "আছো"); pair("কেমন", "আছেন"); pair("আমি", "ভালো"); pair("ভালো", "আছি");
           }

           static String cap(String w, String pre) {
            if (!pre.isEmpty() && !w.isEmpty() && Character.isUpperCase(pre.charAt(0)))
             return Character.toUpperCase(w.charAt(0)) + w.substring(1);
            return w;
           }

           List<String> suggest(String pre, String p1, String p2) {
            String lp = pre.toLowerCase(Locale.ROOT);
            HashMap<String,Integer> sc = new HashMap<>();
            HashMap<String,Integer> bb = p1 == null ? null : b.get(p1);
            HashMap<String,Integer> tt = (p1 == null || p2 == null) ? null : t.get(p2 + "\u0001" + p1);
            if (lp.isEmpty()) {
             if (tt != null) for (Map.Entry<String,Integer> e : tt.entrySet()) inc(sc, e.getKey(), e.getValue() * 30);
             if (bb != null) for (Map.Entry<String,Integer> e : bb.entrySet()) inc(sc, e.getKey(), e.getValue() * 8);
            } else {
             for (Map.Entry<String,Integer> e : u.entrySet()) {
              String w = e.getKey();
              if (w.startsWith(lp) && !w.equals(lp)) {
               int s = e.getValue();
               if (bb != null && bb.containsKey(w)) s += bb.get(w) * 8;
               if (tt != null && tt.containsKey(w)) s += tt.get(w) * 30;
               sc.put(w, s);
              }
             }
            }
            ArrayList<Map.Entry<String,Integer>> l = new ArrayList<>(sc.entrySet());
            Collections.sort(l, (x, y) -> y.getValue() - x.getValue());
            ArrayList<String> r = new ArrayList<>();
            for (Map.Entry<String,Integer> e : l) if (r.size() < 4) r.add(cap(e.getKey(), pre));
            if (lp.isEmpty() && r.size() < 4) {
             int need = 4 - r.size();
             ArrayList<String> top = new ArrayList<>();
             for (Map.Entry<String,Integer> e : u.entrySet()) {
              if (r.contains(e.getKey())) continue;
              int i = 0;
              while (i < top.size() && u.get(top.get(i)) >= e.getValue()) i++;
              if (i < need) {
               top.add(i, e.getKey());
               if (top.size() > need) top.remove(top.size() - 1);
              }
             }
             r.addAll(top);
            }
            if (r.isEmpty() && !pre.isEmpty()) r.add(pre);
            return r;
           }
          }
          EOF

          cat > app/src/main/java/com/awal/keyboard/MainActivity.java <<'EOF'
