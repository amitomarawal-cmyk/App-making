import 'package:flutter/material.dart';
import 'package:hive_flutter/hive_flutter.dart';
import 'screens/home_screen.dart';

void main() async {
  WidgetsFlutterBinding.ensureInitialized();
  await Hive.initFlutter();
  await Hive.openBox('recentFiles');
  await Hive.openBox('filePositions');
  runApp(const DocReaderApp());
}

class DocReaderApp extends StatefulWidget {
  const DocReaderApp({super.key});
  static _DocReaderAppState? of(BuildContext ctx) =>
      ctx.findAncestorStateOfType<_DocReaderAppState>();
  @override
  State<DocReaderApp> createState() => _DocReaderAppState();
}

class _DocReaderAppState extends State<DocReaderApp> {
  ThemeMode _themeMode = ThemeMode.system;
  void toggleTheme() =>
      setState(() => _themeMode =
          _themeMode == ThemeMode.dark ? ThemeMode.light : ThemeMode.dark);
  bool get isDark => _themeMode == ThemeMode.dark;
  @override
  Widget build(BuildContext context) => MaterialApp(
        title: 'DocReader',
        themeMode: _themeMode,
        theme: ThemeData(colorSchemeSeed: Colors.indigo, useMaterial3: true),
        darkTheme: ThemeData(
            colorSchemeSeed: Colors.indigo,
            brightness: Brightness.dark,
            useMaterial3: true),
        home: const HomeScreen(),
      );
}
