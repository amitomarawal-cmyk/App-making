           View clipP() {
            LinearLayout v = vl();
            LinearLayout hd = hl();
            K back = mk("ABC", 1, 14, () -> showPanel(0));
            K rec = mk("Recent", clipPins ? 3 : 1, 13, () -> { clipPins = false; showPanel(3); });
            K pin = mk("Pinned", clipPins ? 1 : 3, 13, () -> { clipPins = true; showPanel(3); });
            K clr = mk("Clear", 3, 13, () -> { (clipPins ? pins : clips).clear(); saveClips(); showPanel(3); });
            hd.addView(back, lp(0, -1, 1));
            hd.addView(rec, lp(0, -1, 1.3f));
            hd.addView(pin, lp(0, -1, 1.3f));
            hd.addView(clr, lp(0, -1, 1));
            v.addView(hd, lp(-1, dp(42), 0));
            ScrollView sc = new ScrollView(this);
            LinearLayout lst = vl();
            lst.setPadding(dp(2), 0, dp(2), dp(4));
            final ArrayList<String> src = clipPins ? pins : clips;
            if (src.isEmpty()) {
             TextView e = new TextView(this);
             e.setText(clipPins ? "Long-press a clip in Recent to pin it" : "Copied text will appear here");
             e.setTextColor(c[3]);
             e.setGravity(Gravity.CENTER);
             e.setPadding(0, dp(40), 0, 0);
             lst.addView(e);
            }
            for (int i = 0; i < src.size(); i += 2) {
             LinearLayout row = hl();
             for (int j = i; j < i + 2; j++) {
              if (j >= src.size()) { row.addView(new View(this), lp(0, 1, 1)); continue; }
              final String t = src.get(j);
              FrameLayout w = new FrameLayout(this);
              w.setPadding(dp(4), dp(4), dp(4), dp(4));
              TextView tv = new TextView(this);
              tv.setText(t.trim());
              tv.setMaxLines(3);
              tv.setEllipsize(TextUtils.TruncateAt.END);
              tv.setTextSize(13);
              tv.setTextColor(c[3]);
              tv.setPadding(dp(10), dp(8), dp(10), dp(8));
              tv.setMinHeight(dp(52));
              GradientDrawable g = new GradientDrawable();
              g.setColor(c[2]);
              g.setCornerRadius(dp(10));
              tv.setBackground(g);
              w.addView(tv, new FrameLayout.LayoutParams(-1, -2));
              w.setOnClickListener(x -> {
               flushBn();
               InputConnection ic = getCurrentInputConnection();
               if (ic != null) ic.commitText(t, 1);
               updSug();
              });
              w.setOnLongClickListener(x -> {
               if (clipPins) { pins.remove(t); clips.remove(t); clips.add(0, t); }
               else { clips.remove(t); pins.remove(t); pins.add(0, t); }
               saveClips();
               showPanel(3);
               return true;
              });
              row.addView(w, lp(0, -2, 1));
             }
             lst.addView(row, lp(-1, -2, 0));
            }
            sc.addView(lst);
            v.addView(sc, lp(-1, 0, 1));
            return v;
           }

           void addRow(LinearLayout v, K... ks) {
            LinearLayout row = hl();
            for (K k : ks) row.addView(k, lp(0, -1, k.wt));
            v.addView(row, lp(-1, 0, 1));
           }

           K arrow(String s, int code) {
            K k = mk(s, 1, 22, () -> sendKey(code));
            k.rp = true;
            return k;
           }

           View edit() {
            LinearLayout v = vl();
            addRow(v, arrow("←", KeyEvent.KEYCODE_DPAD_LEFT), arrow("↑", KeyEvent.KEYCODE_DPAD_UP), arrow("→", KeyEvent.KEYCODE_DPAD_RIGHT), mk("SELECT ALL", 1, 12, () -> act(android.R.id.selectAll)));
            addRow(v, mk("HOME", 1, 12, () -> sendKey(KeyEvent.KEYCODE_MOVE_HOME)), arrow("↓", KeyEvent.KEYCODE_DPAD_DOWN), mk("END", 1, 12, () -> sendKey(KeyEvent.KEYCODE_MOVE_END)), mk("COPY", 1, 12, () -> act(android.R.id.copy)));
            selK = mk("SELECT", selMode ? 2 : 1, 12, () -> { selMode = !selMode; selK.ty = selMode ? 2 : 1; selK.invalidate(); });
            addRow(v, selK, mk("CUT", 1, 12, () -> act(android.R.id.cut)), mk("PASTE", 1, 12, () -> act(android.R.id.paste)), delKey());
            K ab = mk("ABC", 1, 15, () -> showPanel(0));
            ab.wt = 1;
            K sp2 = mk("space", 0, 14, this::space);
            sp2.wt = 3;
            addRow(v, ab, sp2);
            return v;
           }

           void sendKey(int code) {
            InputConnection ic = getCurrentInputConnection();
            if (ic == null) return;
            long t = SystemClock.uptimeMillis();
            int m = selMode ? KeyEvent.META_SHIFT_ON : 0;
            ic.sendKeyEvent(new KeyEvent(t, t, KeyEvent.ACTION_DOWN, code, 0, m));
            ic.sendKeyEvent(new KeyEvent(t, t, KeyEvent.ACTION_UP, code, 0, m));
           }

           void act(int id) {
            InputConnection ic = getCurrentInputConnection();
            if (ic != null) ic.performContextMenuAction(id);
           }

           String bh(char b, boolean up) {
            if (up) {
             int i = UP.indexOf(Character.toUpperCase(b));
             if (i >= 0) return UH[i];
            }
            int i = QW.indexOf(b);
            return i >= 0 ? BL[i] : "";
           }

           void refreshLetters() {
            boolean up = shift > 0;
            for (K k : lk) {
             k.l = String.valueOf(up ? Character.toUpperCase(k.base) : k.base);
             k.h2 = bn ? bh(k.base, up) : "";
             k.invalidate();
            }
            if (spaceK != null) { spaceK.l = bn ? "বাংলা (Avro)" : "English"; spaceK.invalidate(); }
            if (perK != null) { perK.l = bn ? "।" : "."; perK.invalidate(); }
            if (langK != null) { langK.l = bn ? "বা" : "EN"; langK.invalidate(); }
            if (shiftK != null) shiftK.invalidate();
           }

           void doShift() {
            long n = SystemClock.uptimeMillis();
            if (shift == 0) shift = 1;
            else if (shift == 1) shift = (n - lastShift < 400) ? 2 : 0;
            else shift = 0;
            lastShift = n;
            refreshLetters();
           }

           void flushBn() {
            if (buf.length() > 0) {
             InputConnection ic = getCurrentInputConnection();
             if (ic != null) ic.finishComposingText();
             buf.setLength(0);
            }
           }

           void onLetter(K k) {
            InputConnection ic = getCurrentInputConnection();
            if (ic == null) return;
            char ch = shift > 0 ? Character.toUpperCase(k.base) : k.base;
            if (bn) {
             buf.append(ch);
             ic.setComposingText(Avro.conv(buf.toString()), 1);
            } else ic.commitText(String.valueOf(ch), 1);
            if (shift == 1) { shift = 0; refreshLetters(); }
            updSug();
           }

           void onSym(String s) {
            if (bn && !plain) {
             if (s.equals(".")) s = "।";
             else if (s.length() == 1 && s.charAt(0) >= '0' && s.charAt(0) <= '9') s = String.valueOf((char) (0x09E6 + (s.charAt(0) - '0')));
            }
            raw(s);
           }

           void raw(String s) {
            InputConnection ic = getCurrentInputConnection();
            if (ic == null) return;
            flushBn();
            ic.commitText(s, 1);
            learn();
            updSug();
           }

           void space() {
            InputConnection ic = getCurrentInputConnection();
            if (ic == null) return;
            flushBn();
            ic.commitText(" ", 1);
            learn();
            updSug();
           }

           void enter() {
            InputConnection ic = getCurrentInputConnection();
            if (ic == null) return;
            flushBn();
            int a = ei != null ? ei.imeOptions : 0;
            int act = a & EditorInfo.IME_MASK_ACTION;
            if (ei != null && (a & EditorInfo.IME_FLAG_NO_ENTER_ACTION) == 0 && act != EditorInfo.IME_ACTION_NONE && act != EditorInfo.IME_ACTION_UNSPECIFIED)
             ic.performEditorAction(act);
            else sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER);
            updSug();
           }

           void del() {
            InputConnection ic = getCurrentInputConnection();
            if (ic == null) return;
            if (buf.length() > 0) {
             buf.setLength(buf.length() - 1);
             if (buf.length() == 0) {
              ic.setComposingText("", 1);
              ic.finishComposingText();
             } else ic.setComposingText(Avro.conv(buf.toString()), 1);
            } else {
             CharSequence sel = ic.getSelectedText(0);
             if (sel != null && sel.length() > 0) ic.commitText("", 1);
             else sendDownUpKeyEvents(KeyEvent.KEYCODE_DEL);
            }
            updSug();
           }

           void learn() {
            if (plain) return;
            InputConnection ic = getCurrentInputConnection();
            if (ic == null) return;
            CharSequence b = ic.getTextBeforeCursor(60, 0);
            if (b == null) return;
            String s = b.toString();
            int n = s.length();
            if (n < 2) return;
            char sc = s.charAt(n - 1);
            if (!(Character.isWhitespace(sc) || ".,!?;:।".indexOf(sc) >= 0) || !isW(s.charAt(n - 2))) return;
            ArrayList<String> t = toks(s);
            if (t.isEmpty()) return;
            int k = t.size();
            String w = t.get(k - 1);
            if (w.length() < 2 && w.charAt(0) < 128) return;
            sg.learn(k > 2 ? t.get(k - 3) : null, k > 1 ? t.get(k - 2) : null, w);
           }

           void updSug() {
            if (sv[0] == null) return;
            InputConnection ic = getCurrentInputConnection();
            List<String> r = new ArrayList<>();
            curPre = "";
            if (ic != null && !plain) {
             CharSequence b = ic.getTextBeforeCursor(60, 0);
             String s = b == null ? "" : b.toString();
             int i = s.length();
             while (i > 0 && isW(s.charAt(i - 1))) i--;
             String pre = s.substring(i);
             String ctx = s.substring(0, i);
             ArrayList<String> t = toks(ctx);
             String p1 = t.size() > 0 ? t.get(t.size() - 1) : null;
             String p2 = t.size() > 1 ? t.get(t.size() - 2) : null;
             String tr = ctx.trim();
             if (tr.isEmpty() || ".!?।".indexOf(tr.charAt(tr.length() - 1)) >= 0) { p1 = null; p2 = null; }
             curPre = pre;
             r = sg.suggest(pre, p1, p2);
            }
            for (int k = 0; k < 4; k++) sv[k].setText(k < r.size() ? r.get(k) : "");
           }

           void pick(int k) {
            String w = sv[k].getText().toString();
            if (w.isEmpty()) return;
            InputConnection ic = getCurrentInputConnection();
            if (ic == null) return;
            ic.beginBatchEdit();
            if (buf.length() > 0) {
             buf.setLength(0);
             ic.commitText(w + " ", 1);
            } else {
             if (!curPre.isEmpty()) ic.deleteSurroundingText(curPre.length(), 0);
             ic.commitText(w + " ", 1);
            }
            ic.endBatchEdit();
            if (shift == 1) { shift = 0; refreshLetters(); }
            learn();
            updSug();
           }

           @Override
           public void onStartInputView(EditorInfo info, boolean restarting) {
            super.onStartInputView(info, restarting);
            ei = info;
            buf.setLength(0);
            shift = 0;
            selMode = false;
            int it = info.inputType, cls = it & InputType.TYPE_MASK_CLASS, var = it & InputType.TYPE_MASK_VARIATION;
            plain = cls != InputType.TYPE_CLASS_TEXT || var == InputType.TYPE_TEXT_VARIATION_PASSWORD || var == InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD || var == InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD || var == InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS || var == InputType.TYPE_TEXT_VARIATION_URI;
            if (root == null) return;
            int t = sp.getInt("theme", 0);
            if (t != curTheme && t >= 0 && t < Themes.C.length) {
             curTheme = t;
             c = Themes.C[t];
             applyBg();
             for (TextView tv : sv) tv.setTextColor(c[3]);
             fillBar();
            }
            addPrimary();
            showPanel((cls == InputType.TYPE_CLASS_NUMBER || cls == InputType.TYPE_CLASS_PHONE) ? 2 : 0);
           }

           @Override
           public void onFinishInputView(boolean finishingInput) {
            flushBn();
            sg.save();
            super.onFinishInputView(finishingInput);
           }

           @Override
           public void onUpdateSelection(int os, int oe, int ns, int ne, int cs, int ce) {
            super.onUpdateSelection(os, oe, ns, ne, cs, ce);
            if (buf.length() > 0 && ce != -1 && (ns != ce || ne != ce)) {
             buf.setLength(0);
             InputConnection ic = getCurrentInputConnection();
             if (ic != null) ic.finishComposingText();
            }
            h.removeCallbacks(upd);
            h.post(upd);
           }
          }
          EOF

      - name: Gradle wrapper
        run: |
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          chmod +x gradlew

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Awal-Keyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
