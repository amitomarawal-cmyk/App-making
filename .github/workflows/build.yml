name: Build Daba Guru APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license

      - name: Create Gradle project files
        run: |
          mkdir -p app/src/main/java/com/awal/dabaguru app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/assets gradle/wrapper
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DabaGuru"
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.awal.dabaguru'
              compileSdk 34
              defaultConfig {
                  applicationId "com.awal.dabaguru"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Create Android manifest, Java, layout, icon
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- Dabaguru | Creator: Mohammod Abdul Awal | Student, Dept. of English, National University | awal.sorkar.144@gmail.com -->
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/awal/dabaguru/MainActivity.java << 'EOF'
          package com.awal.dabaguru;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          // Creator: Mohammod Abdul Awal
          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.parseColor("#3E2723"));
                  setContentView(R.layout.activity_main);
                  web = (WebView) findViewById(R.id.webview);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setSupportZoom(false);
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @SuppressWarnings("deprecation")
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, String url) {
                          if (url.startsWith("mailto:")) {
                              try { startActivity(new Intent(Intent.ACTION_SENDTO, Uri.parse(url))); } catch (Exception e) { }
                              return true;
                          }
                          return false;
                      }
                  });
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#3E2723">
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>
          </FrameLayout>
          EOF
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">দাবা গুরু</string>
              <string name="creator">Mohammod Abdul Awal</string>
          </resources>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#3E2723" android:pathData="M54,54m-54,0a54,54 0 1,1 108,0a54,54 0 1,1 -108,0"/>
              <path android:fillColor="#FFCA28" android:pathData="M52,16h4v8h8v4h-8v8h-4v-8h-8v-4h8z"/>
              <path android:fillColor="#FFCA28" android:pathData="M32,44L42,58L54,40L66,58L76,44L72,72L36,72z"/>
              <path android:fillColor="#FFCA28" android:pathData="M32,76h44v8h-44z"/>
          </vector>
          EOF

      - name: Create chess game (HTML/JS)
        run: |
          cat > app/src/main/assets/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="bn"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <meta name="author" content="Mohammod Abdul Awal">
          <title>দাবা গুরু</title>
          <style>
          :root{--bg:#f6efe6;--fg:#3e2723;--card:#fff;--lt:#f0d9b5;--dk:#b58863;--ac:#5d4037;--bd:#d7c4b0;--sz:40px}
          body.dark{--bg:#1c1a19;--fg:#efe6dd;--card:#2a2625;--lt:#9c8a7b;--dk:#5a493f;--ac:#a1704a;--bd:#4a403a}
