                      final String t=item[1];
                      card.setOnClickListener(v->{
                          v.animate().scaleX(0.92f).scaleY(0.92f).setDuration(80).withEndAction(()->
                              v.animate().scaleX(1f).scaleY(1f).setDuration(80).withEndAction(()->handleWidget(t)).start()
                          ).start();
                      });
                      widgetRow.addView(card);
                  }
              }

              private void handleWidget(String t){
                  switch(t){
                      case"weather":
                          if(cachedWeather==null){Toast.makeText(this,"Loading weather...",Toast.LENGTH_SHORT).show();return;}
                          Intent wi=new Intent(this,WeatherActivity.class);
                          wi.putExtra("count",cachedWeather.size());
                          for(int i=0;i<cachedWeather.size();i++){
                              WeatherData d=cachedWeather.get(i);
                              wi.putExtra("day_"+i,d.day);wi.putExtra("cond_"+i,d.condition);
                              wi.putExtra("icon_"+i,d.icon);wi.putExtra("hi_"+i,d.tempHigh);wi.putExtra("lo_"+i,d.tempLow);
                          }
                          startActivity(wi);break;
                      case"calendar":startActivity(new Intent(this,CalendarActivity.class));break;
                      case"compass":startActivity(new Intent(this,CompassActivity.class));break;
                      case"speed":startActivity(new Intent(this,SpeedometerActivity.class));break;
                      case"calc":
                          try{startActivity(new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_APP_CALCULATOR));}
                          catch(Exception e){Toast.makeText(this,"No calculator app",Toast.LENGTH_SHORT).show();}break;
                  }
              }

              private void setupPower(){
                  TextView pb=findViewById(R.id.powerBtn);
                  powerGesture=new GestureDetector(this,new GestureDetector.SimpleOnGestureListener(){
                      @Override public boolean onFling(MotionEvent e1,MotionEvent e2,float vx,float vy){
                          float dx=e2.getX()-e1.getX(),dy=e2.getY()-e1.getY();
                          if(Math.abs(dx)>Math.abs(dy)){
                              audioMgr.adjustStreamVolume(AudioManager.STREAM_MUSIC,dx>0?AudioManager.ADJUST_RAISE:AudioManager.ADJUST_LOWER,AudioManager.FLAG_SHOW_UI);
                          }else{
                              try{int cur=android.provider.Settings.System.getInt(getContentResolver(),android.provider.Settings.System.SCREEN_BRIGHTNESS);
                                  android.provider.Settings.System.putInt(getContentResolver(),android.provider.Settings.System.SCREEN_BRIGHTNESS,dy<0?Math.min(255,cur+25):Math.max(0,cur-25));
                              }catch(Exception ignored){}}
                          return true;
                      }
                  });
                  pb.setOnTouchListener((v,ev)->{powerGesture.onTouchEvent(ev);return false;});
                  pb.setOnClickListener(v->{
                      pb.animate().alpha(0.4f).setDuration(100).withEndAction(()->pb.animate().alpha(1f).setDuration(100).start()).start();
                      if(dpm.isAdminActive(adminComp)){dpm.lockNow();}
                      else{Intent i=new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);i.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN,adminComp);i.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION,"Allow to lock screen.");startActivityForResult(i,REQ_ADMIN);}
                  });
                  pb.setOnLongClickListener(v->{startActivityForResult(new Intent(this,DockManagerActivity.class),REQ_DOCK);return true;});
              }

              private void loadApps(){
                  new Thread(()->{
                      Intent intent=new Intent(Intent.ACTION_MAIN,null);intent.addCategory(Intent.CATEGORY_LAUNCHER);
                      PackageManager pm=getPackageManager();
                      List<ResolveInfo> res=pm.queryIntentActivities(intent,0);
                      List<AppInfo> list=new ArrayList<>();
                      for(ResolveInfo ri:res){
                          String pkg=ri.activityInfo.packageName;
                          if(pkg.equals(getPackageName()))continue;
                          list.add(new AppInfo(ri.loadLabel(pm).toString(),pkg,ri.loadIcon(pm),usagePrefs.getInt(pkg,0),patternPrefs.getString("pattern_"+pkg,null)!=null));
                      }
                      Collections.sort(list,(a,b)->{if(b.launchCount!=a.launchCount)return b.launchCount-a.launchCount;return a.label.compareToIgnoreCase(b.label);});
                      runOnUiThread(()->{appList.clear();appList.addAll(list);adapter.update(appList);buildDock(pm);});
                  }).start();
              }

              private void buildDock(PackageManager pm){
                  dockRow.removeAllViews();
                  Set<String> saved=dockPrefs.getStringSet("dock_apps",null);
                  List<String> pkgs=new ArrayList<>();
                  if(saved!=null&&!saved.isEmpty()){pkgs.addAll(saved);}
                  else{String[] def={"dialer","messaging","chrome","camera","settings"};
                      for(AppInfo a:appList){for(String d:def){if(a.packageName.contains(d)&&pkgs.size()<5)pkgs.add(a.packageName);}}}
                  for(String pkg:pkgs){
                      for(AppInfo a:appList){
                          if(a.packageName.equals(pkg)){
                              LinearLayout cell=new LinearLayout(this);
                              cell.setOrientation(LinearLayout.VERTICAL);cell.setGravity(android.view.Gravity.CENTER);
                              LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(0,LinearLayout.LayoutParams.MATCH_PARENT,1f);cell.setLayoutParams(lp);
                              ImageView iv=new ImageView(this);iv.setImageDrawable(a.icon);
                              iv.setLayoutParams(new LinearLayout.LayoutParams(52,52));iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                              cell.addView(iv);
                              cell.setOnClickListener(v->{
                                  v.animate().scaleX(0.85f).scaleY(0.85f).setDuration(80).withEndAction(()->
                                      v.animate().scaleX(1f).scaleY(1f).setDuration(80).withEndAction(()->onAppClick(a)).start()
                                  ).start();
                              });
                              dockRow.addView(cell);break;
                          }
                      }
                  }
              }

              private void onAppClick(AppInfo a){
                  if(a.patternLocked){pendingLaunch=a;Intent i=new Intent(this,PatternLockActivity.class);i.putExtra("package",a.packageName);startActivityForResult(i,REQ_PATTERN);}
                  else launchApp(a);
              }

              private void onAppLong(AppInfo a){
                  new AlertDialog.Builder(this).setTitle(a.label)
                      .setItems(new String[]{"Open",a.patternLocked?"Remove Lock":"Set Pattern Lock","Uninstall"},(d,w)->{
                          if(w==0)onAppClick(a);
                          else if(w==1){
                              if(a.patternLocked){patternPrefs.edit().remove("pattern_"+a.packageName).apply();a.patternLocked=false;adapter.update(appList);}
                              else{pendingLaunch=null;Intent i=new Intent(this,PatternSetupActivity.class);i.putExtra("package",a.packageName);startActivityForResult(i,REQ_SETUP);}
                          }else uninstallApp(a);
                      }).show();
              }

              private void uninstallApp(AppInfo a){
                  new AlertDialog.Builder(this).setTitle("Uninstall "+a.label+"?")
                      .setMessage("This will remove the app from your device.")
                      .setPositiveButton("Uninstall",(d,w)->{Intent i=new Intent(Intent.ACTION_DELETE);i.setData(Uri.parse("package:"+a.packageName));startActivity(i);})
                      .setNegativeButton("Cancel",null).show();
              }

              @Override protected void onActivityResult(int req,int res,Intent data){
                  if(req==REQ_PATTERN&&res==RESULT_OK&&pendingLaunch!=null){launchApp(pendingLaunch);pendingLaunch=null;}
                  else if(req==REQ_SETUP&&res==RESULT_OK){for(AppInfo a:appList)a.patternLocked=patternPrefs.getString("pattern_"+a.packageName,null)!=null;adapter.update(appList);}
                  else if(req==REQ_DOCK&&res==RESULT_OK){loadApps();}
              }

              private void launchApp(AppInfo a){
                  int c=usagePrefs.getInt(a.packageName,0)+1;usagePrefs.edit().putInt(a.packageName,c).apply();a.launchCount=c;
                  Collections.sort(appList,(x,y)->{if(y.launchCount!=x.launchCount)return y.launchCount-x.launchCount;return x.label.compareToIgnoreCase(y.label);});
                  adapter.update(new ArrayList<>(appList));
                  Intent i=getPackageManager().getLaunchIntentForPackage(a.packageName);if(i!=null)startActivity(i);
              }

              private void loadWeather(){
                  String loc=getSharedPreferences("launcher_prefs",MODE_PRIVATE).getString("weather_location","Dhaka");
                  weatherMgr.get(loc,data->{
                      cachedWeather=data;
                      if(!data.isEmpty()){
                          WeatherData t=data.get(0);
                          View wCard=widgetRow.getChildAt(0);
                          if(wCard instanceof LinearLayout){
                              View lbl=((LinearLayout)wCard).getChildAt(1);
                              if(lbl instanceof TextView)((TextView)lbl).setText(t.icon+" "+t.tempHigh+"°");
                          }
                      }
                  });
              }

              private void clock(){
                  Date now=new Date();
                  bigClock.setText(new SimpleDateFormat("HH:mm",Locale.ENGLISH).format(now));
                  fullDate.setText(new SimpleDateFormat("EEEE, MMMM d",Locale.ENGLISH).format(now));
                  statusTime.setText(new SimpleDateFormat("HH:mm",Locale.ENGLISH).format(now));
                  statusDate.setText(new SimpleDateFormat("EEE, MMM d",Locale.ENGLISH).format(now));
              }

              @Override protected void onResume(){super.onResume();handler.post(tick);loadApps();}
              @Override protected void onPause(){super.onPause();handler.removeCallbacks(tick);}
              @Override public void onBackPressed(){}
          }
          EOF

      - name: Fix CalendarActivity inner class issue
        run: |
          cat > app/src/main/java/com/awal/launcher/CalendarActivity.java << 'EOF'
          package com.awal.launcher;
          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.animation.AnimationUtils;
          import android.widget.FrameLayout;
          import android.widget.GridLayout;
          import android.widget.TextView;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Locale;

          public class CalendarActivity extends Activity {
              private GridLayout calGrid,dayHeaders;
              private TextView monthYear;
              private Calendar showing;
              private int todayDay,todayMonth,todayYear;

              @Override protected void onCreate(Bundle s){
                  super.onCreate(s);setContentView(R.layout.activity_calendar);
                  calGrid=findViewById(R.id.calGrid);dayHeaders=findViewById(R.id.dayHeaders);monthYear=findViewById(R.id.monthYear);
                  Calendar now=Calendar.getInstance();
                  todayDay=now.get(Calendar.DAY_OF_MONTH);todayMonth=now.get(Calendar.MONTH);todayYear=now.get(Calendar.YEAR);
                  showing=(Calendar)now.clone();
                  findViewById(R.id.calCard).startAnimation(AnimationUtils.loadAnimation(this,R.anim.fade_in));
                  buildHeaders();buildGrid();
                  findViewById(R.id.btnPrev).setOnClickListener(v->{showing.add(Calendar.MONTH,-1);buildGrid();});
                  findViewById(R.id.btnNext).setOnClickListener(v->{showing.add(Calendar.MONTH,1);buildGrid();});
                  findViewById(R.id.btnClose).setOnClickListener(v->finish());
              }

              private void buildHeaders(){
                  dayHeaders.removeAllViews();
                  String[] days={"Su","Mo","Tu","We","Th","Fr","Sa"};
                  int cell=getCellSize();
                  for(String d:days){
                      TextView tv=new TextView(this);tv.setText(d);tv.setTextColor(0xAA4FC3F7);
                      tv.setTextSize(12);tv.setGravity(Gravity.CENTER);tv.setTypeface(null,Typeface.BOLD);
                      GridLayout.LayoutParams lp=new GridLayout.LayoutParams();lp.width=cell;lp.height=GridLayout.LayoutParams.WRAP_CONTENT;
                      tv.setLayoutParams(lp);dayHeaders.addView(tv);
                  }
              }

              private void buildGrid(){
                  calGrid.removeAllViews();
                  monthYear.setText(new SimpleDateFormat("MMMM yyyy",Locale.ENGLISH).format(showing.getTime()));
                  int cell=getCellSize();
                  Calendar c=(Calendar)showing.clone();c.set(Calendar.DAY_OF_MONTH,1);
                  int first=c.get(Calendar.DAY_OF_WEEK)-1,max=c.getActualMaximum(Calendar.DAY_OF_MONTH);
                  int curM=showing.get(Calendar.MONTH),curY=showing.get(Calendar.YEAR);
                  for(int i=0;i<first;i++)addCell("",cell,false);
                  for(int d=1;d<=max;d++)addCell(String.valueOf(d),cell,d==todayDay&&curM==todayMonth&&curY==todayYear);
              }

              private int getCellSize(){
                  int w=getResources().getDisplayMetrics().widthPixels;
                  float dp=getResources().getDisplayMetrics().density;
                  return (int)((w-80*dp)/7);
              }

              private void addCell(String text,int size,boolean today){
                  FrameLayout fl=new FrameLayout(this);
                  GridLayout.LayoutParams lp=new GridLayout.LayoutParams();lp.width=size;lp.height=size;fl.setLayoutParams(lp);
                  if(!text.isEmpty()){
                      TextView tv=new TextView(this);tv.setText(text);tv.setGravity(Gravity.CENTER);
                      tv.setLayoutParams(new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT,FrameLayout.LayoutParams.MATCH_PARENT));
                      if(today){tv.setBackground(getDrawable(R.drawable.today_circle));tv.setTextColor(Color.WHITE);tv.setTypeface(null,Typeface.BOLD);tv.setTextSize(13);}
                      else{tv.setTextColor(0xFFFFFFFF);tv.setTextSize(13);}
                      fl.addView(tv);
                  }
                  calGrid.addView(fl);
              }
          }
          EOF

