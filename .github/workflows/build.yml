          cat > app/src/main/java/com/awal/tenparts/MainActivity.java << 'EOF'
          package com.awal.tenparts;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ListView;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private static final List<DownloadTask> TASKS = new ArrayList<>();
              private final Handler handler = new Handler(Looper.getMainLooper());
              private TaskAdapter adapter;
              private EditText etUrls;

              private final Runnable ticker = new Runnable() {
                  @Override
                  public void run() {
                      for (DownloadTask t : TASKS) t.tick(500);
                      adapter.notifyDataSetChanged();
                      handler.postDelayed(this, 500);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  etUrls = (EditText) findViewById(R.id.etUrls);
                  Button btnAdd = (Button) findViewById(R.id.btnAdd);
                  ListView lv = (ListView) findViewById(R.id.lvTasks);
                  adapter = new TaskAdapter();
                  lv.setAdapter(adapter);

                  if (Build.VERSION.SDK_INT < 29 && Build.VERSION.SDK_INT >= 23
                          && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, 1);
                  }

                  Intent in = getIntent();
                  if (in != null && Intent.ACTION_SEND.equals(in.getAction())) {
                      String shared = in.getStringExtra(Intent.EXTRA_TEXT);
                      if (shared != null) etUrls.setText(shared);
                  }

                  btnAdd.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          addLinks();
                      }
                  });
              }

              private void addLinks() {
                  String[] parts = etUrls.getText().toString().trim().split("\\s+");
                  int count = 0;
                  for (String p : parts) {
                      String u = p.trim();
                      if (u.startsWith("http://") || u.startsWith("https://")) {
                          DownloadTask t = new DownloadTask(this, u);
                          TASKS.add(0, t);
                          t.start();
                          count++;
                      }
                  }
                  if (count == 0) {
                      Toast.makeText(this, "সঠিক লিংক দিন (http:// বা https:// দিয়ে শুরু)", Toast.LENGTH_SHORT).show();
                  } else {
                      etUrls.setText("");
                      adapter.notifyDataSetChanged();
                  }
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  handler.post(ticker);
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  handler.removeCallbacks(ticker);
              }

              private static String fmt(long b) {
                  if (b < 1024) return b + " B";
                  double k = b / 1024.0;
                  if (k < 1024) return String.format(Locale.US, "%.1f KB", k);
                  double m = k / 1024.0;
                  if (m < 1024) return String.format(Locale.US, "%.1f MB", m);
                  return String.format(Locale.US, "%.2f GB", m / 1024.0);
              }

              private static String statusText(DownloadTask t) {
                  switch (t.state) {
                      case DownloadTask.QUEUED:
                          return "লাইনে অপেক্ষা করছে...";
                      case DownloadTask.CONNECTING:
                          return "সার্ভারের সাথে যোগাযোগ হচ্ছে...";
                      case DownloadTask.DOWNLOADING: {
                          long d = t.downloaded.get();
                          String head;
                          if (t.total > 0) {
                              head = (d * 100 / t.total) + "% • " + fmt(d) + " / " + fmt(t.total);
                          } else {
                              head = fmt(d);
                          }
                          return head + " • " + fmt(t.speed) + "/s\nটুকরা " + t.partsDone.get() + "/" + t.totalParts
                                  + " সম্পন্ন (" + t.totalParts + " থ্রেড)";
                      }
                      case DownloadTask.MERGING:
                          return "টুকরাগুলো জোড়া লাগানো হচ্ছে...";
                      case DownloadTask.DONE:
                          return "✔ সম্পন্ন • " + fmt(t.downloaded.get()) + "\n" + t.savedTo;
                      case DownloadTask.FAILED:
                          return "✖ ব্যর্থ: " + t.error;
                      default:
                          return "বাতিল করা হয়েছে";
                  }
              }

              private class TaskAdapter extends BaseAdapter {
                  @Override
                  public int getCount() {
                      return TASKS.size();
                  }

                  @Override
                  public Object getItem(int i) {
                      return TASKS.get(i);
                  }

                  @Override
                  public long getItemId(int i) {
                      return TASKS.get(i).id;
                  }

                  @Override
                  public View getView(int pos, View v, ViewGroup parent) {
                      if (v == null) v = getLayoutInflater().inflate(R.layout.item_download, parent, false);
                      final DownloadTask t = TASKS.get(pos);
                      TextView tvName = (TextView) v.findViewById(R.id.tvName);
                      TextView tvStatus = (TextView) v.findViewById(R.id.tvStatus);
                      ProgressBar pb = (ProgressBar) v.findViewById(R.id.pb);
                      Button btn = (Button) v.findViewById(R.id.btnAction);

                      tvName.setText(t.name);
                      tvStatus.setText(statusText(t));

                      if (t.state == DownloadTask.DONE) {
                          pb.setIndeterminate(false);
                          pb.setProgress(100);
                      } else if (t.state == DownloadTask.DOWNLOADING && t.total > 0) {
                          pb.setIndeterminate(false);
                          pb.setProgress((int) (t.downloaded.get() * 100 / t.total));
                      } else if (t.state == DownloadTask.DOWNLOADING || t.state == DownloadTask.CONNECTING
                              || t.state == DownloadTask.MERGING) {
                          pb.setIndeterminate(true);
                      } else {
                          pb.setIndeterminate(false);
                          pb.setProgress(0);
                      }

                      btn.setEnabled(t.state != DownloadTask.MERGING);
                      if (t.state == DownloadTask.FAILED) {
                          btn.setText("আবার");
                      } else if (t.state == DownloadTask.DONE || t.state == DownloadTask.CANCELED) {
                          btn.setText("সরান");
                      } else {
                          btn.setText("বাতিল");
                      }
                      btn.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View view) {
                              if (t.state == DownloadTask.FAILED) {
                                  t.retry();
                              } else if (t.state == DownloadTask.DONE || t.state == DownloadTask.CANCELED) {
                                  TASKS.remove(t);
                              } else {
                                  t.cancel();
                              }
                              notifyDataSetChanged();
                          }
                      });
                      return v;
                  }
              }
          }
