          package com.awal.retrolens;

          import android.graphics.ColorMatrix;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Random;

          public class Filter {
              public final String name;
              public float sat = 1f, con = 1f, bri = 0f, r = 1f, g = 1f, b = 1f;
              public float fade = 0f, vig = 0f, grain = 0f;
              public int leakColor = 0, leakSide = 0;

              public Filter(String name) {
                  this.name = name;
              }

              public Filter set(float sat, float con, float bri, float r, float g, float b,
                                float fade, float vig, float grain) {
                  this.sat = sat; this.con = con; this.bri = bri;
                  this.r = r; this.g = g; this.b = b;
                  this.fade = fade; this.vig = vig; this.grain = grain;
                  return this;
              }

              public Filter leak(int color, int side) {
                  this.leakColor = color;
                  this.leakSide = side;
                  return this;
              }

              public ColorMatrix matrix() {
                  ColorMatrix m = new ColorMatrix();
                  m.setSaturation(sat);
                  float s = con * (1f - fade * 0.25f);
                  float t = (1f - con) * 128f + bri * 255f + fade * 45f;
                  ColorMatrix c = new ColorMatrix(new float[]{
                          s * r, 0, 0, 0, t,
                          0, s * g, 0, 0, t,
                          0, 0, s * b, 0, t,
                          0, 0, 0, 1, 0});
                  m.postConcat(c);
                  return m;
              }

              private static float rf(Random q, float a, float b) {
                  return a + q.nextFloat() * (b - a);
              }

              private static final int[] LEAKS = {
                      0x66FF5A1E, 0x665A78FF, 0x66C83CFF, 0x66FFC832, 0x66FF3C6E, 0x6628C8B4
              };

              // p: sat, con, bri, warm, fade, vig, grain  (min,max pairs)
              private static void grp(List<Filter> l, String pre, int n, int seed, float[] p, float leakChance) {
                  for (int i = 1; i <= n; i++) {
                      Random q = new Random(seed * 131L + i);
                      float warm = rf(q, p[6], p[7]);
                      float gt = rf(q, -.04f, .04f);
                      Filter f = new Filter(pre + i).set(
                              rf(q, p[0], p[1]), rf(q, p[2], p[3]), rf(q, p[4], p[5]),
                              1f + warm, 1f + gt, 1f - warm,
                              rf(q, p[8], p[9]), rf(q, p[10], p[11]), rf(q, p[12], p[13]));
                      if (q.nextFloat() < leakChance) {
                          f.leak(LEAKS[q.nextInt(LEAKS.length)], q.nextInt(4));
                      }
                      l.add(f);
                  }
              }

              public static List<Filter> all() {
                  List<Filter> l = new ArrayList<>();
                  l.add(new Filter("Original"));
                  grp(l, "F", 5, 1, new float[]{.9f, 1.2f, 1.0f, 1.15f, -.02f, .03f, .02f, .10f, .02f, .10f, .2f, .4f, .15f, .3f}, .2f);
                  grp(l, "C", 8, 2, new float[]{1.0f, 1.5f, 1.05f, 1.25f, -.03f, .03f, -.10f, .08f, 0f, .06f, .1f, .3f, .1f, .25f}, .5f);
                  grp(l, "K", 8, 3, new float[]{1.1f, 1.4f, 1.05f, 1.2f, 0f, .05f, .04f, .12f, 0f, .05f, .15f, .35f, .1f, .25f}, .3f);
                  grp(l, "P", 11, 4, new float[]{.7f, 1.0f, .85f, 1.0f, .03f, .10f, -.04f, .06f, .06f, .16f, .05f, .2f, .05f, .15f}, .5f);
                  grp(l, "H", 15, 5, new float[]{.9f, 1.3f, 1.1f, 1.3f, -.05f, .03f, -.06f, .10f, 0f, .08f, .25f, .5f, .15f, .3f}, .45f);
                  grp(l, "M", 15, 6, new float[]{.6f, 1.0f, .95f, 1.15f, -.08f, 0f, -.08f, .08f, .05f, .18f, .3f, .55f, .15f, .3f}, .5f);
                  grp(l, "bw", 8, 7, new float[]{0f, 0f, .95f, 1.4f, -.05f, .05f, -.02f, .10f, 0f, .12f, .2f, .5f, .2f, .4f}, 0f);
                  l.add(new Filter("FJ-Provia-400").set(1.10f, 1.10f, 0f, 1.00f, 1.02f, 1.05f, .02f, .20f, .20f));
                  l.add(new Filter("FJ-C200").set(1.15f, 1.05f, 0f, 1.05f, 1.03f, .96f, .03f, .20f, .20f));
                  l.add(new Filter("FJ-A100C").set(1.25f, 1.15f, 0f, 1.00f, 1.04f, 1.00f, 0f, .15f, .15f));
                  l.add(new Filter("BB-White").set(.60f, .95f, .08f, 1.00f, 1.00f, 1.05f, .10f, .10f, .10f));
                  l.add(new Filter("BB-Wedding").set(.85f, .92f, .06f, 1.06f, 1.00f, 1.02f, .12f, .15f, .12f).leak(0x66FF3C6E, 0));
                  l.add(new Filter("AG-O100W").set(.90f, 1.00f, 0f, 1.08f, 1.00f, .90f, .08f, .30f, .20f));
                  l.add(new Filter("AG-400C").set(1.10f, 1.10f, 0f, 1.05f, 1.00f, .95f, .04f, .25f, .35f));
                  l.add(new Filter("FJ-V100C").set(1.40f, 1.20f, 0f, 1.00f, 1.05f, 1.00f, 0f, .25f, .15f));
                  return l;
              }
          }
