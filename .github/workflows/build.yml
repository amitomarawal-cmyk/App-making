          EOF

      - name: activity_pattern layout
        run: |
          cat > app/src/main/res/layout/activity_pattern.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:background="@color/bg_dark"
              android:padding="32dp">
              <ImageView android:id="@+id/appIconBig"
                  android:layout_width="72dp" android:layout_height="72dp"
                  android:scaleType="fitCenter"
                  android:layout_marginBottom="12dp"/>
              <TextView android:id="@+id/patternTitle"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textColor="#FFFFFFFF" android:textSize="20sp"
                  android:text="Draw Pattern to Unlock"
                  android:layout_marginBottom="8dp"/>
              <TextView android:id="@+id/patternMsg"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textColor="#CCFFFFFF" android:textSize="14sp"
                  android:layout_marginBottom="24dp"/>
              <com.awal.launcher.PatternView
                  android:id="@+id/patternView"
                  android:layout_width="280dp"
                  android:layout_height="280dp"/>
              <TextView android:id="@+id/btnCancel"
