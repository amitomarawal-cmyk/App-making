                      try {
                          EGL14.eglDestroySurface(dpy, s);
                      } catch (Exception ignored) {
                      }
                  }
              }

              private void drawFrame() {
                  if (released || !glReady || inTex == null) return;
                  try {
                      EGL14.eglMakeCurrent(dpy, pbuf, pbuf, ctx);
                      inTex.updateTexImage();
                      inTex.getTransformMatrix(texMat);
                      long ts = inTex.getTimestamp();
                      updateGain();
                      for (Out o : new ArrayList<>(outs)) {
                          if (o.es == EGL14.EGL_NO_SURFACE) continue;
                          o.out.updateTransformMatrix(o.mat, texMat);
                          EGL14.eglMakeCurrent(dpy, o.es, o.es, ctx);
                          Size sz = o.out.getSize();
                          render(o.mat, sz.getWidth(), sz.getHeight(), ts, false);
                          EGLExt.eglPresentationTimeANDROID(dpy, o.es, ts);
                          EGL14.eglSwapBuffers(dpy, o.es);
                      }
                      EGL14.eglMakeCurrent(dpy, pbuf, pbuf, ctx);
                  } catch (Throwable t) {
                      fail(t);
                  }
              }

              private void prepareColor(Filter f) {
                  if (f == cachedFor) return;
                  float[] a = f.matrix().getArray(); // 4x5 row-major, offsets in 0..255
                  for (int row = 0; row < 3; row++) {
                      for (int col = 0; col < 3; col++) {
                          mat3[col * 3 + row] = a[row * 5 + col];
                      }
                      off[row] = a[row * 5 + 4] / 255f;
                  }
                  cachedFor = f;
              }

              private void updateGain() {
                  float want = 1f;
                  if (autoOn) {
                      if ((frameCount++ % 4) != 0) return;
                      float mean = measureLuma();
                      want = Math.max(1f, Math.min(3.5f, 0.42f / Math.max(mean, 0.03f)));
                  } else if (gain == 1f) {
                      return;
                  }
                  gain += (want - gain) * (autoOn ? 0.15f : 1f);
                  if (gain < 1.005f) gain = 1f;
                  if (Math.abs(gain - lastReported) > 0.05f || (gain == 1f && lastReported != 1f)) {
                      lastReported = gain;
                      GainListener l = gainListener;
                      if (l != null) l.onGain(gain);
                  }
              }

              private float measureLuma() {
                  GLES20.glBindFramebuffer(GLES20.GL_FRAMEBUFFER, fbo);
                  render(texMat, 32, 32, 0L, true);
                  pix.clear();
                  GLES20.glReadPixels(0, 0, 32, 32, GLES20.GL_RGBA, GLES20.GL_UNSIGNED_BYTE, pix);
                  GLES20.glBindFramebuffer(GLES20.GL_FRAMEBUFFER, 0);
                  long sum = 0;
                  for (int i = 0; i < 32 * 32; i++) {
                      int r = pix.get(i * 4) & 255;
                      int g = pix.get(i * 4 + 1) & 255;
                      int b = pix.get(i * 4 + 2) & 255;
                      sum += (r * 299 + g * 587 + b * 114) / 1000;
                  }
                  return sum / 1024f / 255f;
              }

              private void render(float[] texM, int w, int h, long ts, boolean measure) {
                  Filter f = filter;
                  if (f == null) f = new Filter("none");
                  prepareColor(f);

                  GLES20.glViewport(0, 0, w, h);
                  GLES20.glUseProgram(prog);
                  GLES20.glActiveTexture(GLES20.GL_TEXTURE0);
                  GLES20.glBindTexture(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, oesTex);

                  GLES20.glUniformMatrix4fv(uTexM, 1, false, texM, 0);
                  if (measure) {
                      GLES20.glUniformMatrix3fv(uColor, 1, false, new float[]{1, 0, 0, 0, 1, 0, 0, 0, 1}, 0);
                      GLES20.glUniform3f(uOff, 0f, 0f, 0f);
                      GLES20.glUniform1f(uVig, 0f);
                      GLES20.glUniform4f(uLeak, 0f, 0f, 0f, 0f);
                      GLES20.glUniform1i(uSide, 0);
                      GLES20.glUniform1f(uGrain, 0f);
                      GLES20.glUniform1f(uGain, 1f);
                      GLES20.glUniform1f(uGamma, 1f);
                  } else {
                      GLES20.glUniformMatrix3fv(uColor, 1, false, mat3, 0);
                      GLES20.glUniform3f(uOff, off[0], off[1], off[2]);
                      GLES20.glUniform1f(uVig, f.vig);
                      float la = f.leakColor == 0 ? 0f : ((f.leakColor >>> 24) & 255) / 255f;
                      GLES20.glUniform4f(uLeak, ((f.leakColor >> 16) & 255) / 255f, ((f.leakColor >> 8) & 255) / 255f,
                              (f.leakColor & 255) / 255f, la);
                      GLES20.glUniform1i(uSide, f.leakSide);
                      GLES20.glUniform1f(uGrain, f.grain);
                      GLES20.glUniform1f(uGain, gain);
                      GLES20.glUniform1f(uGamma, 1f + (gain - 1f) * 0.2f);
                  }
                  GLES20.glUniform2f(uRes, w, h);
                  GLES20.glUniform1f(uTime, ((ts / 1000000L) % 1000L) / 1000f);

                  int aPos = GLES20.glGetAttribLocation(prog, "aPos");
                  int aTex = GLES20.glGetAttribLocation(prog, "aTex");
                  quad.position(0);
                  GLES20.glVertexAttribPointer(aPos, 2, GLES20.GL_FLOAT, false, 16, quad);
                  GLES20.glEnableVertexAttribArray(aPos);
                  quad.position(2);
                  GLES20.glVertexAttribPointer(aTex, 2, GLES20.GL_FLOAT, false, 16, quad);
                  GLES20.glEnableVertexAttribArray(aTex);
                  GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4);
                  GLES20.glDisableVertexAttribArray(aPos);
                  GLES20.glDisableVertexAttribArray(aTex);
              }
          }
          EOF
