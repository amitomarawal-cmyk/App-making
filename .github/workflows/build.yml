          package com.awal.launcher;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import android.util.AttributeSet;
          import android.view.View;
          public class CompassView extends View {
              private Paint ring,north,south,txt,center,tickP;
              private float bearing=0;
              public CompassView(Context c){super(c);init();}
              public CompassView(Context c,AttributeSet a){super(c,a);init();}
              private void init(){
                  ring=new Paint(Paint.ANTI_ALIAS_FLAG);ring.setStyle(Paint.Style.STROKE);ring.setColor(0x44FFFFFF);ring.setStrokeWidth(2f);
                  north=new Paint(Paint.ANTI_ALIAS_FLAG);north.setStyle(Paint.Style.FILL);north.setColor(0xFFEF5350);north.setShadowLayer(10f,0,0,0x88EF5350);
                  south=new Paint(Paint.ANTI_ALIAS_FLAG);south.setStyle(Paint.Style.FILL);south.setColor(0xFF90A4AE);
                  txt=new Paint(Paint.ANTI_ALIAS_FLAG);txt.setColor(0xCCFFFFFF);txt.setTextSize(22f);txt.setTextAlign(Paint.Align.CENTER);txt.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
                  center=new Paint(Paint.ANTI_ALIAS_FLAG);center.setStyle(Paint.Style.FILL);center.setColor(0xFFFFFFFF);
                  tickP=new Paint(Paint.ANTI_ALIAS_FLAG);tickP.setStyle(Paint.Style.STROKE);tickP.setColor(0x55FFFFFF);tickP.setStrokeWidth(1.5f);
                  setLayerType(LAYER_TYPE_SOFTWARE,null);
              }
              public void setBearing(float b){
                  float diff=b-bearing;
                  if(diff>180)diff-=360;if(diff<-180)diff+=360;
                  bearing+=diff*0.15f;
                  invalidate();
              }
              @Override protected void onDraw(Canvas c){
                  int w=getWidth(),h=getHeight();
                  float cx=w/2f,cy=h/2f,r=Math.min(w,h)/2f-12f;
                  c.drawCircle(cx,cy,r,ring);
                  c.drawCircle(cx,cy,r*0.85f,ring);
                  c.save();c.rotate(-bearing,cx,cy);
                  for(int i=0;i<36;i++){
                      float a=(float)Math.toRadians(i*10);
                      float inner=i%9==0?r*0.72f:r*0.78f;
                      c.drawLine(cx+(float)Math.sin(a)*inner,cy-(float)Math.cos(a)*inner,
                                 cx+(float)Math.sin(a)*(r-4),cy-(float)Math.cos(a)*(r-4),tickP);
                  }
                  String[] dirs={"N","E","S","W"};float[] ang={0,90,180,270};
                  for(int i=0;i<4;i++){
                      float rad=(float)Math.toRadians(ang[i]);
                      float tx2=cx+(float)Math.sin(rad)*(r*0.62f);
                      float ty2=cy-(float)Math.cos(rad)*(r*0.62f)+txt.getTextSize()/3;
                      txt.setColor(i==0?0xFF4FC3F7:0xCCFFFFFF);
                      c.drawText(dirs[i],tx2,ty2,txt);
                  }
                  android.graphics.Path np=new android.graphics.Path();
                  np.moveTo(cx,cy-r+16);np.lineTo(cx-14,cy+8);np.lineTo(cx+14,cy+8);np.close();
                  c.drawPath(np,north);
                  android.graphics.Path sp=new android.graphics.Path();
                  sp.moveTo(cx,cy+r-16);sp.lineTo(cx-14,cy-8);sp.lineTo(cx+14,cy-8);sp.close();
                  c.drawPath(sp,south);
                  c.restore();
                  c.drawCircle(cx,cy,8f,center);
              }
          }
