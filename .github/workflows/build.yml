name: Build Awal Launcher APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/awal/launcher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/anim
          mkdir -p app/src/main/res/xml
          mkdir -p gradle/wrapper

      - name: settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AwalLauncher"
          include ':app'
          EOF

      - name: root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.1.2' apply false }
          EOF

      - name: gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=false
          EOF

      - name: gradle wrapper props
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Download gradle wrapper jar
        run: curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar

      - name: gradlew
        run: |
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          APP_HOME=`pwd -P`
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec "$JAVA_HOME/bin/java" -Xmx64m -Xms64m -Dorg.gradle.appname="gradlew" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x gradlew

      - name: app build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.awal.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.awal.launcher"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { debug { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          EOF

      - name: device_admin.xml
        run: |
          cat > app/src/main/res/xml/device_admin.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies><force-lock/></uses-policies>
          </device-admin>
          EOF

      - name: animations
        run: |
          cat > app/src/main/res/anim/fade_in.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android">
              <alpha android:fromAlpha="0.0" android:toAlpha="1.0"
                  android:duration="350" android:interpolator="@android:anim/decelerate_interpolator"/>
              <scale android:fromXScale="0.92" android:toXScale="1.0"
                  android:fromYScale="0.92" android:toYScale="1.0"
                  android:pivotX="50%" android:pivotY="50%"
                  android:duration="350" android:interpolator="@android:anim/decelerate_interpolator"/>
          </set>
          EOF
          cat > app/src/main/res/anim/slide_up.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android">
              <translate android:fromYDelta="60dp" android:toYDelta="0"
                  android:duration="400" android:interpolator="@android:anim/decelerate_interpolator"/>
              <alpha android:fromAlpha="0.0" android:toAlpha="1.0"
                  android:duration="400" android:interpolator="@android:anim/decelerate_interpolator"/>
          </set>
          EOF
          cat > app/src/main/res/anim/slide_down_out.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android">
              <translate android:fromYDelta="0" android:toYDelta="80dp"
                  android:duration="300" android:interpolator="@android:anim/accelerate_interpolator"/>
              <alpha android:fromAlpha="1.0" android:toAlpha="0.0"
                  android:duration="300"/>
          </set>
          EOF

      - name: AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES"/>
              <uses-feature android:name="android.hardware.location.gps" android:required="false"/>
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false"/>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Awal Launcher"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:launchMode="singleTask" android:screenOrientation="portrait"
                      android:stateNotNeeded="true">
                      <intent-filter android:priority="1">
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".CalendarActivity" android:exported="false" android:theme="@style/AppTheme.Transparent"/>
                  <activity android:name=".WeatherActivity" android:exported="false" android:theme="@style/AppTheme.Transparent"/>
                  <activity android:name=".PatternLockActivity" android:exported="false" android:theme="@style/AppTheme.Transparent"/>
                  <activity android:name=".PatternSetupActivity" android:exported="false" android:theme="@style/AppTheme.Transparent"/>
                  <activity android:name=".SpeedometerActivity" android:exported="false" android:theme="@style/AppTheme.Transparent"/>
                  <activity android:name=".CompassActivity" android:exported="false" android:theme="@style/AppTheme.Transparent"/>
                  <activity android:name=".DockManagerActivity" android:exported="false" android:theme="@style/AppTheme.Transparent"/>
                  <receiver android:name=".AdminReceiver" android:exported="true"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin"/>
                      <intent-filter><action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/></intent-filter>
                  </receiver>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: values
        run: |
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="text_white">#FFFFFFFF</color>
              <color name="text_dim">#CCFFFFFF</color>
              <color name="accent_blue">#4FC3F7</color>
              <color name="accent_teal">#26C6DA</color>
              <color name="bg_dark">#CC000015</color>
              <color name="glass_fill">#2AFFFFFF</color>
              <color name="glass_stroke">#55FFFFFF</color>
          </resources>
          EOF
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Awal Launcher</string></resources>
          EOF
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:colorBackgroundCacheHint">@null</item>
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:windowTranslucentNavigation">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
              <style name="AppTheme.Transparent" parent="AppTheme">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: drawables
        run: |
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1565C0" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#90CAF9" android:pathData="M54,20C35.2,20 20,35.2 20,54s15.2,34 34,34 34,-15.2 34,-34S72.8,20 54,20z"/>
              <path android:fillColor="#1565C0" android:pathData="M54,34C42.9,34 34,42.9 34,54s8.9,20 20,20 20,-8.9 20,-20S65.1,34 54,34z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,44C48.5,44 44,48.5 44,54s4.5,10 10,10 10,-4.5 10,-10S59.5,44 54,44z"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/glass_panel.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#30FFFFFF"/>
              <stroke android:width="1dp" android:color="#60FFFFFF"/>
              <corners android:radius="24dp"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/glass_card.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#2AFFFFFF"/>
              <stroke android:width="1dp" android:color="#55FFFFFF"/>
              <corners android:radius="20dp"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/glass_circle.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#33FFFFFF"/>
              <stroke android:width="1dp" android:color="#66FFFFFF"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/dock_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#44FFFFFF"/>
              <stroke android:width="1dp" android:color="#66FFFFFF"/>
              <corners android:radius="32dp"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/red_circle.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#FFEF5350"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/today_circle.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#FF4FC3F7"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/widget_pill.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#22FFFFFF"/>
              <stroke android:width="1dp" android:color="#44FFFFFF"/>
              <corners android:radius="12dp"/>
          </shape>
          EOF

      - name: main layout
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/rootLayout"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="@color/bg_dark">
              <LinearLayout android:id="@+id/statusBar"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:paddingTop="44dp" android:paddingHorizontal="20dp" android:paddingBottom="4dp">
                  <TextView android:id="@+id/statusTime"
                      android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                      android:textColor="@color/text_white" android:textSize="14sp"
                      android:fontFamily="sans-serif-medium" android:text="12:00"/>
                  <TextView android:id="@+id/statusDate"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/text_dim" android:textSize="13sp" android:text="Mon, Jan 1"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/clockPanel"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_below="@id/statusBar"
                  android:orientation="vertical" android:paddingHorizontal="20dp" android:paddingBottom="8dp">
                  <TextView android:id="@+id/bigClock"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/text_white" android:textSize="72sp"
                      android:fontFamily="sans-serif-thin" android:text="12:00" android:letterSpacing="-0.05"/>
                  <TextView android:id="@+id/fullDate"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/text_dim" android:textSize="15sp" android:text="Monday, January 1"/>
              </LinearLayout>
              <HorizontalScrollView android:id="@+id/widgetScroll"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_below="@id/clockPanel"
                  android:scrollbars="none" android:paddingHorizontal="12dp" android:paddingBottom="8dp">
                  <LinearLayout android:id="@+id/widgetRow"
                      android:layout_width="wrap_content" android:layout_height="130dp"
                      android:orientation="horizontal" android:gravity="center_vertical"/>
              </HorizontalScrollView>
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/appGrid"
                  android:layout_width="match_parent" android:layout_height="match_parent"
                  android:layout_below="@id/widgetScroll" android:layout_above="@id/dockArea"
                  android:padding="4dp" android:clipToPadding="false"/>
              <LinearLayout android:id="@+id/dockArea"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:orientation="vertical" android:paddingBottom="20dp" android:paddingHorizontal="16dp">
                  <LinearLayout android:id="@+id/dockRow"
                      android:layout_width="match_parent" android:layout_height="80dp"
                      android:orientation="horizontal" android:gravity="center"
                      android:background="@drawable/dock_bg" android:padding="8dp"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="52dp"
                      android:orientation="horizontal" android:gravity="center" android:layout_marginTop="8dp">
                      <TextView android:id="@+id/powerBtn"
                          android:layout_width="52dp" android:layout_height="52dp"
                          android:gravity="center" android:text="⏻" android:textSize="22sp"
                          android:textColor="@color/text_white" android:background="@drawable/glass_circle"/>
                  </LinearLayout>
              </LinearLayout>
          </RelativeLayout>
          EOF

      - name: item layouts
        run: |
          cat > app/src/main/res/layout/item_app.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content" android:layout_height="wrap_content"
              android:orientation="vertical" android:gravity="center" android:padding="6dp">
              <FrameLayout android:layout_width="56dp" android:layout_height="56dp">
                  <ImageView android:id="@+id/appIcon"
                      android:layout_width="52dp" android:layout_height="52dp"
                      android:layout_gravity="center" android:scaleType="fitCenter"/>
                  <TextView android:id="@+id/deleteBadge"
                      android:layout_width="20dp" android:layout_height="20dp"
                      android:layout_gravity="top|start" android:gravity="center"
                      android:text="✕" android:textColor="#FFFFFFFF" android:textSize="11sp"
                      android:background="@drawable/red_circle" android:visibility="gone"/>
                  <ImageView android:id="@+id/lockBadge"
                      android:layout_width="18dp" android:layout_height="18dp"
                      android:layout_gravity="bottom|end" android:visibility="gone"/>
              </FrameLayout>
              <TextView android:id="@+id/appName"
                  android:layout_width="68dp" android:layout_height="wrap_content"
                  android:gravity="center" android:textColor="#FFFFFFFF"
                  android:textSize="10sp" android:maxLines="1" android:ellipsize="end"
                  android:layout_marginTop="3dp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/item_dock_app.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content" android:layout_height="wrap_content"
              android:orientation="vertical" android:gravity="center" android:padding="8dp">
              <ImageView android:id="@+id/dockIcon"
                  android:layout_width="48dp" android:layout_height="48dp" android:scaleType="fitCenter"/>
              <TextView android:id="@+id/dockName"
                  android:layout_width="64dp" android:layout_height="wrap_content"
                  android:gravity="center" android:textColor="#FFFFFFFF"
                  android:textSize="10sp" android:maxLines="1" android:ellipsize="end" android:layout_marginTop="2dp"/>
          </LinearLayout>
          EOF

      - name: calendar layout
        run: |
          cat > app/src/main/res/layout/activity_calendar.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#AA000020">
              <LinearLayout
                  android:id="@+id/calCard"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:layout_marginHorizontal="20dp"
                  android:orientation="vertical"
                  android:background="@drawable/glass_panel"
                  android:padding="20dp">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="horizontal" android:gravity="center_vertical"
                      android:layout_marginBottom="16dp">
                      <TextView android:id="@+id/btnPrev"
                          android:layout_width="40dp" android:layout_height="40dp"
                          android:gravity="center" android:text="‹" android:textSize="28sp"
                          android:textColor="#FFFFFFFF" android:background="@drawable/glass_circle"/>
                      <TextView android:id="@+id/monthYear"
                          android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1" android:gravity="center"
                          android:textColor="#FFFFFFFF" android:textSize="18sp"
                          android:fontFamily="sans-serif-medium" android:text="October 2026"/>
                      <TextView android:id="@+id/btnNext"
                          android:layout_width="40dp" android:layout_height="40dp"
                          android:gravity="center" android:text="›" android:textSize="28sp"
                          android:textColor="#FFFFFFFF" android:background="@drawable/glass_circle"/>
                  </LinearLayout>
                  <GridLayout android:id="@+id/dayHeaders"
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:columnCount="7" android:layout_marginBottom="4dp"/>
                  <GridLayout android:id="@+id/calGrid"
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:columnCount="7"/>
                  <TextView android:id="@+id/btnClose"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:layout_gravity="center" android:layout_marginTop="16dp"
                      android:text="Close" android:textColor="@color/accent_blue"
                      android:textSize="15sp" android:padding="8dp"/>
              </LinearLayout>
          </FrameLayout>
          EOF

      - name: weather layout
        run: |
          cat > app/src/main/res/layout/activity_weather.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#AA000020">
              <LinearLayout
                  android:id="@+id/weatherCard"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:layout_marginHorizontal="20dp"
                  android:orientation="vertical"
                  android:background="@drawable/glass_panel"
                  android:padding="20dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:layout_gravity="center" android:text="7-Day Forecast"
                      android:textColor="#FFFFFFFF" android:textSize="18sp"
                      android:fontFamily="sans-serif-medium" android:layout_marginBottom="16dp"/>
                  <LinearLayout android:id="@+id/weatherList"
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="vertical"/>
                  <TextView android:id="@+id/btnClose"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:layout_gravity="center" android:layout_marginTop="16dp"
                      android:text="Close" android:textColor="@color/accent_blue"
                      android:textSize="15sp" android:padding="8dp"/>
              </LinearLayout>
          </FrameLayout>
          EOF

      - name: pattern layout
        run: |
          cat > app/src/main/res/layout/activity_pattern.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#BB000015">
              <LinearLayout
                  android:id="@+id/patternCard"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:layout_marginHorizontal="24dp"
                  android:orientation="vertical" android:gravity="center"
                  android:background="@drawable/glass_panel" android:padding="28dp">
                  <ImageView android:id="@+id/appIconBig"
                      android:layout_width="64dp" android:layout_height="64dp"
                      android:scaleType="fitCenter" android:layout_marginBottom="12dp"/>
                  <TextView android:id="@+id/patternTitle"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="#FFFFFFFF" android:textSize="18sp"
                      android:fontFamily="sans-serif-medium"
                      android:text="Draw Pattern" android:layout_marginBottom="6dp"/>
                  <TextView android:id="@+id/patternMsg"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="#AAFFFFFF" android:textSize="13sp"
                      android:layout_marginBottom="20dp"/>
                  <com.awal.launcher.PatternView
                      android:id="@+id/patternView"
                      android:layout_width="260dp" android:layout_height="260dp"/>
                  <TextView android:id="@+id/btnCancel"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="Cancel" android:textColor="@color/accent_blue"
                      android:textSize="15sp" android:padding="12dp" android:layout_marginTop="8dp"/>
              </LinearLayout>
          </FrameLayout>
          EOF

