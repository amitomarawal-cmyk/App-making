name: Build Bass Booster APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/awal/bassbooster
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p gradle/wrapper

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BassBooster"
          include ':app'
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF

      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.awal.bassbooster'
              compileSdk 34
              defaultConfig {
                  applicationId "com.awal.bassbooster"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.cardview:cardview:1.0.0'
          }
          EOF

      - name: Create gradle wrapper properties
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Download Gradle Wrapper JAR
        run: |
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Create gradlew
        run: |
          python3 - << 'PYEOF'
          content = r"""#!/bin/sh
          APP_NAME="Gradle"
          APP_BASE_NAME=`basename "$0"`
          MAX_FD="maximum"
          warn () { echo "$*"; }
          die () { echo; echo "$*"; echo; exit 1; }
          PRG="$0"
          while [ -h "$PRG" ] ; do
              ls=`ls -ld "$PRG"`
              link=`expr "$ls" : '.*-> \(.*\)$'`
              if expr "$link" : '/.*' > /dev/null; then PRG="$link"
              else PRG=`dirname "$PRG"`"/$link"; fi
          done
          SAVED="`pwd`"
          cd "`dirname \"$PRG\"`/" >/dev/null
          APP_HOME="`pwd -P`"
          cd "$SAVED" >/dev/null
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          JAVACMD="java"
          exec "$JAVACMD" -Xmx64m -Xms64m \
            -Dorg.gradle.appname="$APP_BASE_NAME" \
            -classpath "$CLASSPATH" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          """
          with open('gradlew', 'w') as f:
              f.write(content)
          print("gradlew created")
          PYEOF
          chmod +x gradlew

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.BassBooster">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/awal/bassbooster/MainActivity.java << 'EOF'
          package com.awal.bassbooster;

          import android.media.AudioManager;
          import android.media.audiofx.BassBoost;
          import android.media.audiofx.PresetReverb;
          import android.media.audiofx.Virtualizer;
          import android.os.Bundle;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.widget.Switch;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private BassBoost bassBoost;
              private Virtualizer virtualizer;
              private PresetReverb presetReverb;

              private SeekBar seekBass, seekSurround, seekReverb;
              private TextView tvBassVal, tvSurroundVal, tvReverbVal;
              private Switch switchBass, switchSurround, switchReverb;

              private int audioSessionId = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  try {
                      bassBoost = new BassBoost(0, audioSessionId);
                      bassBoost.setEnabled(true);
                      virtualizer = new Virtualizer(0, audioSessionId);
                      virtualizer.setEnabled(true);
                      presetReverb = new PresetReverb(0, audioSessionId);
                      presetReverb.setEnabled(true);
                  } catch (Exception e) {
                      Toast.makeText(this, "Audio FX not supported on this device", Toast.LENGTH_LONG).show();
                  }

                  seekBass     = findViewById(R.id.seekBass);
                  seekSurround = findViewById(R.id.seekSurround);
                  seekReverb   = findViewById(R.id.seekReverb);
                  tvBassVal     = findViewById(R.id.tvBassVal);
                  tvSurroundVal = findViewById(R.id.tvSurroundVal);
                  tvReverbVal   = findViewById(R.id.tvReverbVal);
                  switchBass     = findViewById(R.id.switchBass);
                  switchSurround = findViewById(R.id.switchSurround);
                  switchReverb   = findViewById(R.id.switchReverb);

                  seekBass.setMax(1000);
                  seekSurround.setMax(1000);
                  seekReverb.setMax(5);

                  seekBass.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) {
                          tvBassVal.setText(p / 10 + "%");
                          if (bassBoost != null) try { bassBoost.setStrength((short) p); } catch (Exception ignored) {}
                      }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });

                  seekSurround.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) {
                          tvSurroundVal.setText(p / 10 + "%");
                          if (virtualizer != null) try { virtualizer.setStrength((short) p); } catch (Exception ignored) {}
                      }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });

                  seekReverb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      String[] labels  = {"None","Small Room","Med Room","Large Room","Med Hall","Large Hall"};
                      short[]  presets = {
                          PresetReverb.PRESET_NONE,
                          PresetReverb.PRESET_SMALLROOM,
                          PresetReverb.PRESET_MEDIUMROOM,
                          PresetReverb.PRESET_LARGEROOM,
                          PresetReverb.PRESET_MEDIUMHALL,
                          PresetReverb.PRESET_LARGEHALL
                      };
                      public void onProgressChanged(SeekBar s, int p, boolean u) {
                          tvReverbVal.setText(labels[p]);
                          if (presetReverb != null) try { presetReverb.setPreset(presets[p]); } catch (Exception ignored) {}
                      }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });

                  switchBass.setOnCheckedChangeListener((b, c) -> {
                      if (bassBoost   != null) try { bassBoost.setEnabled(c);   } catch (Exception ignored) {}
                  });
                  switchSurround.setOnCheckedChangeListener((b, c) -> {
                      if (virtualizer != null) try { virtualizer.setEnabled(c); } catch (Exception ignored) {}
                  });
                  switchReverb.setOnCheckedChangeListener((b, c) -> {
                      if (presetReverb!= null) try { presetReverb.setEnabled(c);} catch (Exception ignored) {}
                  });

                  switchBass.setChecked(true);
                  switchSurround.setChecked(true);
                  switchReverb.setChecked(true);
                  seekBass.setProgress(500);
                  seekSurround.setProgress(500);
                  seekReverb.setProgress(0);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (bassBoost   != null) try { bassBoost.release();   } catch (Exception ignored) {}
                  if (virtualizer != null) try { virtualizer.release(); } catch (Exception ignored) {}
                  if (presetReverb!= null) try { presetReverb.release();} catch (Exception ignored) {}
              }
          }
          EOF

