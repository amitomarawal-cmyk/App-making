          cat > app/src/main/java/com/awal/player/RingView.java << 'EOF'
          package com.awal.player;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Shader;
          import android.graphics.SweepGradient;
          import android.text.TextPaint;
          import android.text.TextUtils;
          import android.util.AttributeSet;
          import android.view.View;

          public class RingView extends View {
            final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
            final TextPaint tp = new TextPaint(Paint.ANTI_ALIAS_FLAG);
            final float d = getResources().getDisplayMetrics().density;
            volatile float target;
            float cur, cur2, rot;
            boolean active, synth = true;
            String title = "", sub = "";
            LinearGradient bg;
            SweepGradient sw;
            float cx, cy, R;

            public RingView(Context c) { super(c); }
            public RingView(Context c, AttributeSet a) { super(c, a); }

            void setLevel(float l) { target = l; }
            void setSynthetic(boolean s) { synth = s; }

            void setActive(boolean a) {
              active = a;
              postInvalidateOnAnimation();
            }

            void setTitle(CharSequence t, CharSequence s) {
              title = t == null ? "" : t.toString();
              sub = s == null ? "" : s.toString();
              invalidate();
            }

            @Override protected void onSizeChanged(int w, int h, int ow, int oh) {
              bg = new LinearGradient(0, 0, 0, h, 0xFF0B0F1A, 0xFF1E1140, Shader.TileMode.CLAMP);
              cx = w / 2f;
              cy = h * 0.36f;
              R = Math.min(w, h) * 0.2f;
              sw = new SweepGradient(cx, cy, new int[] {0xFF4FC3F7, 0xFF7C4DFF, 0xFFFF4081, 0xFF4FC3F7}, null);
            }

            @Override protected void onDraw(Canvas c) {
              int w = getWidth(), h = getHeight();
              p.setShader(bg);
              p.setStyle(Paint.Style.FILL);
              c.drawRect(0, 0, w, h, p);
              p.setShader(null);

              float t = System.nanoTime() / 1e9f;
              float tg = active ? (synth ? 0.3f + 0.25f * (float) Math.sin(t * 5) : target) : 0f;
              cur += (tg - cur) * (tg > cur ? 0.6f : 0.1f);
              cur2 += (cur - cur2) * 0.12f;
              rot += 0.5f + cur * 2f;

              float rr = R * 1.12f + cur * R * 0.22f;
              p.setStyle(Paint.Style.STROKE);
              p.setShader(null);
              p.setColor(0xFF7C4DFF);
              p.setAlpha(70);
              p.setStrokeWidth(d * 2);
              c.drawCircle(cx, cy, R * 1.4f + cur2 * R * 0.5f, p);

              p.setShader(sw);
              p.setStrokeCap(Paint.Cap.ROUND);
              p.setStrokeWidth(d * 3);
              for (int i = 0; i < 56; i++) {
                double a = i * 2 * Math.PI / 56;
                float n = 0.5f + 0.5f * (float) Math.sin(t * 4 + i * 1.9f);
                float r0 = rr + d * 10;
                float r1 = r0 + d * 3 + n * cur * R * 0.6f;
                float ca = (float) Math.cos(a), sa = (float) Math.sin(a);
                c.drawLine(cx + ca * r0, cy + sa * r0, cx + ca * r1, cy + sa * r1, p);
              }

              c.save();
              c.rotate(rot, cx, cy);
              p.setStrokeWidth(d * (5 + cur * 8));
              c.drawCircle(cx, cy, rr, p);
              c.restore();
              p.setShader(null);

              p.setStyle(Paint.Style.FILL);
              p.setColor(0xFF121830);
              c.drawCircle(cx, cy, R * 0.98f, p);
              tp.setColor(0xFFFFFFFF);
              tp.setTextAlign(Paint.Align.CENTER);
              tp.setTextSize(R * 0.9f);
              c.drawText("\u266A", cx, cy + R * 0.3f, tp);

              float y = cy + R * 2.2f;
              float mw = w - d * 48;
              tp.setFakeBoldText(true);
              tp.setTextSize(d * 20);
              c.drawText(TextUtils.ellipsize(title, tp, mw, TextUtils.TruncateAt.END).toString(), cx, y, tp);
              tp.setFakeBoldText(false);
              tp.setColor(0xFF9AA0B8);
              tp.setTextSize(d * 14);
              c.drawText(TextUtils.ellipsize(sub, tp, mw, TextUtils.TruncateAt.END).toString(), cx, y + d * 26, tp);

              if (active || cur > 0.01f) postInvalidateOnAnimation();
            }
          }
