          </vector>
          EOF

          for d in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cat > app/src/main/res/$d/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
            cp app/src/main/res/$d/ic_launcher.xml app/src/main/res/$d/ic_launcher_round.xml
          done

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">iControl Launcher</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.iControlLauncher" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:windowTranslucentNavigation">true</item>
                  <item name="colorPrimary">#1C1C3E</item>
                  <item name="colorPrimaryDark">#0D0D1A</item>
                  <item name="colorAccent">#6C63FF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/anim/fade_in.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <alpha xmlns:android="http://schemas.android.com/apk/res/android"
              android:fromAlpha="0.0" android:toAlpha="1.0" android:duration="300"/>
          EOF

          cat > app/src/main/res/anim/fade_out.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <alpha xmlns:android="http://schemas.android.com/apk/res/android"
              android:fromAlpha="1.0" android:toAlpha="0.0" android:duration="300"/>
          EOF

          cat > app/src/main/res/anim/slide_up.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android">
              <translate android:fromYDelta="100%" android:toYDelta="0%" android:duration="350"/>
              <alpha android:fromAlpha="0.0" android:toAlpha="1.0" android:duration="350"/>
          </set>
          EOF

          cat > app/proguard-rules.pro << 'EOF'
          -keep class com.icontrol.launcher.** { *; }
          EOF

      - name: Setup Gradle Wrapper
        run: |
          cat > settings.gradle << 'EOF'
          rootProject.name = "iControl Launcher"
          include ':app'
          EOF

          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

          cat > gradlew << 'EOF'
          #!/bin/sh
          APP_HOME=$(dirname "$0")
          exec java -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iControl-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
