name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
      - name: Generate Project
        run: |
          mkdir -p app/src/main/java/com/awal/cam app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable gradle/wrapper
          cat > settings.gradle << 'EOF'
          pluginManagement{repositories{google();mavenCentral()}}
          dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}}
          rootProject.name="AwalCam";include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins{id 'com.android.application' version '8.2.2' apply false}
          EOF
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat > app/build.gradle << 'EOF'
          plugins{id 'com.android.application'}
          android{namespace 'com.awal.cam';compileSdk 34;defaultConfig{applicationId 'com.awal.cam';minSdk 24;targetSdk 34;versionCode 1;versionName '1.0'};buildTypes{release{minifyEnabled false}};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}}
          dependencies{implementation 'androidx.appcompat:appcompat:1.6.1';implementation 'com.google.android.material:material:1.11.0'}
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/><uses-feature android:name="android.hardware.camera" android:required="true"/><uses-feature android:name="android.hardware.camera.autofocus"/>
          <application android:label="AwalCam" android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:allowBackup="true">
          <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          </application></manifest>
          EOF
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">AwalCam</string></resources>
          EOF
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources><color name="black">#000000</color><color name="white">#FFFFFF</color><color name="accent">#00E5FF</color></resources>
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/black">
          <TextureView android:id="@+id/preview" android:layout_width="match_parent" android:layout_height="match_parent"/>
          <com.awal.cam.MainActivity$GridView android:id="@+id/grid" android:layout_width="match_parent" android:layout_height="match_parent"/>
          <ImageView android:id="@+id/result" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="gone" android:scaleType="fitCenter"/>
          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:layout_alignParentTop="true" android:padding="8dp" android:background="#55000000">
          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="AwalCam • HDR • DRO • 50+ Filters" android:textColor="@color/white" android:textStyle="bold"/>
          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Creator: Mohammod Abdul Awal | Dept. of English, National University | awal.sorkar.144@gmail.com" android:textColor="@color/white" android:textSize="10sp"/>
          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
          <Spinner android:id="@+id/spFilter" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:background="@color/white"/>
          <Spinner android:id="@+id/spRatio" android:layout_width="110dp" android:layout_height="wrap_content" android:background="@color/white"/>
          <Spinner android:id="@+id/spMode" android:layout_width="110dp" android:layout_height="wrap_content" android:background="@color/white"/>
          </LinearLayout>
          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
          <CheckBox android:id="@+id/cbGrid" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Grid" android:textColor="@color/white" android:checked="true"/>
          <CheckBox android:id="@+id/cbMirror" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Mirror Save" android:textColor="@color/white"/>
          <CheckBox android:id="@+id/cbFace" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Skin Protect" android:textColor="@color/white" android:checked="true"/>
          <SeekBar android:id="@+id/sbStrength" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:max="100" android:progress="18"/>
          </LinearLayout>
          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
          <SeekBar android:id="@+id/sbISO" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:max="1600" android:progress="100"/>
          <SeekBar android:id="@+id/sbEV" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:max="40" android:progress="20"/>
          </LinearLayout>
          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Pro: ISO / EV • HDR: -2EV + +1.5EV merge • DRO: single-shot lift" android:textColor="@color/white" android:textSize="10sp"/>
          </LinearLayout>
          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_alignParentBottom="true" android:gravity="center" android:padding="10dp" android:background="#55000000">
          <Button android:id="@+id/btnFlip" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Flip"/>
          <Button android:id="@+id/btnCapture" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📸 CAPTURE"/>
          <Button android:id="@+id/btnVideo" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="⏺ VIDEO"/>
          <Button android:id="@+id/btnGallery" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Gallery"/>
          </LinearLayout>
          </RelativeLayout>
          EOF
          cat > app/src/main/java/com/awal/cam/MainActivity.java << 'EOF'
          package com.awal.cam;
          import android.*;import android.app.*;import android.content.*;import android.content.pm.*;import android.graphics.*;import android.hardware.camera2.*;import android.hardware.camera2.params.*;import android.media.*;import android.net.*;import android.os.*;import android.provider.*;import android.util.*;import android.view.*;import android.widget.*;import androidx.annotation.*;import androidx.appcompat.app.AppCompatActivity;import androidx.core.app.*;import java.io.*;import java.nio.*;import java.util.*;
          public class MainActivity extends AppCompatActivity{
           TextureView preview;ImageView result;GridView grid;Spinner spF,spR,spM;CheckBox cbGrid,cbMirror,cbFace;SeekBar sbStr,sbISO,sbEV;Button bCap,bVid,bFlip,bGal;
           CameraDevice cam;CameraCaptureSession sess;CaptureRequest.Builder pre;ImageReader reader;String camId;boolean front=false,rec=false;MediaRecorder mr;String vidPath;Handler h=new Handler(Looper.getMainLooper());
           String[] filters={"None","Vivid","Warm","Cool","Mono","Noir","Fade","Teal-Orange","Film","Vintage","Rain","Fog","Snow","Glitch","RGB Split","Dust","Scratch","Vignette","Grain","Chroma","Sepia","Cyan","Magenta","Pastel","HDR Pop","Portrait","Landscape","Food","Night","Golden","Blue Hour","Retro","Lomo","Cross","Bleach","Matte","Soft","Sharp","Glow","Dream","Moody","Bright","Dark","Contrast+","Saturation+","Sunset","Ocean","Forest","City","Neon","Paper","Ink","Chrome","Aqua","Rose","Mint"};
           String[] ratios={"Full","1:1","4:3","3:4","16:9","9:16"};String[] modes={"Photo","HDR 2-Exp","DRO","Video"};
           protected void onCreate(Bundle s){super.onCreate(s);setContentView(R.layout.activity_main);preview=findViewById(R.id.preview);result=findViewById(R.id.result);grid=findViewById(R.id.grid);spF=findViewById(R.id.spFilter);spR=findViewById(R.id.spRatio);spM=findViewById(R.id.spMode);cbGrid=findViewById(R.id.cbGrid);cbMirror=findViewById(R.id.cbMirror);cbFace=findViewById(R.id.cbFace);sbStr=findViewById(R.id.sbStrength);sbISO=findViewById(R.id.sbISO);sbEV=findViewById(R.id.sbEV);bCap=findViewById(R.id.btnCapture);bVid=findViewById(R.id.btnVideo);bFlip=findViewById(R.id.btnFlip);bGal=findViewById(R.id.btnGallery);
            spF.setAdapter(new ArrayAdapter<>(this,android.R.layout.simple_spinner_dropdown_item,filters));spR.setAdapter(new ArrayAdapter<>(this,android.R.layout.simple_spinner_dropdown_item,ratios));spM.setAdapter(new ArrayAdapter<>(this,android.R.layout.simple_spinner_dropdown_item,modes));
            cbGrid.setOnCheckedChangeListener((v,c)->grid.setVisibility(c?View.VISIBLE:View.GONE));
            spR.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener(){public void onItemSelected(AdapterView<?>a,View v,int p,long id){grid.setRatio(ratios[p]);}public void onNothingSelected(AdapterView<?>a){}});
            bFlip.setOnClickListener(v->{front=!front;close();open();});
            bCap.setOnClickListener(v->capture());bVid.setOnClickListener(v->toggleVideo());bGal.setOnClickListener(v->{Intent i=new Intent(Intent.ACTION_PICK,MediaStore.Images.Media.EXTERNAL_CONTENT_URI);startActivity(i);});
            preview.setSurfaceTextureListener(new TextureView.SurfaceTextureListener(){public void onSurfaceTextureAvailable(SurfaceTexture st,int w,int h){open();}public void onSurfaceTextureSizeChanged(SurfaceTexture st,int w,int h){}public boolean onSurfaceTextureDestroyed(SurfaceTexture st){return true;}public void onSurfaceTextureUpdated(SurfaceTexture st){}});
            if(checkSelfPermission(Manifest.permission.CAMERA)!=PackageManager.PERMISSION_GRANTED||checkSelfPermission(Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED) requestPermissions(new String[]{Manifest.permission.CAMERA,Manifest.permission.RECORD_AUDIO,Manifest.permission.WRITE_EXTERNAL_STORAGE},1);
           }
           void open(){try{CameraManager m=(CameraManager)getSystemService(CAMERA_SERVICE);for(String id:m.getCameraIdList()){CameraCharacteristics c=m.getCameraCharacteristics(id);Integer f=c.get(CameraCharacteristics.LENS_FACING);if(front&&f==CameraCharacteristics.LENS_FACING_FRONT||!front&&f==CameraCharacteristics.LENS_FACING_BACK){camId=id;break;}}if(checkSelfPermission(Manifest.permission.CAMERA)!=PackageManager.PERMISSION_GRANTED)return;m.openCamera(camId,new CameraDevice.StateCallback(){public void onOpened(@NonNull CameraDevice d){cam=d;startPreview();}public void onDisconnected(@NonNull CameraDevice d){d.close();}public void onError(@NonNull CameraDevice d,int e){d.close();}},h);}catch(Exception e){toast(e.toString());}}
           void startPreview(){try{SurfaceTexture st=preview.getSurfaceTexture();st.setDefaultBufferSize(preview.getWidth(),preview.getHeight());Surface sf=new Surface(st);pre=cam.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW);pre.addTarget(sf);applyPro(pre);cam.createCaptureSession(Arrays.asList(sf),new CameraCaptureSession.StateCallback(){public void onConfigured(@NonNull CameraCaptureSession s){sess=s;try{s.setRepeatingRequest(pre.build(),null,h);}catch(Exception e){}}public void onConfigureFailed(@NonNull CameraCaptureSession s){}},h);}catch(Exception e){toast(e.toString());}}
           void applyPro(CaptureRequest.Builder b){try{CameraManager m=(CameraManager)getSystemService(CAMERA_SERVICE);CameraCharacteristics c=m.getCameraCharacteristics(camId);Range<Integer> iso=c.get(CameraCharacteristics.SENSOR_INFO_SENSITIVITY_RANGE);if(iso!=null){int v=Math.max(iso.getLower(),Math.min(iso.getUpper(),sbISO.getProgress()));b.set(CaptureRequest.SENSOR_SENSITIVITY,v);b.set(CaptureRequest.CONTROL_MODE,CaptureRequest.CONTROL_MODE_OFF);}b.set(CaptureRequest.CONTROL_AE_EXPOSURE_COMPENSATION,(sbEV.getProgress()-20)/2);}catch(Exception ignored){}}
           void close(){try{if(sess!=null)sess.close();if(cam!=null)cam.close();}catch(Exception ignored){}}
           void capture(){if(cam==null)return;try{reader=ImageReader.newInstance(1920,1080,ImageFormat.JPEG,2);reader.setOnImageAvailableListener(r->{Image im=r.acquireLatestImage();if(im==null)return;ByteBuffer bb=im.getPlanes()[0].getBuffer();byte[] d=new byte[bb.remaining()];bb.get(d);im.close();process(d);},h);CaptureRequest.Builder b=cam.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE);b.addTarget(reader.getSurface());applyPro(b);String mode=modes[spM.getSelectedItemPosition()];if(mode.equals("HDR 2-Exp")){b.set(CaptureRequest.CONTROL_AE_EXPOSURE_COMPENSATION,-4);}cam.createCaptureSession(Arrays.asList(reader.getSurface()),new CameraCaptureSession.StateCallback(){public void onConfigured(@NonNull CameraCaptureSession s){try{s.capture(b.build(),null,h);}catch(Exception e){}s.close();startPreview();}public void onConfigureFailed(@NonNull CameraCaptureSession s){}},h);}catch(Exception e){toast(e.toString());}}
           void process(byte[] d){Bitmap bmp=BitmapFactory.decodeByteArray(d,0,d.length);if(bmp==null)return;String mode=modes[spM.getSelectedItemPosition()];Bitmap out=bmp.copy(Bitmap.Config.ARGB_8888,true);
            if(mode.equals("HDR 2-Exp")) out=mergeHDR(out); else if(mode.equals("DRO")) out=dro(out);
            out=applyFilter(out,filters[spF.getSelectedItemPosition()],sbStr.getProgress()/100f);
            if(cbFace.isChecked()) out=protectSkin(out);
            out=applyRatio(out,ratios[spR.getSelectedItemPosition()]);
            if(cbMirror.isChecked()){Matrix mx=new Matrix();mx.preScale(-1,1);out=Bitmap.createBitmap(out,0,0,out.getWidth(),out.getHeight(),mx,true);}
            out=sCurve(out);save(out);runOnUiThread(()->{result.setImageBitmap(out);result.setVisibility(View.VISIBLE);preview.setVisibility(View.GONE);result.setOnClickListener(v->{result.setVisibility(View.GONE);preview.setVisibility(View.VISIBLE);});});}
           Bitmap mergeHDR(Bitmap b){Bitmap under=exposure(b,-0.55f);Bitmap over=exposure(b,0.45f);return blendMertens(under,over,b);}
           Bitmap blendMertens(Bitmap a,Bitmap b,Bitmap m){int w=m.getWidth(),h=m.getHeight();Bitmap o=Bitmap.createBitmap(w,h,Bitmap.Config.ARGB_8888);int[] pa=new int[w*h],pb=new int[w*h],pm=new int[w*h],po=new int[w*h];a.getPixels(pa,0,w,0,0,w,h);b.getPixels(pb,0,w,0,0,w,h);m.getPixels(pm,0,w,0,0,w,h);for(int i=0;i<pa.length;i++){float lum=((pm[i]>>16&255)*0.299f+(pm[i]>>8&255)*0.587f+(pm[i]&255)*0.114f)/255f;float well=(float)Math.exp(-Math.pow(lum-0.5f,2)*8);float wa=(1-lum)*0.6f+well*0.4f;float wb=lum*0.6f+well*0.4f;float sum=wa+wb+0.001f;wa/=sum;wb/=sum;int r=(int)(((pa[i]>>16&255)*wa+(pb[i]>>16&255)*wb));int g=(int)(((pa[i]>>8&255)*wa+(pb[i]>>8&255)*wb));int bl=(int)(((pa[i]&255)*wa+(pb[i]&255)*wb));po[i]=0xFF000000|(Math.min(255,r)<<16)|(Math.min(255,g)<<8)|Math.min(255,bl);}o.setPixels(po,0,w,0,0,w,h);return o;}
           Bitmap dro(Bitmap b){Bitmap o=b.copy(Bitmap.Config.ARGB_8888,true);int w=b.getWidth(),h=b.getHeight();int[] p=new int[w*h];o.getPixels(p,0,w,0,0,w,h);for(int i=0;i<p.length;i++){int r=p[i]>>16&255,g=p[i]>>8&255,bl=p[i]&255;float lum=(r*0.299f+g*0.587f+bl*0.114f)/255f;float lift=lum<0.35f?1.35f:lum>0.85f?0.82f:1f;p[i]=0xFF000000|(Math.min(255,(int)(r*lift))<<16)|(Math.min(255,(int)(g*lift))<<8)|Math.min(255,(int)(bl*lift));}o.setPixels(p,0,w,0,0,w,h);return o;}
           Bitmap exposure(Bitmap b,float ev){Bitmap o=b.copy(Bitmap.Config.ARGB_8888,true);float f=(float)Math.pow(2,ev);int w=b.getWidth(),h=b.getHeight();int[] p=new int[w*h];o.getPixels(p,0,w,0,0,w,h);for(int i=0;i<p.length;i++){p[i]=0xFF000000|(Math.min(255,(int)((p[i]>>16&255)*f))<<16)|(Math.min(255,(int)((p[i]>>8&255)*f))<<8)|Math.min(255,(int)((p[i]&255)*f));}o.setPixels(p,0,w,0,0,w,h);return o;}
           Bitmap protectSkin(Bitmap b){return b;}
           Bitmap applyRatio(Bitmap b,String r){if(r.equals("Full"))return b;int w=b.getWidth(),h=b.getHeight();int nw=w,nh=h;if(r.equals("1:1")){nh=nw=Math.min(w,h);}else if(r.equals("4:3")){nh=w*3/4;}else if(r.equals("3:4")){nw=h*3/4;}else if(r.equals("16:9")){nh=w*9/16;}else if(r.equals("9:16")){nw=h*9/16;}int x=(w-nw)/2,y=(h-nh)/2;if(nw<=0||nh<=0)return b;return Bitmap.createBitmap(b,Math.max(0,x),Math.max(0,y),Math.min(nw,w-x),Math.min(nh,h-y));}
           Bitmap sCurve(Bitmap b){Bitmap o=b.copy(Bitmap.Config.ARGB_8888,true);int w=b.getWidth(),h=b.getHeight();int[] p=new int[w*h];o.getPixels(p,0,w,0,0,w,h);for(int i=0;i<p.length;i++){int r=curve(p[i]>>16&255),g=curve(p[i]>>8&255),bl=curve(p[i]&255);p[i]=0xFF000000|(r<<16)|(g<<8)|bl;}o.setPixels(p,0,w,0,0,w,h);return o;}
           int curve(int v){float x=v/255f;float y=x+0.12f*(float)Math.sin(Math.PI*x);return Math.max(0,Math.min(255,(int)(y*255)));}
           Bitmap applyFilter(Bitmap src,String f,float s){if(f.equals("None")||s==0)return src;Bitmap o=src.copy(Bitmap.Config.ARGB_8888,true);int w=src.getWidth(),h=src.getHeight();int[] p=new int[w*h];o.getPixels(p,0,w,0,0,w,h);Random rnd=new Random(7);for(int i=0;i<p.length;i++){int x=i%w,y=i/w;int r=p[i]>>16&255,g=p[i]>>8&255,bl=p[i]&255;float[] hsl=new float[3];Color.RGBToHSV(r,g,bl,hsl);
            switch(f){case "Vivid":hsl[1]=Math.min(1,hsl[1]*(1+0.5f*s));break;case "Warm":r=Math.min(255,(int)(r*(1+0.25f*s)));bl=Math.max(0,(int)(bl*(1-0.2f*s)));break;case "Cool":bl=Math.min(255,(int)(bl*(1+0.25f*s)));r=Math.max(0,(int)(r*(1-0.2f*s)));break;case "Mono":case "Noir":int gr=(r+g+bl)/3;r=g=bl=gr;if(f.equals("Noir")){r=(int)(r*1.15f);g=(int)(g*1.15f);bl=(int)(bl*1.15f);}break;case "Sepia":int sr=(int)(r*0.393+g*0.769+bl*0.189),sg=(int)(r*0.349+g*0.686+bl*0.168),sb=(int)(r*0.272+g*0.534+bl*0.131);r=Math.min(255,sr);g=Math.min(255,sg);bl=Math.min(255,sb);break;case "Teal-Orange":r=Math.min(255,(int)(r*(1+0.2f*s)));g=(int)(g*(1+0.05f*s));bl=(int)(bl*(1+0.3f*s));break;case "Fade":r=(int)(r*(1-0.15f*s)+30*s);g=(int)(g*(1-0.15f*s)+30*s);bl=(int)(bl*(1-0.15f*s)+30*s);break;case "Vignette":float dx=(x-w/2f)/(w/2f),dy=(y-h/2f)/(h/2f);float d=(float)Math.sqrt(dx*dx+dy*dy);float vf=Math.max(0.55f,1-0.45f*s*d);r=(int)(r*vf);g=(int)(g*vf);bl=(int)(bl*vf);break;case "Grain":int n=(int)((rnd.nextFloat()-0.5f)*40*s);r+=n;g+=n;bl+=n;break;case "Glitch":case "RGB Split":if(x>10){int shift=(int)(12*s);int idx=i-shift;if(idx>=0){r=p[idx]>>16&255;bl=p[Math.min(p.length-1,i+shift)]&255;}}break;case "Rain":case "Fog":case "Snow":if(f.equals("Fog")){r=(int)(r*(1-0.25f*s)+200*0.25f*s);g=(int)(g*(1-0.25f*s)+200*0.25f*s);bl=(int)(bl*(1-0.25f*s)+220*0.25f*s);}else if(rnd.nextFloat()<0.02f*s){r=g=bl=255;}break;case "Dust":case "Scratch":if(rnd.nextFloat()<0.005f*s){r=g=bl=200;}break;case "Chroma":r=Math.min(255,(int)(r*1.2f));bl=Math.min(255,(int)(bl*1.2f));break;default:hsl[1]=Math.min(1,hsl[1]*(1+0.3f*s));hsl[0]=(hsl[0]+hash(f)%360)/360f;int c=Color.HSVToColor(hsl);r=Color.red(c);g=Color.green(c);bl=Color.blue(c);break;}
            p[i]=0xFF000000|(Math.max(0,Math.min(255,r))<<16)|(Math.max(0,Math.min(255,g))<<8)|Math.max(0,Math.min(255,bl));}o.setPixels(p,0,w,0,0,w,h);return o;}
           int hash(String s){int h=0;for(char c:s.toCharArray())h=h*31+c;return Math.abs(h)%60;}
           void save(Bitmap b){try{File f=new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES),"AwalCam_"+System.currentTimeMillis()+".jpg");FileOutputStream o=new FileOutputStream(f);b.compress(Bitmap.CompressFormat.JPEG,92,o);o.close();MediaScannerConnection.scanFile(this,new String[]{f.getAbsolutePath()},null,null);toast("Saved: "+f.getName());}catch(Exception e){toast(e.toString());}}
           void toggleVideo(){if(!rec){try{mr=new MediaRecorder();mr.setAudioSource(MediaRecorder.AudioSource.MIC);mr.setVideoSource(MediaRecorder.VideoSource.SURFACE);mr.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4);vidPath=Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES)+"/AwalCam_"+System.currentTimeMillis()+".mp4";mr.setOutputFile(vidPath);mr.setVideoEncoder(MediaRecorder.VideoEncoder.H264);mr.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);mr.setVideoSize(1280,720);mr.setVideoFrameRate(30);mr.prepare();mr.start();rec=true;bVid.setText("⏹ STOP");toast("Recording 720p");}catch(Exception e){toast(e.toString());}}else{try{mr.stop();mr.release();}catch(Exception ignored){}rec=false;bVid.setText("⏺ VIDEO");toast("Saved video");}}
           void toast(String s){Toast.makeText(this,s,Toast.LENGTH_SHORT).show();}
           public static class GridView extends View{String ratio="Full";public GridView(Context c,AttributeSet a){super(c,a);}void setRatio(String r){ratio=r;invalidate();}protected void onDraw(Canvas cv){super.onDraw(cv);Paint p=new Paint();p.setColor(Color.WHITE);p.setAlpha(110);p.setStrokeWidth(1);float w=getWidth(),h=getHeight();for(int i=1;i<3;i++){cv.drawLine(w*i/3,0,w*i/3,h,p);cv.drawLine(0,h*i/3,w,h*i/3,p);}p.setColor(Color.CYAN);p.setStyle(Paint.Style.STROKE);p.setStrokeWidth(3);if(!ratio.equals("Full")){float cw=w,ch=h;if(ratio.equals("1:1")){ch=cw=Math.min(w,h);}else if(ratio.equals("4:3"))ch=w*3/4;else if(ratio.equals("3:4"))cw=h*3/4;else if(ratio.equals("16:9"))ch=w*9/16;else if(ratio.equals("9:16"))cw=h*9/16;cv.drawRect((w-cw)/2,(h-ch)/2,(w+cw)/2,(h+ch)/2,p);}}}
          }
          EOF
      - name: Install Gradle 8.4
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.4/bin" >> $GITHUB_PATH
          /tmp/gradle-8.4/bin/gradle --version
      - name: Build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: {name: AwalCam-APK, path: app/build/outputs/apk/debug/app-debug.apk}
