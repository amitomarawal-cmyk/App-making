          EOF

          cat > app/src/main/java/com/awal/tenparts/DownloadTask.java << 'EOF'
          package com.awal.tenparts;

          import android.content.ContentValues;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLDecoder;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.ExecutionException;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.Future;
          import java.util.concurrent.atomic.AtomicInteger;
          import java.util.concurrent.atomic.AtomicLong;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class DownloadTask {
              public static final int PARTS = 10;
              public static final int QUEUED = 0, CONNECTING = 1, DOWNLOADING = 2, MERGING = 3,
                      DONE = 4, FAILED = 5, CANCELED = 6;

              // একসাথে সর্বোচ্চ ৩টা ফাইল চলবে, বাকিগুলো লাইনে দাঁড়াবে
              private static final ExecutorService FILES = Executors.newFixedThreadPool(3);
              // টুকরা-থ্রেডগুলো এখানে চলবে
              private static final ExecutorService SEGMENTS = Executors.newCachedThreadPool();
              private static final AtomicInteger IDS = new AtomicInteger(1);

              public final int id = IDS.getAndIncrement();
              public final String url;
              public volatile String name = "লিংক পরীক্ষা হচ্ছে...";
              public volatile long total = -1;
              public final AtomicLong downloaded = new AtomicLong(0);
              public final AtomicInteger partsDone = new AtomicInteger(0);
              public volatile int totalParts = PARTS;
              public volatile int state = QUEUED;
              public volatile String error = "";
              public volatile String savedTo = "";
              public volatile long speed = 0;

              private volatile boolean cancelled = false;
              private volatile boolean abort = false;
              private volatile boolean rangeOk = false;
              private volatile String resolved;
              private long lastBytes = 0;
              private final Context ctx;
              private File dir;

              public DownloadTask(Context context, String url) {
                  this.ctx = context.getApplicationContext();
                  this.url = url;
                  this.resolved = url;
              }

              public void start() {
                  FILES.execute(this::run);
              }

              public void cancel() {
                  cancelled = true;
                  state = CANCELED;
              }

              public void retry() {
                  if (state != FAILED) return;
                  cancelled = false;
                  abort = false;
                  error = "";
                  state = QUEUED;
                  FILES.execute(this::run);
              }

              public void tick(long ms) {
                  long d = downloaded.get();
                  long s = (d - lastBytes) * 1000 / ms;
                  speed = s < 0 ? 0 : s;
                  lastBytes = d;
              }

              private boolean stopped() {
                  return cancelled || abort;
              }

              private void set(int s) {
                  if (!cancelled) state = s;
              }

              private void run() {
                  try {
                      set(CONNECTING);
                      probe();
                      if (cancelled) {
                          cleanup();
                          return;
                      }
                      File base = ctx.getExternalFilesDir(null);
                      if (base == null) base = ctx.getFilesDir();
                      dir = new File(base, "parts_" + id);
                      if (!dir.exists() && !dir.mkdirs()) throw new IOException("টেম্প ফোল্ডার তৈরি করা যায়নি");

                      final boolean ranged = rangeOk;
                      final int n = (ranged && total >= PARTS * 1024L) ? PARTS : 1;
                      totalParts = n;
                      final long size = ranged ? total / n : 0;
                      File[] parts = new File[n];
                      long have = 0;
                      for (int i = 0; i < n; i++) {
                          parts[i] = new File(dir, "part" + i);
                          if (parts[i].exists()) have += parts[i].length();
                      }
                      downloaded.set(have);
                      lastBytes = have;
                      partsDone.set(0);
                      set(DOWNLOADING);

                      List<Future<?>> fs = new ArrayList<>();
                      for (int i = 0; i < n; i++) {
                          final File pf = parts[i];
                          final long s = ranged ? i * size : 0;
                          final long e = ranged ? (i == n - 1 ? total - 1 : s + size - 1) : -1;
                          fs.add(SEGMENTS.submit(() -> {
                              downloadPart(pf, s, e, ranged);
                              if (!stopped()) partsDone.incrementAndGet();
                              return null;
                          }));
                      }

                      try {
                          for (Future<?> f : fs) f.get();
                      } catch (ExecutionException ex) {
                          abort = true;
                          for (Future<?> f : fs) {
                              try { f.get(); } catch (Exception ignore) { }
                          }
                          Throwable c = ex.getCause();
                          throw (c instanceof Exception) ? (Exception) c : ex;
                      }

                      if (cancelled) {
                          cleanup();
                          return;
                      }

                      long sum = 0;
                      for (File p : parts) sum += p.exists() ? p.length() : 0;
                      if (total > 0 && sum != total) throw new IOException("ফাইল অসম্পূর্ণ (" + sum + "/" + total + ")");

                      set(MERGING);
                      merge(parts);
                      cleanup();
                      set(DONE);
                  } catch (Exception e) {
                      if (cancelled) {
                          cleanup();
                      } else {
                          String m = e.getMessage();
                          error = (m == null || m.isEmpty()) ? e.getClass().getSimpleName() : m;
                          state = FAILED;
                      }
                  }
              }

              // ---------- সার্ভার পরীক্ষা: সাইজ আর Range সাপোর্ট আছে কিনা ----------
              private void probe() throws IOException {
                  HttpURLConnection c = open(url, 0, 0);
                  try {
                      resolved = c.getURL().toString();
                      int code = c.getResponseCode();
                      String cd = c.getHeaderField("Content-Disposition");
                      if (code == 206) {
                          long t = -1;
                          String cr = c.getHeaderField("Content-Range");
                          if (cr != null && cr.contains("/")) {
                              try {
                                  t = Long.parseLong(cr.substring(cr.lastIndexOf('/') + 1).trim());
                              } catch (NumberFormatException ignore) { }
                          }
                          total = t;
                          rangeOk = t > 0;
                      } else if (code == 200) {
                          total = c.getContentLengthLong();
                          rangeOk = false;
                      } else if (code == 416) {
                          total = 0;
                          rangeOk = false;
                      } else {
                          throw new IOException("সার্ভার থেকে HTTP " + code + " এসেছে");
                      }
                      name = pickName(cd, resolved);
                  } finally {
                      c.disconnect();
                  }
              }

              private String pickName(String cd, String u) {
                  String n = null;
                  if (cd != null) {
                      Matcher m = Pattern.compile("filename\\*?=(?:UTF-8'')?\"?([^\";]+)\"?",
                              Pattern.CASE_INSENSITIVE).matcher(cd);
                      if (m.find()) n = m.group(1).trim();
                  }
                  if (n == null) {
                      try {
                          String p = new URL(u).getPath();
                          n = p.substring(p.lastIndexOf('/') + 1);
                      } catch (Exception ignore) { }
                  }
                  if (n != null) {
                      try { n = URLDecoder.decode(n, "UTF-8"); } catch (Exception ignore) { }
                  }
                  if (n == null || n.trim().isEmpty()) n = "download_" + System.currentTimeMillis();
                  n = n.replaceAll("[\\\\/:*?\"<>|]", "_").trim();
                  return n;
              }

              // ---------- redirect নিজে ফলো করে কানেকশন খোলা ----------
              private HttpURLConnection open(String u, long from, long to) throws IOException {
                  for (int i = 0; i < 8; i++) {
                      HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                      c.setInstanceFollowRedirects(false);
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(20000);
                      c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android) TenPartsDM/1.0");
                      c.setRequestProperty("Accept-Encoding", "identity");
                      if (from >= 0) {
                          c.setRequestProperty("Range", "bytes=" + from + "-" + (to >= 0 ? String.valueOf(to) : ""));
                      }
                      int code = c.getResponseCode();
                      if (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) {
                          String loc = c.getHeaderField("Location");
                          c.disconnect();
                          if (loc == null) throw new IOException("Redirect এর Location নেই");
                          u = new URL(new URL(u), loc).toString();
                          continue;
                      }
                      return c;
                  }
                  throw new IOException("অনেক বেশি redirect");
              }

              // ---------- একটা টুকরা ডাউনলোড (ব্যর্থ হলে ৫ বার পর্যন্ত, যেখানে থেমেছিল সেখান থেকে) ----------
              private void downloadPart(File f, long start, long end, boolean ranged) throws Exception {
                  int attempt = 0;
                  byte[] buf = new byte[32768];
                  while (true) {
                      if (stopped()) return;
                      long have = f.exists() ? f.length() : 0;
                      if (!ranged && have > 0) {
                          downloaded.addAndGet(-have);
                          f.delete();
                          have = 0;
                      }
                      long partLen = ranged ? end - start + 1 : -1;
                      if (ranged && have >= partLen) return;

                      HttpURLConnection c = null;
                      try {
                          c = ranged ? open(resolved, start + have, end) : open(resolved, -1, -1);
                          int code = c.getResponseCode();
                          if (ranged && code != 206) throw new IOException("সার্ভার Range সাপোর্ট করেনি (HTTP " + code + ")");
                          if (!ranged && code != 200) throw new IOException("HTTP " + code);

                          long got = 0;
                          try (InputStream in = c.getInputStream();
                               FileOutputStream out = new FileOutputStream(f, ranged)) {
                              int r;
                              while (!stopped() && (r = in.read(buf)) > 0) {
                                  if (ranged) {
                                      long remaining = partLen - have - got;
                                      if (r > remaining) r = (int) remaining;
                                  }
                                  out.write(buf, 0, r);
                                  got += r;
                                  downloaded.addAndGet(r);
                                  if (ranged && have + got >= partLen) break;
                              }
                          }
                          if (stopped()) return;
                          if (ranged && have + got < partLen) throw new IOException("টুকরা অসম্পূর্ণ");
                          return;
                      } catch (IOException e) {
                          if (stopped()) return;
                          if (++attempt >= 5) throw e;
                          Thread.sleep(1000L * attempt);
                      } finally {
                          if (c != null) c.disconnect();
                      }
                  }
              }

              // ---------- ১০ টুকরা জোড়া লাগানো ----------
              private void merge(File[] parts) throws Exception {
                  OutputStream out;
                  Uri uri = null;
                  File outFile = null;
                  if (Build.VERSION.SDK_INT >= 29) {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                      v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/TenParts");
                      v.put(MediaStore.Downloads.IS_PENDING, 1);
                      uri = ctx.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      if (uri == null) throw new IOException("আউটপুট ফাইল তৈরি করা যায়নি");
                      out = ctx.getContentResolver().openOutputStream(uri);
                      if (out == null) throw new IOException("আউটপুট ফাইল খোলা যায়নি");
                      savedTo = "Downloads/TenParts/" + name;
                  } else {
                      File d = new File(Environment.getExternalStoragePublicDirectory(
                              Environment.DIRECTORY_DOWNLOADS), "TenParts");
                      if (!d.exists() && !d.mkdirs()) throw new IOException("Downloads ফোল্ডারে লেখা যাচ্ছে না (পারমিশন দিন)");
                      outFile = unique(d, name);
                      out = new FileOutputStream(outFile);
                      savedTo = "Download/TenParts/" + outFile.getName();
                  }

                  byte[] buf = new byte[65536];
                  try {
                      for (File p : parts) {
                          if (!p.exists()) continue;
                          try (InputStream in = new FileInputStream(p)) {
                              int r;
                              while ((r = in.read(buf)) > 0) out.write(buf, 0, r);
                          }
                      }
                      out.flush();
                      out.close();
                  } catch (IOException e) {
                      try { out.close(); } catch (Exception ignore) { }
                      if (uri != null) ctx.getContentResolver().delete(uri, null, null);
                      else if (outFile != null) outFile.delete();
                      throw e;
                  }

                  if (uri != null) {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.IS_PENDING, 0);
                      ctx.getContentResolver().update(uri, v, null, null);
                  }
              }

              private File unique(File d, String n) {
                  File f = new File(d, n);
                  String base = n, ext = "";
                  int dot = n.lastIndexOf('.');
                  if (dot > 0) {
                      base = n.substring(0, dot);
                      ext = n.substring(dot);
                  }
                  int i = 1;
                  while (f.exists()) f = new File(d, base + " (" + (i++) + ")" + ext);
                  return f;
              }

              private void cleanup() {
                  if (dir == null) return;
                  File[] fs = dir.listFiles();
                  if (fs != null) for (File f : fs) f.delete();
                  dir.delete();
              }
          }
