          /** OpenGL processor: applies the selected filter to every video frame before encoding. */
          public class VideoFx implements SurfaceProcessor {

              public static class Effect extends CameraEffect {
                  public Effect(Executor e, SurfaceProcessor p, Consumer<Throwable> l) {
                      super(CameraEffect.VIDEO_CAPTURE, e, p, l);
                  }
              }

              private static class Out {
                  SurfaceOutput out;
                  EGLSurface es = EGL14.EGL_NO_SURFACE;
                  float[] mat = new float[16];
              }

              private static final String VS =
                      "uniform mat4 uTexM;\n"
                      + "attribute vec4 aPos;\n"
                      + "attribute vec4 aTex;\n"
                      + "varying vec2 vTex;\n"
                      + "varying vec2 vPos;\n"
                      + "void main(){\n"
                      + "  gl_Position = aPos;\n"
                      + "  vTex = (uTexM * aTex).xy;\n"
                      + "  vPos = aTex.xy;\n"
                      + "}\n";

              private static final String FS =
                      "#extension GL_OES_EGL_image_external : require\n"
                      + "#ifdef GL_FRAGMENT_PRECISION_HIGH\n"
                      + "precision highp float;\n"
                      + "#else\n"
                      + "precision mediump float;\n"
                      + "#endif\n"
                      + "varying vec2 vTex;\n"
                      + "varying vec2 vPos;\n"
                      + "uniform samplerExternalOES sTex;\n"
                      + "uniform mat3 uColor;\n"
                      + "uniform vec3 uOff;\n"
                      + "uniform float uVig;\n"
                      + "uniform vec4 uLeak;\n"
                      + "uniform int uSide;\n"
                      + "uniform float uGrain;\n"
                      + "uniform vec2 uRes;\n"
                      + "uniform float uTime;\n"
                      + "uniform float uGain;\n"
                      + "uniform float uGamma;\n"
                      + "void main(){\n"
                      + "  vec3 c = texture2D(sTex, vTex).rgb;\n"
                      + "  if (uGain > 1.001) {\n"
                      + "    c = pow(c, vec3(1.0 / uGamma));\n"
                      + "    c *= uGain;\n"
                      + "    vec3 over = max(c - 0.8, 0.0);\n"
                      + "    c = min(c, vec3(0.8)) + 0.2 * (1.0 - exp(-over / 0.2));\n"
                      + "  }\n"
                      + "  c = clamp(uColor * c + uOff, 0.0, 1.0);\n"
                      + "  if (uLeak.a > 0.0) {\n"
                      + "    float t;\n"
                      + "    if (uSide == 0) t = 1.0 - vPos.x / 0.6;\n"
                      + "    else if (uSide == 1) t = 1.0 - (1.0 - vPos.x) / 0.6;\n"
                      + "    else if (uSide == 2) t = 1.0 - (1.0 - vPos.y) / 0.5;\n"
                      + "    else t = 1.0 - vPos.y / 0.5;\n"
                      + "    t = clamp(t, 0.0, 1.0);\n"
                      + "    c = mix(c, uLeak.rgb, uLeak.a * t);\n"
                      + "  }\n"
                      + "  if (uVig > 0.0) {\n"
                      + "    vec2 p = (vPos - 0.5) * uRes;\n"
                      + "    float d = length(p) / (0.5 * length(uRes));\n"
                      + "    float t2 = clamp((d - 0.5) / 0.5, 0.0, 1.0);\n"
                      + "    c *= 1.0 - uVig * t2;\n"
                      + "  }\n"
                      + "  if (uGrain > 0.0) {\n"
                      + "    float n = fract(sin(dot(vPos * uRes * 0.5 + uTime * 100.0, vec2(12.9898, 78.233))) * 43758.5453);\n"
                      + "    c = mix(c, vec3(n), uGrain * 0.35);\n"
                      + "  }\n"
                      + "  gl_FragColor = vec4(c, 1.0);\n"
