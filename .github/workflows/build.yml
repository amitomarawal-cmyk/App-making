          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.drawable.GradientDrawable;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.GestureDetector;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.recyclerview.widget.GridLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {
              private static final int REQ_PATTERN=101,REQ_SETUP=102,REQ_ADMIN=103,REQ_DOCK=104;
              private Handler handler=new Handler();
              private TextView bigClock,fullDate,statusTime,statusDate;
              private RecyclerView appGrid;
              private AppAdapter adapter;
              private List<AppInfo> appList=new ArrayList<>();
              private SharedPreferences usagePrefs,patternPrefs,dockPrefs;
              private WeatherManager weatherMgr;
              private LinearLayout dockRow,widgetRow;
              private GestureDetector powerGesture;
              private AudioManager audioMgr;
              private DevicePolicyManager dpm;
              private ComponentName adminComp;
              private AppInfo pendingLaunch;
              private List<WeatherData> cachedWeather;
              private boolean editMode=false;

              private Runnable tick=new Runnable(){@Override public void run(){clock();handler.postDelayed(this,1000);}};

              @Override protected void onCreate(Bundle s){
                  super.onCreate(s);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  setContentView(R.layout.activity_main);
                  usagePrefs=getSharedPreferences("usage",MODE_PRIVATE);
                  patternPrefs=getSharedPreferences("patterns",MODE_PRIVATE);
                  dockPrefs=getSharedPreferences("dock_prefs",MODE_PRIVATE);
                  audioMgr=(AudioManager)getSystemService(AUDIO_SERVICE);
                  dpm=(DevicePolicyManager)getSystemService(DEVICE_POLICY_SERVICE);
                  adminComp=new ComponentName(this,AdminReceiver.class);
                  weatherMgr=new WeatherManager(this);
                  bigClock=findViewById(R.id.bigClock);fullDate=findViewById(R.id.fullDate);
                  statusTime=findViewById(R.id.statusTime);statusDate=findViewById(R.id.statusDate);
                  appGrid=findViewById(R.id.appGrid);dockRow=findViewById(R.id.dockRow);widgetRow=findViewById(R.id.widgetRow);
                  appGrid.setLayoutManager(new GridLayoutManager(this,4));
                  adapter=new AppAdapter(appList,this::onAppClick,this::onAppLong,this::onAppDelete);
                  appGrid.setAdapter(adapter);
                  setupWidgets();setupPower();loadApps();loadWeather();
                  if(!dpm.isAdminActive(adminComp)){
                      Intent i=new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                      i.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN,adminComp);
                      i.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION,"Needed to lock screen.");
                      startActivityForResult(i,REQ_ADMIN);
                  }
              }

              private void setupWidgets(){
                  String[][] w={{"☀","weather"},{"🗓","calendar"},{"🧮","calc"},{"🧭","compass"},{"🚗","speed"}};
                  for(String[] item:w){
                      LinearLayout card=new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);card.setGravity(android.view.Gravity.CENTER);
                      GradientDrawable bg=new GradientDrawable();
                      bg.setCornerRadius(20*getResources().getDisplayMetrics().density);
                      bg.setColor(0x2AFFFFFF);bg.setStroke(1,0x55FFFFFF);card.setBackground(bg);
                      LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(120,130);lp.setMargins(8,0,8,0);card.setLayoutParams(lp);
                      TextView tv=new TextView(this);tv.setText(item[0]);tv.setTextSize(32);tv.setGravity(android.view.Gravity.CENTER);card.addView(tv);
                      TextView lbl=new TextView(this);lbl.setTextColor(0xCCFFFFFF);lbl.setTextSize(10);lbl.setGravity(android.view.Gravity.CENTER);
                      if("weather".equals(item[1]))lbl.setTag("weather_label");
                      card.addView(lbl);
                      final String t=item[1];card.setOnClickListener(v->handleWidget(t));
                      widgetRow.addView(card);
                  }
              }

              private void handleWidget(String t){
                  switch(t){
                      case"weather":showWeatherFull();break;
                      case"calendar":showCal();break;
                      case"compass":startActivity(new Intent(this,CompassActivity.class));break;
                      case"speed":startActivity(new Intent(this,SpeedometerActivity.class));break;
                      case"calc":
                          try{startActivity(new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_APP_CALCULATOR));}
                          catch(Exception e){Toast.makeText(this,"No calculator app found",Toast.LENGTH_SHORT).show();}break;
                  }
              }

              private void showCal(){
                  java.util.Calendar c=java.util.Calendar.getInstance();
                  java.text.SimpleDateFormat mf=new java.text.SimpleDateFormat("MMMM yyyy",Locale.ENGLISH);
                  StringBuilder sb=new StringBuilder(mf.format(c.getTime())+"\n\nSu Mo Tu We Th Fr Sa\n");
                  int today=c.get(java.util.Calendar.DAY_OF_MONTH);
                  c.set(java.util.Calendar.DAY_OF_MONTH,1);
                  int first=c.get(java.util.Calendar.DAY_OF_WEEK)-1,max=c.getActualMaximum(java.util.Calendar.DAY_OF_MONTH),col=0;
                  for(int i=0;i<first;i++){sb.append("   ");col++;}
                  for(int d=1;d<=max;d++){sb.append(d==today?String.format("[%2d]",d):String.format(" %2d ",d));if(++col%7==0)sb.append("\n");}
                  new AlertDialog.Builder(this).setTitle("Calendar").setMessage(sb).setPositiveButton("OK",null).show();
              }

              private void showWeatherFull(){
                  if(cachedWeather==null){Toast.makeText(this,"Loading...",Toast.LENGTH_SHORT).show();return;}
                  StringBuilder sb=new StringBuilder("7-Day Forecast\n\n");
                  for(WeatherData d:cachedWeather)sb.append(d.icon+" "+d.day+": "+d.condition+" "+d.tempHigh+"°/"+d.tempLow+"°C\n");
                  new AlertDialog.Builder(this).setTitle("Weather").setMessage(sb).setPositiveButton("OK",null).show();
              }

              private void setupPower(){
                  TextView pb=findViewById(R.id.powerBtn);
                  powerGesture=new GestureDetector(this,new GestureDetector.SimpleOnGestureListener(){
                      @Override public boolean onFling(MotionEvent e1,MotionEvent e2,float vx,float vy){
                          float dx=e2.getX()-e1.getX(),dy=e2.getY()-e1.getY();
                          if(Math.abs(dx)>Math.abs(dy)){
                              audioMgr.adjustStreamVolume(AudioManager.STREAM_MUSIC,dx>0?AudioManager.ADJUST_RAISE:AudioManager.ADJUST_LOWER,AudioManager.FLAG_SHOW_UI);
                          }else{
                              try{int cur=android.provider.Settings.System.getInt(getContentResolver(),android.provider.Settings.System.SCREEN_BRIGHTNESS);
                                  android.provider.Settings.System.putInt(getContentResolver(),android.provider.Settings.System.SCREEN_BRIGHTNESS,dy<0?Math.min(255,cur+25):Math.max(0,cur-25));
                              }catch(Exception ignored){}}
                          return true;
                      }
                  });
                  pb.setOnTouchListener((v,ev)->{powerGesture.onTouchEvent(ev);return false;});
                  pb.setOnClickListener(v->{
                      if(dpm.isAdminActive(adminComp)){dpm.lockNow();}
                      else{Intent i=new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                          i.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN,adminComp);
                          i.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION,"Allow to lock screen.");
                          startActivityForResult(i,REQ_ADMIN);}
                  });
                  pb.setOnLongClickListener(v->{
                      startActivityForResult(new Intent(this,DockManagerActivity.class),REQ_DOCK);
                      return true;
                  });
              }

              private void loadApps(){
                  new Thread(()->{
                      Intent intent=new Intent(Intent.ACTION_MAIN,null);intent.addCategory(Intent.CATEGORY_LAUNCHER);
                      PackageManager pm=getPackageManager();
                      List<ResolveInfo> res=pm.queryIntentActivities(intent,0);
                      List<AppInfo> list=new ArrayList<>();
                      for(ResolveInfo ri:res){
                          String pkg=ri.activityInfo.packageName;
                          if(pkg.equals(getPackageName()))continue;
                          list.add(new AppInfo(ri.loadLabel(pm).toString(),pkg,ri.loadIcon(pm),usagePrefs.getInt(pkg,0),patternPrefs.getString("pattern_"+pkg,null)!=null));
                      }
                      Collections.sort(list,(a,b)->{if(b.launchCount!=a.launchCount)return b.launchCount-a.launchCount;return a.label.compareToIgnoreCase(b.label);});
                      runOnUiThread(()->{appList.clear();appList.addAll(list);adapter.update(appList);buildDock(pm);});
                  }).start();
              }

              private void buildDock(PackageManager pm){
                  dockRow.removeAllViews();
                  Set<String> saved=dockPrefs.getStringSet("dock_apps",null);
                  List<String> pkgs=new ArrayList<>();
                  if(saved!=null&&!saved.isEmpty()){pkgs.addAll(saved);}
                  else{String[] def={"dialer","messaging","chrome","camera2","settings"};
                      for(AppInfo a:appList){for(String d:def){if(a.packageName.contains(d)&&pkgs.size()<5)pkgs.add(a.packageName);}}}
                  for(String pkg:pkgs){
                      for(AppInfo a:appList){
                          if(a.packageName.equals(pkg)){
                              LinearLayout cell=new LinearLayout(this);
                              cell.setOrientation(LinearLayout.VERTICAL);cell.setGravity(android.view.Gravity.CENTER);
                              LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(0,LinearLayout.LayoutParams.MATCH_PARENT,1f);cell.setLayoutParams(lp);
                              ImageView iv=new ImageView(this);iv.setImageDrawable(a.icon);
                              iv.setLayoutParams(new LinearLayout.LayoutParams(52,52));iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                              cell.addView(iv);cell.setOnClickListener(v->onAppClick(a));dockRow.addView(cell);break;
                          }
                      }
                  }
              }

              private void onAppClick(AppInfo a){
                  if(editMode)return;
                  if(a.patternLocked){pendingLaunch=a;Intent i=new Intent(this,PatternLockActivity.class);i.putExtra("package",a.packageName);startActivityForResult(i,REQ_PATTERN);}
                  else launchApp(a);
              }

              private void onAppLong(AppInfo a){
                  if(editMode){exitEditMode();return;}
                  new AlertDialog.Builder(this).setTitle(a.label)
                      .setItems(new String[]{
                          "Open",
                          a.patternLocked?"Remove Pattern Lock":"Set Pattern Lock",
                          "Uninstall"
                      },(d,w)->{
                          if(w==0)onAppClick(a);
                          else if(w==1){
                              if(a.patternLocked){patternPrefs.edit().remove("pattern_"+a.packageName).apply();a.patternLocked=false;adapter.update(appList);}
                              else{pendingLaunch=null;Intent i=new Intent(this,PatternSetupActivity.class);i.putExtra("package",a.packageName);startActivityForResult(i,REQ_SETUP);}
                          }else if(w==2){uninstallApp(a);}
                      }).show();
              }

              private void onAppDelete(AppInfo a){uninstallApp(a);}

              private void uninstallApp(AppInfo a){
                  new AlertDialog.Builder(this)
                      .setTitle("Uninstall "+a.label+"?")
                      .setMessage("This will remove the app from your device.")
                      .setPositiveButton("Uninstall",(d,w)->{
                          Intent i=new Intent(Intent.ACTION_DELETE);
                          i.setData(Uri.parse("package:"+a.packageName));
                          startActivity(i);
                      })
                      .setNegativeButton("Cancel",null).show();
              }

              private void exitEditMode(){
                  editMode=false;adapter.setEditMode(false);
                  Toast.makeText(this,"Edit mode off",Toast.LENGTH_SHORT).show();
              }

              @Override public void onBackPressed(){
                  if(editMode){exitEditMode();}
              }

              @Override protected void onActivityResult(int req,int res,Intent data){
                  if(req==REQ_PATTERN&&res==RESULT_OK&&pendingLaunch!=null){launchApp(pendingLaunch);pendingLaunch=null;}
                  else if(req==REQ_SETUP&&res==RESULT_OK){for(AppInfo a:appList)a.patternLocked=patternPrefs.getString("pattern_"+a.packageName,null)!=null;adapter.update(appList);}
                  else if(req==REQ_DOCK&&res==RESULT_OK){loadApps();}
              }

              private void launchApp(AppInfo a){
                  int c=usagePrefs.getInt(a.packageName,0)+1;usagePrefs.edit().putInt(a.packageName,c).apply();a.launchCount=c;
                  Collections.sort(appList,(x,y)->{if(y.launchCount!=x.launchCount)return y.launchCount-x.launchCount;return x.label.compareToIgnoreCase(y.label);});
                  adapter.update(new ArrayList<>(appList));
                  Intent i=getPackageManager().getLaunchIntentForPackage(a.packageName);if(i!=null)startActivity(i);
              }

              private void loadWeather(){
                  String loc=getSharedPreferences("launcher_prefs",MODE_PRIVATE).getString("weather_location","Dhaka");
                  weatherMgr.get(loc,data->{
                      cachedWeather=data;
                      if(!data.isEmpty()){
                          WeatherData t=data.get(0);
                          View wCard=widgetRow.getChildAt(0);
                          if(wCard instanceof LinearLayout){
                              View lbl=((LinearLayout)wCard).getChildAt(1);
                              if(lbl instanceof TextView)((TextView)lbl).setText(t.icon+t.tempHigh+"°C");
                          }
                      }
                  });
              }

              private void clock(){
                  Date now=new Date();
                  bigClock.setText(new SimpleDateFormat("HH:mm",Locale.ENGLISH).format(now));
                  fullDate.setText(new SimpleDateFormat("EEEE, MMMM d",Locale.ENGLISH).format(now));
                  statusTime.setText(new SimpleDateFormat("HH:mm",Locale.ENGLISH).format(now));
                  statusDate.setText(new SimpleDateFormat("EEE, MMM d",Locale.ENGLISH).format(now));
              }

              @Override protected void onResume(){super.onResume();handler.post(tick);loadApps();}
              @Override protected void onPause(){super.onPause();handler.removeCallbacks(tick);}
          }
          EOF

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AwalLauncher-v4
          path: app/build/outputs/apk/debug/app-debug.apk
