          cat > $P/Motion.java << 'EOF'
          package com.awal.depthlens;
          import java.util.*;

          public class Motion {
              static byte[] depth(List<byte[]> fr, int fw, int fh, int[] sz) {
                  int n = fr.size();
                  if (n < 6) return null;
                  final int B = 8, S = 4, R = 5;
                  int bw = (fw - B) / S + 1, bh = (fh - B) / S + 1, nb = bw * bh;
                  float[] acc = new float[nb];
                  boolean[] ok = new boolean[nb];
                  byte[] f0 = fr.get(n / 2);
                  for (int by = 0; by < bh; by++) for (int bx = 0; bx < bw; bx++) {
                      int s = 0, s2 = 0;
                      for (int y = 0; y < B; y++) for (int x = 0; x < B; x++) {
                          int v = f0[(by * S + y) * fw + bx * S + x] & 255;
                          s += v; s2 += v * v;
                      }
                      ok[by * bw + bx] = (s2 - (s * s) / (B * B)) / (B * B) > 40;
                  }
                  int pairs = 0, d = Math.max(2, n / 3), st = Math.max(1, d / 2);
                  for (int i = 0; i + d < n; i += st) {
                      byte[] a = fr.get(i), b = fr.get(i + d);
                      float[] vx = new float[nb], vy = new float[nb];
                      float mot = 0;
                      int cnt = 0;
                      for (int by = 0; by < bh; by++) for (int bx = 0; bx < bw; bx++) {
                          int bo = by * bw + bx;
                          if (!ok[bo]) continue;
                          int x0 = bx * S, y0 = by * S, best = Integer.MAX_VALUE, bdx = 0, bdy = 0;
                          for (int dy = -R; dy <= R; dy++) for (int dx = -R; dx <= R; dx++) {
                              int xx = x0 + dx, yy = y0 + dy;
                              if (xx < 0 || yy < 0 || xx + B > fw || yy + B > fh) continue;
                              int sad = 0;
                              for (int y = 0; y < B; y++) {
                                  int ra = (y0 + y) * fw + x0, rb = (yy + y) * fw + xx;
                                  for (int x = 0; x < B; x++) sad += Math.abs((a[ra + x] & 255) - (b[rb + x] & 255));
                              }
                              sad += 3 * (Math.abs(dx) + Math.abs(dy));
                              if (sad < best) { best = sad; bdx = dx; bdy = dy; }
                          }
                          vx[bo] = bdx; vy[bo] = bdy;
                          mot += (float) Math.hypot(bdx, bdy);
                          cnt++;
                      }
                      if (cnt == 0) continue;
                      mot /= cnt;
                      if (mot < 0.7f) continue;
                      List<Float> xs = new ArrayList<>(), ys = new ArrayList<>();
                      for (int by = 0; by < bh; by++) for (int bx = 0; bx < bw; bx++) {
                          int bo = by * bw + bx;
                          if (ok[bo] && (bx == 0 || by == 0 || bx == bw - 1 || by == bh - 1)) { xs.add(vx[bo]); ys.add(vy[bo]); }
                      }
                      if (xs.size() < 3) {
                          xs.clear(); ys.clear();
                          for (int bo = 0; bo < nb; bo++) if (ok[bo]) { xs.add(vx[bo]); ys.add(vy[bo]); }
                      }
                      Collections.sort(xs);
                      Collections.sort(ys);
                      float mx = xs.get(xs.size() / 2), my = ys.get(ys.size() / 2);
                      for (int bo = 0; bo < nb; bo++) if (ok[bo]) acc[bo] += (float) Math.hypot(vx[bo] - mx, vy[bo] - my);
                      pairs++;
                  }
                  if (pairs == 0) return null;
                  List<Float> vals = new ArrayList<>();
                  for (int bo = 0; bo < nb; bo++) if (ok[bo]) vals.add(acc[bo]);
                  if (vals.size() < 8) return null;
                  Collections.sort(vals);
                  float p95 = vals.get((int) (vals.size() * 0.95f));
                  if (p95 < 1f) return null;
                  float[] nv = new float[nb];
                  boolean[] known = ok.clone();
                  for (int bo = 0; bo < nb; bo++) if (ok[bo]) nv[bo] = Math.min(1f, acc[bo] / p95);
                  for (int pass = 0; pass < 8; pass++) {
                      boolean[] nk = known.clone();
                      float[] nn = nv.clone();
                      for (int by = 0; by < bh; by++) for (int bx = 0; bx < bw; bx++) {
                          int bo = by * bw + bx;
                          if (known[bo]) continue;
                          float s = 0;
                          int c = 0;
                          if (bx > 0 && known[bo - 1]) { s += nv[bo - 1]; c++; }
                          if (bx < bw - 1 && known[bo + 1]) { s += nv[bo + 1]; c++; }
                          if (by > 0 && known[bo - bw]) { s += nv[bo - bw]; c++; }
                          if (by < bh - 1 && known[bo + bw]) { s += nv[bo + bw]; c++; }
                          if (c > 0) { nn[bo] = s / c; nk[bo] = true; }
                      }
                      nv = nn;
                      known = nk;
                  }
                  byte[] out = new byte[nb];
                  for (int bo = 0; bo < nb; bo++) out[bo] = (byte) (Math.min(1f, nv[bo]) * 255);
                  sz[0] = bw;
                  sz[1] = bh;
                  return out;
              }
          }
