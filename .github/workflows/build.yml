      - name: Create launcher icons
        run: |
          python3 << 'PYEOF'
          import struct, zlib

          def create_png(width, height, pixels_fn):
              def chunk(name, data):
                  c = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
              rows = b''
              for y in range(height):
                  rows += b'\x00'
                  for x in range(width):
                      rows += pixels_fn(x, y, width, height)
              idat = chunk(b'IDAT', zlib.compress(rows, 9))
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend

          def bass_icon(x, y, w, h):
              cx, cy = w / 2, h / 2
              r = min(w, h) / 2 - 2
              dx, dy = x - cx, y - cy
              dist = (dx ** 2 + dy ** 2) ** 0.5
              if r - 3 < dist <= r:
                  return bytes([255, 107, 53])
              if dist <= r - 3:
                  nx, ny = x - w * 0.35, y - h * 0.25
                  note_r = min(w, h) * 0.12
                  if (nx ** 2 + ny ** 2) ** 0.5 < note_r:
                      return bytes([255, 107, 53])
                  nx2, ny2 = x - w * 0.55, y - h * 0.38
                  if (nx2 ** 2 + ny2 ** 2) ** 0.5 < note_r * 0.8:
                      return bytes([168, 85, 247])
                  if w * 0.30 < x < w * 0.36 and h * 0.25 < y < h * 0.55:
                      return bytes([255, 107, 53])
                  if w * 0.50 < x < w * 0.56 and h * 0.12 < y < h * 0.42:
                      return bytes([168, 85, 247])
                  for i, color in enumerate([(6, 182, 212), (255, 107, 53), (168, 85, 247)]):
                      wave_r = r * (0.45 + i * 0.12)
                      if wave_r - 2 < dist <= wave_r and x > cx:
                          return bytes(color)
                  return bytes([15, 15, 26])
              return bytes([15, 15, 26])

          sizes = {'hdpi': 72, 'mdpi': 48, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for folder, size in sizes.items():
              png = create_png(size, size, bass_icon)
              for name in ['ic_launcher', 'ic_launcher_round']:
                  path = f'app/src/main/res/mipmap-{folder}/{name}.png'
                  with open(path, 'wb') as f:
                      f.write(png)
              print(f'Created {folder} ({size}x{size})')
          print('All icons done!')
          PYEOF

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BassBooster-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
