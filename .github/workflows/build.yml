      - name: WeatherManager.java
        run: |
          cat > app/src/main/java/com/awal/launcher/WeatherManager.java << 'EOF'
          package com.awal.launcher;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Handler;
          import android.os.Looper;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          public class WeatherManager {
              private static final String PREFS="wp",KEY="wj",LAST="wl";
              private static final long GAP=24*60*60*1000L;
              private Context ctx;
              private ExecutorService exec=Executors.newSingleThreadExecutor();
              public interface Callback{void onWeather(List<WeatherData> d);}
              public WeatherManager(Context c){ctx=c;}
              public void get(String loc,Callback cb){
                  SharedPreferences p=ctx.getSharedPreferences(PREFS,Context.MODE_PRIVATE);
                  String cached=p.getString(KEY,null);
                  if(cached!=null&&System.currentTimeMillis()-p.getLong(LAST,0)<GAP){cb.onWeather(parse(cached));return;}
                  exec.execute(()->{
                      try{
                          URL url=new URL("https://wttr.in/"+loc.replace(" ","+")+"?format=j1");
                          HttpURLConnection c=(HttpURLConnection)url.openConnection();
                          c.setConnectTimeout(5000);c.setReadTimeout(5000);
                          BufferedReader br=new BufferedReader(new InputStreamReader(c.getInputStream()));
                          StringBuilder sb=new StringBuilder();String ln;
                          while((ln=br.readLine())!=null)sb.append(ln);
                          String json=sb.toString();
                          p.edit().putString(KEY,json).putLong(LAST,System.currentTimeMillis()).apply();
                          new Handler(Looper.getMainLooper()).post(()->cb.onWeather(parse(json)));
                      }catch(Exception e){
                          if(cached!=null)new Handler(Looper.getMainLooper()).post(()->cb.onWeather(parse(cached)));
                          else new Handler(Looper.getMainLooper()).post(()->cb.onWeather(fallback()));
                      }
                  });
              }
              private List<WeatherData> parse(String json){
                  List<WeatherData> list=new ArrayList<>();
                  try{
                      JSONArray days=new JSONObject(json).getJSONArray("weather");
                      String[] names={"Today","Tomorrow","Day 3","Day 4","Day 5","Day 6","Day 7"};
                      for(int i=0;i<Math.min(7,days.length());i++){
                          JSONObject d=days.getJSONObject(i);
                          int hi=Integer.parseInt(d.getString("maxtempC"));
                          int lo=Integer.parseInt(d.getString("mintempC"));
                          JSONArray h=d.getJSONArray("hourly");
                          String desc=h.getJSONObject(4).getJSONArray("weatherDesc").getJSONObject(0).getString("value");
                          int code=Integer.parseInt(h.getJSONObject(4).getString("weatherCode"));
                          list.add(new WeatherData(names[i],desc,hi,lo,ic(code)));
                      }
                  }catch(Exception e){return fallback();}
                  return list;
              }
              private String ic(int c){
                  if(c>=200&&c<300)return"⛈";if(c>=300&&c<400)return"🌦";
                  if(c>=500&&c<600)return"🌧";if(c>=600&&c<700)return"❄";
                  if(c==800)return"☀";if(c>800)return"⛅";return"🌤";
              }
              private List<WeatherData> fallback(){
                  List<WeatherData> l=new ArrayList<>();
                  for(String d:new String[]{"Today","Tomorrow","Day 3","Day 4","Day 5","Day 6","Day 7"})
                      l.add(new WeatherData(d,"--",0,0,"🌤"));
                  return l;
              }
          }
          EOF

