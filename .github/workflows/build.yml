              int n, rot, theme, lastPage = -1, penColor = 0xFFE53935;
              public int tool = VIEW;
              boolean ready, restored, thumbDrag, busy;
              float docW, docH, gap, dens, s = 1f, tx, ty, hx, hy, ox, oy;
              float penWidth = WIDTHS[1], textSize = TSIZES[1];
              long lastMove;
              LruCache<Integer, Bitmap> cache;
              final HashMap<Integer, Detail> details = new HashMap<>();
