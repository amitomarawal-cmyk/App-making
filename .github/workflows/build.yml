name: Build DepthLens APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
      - name: Generate project
        run: |
          P=app/src/main/java/com/awal/depthlens
          mkdir -p $P app/src/main/res/drawable gradle/wrapper

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'DepthLens'
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.1.2' apply false }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.awal.depthlens'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.awal.depthlens'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.camera:camera-core:1.3.1'
              implementation 'androidx.camera:camera-camera2:1.3.1'
              implementation 'androidx.camera:camera-lifecycle:1.3.1'
              implementation 'androidx.camera:camera-view:1.3.1'
              implementation 'com.google.guava:guava:32.1.3-android'
              implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <application
                  android:label="DepthLens"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="subject_segment" />
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".GalleryActivity" android:exported="false" />
                  <activity android:name=".EditorActivity" android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#101820" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#2E86DE" android:pathData="M54,54m-34,0a34,34 0,1 1,68 0a34,34 0,1 1,-68 0" />
              <path android:fillColor="#101820" android:pathData="M54,54m-24,0a24,24 0,1 1,48 0a24,24 0,1 1,-48 0" />
              <path android:fillColor="#54A0FF" android:pathData="M54,54m-14,0a14,14 0,1 1,28 0a14,14 0,1 1,-28 0" />
              <path android:fillColor="#FFFFFF" android:pathData="M47,46m-4,0a4,4 0,1 1,8 0a4,4 0,1 1,-8 0" />
          </vector>
          EOF

          cat > $P/Processor.java << 'EOF'
          package com.awal.depthlens;
          import android.graphics.*;
          import android.media.ExifInterface;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.segmentation.subject.*;
          import java.io.*;
          import java.nio.FloatBuffer;
          import java.util.*;
          import java.util.concurrent.*;

          public class Processor {
              static final ExecutorService Q = Executors.newSingleThreadExecutor();
              static final Set<String> busy = Collections.synchronizedSet(new HashSet<String>());
              static final int MAX = 1280;

              static Bitmap load(File f, int max) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(f.getPath(), o);
                      int s = 1;
                      while (Math.max(o.outWidth, o.outHeight) / (s * 2) >= max) s *= 2;
                      o = new BitmapFactory.Options();
                      o.inSampleSize = s;
                      Bitmap b = BitmapFactory.decodeFile(f.getPath(), o);
                      int ori = new ExifInterface(f.getPath()).getAttributeInt(ExifInterface.TAG_ORIENTATION, 1);
                      int rot = ori == 6 ? 90 : ori == 3 ? 180 : ori == 8 ? 270 : 0;
                      float sc = Math.min(1f, (float) max / Math.max(b.getWidth(), b.getHeight()));
                      Matrix m = new Matrix();
                      m.postRotate(rot);
                      m.postScale(sc, sc);
                      return Bitmap.createBitmap(b, 0, 0, b.getWidth(), b.getHeight(), m, true);
                  } catch (Exception e) {
                      return null;
                  }
              }

              static byte[] readMask(File f, int n) {
                  try {
                      if (f.length() != n) return null;
                      byte[] b = new byte[n];
                      try (DataInputStream d = new DataInputStream(new FileInputStream(f))) { d.readFully(b); }
                      return b;
                  } catch (Exception e) {
                      return null;
                  }
              }

              static class Depth { int w, h; byte[] d; }
              static Depth readDepth(File f) {
                  try {
                      if (!f.exists()) return null;
                      try (DataInputStream i = new DataInputStream(new FileInputStream(f))) {
                          Depth x = new Depth(); x.w = i.readInt(); x.h = i.readInt(); x.d = new byte[x.w * x.h]; i.readFully(x.d); return x;
                      }
                  } catch (Exception e) { return null; }
              }

              static void enqueue(final File f) {
                  final File mf = new File(f.getPath() + ".m");
                  if (mf.exists() || !busy.add(f.getPath())) return;
                  Q.execute(() -> {
                      try {
                          Bitmap b = load(f, MAX);
                          final int n = b.getWidth() * b.getHeight();
                          SubjectSegmenter sg = SubjectSegmentation.getClient(
                                  new SubjectSegmenterOptions.Builder().enableForegroundConfidenceMask().build());
                          final CountDownLatch l = new CountDownLatch(1);
                          sg.process(InputImage.fromBitmap(b, 0)).addOnSuccessListener(r -> {
                              try {
                                  FloatBuffer fb = r.getForegroundConfidenceMask();
                                  if (fb != null && fb.remaining() >= n) {
                                      byte[] m = new byte[n];
                                      for (int i = 0; i < n; i++) m[i] = (byte) (Math.min(1f, Math.max(0f, fb.get(i))) * 255);
                                      try (FileOutputStream o = new FileOutputStream(mf)) { o.write(m); }
                                  }
                              } catch (Exception e) { }
                              l.countDown();
                          }).addOnFailureListener(e -> l.countDown());
                          l.await(90, TimeUnit.SECONDS);
                          sg.close();
                      } catch (Exception e) { }
                      busy.remove(f.getPath());
                  });
              }
          }
          EOF

          cat > $P/Blur.java << 'EOF'
          package com.awal.depthlens;
          import android.graphics.*;

          public class Blur {
              static final String[] NAMES = {"Natural", "Dramatic", "Evening Sky"};
              static final int[] PS = {60, 85, 60};
              static final float[] CON = {1f, 1.2f, 1.08f};
              static final float[] SAT = {1f, 1.15f, 1.2f};
              static final float[] VIG = {0f, 0.4f, 0.2f};
              static byte[] cm;
              static float[] cf;

              static int analyze(Bitmap b) {
                  Bitmap s = Bitmap.createScaledBitmap(b, 32, 32, true);
                  double sum = 0, sq = 0, tr = 0, tb = 0, tl = 0;
                  int n = 0;
                  for (int y = 0; y < 32; y++) for (int x = 0; x < 32; x++) {
                      int c = s.getPixel(x, y);
                      double r = Color.red(c), g = Color.green(c), bl = Color.blue(c);
                      double l = (0.3 * r + 0.59 * g + 0.11 * bl) / 255;
                      sum += l; sq += l * l;
                      if (y < 11) { tr += r; tb += bl; tl += l; n++; }
                  }
                  double m = sum / 1024, sd = Math.sqrt(Math.max(0, sq / 1024 - m * m));
                  tr /= n; tb /= n; tl /= n;
                  if (tr > tb + 15 && tl > 0.3) return 2;
                  if (sd > 0.27 || m < 0.33) return 1;
                  return 0;
              }

              static void box(int[] p, int w, int h, int r, boolean horiz) {
                  int n = horiz ? w : h, m = horiz ? h : w;
                  int[] o = new int[n];
                  for (int j = 0; j < m; j++) {
                      for (int i = 0; i < n; i++) {
                          int a = 0, rr = 0, g = 0, b = 0, c = 0;
                          for (int d = -r; d <= r; d++) {
                              int t = i + d;
                              if (t < 0 || t >= n) continue;
                              int v = p[horiz ? j * w + t : t * w + j];
                              a += v >>> 24; rr += (v >> 16) & 255; g += (v >> 8) & 255; b += v & 255; c++;
                          }
                          o[i] = ((a / c) << 24) | ((rr / c) << 16) | ((g / c) << 8) | (b / c);
                      }
                      for (int i = 0; i < n; i++) p[horiz ? j * w + i : i * w + j] = o[i];
                  }
              }

              static Bitmap blur(Bitmap src, int k) {
                  int w = src.getWidth(), h = src.getHeight();
                  int sw = Math.max(1, w / k), sh = Math.max(1, h / k);
                  Bitmap s = Bitmap.createScaledBitmap(src, sw, sh, true);
                  int[] p = new int[sw * sh];
                  s.getPixels(p, 0, sw, 0, 0, sw, sh);
                  box(p, sw, sh, 2, true);
                  box(p, sw, sh, 2, false);
                  Bitmap t = Bitmap.createBitmap(sw, sh, Bitmap.Config.ARGB_8888);
                  t.setPixels(p, 0, sw, 0, 0, sw, sh);
                  return Bitmap.createScaledBitmap(t, w, h, true);
              }

              static float[] up(byte[] d, int dw, int dh, int w, int h) {
                  int[] p = new int[dw * dh];
                  for (int i = 0; i < p.length; i++) { int v = d[i] & 255; p[i] = 0xFF000000 | (v << 16) | (v << 8) | v; }
                  Bitmap s = Bitmap.createBitmap(dw, dh, Bitmap.Config.ARGB_8888);
                  s.setPixels(p, 0, dw, 0, 0, dw, dh);
                  Bitmap u = blur(Bitmap.createScaledBitmap(s, w, h, true), 8);
                  int[] q = new int[w * h];
                  u.getPixels(q, 0, w, 0, 0, w, h);
                  float[] f = new float[w * h];
                  for (int i = 0; i < f.length; i++) f[i] = (q[i] & 255) / 255f;
                  return f;
              }

              static int mix(int a, int b, float f) {
                  int r = (int) (((a >> 16) & 255) * (1 - f) + ((b >> 16) & 255) * f);
                  int g = (int) (((a >> 8) & 255) * (1 - f) + ((b >> 8) & 255) * f);
                  int bl = (int) ((a & 255) * (1 - f) + (b & 255) * f);
                  return 0xFF000000 | (r << 16) | (g << 8) | bl;
              }

              static int cl(float v) { return v < 0 ? 0 : v > 255 ? 255 : (int) v; }

              static synchronized float[] soft(byte[] mask, int w, int h) {
                  if (cm == mask && cf != null) return cf;
                  int[] p = new int[w * h];
                  for (int i = 0; i < p.length; i++) { int v = mask[i] & 255; p[i] = 0xFF000000 | (v << 16) | (v << 8) | v; }
                  Bitmap mb = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  mb.setPixels(p, 0, w, 0, 0, w, h);
                  mb = blur(mb, 10);
                  mb.getPixels(p, 0, w, 0, 0, w, h);
                  float[] f = new float[w * h];
                  for (int i = 0; i < f.length; i++) f[i] = (p[i] & 255) / 255f;
                  cm = mask; cf = f;
                  return f;
              }

              static Bitmap render(Bitmap src, byte[] mask, byte[] dep, int dw, int dh, float st, boolean bg, int pre) {
                  int w = src.getWidth(), h = src.getHeight();
                  int[] o = new int[w * h], p1 = new int[w * h], p2 = new int[w * h];
                  src.getPixels(o, 0, w, 0, 0, w, h);
                  blur(src, 2 + (int) (st * 6)).getPixels(p1, 0, w, 0, 0, w, h);
                  blur(src, 4 + (int) (st * 22)).getPixels(p2, 0, w, 0, 0, w, h);
                  float[] m = mask != null ? soft(mask, w, h) : null;
                  float[] dn = dep != null ? up(dep, dw, dh, w, h) : null; float fN = 0.6f;
                  if (dn != null) { double s1 = 0, s2 = 0; for (int i = 0; i < dn.length; i++) { float wt; if (m != null) wt = m[i] > 0.5f ? 1f : 0f; else { int xx = i % w, yy = i / w; wt = (xx > w * 0.35f && xx < w * 0.65f && yy > h * 0.35f && yy < h * 0.65f) ? 1f : 0f; } s1 += wt * dn[i]; s2 += wt; } if (s2 > 0) fN = (float) (s1 / s2); }
                  float con = CON[pre], sat = SAT[pre], vig = VIG[pre];
                  for (int y = 0; y < h; y++) {
                      float fy = (float) y / h;
                      for (int x = 0; x < w; x++) {
                          int i = y * w + x;
                          float t;
                          float tm = m != null ? (bg ? (1 - m[i]) * (0.55f + 0.45f * (1 - fy)) : m[i]) : -1f; float tp = -1f;
                          if (dn != null) { float dd = bg ? fN - dn[i] : dn[i] - fN; tp = Math.min(1f, Math.max(0f, dd * 2.5f)); }
                          if (tm >= 0 && tp >= 0) t = 0.5f * (tm + tp); else if (tm >= 0) t = tm; else if (tp >= 0) t = tp;
                          else { t = Math.min(1f, Math.abs(fy - 0.6f) * 2.2f); if (!bg) t = 1 - t; }
                          int c = t < 0.5f ? mix(o[i], p1[i], t * 2) : mix(p1[i], p2[i], (t - 0.5f) * 2);
                          if (pre > 0) {
                              float r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
                              float gr = 0.3f * r + 0.59f * g + 0.11f * b;
                              r = gr + (r - gr) * sat; g = gr + (g - gr) * sat; b = gr + (b - gr) * sat;
                              r = (r - 128) * con + 128; g = (g - 128) * con + 128; b = (b - 128) * con + 128;
                              if (pre == 2) { r *= 1.08f; b *= 0.92f; }
                              float dx = (float) x / w - 0.5f, dy = fy - 0.5f;
                              float d = (float) Math.sqrt(dx * dx + dy * dy) / 0.707f;
                              float v = 1 - vig * d * d;
                              c = 0xFF000000 | (cl(r * v) << 16) | (cl(g * v) << 8) | cl(b * v);
                          }
                          o[i] = c;
                      }
                  }
                  return Bitmap.createBitmap(o, w, h, Bitmap.Config.ARGB_8888);
              }
          }
          EOF

          cat > $P/MainActivity.java << 'EOF'
          package com.awal.depthlens;
          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Range;
          import android.util.Rational;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.camera.core.*;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.view.PreviewView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.io.*;
          import java.nio.ByteBuffer;
          import java.util.*;
          import java.util.concurrent.*;

          public class MainActivity extends AppCompatActivity {
              static final int FW = 96;
              static final Rational[] RAT = {new Rational(3, 4), new Rational(9, 16), new Rational(1, 1)};
              static final String[] RT = {"3:4", "9:16", "1:1"};
              static final float[] RV = {0.75f, 0.5625f, 1f};
              static final int[] FM = {ImageCapture.FLASH_MODE_OFF, ImageCapture.FLASH_MODE_AUTO, ImageCapture.FLASH_MODE_ON};
              static final String[] FT = {"Off", "Auto", "On"};
              PreviewView pv;
              Overlay ov;
              ProcessCameraProvider prov;
              Camera cam;
              ImageCapture ic;
              SeekBar zoom, exp;
              TextView msg;
              int ri = 0, fl = 0, expLo = 0;
              boolean front = false, grid = true, sweep = false;
              volatile boolean collecting = false;
              volatile int ffw = FW, ffh = FW;
              final List<byte[]> frames = Collections.synchronizedList(new ArrayList<byte[]>());
              final ExecutorService ax = Executors.newSingleThreadExecutor();
              final Handler h = new Handler(Looper.getMainLooper());

              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }

              class Overlay extends View {
                  Paint p = new Paint();
                  float r = 0.75f, fx = -1, fy;
                  boolean grid = true;

                  Overlay(Context c) {
                      super(c);
                      p.setStyle(Paint.Style.STROKE);
                      p.setAntiAlias(true);
                  }

                  void ring(float x, float y) {
                      fx = x; fy = y;
                      invalidate();
                      postDelayed(() -> { fx = -1; invalidate(); }, 1200);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      int W = getWidth(), H = getHeight();
                      float w, hh;
                      if (W / (float) H > r) { hh = H; w = H * r; } else { w = W; hh = W / r; }
                      float l = (W - w) / 2, t = (H - hh) / 2;
                      p.setColor(0x99FFFFFF);
                      p.setStrokeWidth(3f);
                      c.drawRect(l, t, l + w, t + hh, p);
                      if (grid) {
                          p.setStrokeWidth(2f);
                          for (int i = 1; i < 3; i++) {
                              c.drawLine(l + w * i / 3, t, l + w * i / 3, t + hh, p);
                              c.drawLine(l, t + hh * i / 3, l + w, t + hh * i / 3, p);
                          }
                      }
                      if (fx >= 0) {
                          p.setColor(0xFFFFD60A);
                          p.setStrokeWidth(4f);
                          c.drawCircle(fx, fy, 60, p);
                      }
                  }
              }

              void setBg(View v, int c) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(c);
                  d.setCornerRadius(dp(20));
                  v.setBackground(d);
              }

              TextView chip(String t) {
                  TextView v = new TextView(this);
                  v.setText(t);
                  v.setTextColor(0xFFFFFFFF);
                  v.setTextSize(13);
                  v.setGravity(Gravity.CENTER);
                  v.setPadding(dp(10), dp(8), dp(10), dp(8));
                  v.setClickable(true);
                  setBg(v, 0x88000000);
                  return v;
              }

              LinearLayout row(String t, SeekBar s) {
                  LinearLayout r = new LinearLayout(this);
                  r.setGravity(Gravity.CENTER_VERTICAL);
                  TextView l = new TextView(this);
                  l.setText(t);
                  l.setTextColor(0xFFFFFFFF);
                  l.setTextSize(12);
                  r.addView(l, dp(64), -2);
                  r.addView(s, new LinearLayout.LayoutParams(0, -2, 1f));
                  return r;
              }

              View cell(View v, int w, int hh) {
                  FrameLayout f = new FrameLayout(this);
                  f.addView(v, new FrameLayout.LayoutParams(w, hh, Gravity.CENTER));
                  return f;
              }

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF000000);
                  pv = new PreviewView(this);
                  pv.setScaleType(PreviewView.ScaleType.FIT_CENTER);
                  root.addView(pv, -1, -1);
                  ov = new Overlay(this);
                  root.addView(ov, -1, -1);

                  LinearLayout top = new LinearLayout(this);
                  top.setPadding(dp(8), dp(34), dp(8), 0);
                  final TextView cR = chip("3:4"), cG = chip("\u25A6 Grid"), cF = chip("\u26A1 Off"), cS = chip("\u2194 Sweep"), cC = chip("\uD83D\uDD04");
                  setBg(cG, 0xAA2E86DE);
                  for (TextView c : new TextView[]{cR, cG, cF, cS, cC}) {
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, -2, 1f);
                      lp.setMargins(dp(3), 0, dp(3), 0);
                      top.addView(c, lp);
                  }
                  root.addView(top, new FrameLayout.LayoutParams(-1, -2, Gravity.TOP));

                  msg = new TextView(this);
                  msg.setTextSize(22);
                  msg.setTextColor(0xFFFFD60A);
                  msg.setGravity(Gravity.CENTER);
                  msg.setPadding(dp(16), dp(12), dp(16), dp(12));
                  setBg(msg, 0xAA000000);
                  msg.setVisibility(View.GONE);
                  root.addView(msg, new FrameLayout.LayoutParams(-2, -2, Gravity.CENTER));

                  LinearLayout bot = new LinearLayout(this);
                  bot.setOrientation(LinearLayout.VERTICAL);
                  bot.setPadding(dp(12), dp(8), dp(12), dp(6));
                  bot.setBackgroundColor(0x55000000);
                  zoom = new SeekBar(this);
                  zoom.setMax(100);
                  exp = new SeekBar(this);
                  exp.setMax(1);
                  bot.addView(row("Zoom", zoom), -1, -2);
                  bot.addView(row("\u2600 Light", exp), -1, -2);
                  LinearLayout br = new LinearLayout(this);
                  br.setGravity(Gravity.CENTER_VERTICAL);
                  br.setPadding(0, dp(8), 0, 0);
                  TextView cGal = chip("\uD83D\uDDBC Gallery"), cA = chip("AF Auto");
                  View sh = new View(this);
                  GradientDrawable gd = new GradientDrawable();
                  gd.setShape(GradientDrawable.OVAL);
                  gd.setColor(0xFFFFFFFF);
                  gd.setStroke(dp(5), 0xFF2E86DE);
                  sh.setBackground(gd);
                  sh.setClickable(true);
                  br.addView(cell(cGal, -2, -2), new LinearLayout.LayoutParams(0, -2, 1f));
                  br.addView(cell(sh, dp(72), dp(72)), new LinearLayout.LayoutParams(0, -2, 1f));
                  br.addView(cell(cA, -2, -2), new LinearLayout.LayoutParams(0, -2, 1f));
                  bot.addView(br, -1, -2);
                  TextView cr = new TextView(this);
                  cr.setText("DepthLens \u2022 Mohammod Abdul Awal \u2022 Dept. of English, National University \u2022 awal.sorkar.144@gmail.com");
                  cr.setTextColor(0x99FFFFFF);
