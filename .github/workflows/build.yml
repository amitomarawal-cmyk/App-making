          cat > $P/Processor.java << 'EOF'
          package com.awal.depthlens;
          import android.graphics.*;
          import android.media.ExifInterface;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.segmentation.subject.*;
          import java.io.*;
          import java.nio.FloatBuffer;
          import java.util.*;
          import java.util.concurrent.*;

          public class Processor {
              static final ExecutorService Q = Executors.newSingleThreadExecutor();
              static final Set<String> busy = Collections.synchronizedSet(new HashSet<String>());
              static final int MAX = 1280;

              static Bitmap load(File f, int max) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(f.getPath(), o);
                      int s = 1;
                      while (Math.max(o.outWidth, o.outHeight) / (s * 2) >= max) s *= 2;
                      o = new BitmapFactory.Options();
                      o.inSampleSize = s;
                      Bitmap b = BitmapFactory.decodeFile(f.getPath(), o);
                      int ori = new ExifInterface(f.getPath()).getAttributeInt(ExifInterface.TAG_ORIENTATION, 1);
                      int rot = ori == 6 ? 90 : ori == 3 ? 180 : ori == 8 ? 270 : 0;
                      float sc = Math.min(1f, (float) max / Math.max(b.getWidth(), b.getHeight()));
                      Matrix m = new Matrix();
                      m.postRotate(rot);
                      m.postScale(sc, sc);
                      return Bitmap.createBitmap(b, 0, 0, b.getWidth(), b.getHeight(), m, true);
                  } catch (Exception e) {
                      return null;
                  }
              }

              static byte[] readMask(File f, int n) {
                  try {
                      if (f.length() != n) return null;
                      byte[] b = new byte[n];
                      try (DataInputStream d = new DataInputStream(new FileInputStream(f))) { d.readFully(b); }
                      return b;
                  } catch (Exception e) {
                      return null;
                  }
              }

              static void enqueue(final File f) {
                  final File mf = new File(f.getPath() + ".m");
                  if (mf.exists() || !busy.add(f.getPath())) return;
                  Q.execute(() -> {
                      try {
                          Bitmap b = load(f, MAX);
                          final int n = b.getWidth() * b.getHeight();
                          SubjectSegmenter sg = SubjectSegmentation.getClient(
                                  new SubjectSegmenterOptions.Builder().enableForegroundConfidenceMask().build());
                          final CountDownLatch l = new CountDownLatch(1);
                          sg.process(InputImage.fromBitmap(b, 0)).addOnSuccessListener(r -> {
                              try {
                                  FloatBuffer fb = r.getForegroundConfidenceMask();
                                  if (fb != null && fb.remaining() >= n) {
                                      byte[] m = new byte[n];
                                      for (int i = 0; i < n; i++) m[i] = (byte) (Math.min(1f, Math.max(0f, fb.get(i))) * 255);
                                      try (FileOutputStream o = new FileOutputStream(mf)) { o.write(m); }
                                  }
                              } catch (Exception e) { }
                              l.countDown();
                          }).addOnFailureListener(e -> l.countDown());
                          l.await(90, TimeUnit.SECONDS);
                          sg.close();
                      } catch (Exception e) { }
                      busy.remove(f.getPath());
                  });
              }
          }
          EOF

          cat > $P/Blur.java << 'EOF'
          package com.awal.depthlens;
          import android.graphics.*;

          public class Blur {
              static final String[] NAMES = {"Natural", "Dramatic", "Evening Sky"};
              static final int[] PS = {60, 85, 60};
              static final float[] CON = {1f, 1.2f, 1.08f};
              static final float[] SAT = {1f, 1.15f, 1.2f};
              static final float[] VIG = {0f, 0.4f, 0.2f};
              static byte[] cm;
              static float[] cf;

              static int analyze(Bitmap b) {
                  Bitmap s = Bitmap.createScaledBitmap(b, 32, 32, true);
                  double sum = 0, sq = 0, tr = 0, tb = 0, tl = 0;
                  int n = 0;
                  for (int y = 0; y < 32; y++) for (int x = 0; x < 32; x++) {
                      int c = s.getPixel(x, y);
                      double r = Color.red(c), g = Color.green(c), bl = Color.blue(c);
                      double l = (0.3 * r + 0.59 * g + 0.11 * bl) / 255;
                      sum += l; sq += l * l;
                      if (y < 11) { tr += r; tb += bl; tl += l; n++; }
                  }
                  double m = sum / 1024, sd = Math.sqrt(Math.max(0, sq / 1024 - m * m));
                  tr /= n; tb /= n; tl /= n;
                  if (tr > tb + 15 && tl > 0.3) return 2;
                  if (sd > 0.27 || m < 0.33) return 1;
                  return 0;
              }

              static void box(int[] p, int w, int h, int r, boolean horiz) {
                  int n = horiz ? w : h, m = horiz ? h : w;
                  int[] o = new int[n];
                  for (int j = 0; j < m; j++) {
                      for (int i = 0; i < n; i++) {
                          int a = 0, rr = 0, g = 0, b = 0, c = 0;
                          for (int d = -r; d <= r; d++) {
                              int t = i + d;
                              if (t < 0 || t >= n) continue;
                              int v = p[horiz ? j * w + t : t * w + j];
                              a += v >>> 24; rr += (v >> 16) & 255; g += (v >> 8) & 255; b += v & 255; c++;
                          }
                          o[i] = ((a / c) << 24) | ((rr / c) << 16) | ((g / c) << 8) | (b / c);
                      }
                      for (int i = 0; i < n; i++) p[horiz ? j * w + i : i * w + j] = o[i];
                  }
              }

              static Bitmap blur(Bitmap src, int k) {
                  int w = src.getWidth(), h = src.getHeight();
                  int sw = Math.max(1, w / k), sh = Math.max(1, h / k);
                  Bitmap s = Bitmap.createScaledBitmap(src, sw, sh, true);
                  int[] p = new int[sw * sh];
                  s.getPixels(p, 0, sw, 0, 0, sw, sh);
                  box(p, sw, sh, 2, true);
                  box(p, sw, sh, 2, false);
                  Bitmap t = Bitmap.createBitmap(sw, sh, Bitmap.Config.ARGB_8888);
                  t.setPixels(p, 0, sw, 0, 0, sw, sh);
                  return Bitmap.createScaledBitmap(t, w, h, true);
              }

              static int mix(int a, int b, float f) {
                  int r = (int) (((a >> 16) & 255) * (1 - f) + ((b >> 16) & 255) * f);
                  int g = (int) (((a >> 8) & 255) * (1 - f) + ((b >> 8) & 255) * f);
                  int bl = (int) ((a & 255) * (1 - f) + (b & 255) * f);
                  return 0xFF000000 | (r << 16) | (g << 8) | bl;
              }

              static int cl(float v) { return v < 0 ? 0 : v > 255 ? 255 : (int) v; }

              static synchronized float[] soft(byte[] mask, int w, int h) {
                  if (cm == mask && cf != null) return cf;
                  int[] p = new int[w * h];
                  for (int i = 0; i < p.length; i++) { int v = mask[i] & 255; p[i] = 0xFF000000 | (v << 16) | (v << 8) | v; }
                  Bitmap mb = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  mb.setPixels(p, 0, w, 0, 0, w, h);
                  mb = blur(mb, 10);
                  mb.getPixels(p, 0, w, 0, 0, w, h);
                  float[] f = new float[w * h];
                  for (int i = 0; i < f.length; i++) f[i] = (p[i] & 255) / 255f;
                  cm = mask; cf = f;
                  return f;
              }

              static Bitmap render(Bitmap src, byte[] mask, float st, boolean bg, int pre) {
                  int w = src.getWidth(), h = src.getHeight();
                  int[] o = new int[w * h], p1 = new int[w * h], p2 = new int[w * h];
                  src.getPixels(o, 0, w, 0, 0, w, h);
                  blur(src, 2 + (int) (st * 6)).getPixels(p1, 0, w, 0, 0, w, h);
                  blur(src, 4 + (int) (st * 22)).getPixels(p2, 0, w, 0, 0, w, h);
                  float[] m = mask != null ? soft(mask, w, h) : null;
                  float con = CON[pre], sat = SAT[pre], vig = VIG[pre];
                  for (int y = 0; y < h; y++) {
                      float fy = (float) y / h;
                      for (int x = 0; x < w; x++) {
                          int i = y * w + x;
                          float t;
                          if (m != null) t = bg ? (1 - m[i]) * (0.55f + 0.45f * (1 - fy)) : m[i];
                          else { t = Math.min(1f, Math.abs(fy - 0.6f) * 2.2f); if (!bg) t = 1 - t; }
                          int c = t < 0.5f ? mix(o[i], p1[i], t * 2) : mix(p1[i], p2[i], (t - 0.5f) * 2);
                          if (pre > 0) {
                              float r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
                              float gr = 0.3f * r + 0.59f * g + 0.11f * b;
                              r = gr + (r - gr) * sat; g = gr + (g - gr) * sat; b = gr + (b - gr) * sat;
                              r = (r - 128) * con + 128; g = (g - 128) * con + 128; b = (b - 128) * con + 128;
                              if (pre == 2) { r *= 1.08f; b *= 0.92f; }
                              float dx = (float) x / w - 0.5f, dy = fy - 0.5f;
                              float d = (float) Math.sqrt(dx * dx + dy * dy) / 0.707f;
                              float v = 1 - vig * d * d;
                              c = 0xFF000000 | (cl(r * v) << 16) | (cl(g * v) << 8) | cl(b * v);
                          }
                          o[i] = c;
                      }
                  }
                  return Bitmap.createBitmap(o, w, h, Bitmap.Config.ARGB_8888);
              }
          }
          EOF

          cat > $P/MainActivity.java << 'EOF'
          package com.awal.depthlens;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.camera.core.*;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.view.PreviewView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.io.File;

          public class MainActivity extends AppCompatActivity {
              PreviewView pv;
              ImageCapture ic;

              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  FrameLayout root = new FrameLayout(this);
                  pv = new PreviewView(this);
                  root.addView(pv, -1, -1);
                  TextView cr = new TextView(this);
                  cr.setText("DepthLens  \u2022  Mohammod Abdul Awal\nStudent, Dept. of English, National University\nawal.sorkar.144@gmail.com");
                  cr.setTextColor(0xFFFFFFFF);
                  cr.setTextSize(11);
                  cr.setBackgroundColor(0x66000000);
                  cr.setPadding(dp(10), dp(30), dp(10), dp(8));
                  root.addView(cr, -1, -2);
                  LinearLayout bar = new LinearLayout(this);
                  bar.setGravity(Gravity.CENTER);
                  Button g = new Button(this);
                  g.setText("\uD83D\uDDBC");
                  Button c = new Button(this);
                  c.setText("\u25CF");
                  c.setTextSize(30);
                  bar.addView(g);
                  bar.addView(c);
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM);
                  lp.bottomMargin = dp(30);
                  root.addView(bar, lp);
                  setContentView(root);
                  g.setOnClickListener(v -> startActivity(new Intent(this, GalleryActivity.class)));
                  c.setOnClickListener(v -> shoot());
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) startCam();
                  else ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, 1);
              }

              @Override
              public void onRequestPermissionsResult(int rc, String[] p, int[] r) {
                  super.onRequestPermissionsResult(rc, p, r);
                  if (r.length > 0 && r[0] == PackageManager.PERMISSION_GRANTED) startCam();
              }

              void startCam() {
                  var f = ProcessCameraProvider.getInstance(this);
                  f.addListener(() -> {
                      try {
                          ProcessCameraProvider p = f.get();
                          Preview pr = new Preview.Builder().build();
                          pr.setSurfaceProvider(pv.getSurfaceProvider());
                          ic = new ImageCapture.Builder().build();
                          p.unbindAll();
                          p.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, pr, ic);
                      } catch (Exception e) { }
                  }, ContextCompat.getMainExecutor(this));
              }

              void shoot() {
                  if (ic == null) return;
                  final File out = new File(getExternalFilesDir("photos"), System.currentTimeMillis() + ".jpg");
                  ic.takePicture(new ImageCapture.OutputFileOptions.Builder(out).build(), ContextCompat.getMainExecutor(this),
                          new ImageCapture.OnImageSavedCallback() {
                              @Override
                              public void onImageSaved(ImageCapture.OutputFileResults r) {
                                  Processor.enqueue(out);
                                  Toast.makeText(MainActivity.this, "Saved. Depth processing in background", Toast.LENGTH_SHORT).show();
                              }

                              @Override
                              public void onError(ImageCaptureException e) {
                                  Toast.makeText(MainActivity.this, "Capture failed", Toast.LENGTH_SHORT).show();
                              }
                          });
              }
          }
          EOF

          cat > $P/GalleryActivity.java << 'EOF'
          package com.awal.depthlens;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.os.*;
          import android.util.LruCache;
          import android.view.*;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.File;
          import java.util.*;
          import java.util.concurrent.*;

          public class GalleryActivity extends AppCompatActivity {
              final List<File> files = new ArrayList<>();
              final LruCache<String, Bitmap> cache = new LruCache<>(80);
              final ExecutorService ex = Executors.newFixedThreadPool(2);
              final Handler h = new Handler(Looper.getMainLooper());
              BaseAdapter ad;
              int sz;

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  sz = getResources().getDisplayMetrics().widthPixels / 3;
                  GridView g = new GridView(this);
                  g.setNumColumns(3);
                  g.setBackgroundColor(0xFF000000);
                  g.setPadding(0, (int) (30 * getResources().getDisplayMetrics().density), 0, 0);
                  setContentView(g);
                  ad = new BaseAdapter() {
                      public int getCount() { return files.size(); }
                      public Object getItem(int i) { return files.get(i); }
                      public long getItemId(int i) { return i; }
                      public View getView(int p, View cv, ViewGroup par) {
                          FrameLayout fl = (FrameLayout) cv;
                          final ImageView iv;
                          TextView tv;
                          if (fl == null) {
                              fl = new FrameLayout(GalleryActivity.this);
                              iv = new ImageView(GalleryActivity.this);
                              iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                              tv = new TextView(GalleryActivity.this);
                              tv.setText("\u23F3");
                              tv.setTextSize(20);
                              fl.addView(iv, -1, -1);
                              fl.addView(tv);
                              fl.setLayoutParams(new AbsListView.LayoutParams(-1, sz));
                              fl.setTag(new View[]{iv, tv});
                          } else {
                              View[] t = (View[]) fl.getTag();
                              iv = (ImageView) t[0];
                              tv = (TextView) t[1];
                          }
                          final File f = files.get(p);
                          tv.setVisibility(new File(f.getPath() + ".m").exists() ? View.GONE : View.VISIBLE);
                          Bitmap cb = cache.get(f.getPath());
                          iv.setTag(f.getPath());
                          if (cb != null) iv.setImageBitmap(cb);
                          else {
                              iv.setImageBitmap(null);
                              ex.execute(() -> {
                                  final Bitmap b = Processor.load(f, 256);
                                  if (b == null) return;
                                  h.post(() -> {
                                      cache.put(f.getPath(), b);
                                      if (f.getPath().equals(iv.getTag())) iv.setImageBitmap(b);
                                  });
                              });
                          }
                          return fl;
                      }
                  };
                  g.setAdapter(ad);
                  g.setOnItemClickListener((a, v, p, id) ->
                          startActivity(new Intent(this, EditorActivity.class).putExtra("p", files.get(p).getPath())));
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  files.clear();
                  File[] fs = getExternalFilesDir("photos").listFiles((d, n) -> n.endsWith(".jpg"));
                  if (fs != null) {
                      Arrays.sort(fs, (a, b) -> b.getName().compareTo(a.getName()));
                      for (File f : fs) { files.add(f); Processor.enqueue(f); }
                  }
                  tick();
              }

              void tick() {
                  ad.notifyDataSetChanged();
                  boolean pending = false;
                  for (File f : files) if (!new File(f.getPath() + ".m").exists()) pending = true;
                  if (pending) h.postDelayed(this::tick, 3000);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  h.removeCallbacksAndMessages(null);
              }
          }
          EOF

          cat > $P/EditorActivity.java << 'EOF'
          package com.awal.depthlens;
          import android.content.ContentValues;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.*;
          import android.provider.MediaStore;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.File;
          import java.io.OutputStream;
          import java.util.concurrent.*;
          import java.util.concurrent.atomic.AtomicInteger;

          public class EditorActivity extends AppCompatActivity {
              volatile Bitmap src, cur;
              volatile byte[] mask;
              volatile boolean bg = true;
              volatile int preset = 0;
              ImageView iv;
              SeekBar sb;
              TextView tv;
              final AtomicInteger seq = new AtomicInteger();
              final ExecutorService ex = Executors.newSingleThreadExecutor();
              final Handler h = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xFF000000);
                  root.setPadding(0, (int) (30 * getResources().getDisplayMetrics().density), 0, 0);
                  iv = new ImageView(this);
                  iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  root.addView(iv, new LinearLayout.LayoutParams(-1, 0, 1f));
                  tv = new TextView(this);
                  tv.setTextColor(0xFFFFFFFF);
                  tv.setPadding(24, 8, 24, 0);
                  tv.setText("Loading...");
                  root.addView(tv, -1, -2);
                  sb = new SeekBar(this);
                  sb.setMax(100);
                  sb.setProgress(60);
                  root.addView(sb, -1, -2);
                  LinearLayout row = new LinearLayout(this);
                  final Button b1 = new Button(this), b2 = new Button(this), b3 = new Button(this);
                  b1.setText("Background");
                  b2.setText("Auto AI");
                  b3.setText("Save");
                  row.addView(b1, new LinearLayout.LayoutParams(0, -2, 1f));
                  row.addView(b2, new LinearLayout.LayoutParams(0, -2, 1f));
                  row.addView(b3, new LinearLayout.LayoutParams(0, -2, 1f));
                  root.addView(row, -1, -2);
                  setContentView(root);

                  final File f = new File(getIntent().getStringExtra("p"));
                  ex.execute(() -> {
                      Bitmap b = Processor.load(f, Processor.MAX);
                      if (b == null) return;
                      File m = new File(f.getPath() + ".m");
                      if (m.exists()) mask = Processor.readMask(m, b.getWidth() * b.getHeight());
                      src = b;
                      h.post(() -> {
                          tv.setText(mask != null ? "Depth ready" : "Depth not ready yet: using simple gradient");
                          draw();
                      });
                  });
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) { draw(); }
                      public void onStartTrackingTouch(SeekBar s) { }
                      public void onStopTrackingTouch(SeekBar s) { }
                  });
                  b1.setOnClickListener(v -> {
                      bg = !bg;
                      b1.setText(bg ? "Background" : "Foreground");
                      draw();
                  });
                  b2.setOnClickListener(v -> {
                      if (src == null) return;
                      ex.execute(() -> {
                          final int p = Blur.analyze(src);
                          preset = p;
                          h.post(() -> {
                              tv.setText("AI scene: " + Blur.NAMES[p]);
                              sb.setProgress(Blur.PS[p]);
                              draw();
                          });
                      });
                  });
                  b3.setOnClickListener(v -> save());
              }

              void draw() {
                  if (src == null) return;
                  final int id = seq.incrementAndGet();
                  final float st = sb.getProgress() / 100f;
                  ex.execute(() -> {
                      if (id != seq.get()) return;
                      final Bitmap r = Blur.render(src, mask, st, bg, preset);
                      if (id == seq.get()) h.post(() -> { cur = r; iv.setImageBitmap(r); });
                  });
              }

              void save() {
                  final Bitmap b = cur;
                  if (b == null) return;
                  ex.execute(() -> {
                      String msg;
                      try {
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Images.Media.DISPLAY_NAME, "DepthLens_" + System.currentTimeMillis() + ".jpg");
                          v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                          v.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/DepthLens");
                          Uri u = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                          OutputStream o = getContentResolver().openOutputStream(u);
                          b.compress(Bitmap.CompressFormat.JPEG, 95, o);
                          o.close();
                          msg = "Saved to Pictures/DepthLens";
                      } catch (Exception e) {
                          msg = "Save failed";
                      }
                      final String m = msg;
                      h.post(() -> Toast.makeText(this, m, Toast.LENGTH_SHORT).show());
                  });
              }
          }
          EOF

          cat > gradlew << 'EOF'
          #!/bin/sh
          D=$(dirname "$0")
          exec java -classpath "$D/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew
      - name: Download wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
      - name: Build
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DepthLens-APK
          path: app/build/outputs/apk/debug/app-debug.apk
