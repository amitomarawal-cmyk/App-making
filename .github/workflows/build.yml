                  thumb.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View view, Outline o) {
                          o.setOval(0, 0, view.getWidth(), view.getHeight());
                      }
                  });
                  thumb.setClipToOutline(true);
                  thumb.setOnClickListener(v -> openGallery());

                  bottom.addView(cell(zoomBtn, 58));
                  bottom.addView(cell(shutter, 94));
                  bottom.addView(cell(thumb, 58));
                  LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(-1, -2);
                  bp.bottomMargin = dp(24);
                  bp.topMargin = dp(6);
                  col.addView(bottom, bp);
              }

              private void selectFilter(int i) {
                  filterIndex = i;
                  for (int k = 0; k < keys.size(); k++) {
                      keys.get(k).setBackground(keyBg(k == i));
                      keys.get(k).setTextColor(k == i ? 0xFFFFC27A : 0xFFEEEEEE);
                  }
                  Filter f = filters.get(i);
                  Paint p = new Paint();
                  p.setColorFilter(new ColorMatrixColorFilter(f.matrix()));
                  previewView.setLayerPaint(p);
                  overlay.setFilter(f);
                  final TextView key = keys.get(i);
                  strip.post(() -> strip.smoothScrollTo(key.getLeft() + key.getWidth() / 2 - strip.getWidth() / 2, 0));
              }

              // ------------------------------------------------------------ touch: focus / exposure / pinch zoom

              private void setupTouch() {
                  scaleDetector = new ScaleGestureDetector(this, new ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      @Override
                      public boolean onScale(ScaleGestureDetector d) {
                          if (camera == null) return true;
                          ZoomState zs = camera.getCameraInfo().getZoomState().getValue();
                          if (zs == null) return true;
                          float r = zs.getZoomRatio() * d.getScaleFactor();
                          r = Math.max(zs.getMinZoomRatio(), Math.min(zs.getMaxZoomRatio(), r));
                          setZoom(r);
                          return true;
                      }
                  });

                  overlay.setOnTouchListener(new View.OnTouchListener() {
                      float dx, dy;
                      boolean moved, scaled;
                      int baseEv;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          scaleDetector.onTouchEvent(e);
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  dx = e.getX();
                                  dy = e.getY();
                                  moved = false;
                                  scaled = false;
                                  baseEv = evIndex;
                                  break;
                              case MotionEvent.ACTION_POINTER_DOWN:
                                  scaled = true;
                                  break;
                              case MotionEvent.ACTION_MOVE:
                                  if (scaleDetector.isInProgress()) {
                                      scaled = true;
                                      break;
                                  }
                                  if (!scaled && e.getPointerCount() == 1) {
                                      float d = dy - e.getY();
                                      if (moved || Math.abs(d) > dp(12)) {
                                          if (!moved) {
                                              moved = true;
                                              focusAt(dx, dy);
                                          }
                                          setEv(baseEv + Math.round(d / dp(14)));
                                      }
                                  }
                                  break;
                              case MotionEvent.ACTION_UP:
                                  if (!moved && !scaled) focusAt(e.getX(), e.getY());
                                  v.performClick();
                                  break;
                              default:
                                  break;
                          }
                          return true;
                      }
                  });
              }

              private void focusAt(float x, float y) {
                  if (camera == null) return;
                  try {
                      MeteringPoint pt = previewView.getMeteringPointFactory().createPoint(x, y);
                      FocusMeteringAction a = new FocusMeteringAction.Builder(pt,
                              FocusMeteringAction.FLAG_AF | FocusMeteringAction.FLAG_AE)
                              .setAutoCancelDuration(4, TimeUnit.SECONDS).build();
                      camera.getCameraControl().startFocusAndMetering(a);
                  } catch (Exception ignored) {
                  }
                  overlay.showFocus(x, y);
              }

              private void setEv(int index) {
                  if (camera == null) return;
                  ExposureState es = camera.getCameraInfo().getExposureState();
                  if (!es.isExposureCompensationSupported()) return;
                  Range<Integer> range = es.getExposureCompensationRange();
                  int idx = Math.max(range.getLower(), Math.min(range.getUpper(), index));
                  evIndex = idx;
                  camera.getCameraControl().setExposureCompensationIndex(idx);
                  float ev = idx * es.getExposureCompensationStep().floatValue();
                  overlay.showEv(String.format(Locale.US, "\u2600 EV %+.1f", ev));
              }

              // ------------------------------------------------------------ zoom / flash

              private void setZoom(float r) {
                  if (camera == null) return;
                  camera.getCameraControl().setZoomRatio(r);
                  zoomBtn.setText(String.format(Locale.US, "%.1fx", r));
              }

              private void cycleZoom() {
                  if (camera == null) return;
                  ZoomState zs = camera.getCameraInfo().getZoomState().getValue();
                  if (zs == null) return;
                  float cur = zs.getZoomRatio();
                  float[] levels = {1f, 2f, 3f, 5f};
                  float next = 1f;
                  for (float z : levels) {
                      if (z > cur + 0.05f && z <= zs.getMaxZoomRatio()) {
                          next = z;
                          break;
                      }
                  }
                  next = Math.max(zs.getMinZoomRatio(), next);
                  setZoom(next);
              }

              private void cycleFlash() {
                  String label;
                  if (flashMode == ImageCapture.FLASH_MODE_OFF) {
                      flashMode = ImageCapture.FLASH_MODE_AUTO;
                      label = "Flash: Auto";
                      flashBtn.setTextColor(0xFFFFD54F);
                  } else if (flashMode == ImageCapture.FLASH_MODE_AUTO) {
                      flashMode = ImageCapture.FLASH_MODE_ON;
                      label = "Flash: On";
                      flashBtn.setTextColor(0xFFFF7A00);
                  } else {
                      flashMode = ImageCapture.FLASH_MODE_OFF;
                      label = "Flash: Off";
                      flashBtn.setTextColor(0xFF777777);
                  }
                  if (imageCapture != null) imageCapture.setFlashMode(flashMode);
                  Toast.makeText(this, label, Toast.LENGTH_SHORT).show();
              }

              // ------------------------------------------------------------ camera

              private void ensurePermissions() {
                  List<String> need = new ArrayList<>();
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.CAMERA);
                  }
                  if (Build.VERSION.SDK_INT <= 28 && ContextCompat.checkSelfPermission(this,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.WRITE_EXTERNAL_STORAGE);
                  }
                  if (need.isEmpty()) startCamera();
                  else permLauncher.launch(need.toArray(new String[0]));
              }

              private void startCamera() {
                  final ListenableFuture<ProcessCameraProvider> f = ProcessCameraProvider.getInstance(this);
                  f.addListener(() -> {
                      try {
                          provider = f.get();
                          bindCamera();
                      } catch (Exception e) {
                          Toast.makeText(this, "Camera error: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      }
                  }, ContextCompat.getMainExecutor(this));
              }

              private void bindCamera() {
                  if (provider == null) return;
                  provider.unbindAll();
                  Preview preview = new Preview.Builder()
                          .setTargetAspectRatio(AspectRatio.RATIO_4_3).build();
                  preview.setSurfaceProvider(previewView.getSurfaceProvider());
                  imageCapture = new ImageCapture.Builder()
                          .setTargetAspectRatio(AspectRatio.RATIO_4_3)
                          .setCaptureMode(ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY)
                          .setFlashMode(flashMode)
                          .build();
                  CameraSelector sel = new CameraSelector.Builder().requireLensFacing(lensFacing).build();
                  try {
                      camera = provider.bindToLifecycle(this, sel, preview, imageCapture);
                      evIndex = 0;
                      zoomBtn.setText("1.0x");
                  } catch (Exception e) {
                      Toast.makeText(this, "Cannot open this camera", Toast.LENGTH_SHORT).show();
                      if (lensFacing == CameraSelector.LENS_FACING_FRONT) {
                          lensFacing = CameraSelector.LENS_FACING_BACK;
                      }
                  }
              }

              // ------------------------------------------------------------ capture + processing

              private void capture() {
                  if (imageCapture == null) return;
                  innerFrame.animate().alpha(0.35f).setDuration(60).withEndAction(
                          () -> innerFrame.animate().alpha(1f).setDuration(140).start()).start();

                  final File tmp = new File(getCacheDir(), "cap_" + System.currentTimeMillis() + ".jpg");
                  ImageCapture.OutputFileOptions opt = new ImageCapture.OutputFileOptions.Builder(tmp).build();
                  final boolean mir = lensFacing == CameraSelector.LENS_FACING_FRONT && mirrorOn;
                  final Filter f = filters.get(filterIndex);
                  final int q = quality;
                  imageCapture.takePicture(opt, ContextCompat.getMainExecutor(this),
                          new ImageCapture.OnImageSavedCallback() {
                              @Override
                              public void onImageSaved(ImageCapture.OutputFileResults r) {
                                  io.execute(() -> process(tmp, mir, f, q));
                              }

                              @Override
                              public void onError(ImageCaptureException e) {
                                  Toast.makeText(MainActivity.this, "Capture failed: " + e.getMessage(),
                                          Toast.LENGTH_LONG).show();
                              }
                          });
              }

              private void process(File tmp, boolean mir, Filter f, int q) {
                  Bitmap src = null, rot = null, out = null;
                  try {
                      int maxSide = q == 0 ? 4096 : (q == 1 ? 2048 : 1280);
                      int jq = q == 0 ? 95 : (q == 1 ? 85 : 70);
                      String path = tmp.getAbsolutePath();

                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(path, o);
                      int big = Math.max(o.outWidth, o.outHeight);
                      int sample = 1;
                      while (big / (sample * 2) >= maxSide) sample *= 2;
                      o = new BitmapFactory.Options();
                      o.inSampleSize = sample;
                      src = BitmapFactory.decodeFile(path, o);
                      if (src == null) throw new RuntimeException("decode failed");

                      int orient = new ExifInterface(path).getAttributeInt(
                              ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL);
                      Matrix m = new Matrix();
                      if (orient == ExifInterface.ORIENTATION_ROTATE_90) m.postRotate(90);
                      else if (orient == ExifInterface.ORIENTATION_ROTATE_180) m.postRotate(180);
                      else if (orient == ExifInterface.ORIENTATION_ROTATE_270) m.postRotate(270);
                      if (mir) m.postScale(-1f, 1f);
                      float sc = Math.min(1f, (float) maxSide / Math.max(src.getWidth(), src.getHeight()));
                      if (sc < 1f) m.postScale(sc, sc);
                      rot = Bitmap.createBitmap(src, 0, 0, src.getWidth(), src.getHeight(), m, true);

                      out = Bitmap.createBitmap(rot.getWidth(), rot.getHeight(), Bitmap.Config.ARGB_8888);
                      Canvas c = new Canvas(out);
                      Paint p = new Paint(Paint.FILTER_BITMAP_FLAG);
                      p.setColorFilter(new ColorMatrixColorFilter(f.matrix()));
                      c.drawBitmap(rot, 0, 0, p);
                      Fx.draw(c, out.getWidth(), out.getHeight(), f, Math.max(1f, out.getWidth() / 900f));

                      final Uri uri = saveBitmap(out, jq);

                      int s = Math.min(out.getWidth(), out.getHeight());
                      Bitmap sq = Bitmap.createBitmap(out, (out.getWidth() - s) / 2, (out.getHeight() - s) / 2, s, s);
                      final Bitmap th = Bitmap.createScaledBitmap(sq, 160, 160, true);
                      runOnUiThread(() -> {
                          lastUri = uri;
                          thumb.setImageBitmap(th);
                          Toast.makeText(this, "Saved \u2714  Pictures/RetroLens", Toast.LENGTH_SHORT).show();
                      });
                  } catch (Exception e) {
                      final String msg = String.valueOf(e.getMessage());
                      runOnUiThread(() -> Toast.makeText(this, "Save failed: " + msg, Toast.LENGTH_LONG).show());
                  } finally {
                      tmp.delete();
                  }
              }

              private Uri saveBitmap(Bitmap bmp, int jq) throws Exception {
                  String name = "RetroLens_" + new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()) + ".jpg";
                  if (Build.VERSION.SDK_INT >= 29) {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Images.Media.DISPLAY_NAME, name);
                      v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                      v.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/RetroLens");
                      v.put(MediaStore.Images.Media.IS_PENDING, 1);
                      Uri uri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                      if (uri == null) throw new RuntimeException("MediaStore insert failed");
                      OutputStream os = getContentResolver().openOutputStream(uri);
                      bmp.compress(Bitmap.CompressFormat.JPEG, jq, os);
                      os.close();
                      ContentValues done = new ContentValues();
                      done.put(MediaStore.Images.Media.IS_PENDING, 0);
                      getContentResolver().update(uri, done, null, null);
                      return uri;
                  } else {
                      File dir = new File(Environment.getExternalStoragePublicDirectory(
                              Environment.DIRECTORY_PICTURES), "RetroLens");
                      dir.mkdirs();
                      File file = new File(dir, name);
                      FileOutputStream fo = new FileOutputStream(file);
                      bmp.compress(Bitmap.CompressFormat.JPEG, jq, fo);
                      fo.close();
                      MediaScannerConnection.scanFile(this, new String[]{file.getAbsolutePath()},
                              new String[]{"image/jpeg"}, null);
                      return Uri.fromFile(file);
                  }
              }

              private void openGallery() {
                  try {
                      Intent i;
                      if (lastUri != null) {
                          i = new Intent(Intent.ACTION_VIEW);
                          i.setDataAndType(lastUri, "image/*");
                          i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } else {
                          i = new Intent(Intent.ACTION_VIEW, MediaStore.Images.Media.EXTERNAL_CONTENT_URI);
                      }
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "No gallery app found", Toast.LENGTH_SHORT).show();
                  }
              }

              // ------------------------------------------------------------ settings

              private void showSettings() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(22), dp(14), dp(22), dp(6));

                  SwitchCompat gs = new SwitchCompat(this);
                  gs.setText("Rule of Thirds grid  (\u09B0\u09C1\u09B2 \u0985\u09AB \u09A5\u09BE\u09B0\u09CD\u09A1\u09B8)");
                  gs.setTextColor(0xFFFFFFFF);
                  gs.setChecked(gridOn);
                  gs.setOnCheckedChangeListener((b, c) -> {
                      gridOn = c;
                      prefs.edit().putBoolean("grid", c).apply();
                      overlay.setGrid(c);
                  });
                  box.addView(gs, new LinearLayout.LayoutParams(-1, dp(48)));

                  SwitchCompat ms = new SwitchCompat(this);
                  ms.setText("Mirror selfie image  (\u09B8\u09C7\u09B2\u09AB\u09BF \u09AE\u09BF\u09B0\u09B0)");
                  ms.setTextColor(0xFFFFFFFF);
                  ms.setChecked(mirrorOn);
                  ms.setOnCheckedChangeListener((b, c) -> {
                      mirrorOn = c;
                      prefs.edit().putBoolean("mirror", c).apply();
                  });
                  box.addView(ms, new LinearLayout.LayoutParams(-1, dp(48)));

                  TextView qt = new TextView(this);
                  qt.setText("Image quality / size");
                  qt.setTextColor(0xFFFFB066);
                  qt.setPadding(0, dp(14), 0, dp(4));
                  box.addView(qt);

                  String[] labels = {
                          "High  \u2013 up to 4096 px, JPEG 95%",
                          "Medium \u2013 up to 2048 px, JPEG 85%",
                          "Low \u2013 up to 1280 px, JPEG 70% (small file)"};
                  final int[] ids = new int[3];
                  RadioGroup rg = new RadioGroup(this);
                  for (int i = 0; i < 3; i++) {
                      RadioButton rb = new RadioButton(this);
                      rb.setText(labels[i]);
                      rb.setTextColor(0xFFFFFFFF);
                      ids[i] = View.generateViewId();
                      rb.setId(ids[i]);
                      rg.addView(rb);
                  }
                  rg.check(ids[Math.max(0, Math.min(2, quality))]);
                  rg.setOnCheckedChangeListener((g, id) -> {
                      for (int i = 0; i < 3; i++) {
                          if (ids[i] == id) {
                              quality = i;
                              prefs.edit().putInt("quality", i).apply();
                          }
                      }
                  });
                  box.addView(rg);

                  View line = new View(this);
                  line.setBackgroundColor(0x44FFFFFF);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, dp(1));
                  lp.topMargin = dp(14);
                  lp.bottomMargin = dp(10);
                  box.addView(line, lp);

                  TextView about = new TextView(this);
                  about.setText("RetroLens 1.0\n"
                          + "Creator: Mohammod Abdul Awal\n"
                          + "Student: Department of English, National University\n"
                          + "Mail: awal.sorkar.144@gmail.com");
                  about.setTextColor(0xFFCCCCCC);
                  about.setTextSize(13);
                  about.setAutoLinkMask(Linkify.EMAIL_ADDRESSES);
                  about.setLinkTextColor(0xFFFF9A2E);
                  box.addView(about);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(box);
                  new AlertDialog.Builder(this)
                          .setTitle("Settings")
                          .setView(scroll)
                          .setPositiveButton("OK", null)
                          .show();
              }
          }
