          cat > app/src/main/java/com/awal/retrolens/OverlayView.java << 'EOF'
          package com.awal.retrolens;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.os.SystemClock;
          import android.view.View;

          /** Effects layer + rule-of-thirds grid + focus ring + exposure label. */
          public class OverlayView extends View {
              private Filter filter;
              private boolean grid = false;
              private float fx = -1f, fy = -1f;
              private long focusT = 0, evT = 0;
              private String evText = "";
              private final Paint line = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint ring = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint text = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final float d;

              public OverlayView(Context c) {
                  super(c);
                  d = c.getResources().getDisplayMetrics().density;
                  line.setColor(0xAAFFFFFF);
                  line.setStrokeWidth(1.2f * d);
                  ring.setStyle(Paint.Style.STROKE);
                  ring.setStrokeWidth(2f * d);
                  ring.setColor(0xFFFFB22E);
                  text.setColor(0xFFFFD27A);
                  text.setTextSize(15f * d);
                  text.setTextAlign(Paint.Align.CENTER);
                  text.setShadowLayer(3f * d, 0, 0, 0xFF000000);
                  setClickable(true);
              }

              public void setFilter(Filter f) { filter = f; invalidate(); }
              public void setGrid(boolean g) { grid = g; invalidate(); }

              public void showFocus(float x, float y) {
                  fx = x; fy = y;
                  focusT = SystemClock.uptimeMillis();
                  invalidate();
              }

              public void showEv(String s) {
                  evText = s;
                  evT = SystemClock.uptimeMillis();
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas c) {
                  int w = getWidth(), h = getHeight();
                  if (filter != null) Fx.draw(c, w, h, filter, 1f);

                  if (grid) {
                      c.drawLine(w / 3f, 0, w / 3f, h, line);
                      c.drawLine(2f * w / 3f, 0, 2f * w / 3f, h, line);
                      c.drawLine(0, h / 3f, w, h / 3f, line);
                      c.drawLine(0, 2f * h / 3f, w, 2f * h / 3f, line);
                  }

                  long now = SystemClock.uptimeMillis();
                  boolean again = false;

                  if (fx >= 0) {
                      long t = now - focusT;
                      if (t < 2000) {
                          float k = Math.min(1f, t / 220f);
                          float r = (52f - 18f * k) * d;
                          int a = t < 1400 ? 255 : (int) (255f * (2000 - t) / 600f);
                          ring.setAlpha(Math.max(0, Math.min(255, a)));
                          c.drawCircle(fx, fy, r, ring);
                          c.drawCircle(fx, fy, 3f * d, ring);
                          again = true;
                      }
                  }

                  long te = now - evT;
                  if (evT > 0 && te < 1800) {
                      int a = te < 1200 ? 255 : (int) (255f * (1800 - te) / 600f);
                      text.setAlpha(Math.max(0, Math.min(255, a)));
                      c.drawText(evText, w / 2f, 34f * d, text);
                      again = true;
                  }

                  if (again) postInvalidateOnAnimation();
              }
          }
