          package com.awal.launcher;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.util.AttributeSet;
          import android.view.View;
          public class CompassView extends View {
              private Paint p1,p2,p3,p4;
              private float bearing=0;
              public CompassView(Context c){super(c);init();}
              public CompassView(Context c,AttributeSet a){super(c,a);init();}
              private void init(){
                  p1=new Paint(Paint.ANTI_ALIAS_FLAG);p1.setStyle(Paint.Style.STROKE);p1.setColor(0x55FFFFFF);p1.setStrokeWidth(2f);
                  p2=new Paint(Paint.ANTI_ALIAS_FLAG);p2.setStyle(Paint.Style.FILL);p2.setColor(0xFFEF5350);
                  p3=new Paint(Paint.ANTI_ALIAS_FLAG);p3.setStyle(Paint.Style.FILL);p3.setColor(0xFF90A4AE);
                  p4=new Paint(Paint.ANTI_ALIAS_FLAG);p4.setColor(0xCCFFFFFF);p4.setTextSize(28f);p4.setTextAlign(Paint.Align.CENTER);
              }
              public void setBearing(float b){bearing=b;invalidate();}
              @Override protected void onDraw(Canvas c){
                  int w=getWidth(),h=getHeight();
                  float cx=w/2f,cy=h/2f,r=Math.min(w,h)/2f-16f;
                  c.drawCircle(cx,cy,r,p1);
                  c.save();c.rotate(-bearing,cx,cy);
                  float[] dirs={"N","E","S","W"};float[] angles={0,90,180,270};
                  for(int i=0;i<4;i++){float rad=(float)Math.toRadians(angles[i]);c.drawText(dirs[i],cx+(float)Math.sin(rad)*(r-36),cy-(float)Math.cos(rad)*(r-36)+(p4.getTextSize()/3),p4);}
                  android.graphics.Path np=new android.graphics.Path();np.moveTo(cx,cy-r+24);np.lineTo(cx-18,cy+r/4);np.lineTo(cx+18,cy+r/4);np.close();c.drawPath(np,p2);
                  android.graphics.Path sp=new android.graphics.Path();sp.moveTo(cx,cy+r-24);sp.lineTo(cx-18,cy-r/4);sp.lineTo(cx+18,cy-r/4);sp.close();c.drawPath(sp,p3);
                  c.restore();
              }
          }
