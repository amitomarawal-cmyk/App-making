      - name: Create RecentFilesManager
        run: |
          cat > app/src/main/java/com/awal/pdfreader/RecentFilesManager.java << 'EOF'
          package com.awal.pdfreader;
          import android.content.Context;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.List;
          public class RecentFilesManager {
              private static final String PREF = "recent_files";
              private static final String KEY = "files";
              private static final int MAX = 100;
              private SharedPreferences prefs;
              public RecentFilesManager(Context ctx) {
                  prefs = ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE);
              }
              public List<RecentFile> getAll() {
                  List<RecentFile> list = new ArrayList<>();
                  try {
                      String json = prefs.getString(KEY, "[]");
                      JSONArray arr = new JSONArray(json);
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          list.add(new RecentFile(o.getString("path"), o.getString("name"),
                              o.getInt("lastPage"), o.getLong("lastOpened")));
                      }
                  } catch (Exception ignored) {}
                  return list;
              }
              public void addOrUpdate(String path, String name, int lastPage) {
                  List<RecentFile> list = getAll();
                  list.removeIf(f -> f.path.equals(path));
                  list.add(0, new RecentFile(path, name, lastPage, System.currentTimeMillis()));
                  if (list.size() > MAX) list = list.subList(0, MAX);
                  save(list);
              }
              public void remove(String path) {
                  List<RecentFile> list = getAll();
                  list.removeIf(f -> f.path.equals(path));
                  save(list);
              }
              private void save(List<RecentFile> list) {
                  try {
                      JSONArray arr = new JSONArray();
                      for (RecentFile f : list) {
                          JSONObject o = new JSONObject();
                          o.put("path", f.path); o.put("name", f.name);
                          o.put("lastPage", f.lastPage); o.put("lastOpened", f.lastOpened);
                          arr.put(o);
                      }
                      prefs.edit().putString(KEY, arr.toString()).apply();
                  } catch (Exception ignored) {}
              }
              public int getLastPage(String path) {
                  for (RecentFile f : getAll()) if (f.path.equals(path)) return f.lastPage;
                  return 0;
              }
          }
          EOF

      - name: Create DrawingView
        run: |
          cat > app/src/main/java/com/awal/pdfreader/DrawingView.java << 'EOF'
          package com.awal.pdfreader;
          import android.content.Context;
          import android.graphics.*;
          import android.util.AttributeSet;
          import android.view.MotionEvent;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;
          public class DrawingView extends View {
              private Paint paint = new Paint();
              private Path currentPath = new Path();
              private List<Path> paths = new ArrayList<>();
              private List<Paint> paints = new ArrayList<>();
              private float startX, startY;
              private boolean drawing = false;
              public DrawingView(Context ctx, AttributeSet attrs) {
                  super(ctx, attrs);
                  paint.setColor(Color.RED);
                  paint.setStrokeWidth(5f);
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setAntiAlias(true);
                  setBackgroundColor(Color.TRANSPARENT);
              }
              @Override
              protected void onDraw(Canvas canvas) {
                  for (int i = 0; i < paths.size(); i++) canvas.drawPath(paths.get(i), paints.get(i));
                  canvas.drawPath(currentPath, paint);
              }
              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  if (e.getPointerCount() > 1) return false;
                  switch (e.getAction()) {
                      case MotionEvent.ACTION_DOWN:
                          currentPath = new Path();
                          currentPath.moveTo(e.getX(), e.getY());
                          drawing = true;
                          break;
                      case MotionEvent.ACTION_MOVE:
                          if (drawing) currentPath.lineTo(e.getX(), e.getY());
                          break;
                      case MotionEvent.ACTION_UP:
                          if (drawing) {
                              paths.add(currentPath);
                              Paint p = new Paint(paint);
                              paints.add(p);
                              drawing = false;
                          }
                          break;
                  }
                  invalidate();
                  return true;
              }
              public void setPaintColor(int color) { paint.setColor(color); }
              public void clear() { paths.clear(); paints.clear(); currentPath = new Path(); invalidate(); }
          }
          EOF

      - name: Create RecentAdapter
        run: |
          cat > app/src/main/java/com/awal/pdfreader/RecentAdapter.java << 'EOF'
          package com.awal.pdfreader;
          import android.view.*;
          import android.widget.*;
          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.RecyclerView;
          import java.text.SimpleDateFormat;
          import java.util.*;
          public class RecentAdapter extends RecyclerView.Adapter<RecentAdapter.VH> {
              private List<RecentFile> items;
              private OnItemClick listener;
              interface OnItemClick {
                  void onOpen(RecentFile f);
                  void onDelete(RecentFile f, int pos);
              }
              public RecentAdapter(List<RecentFile> items, OnItemClick listener) {
                  this.items = items; this.listener = listener;
              }
              @NonNull @Override
              public VH onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                  View v = LayoutInflater.from(parent.getContext())
                      .inflate(R.layout.item_recent, parent, false);
                  return new VH(v);
              }
              @Override
              public void onBindViewHolder(@NonNull VH h, int pos) {
                  RecentFile f = items.get(pos);
                  h.name.setText(f.name);
                  h.path.setText(f.path);
                  h.pageInfo.setText("Page: " + (f.lastPage + 1) + " | " +
                      new SimpleDateFormat("dd/MM/yy HH:mm", Locale.getDefault()).format(new Date(f.lastOpened)));
                  h.itemView.setOnClickListener(v -> listener.onOpen(f));
                  h.delete.setOnClickListener(v -> listener.onDelete(f, h.getAdapterPosition()));
              }
              @Override public int getItemCount() { return items.size(); }
              public void remove(int pos) { items.remove(pos); notifyItemRemoved(pos); }
              static class VH extends RecyclerView.ViewHolder {
                  TextView name, path, pageInfo;
                  ImageButton delete;
                  VH(View v) {
                      super(v);
                      name = v.findViewById(R.id.tv_name);
                      path = v.findViewById(R.id.tv_path);
                      pageInfo = v.findViewById(R.id.tv_page_info);
                      delete = v.findViewById(R.id.btn_delete);
                  }
              }
          }
