             const tm=selMoves.find(m=>m.t===s);
             if(tm)cl+=(p||tm.e)?' tc':' tg';
             if(hintMove&&(s===hintMove.f||s===hintMove.t))cl+=' hn';
             if(s===chk)cl+=' chk';
            }
            h+='<div class="'+cl+'" data-s="'+s+'"'+(i===7?' data-f="'+FL[c]+'"':'')+(j===0?' data-r="'+(8-r)+'"':'')+'>'+(p?'<span class="pc '+(p>0?'pw':'pb')+(S.mode==='hh'&&p<0?' rot':'')+'">'+GL[Math.abs(p)]+'</span>':'')+'</div>';
           }
           $('board').innerHTML=h;
           if(anim){runAnim(anim);anim=null;}
           const topS=f?1:-1;
           $('nTop').textContent=pname(topS);$('nBot').textContent=pname(-topS);
           updClocks();
           $('st').textContent=stTxt();
           $('cm').innerHTML=cmt?'<span class="'+cmt.c+'">'+cmt.t+'</span>':'';
           const pct=50+50*Math.tanh(curEval/500),ew=$('evw');
           ew.style.height=pct+'%';
           if(f){ew.style.top='0';ew.style.bottom='';}else{ew.style.bottom='0';ew.style.top='';}
           const ev=Math.abs(curEval/100);
           $('evt').textContent=Math.abs(curEval)>=9000?'কিস্তিমাত':(Math.abs(curEval)<15?'⚖️ সমান সমান':(curEval>0?'সাদা':'কালো')+' এগিয়ে (+'+bn(ev.toFixed(1))+')');
           $('bHint').textContent='💡 হিন্ট ('+bn(3-hints)+')';
           $('bUndo').disabled=busy||rep>=0||!moves.length;
           $('bHint').disabled=busy||rep>=0||!!over||S.mode!=='ai'||turn!==S.hc;
           $('rb').style.display=rep>=0?'flex':'none';
           $('rpi').textContent=bn(rep)+'/'+bn(moves.length);
           let l='';
           for(let i=0;i<sans.length;i++){
            if(i%2===0)l+=bn(i/2+1)+'. ';
            l+='<span class="'+(rep>0&&i===rep-1?'cur':'')+'">'+sans[i]+'</span> ';
           }
           $('ml').innerHTML=l||'<span class="sm">এখনো কোনো চাল হয়নি</span>';
           if(rep<0)$('ml').scrollTop=$('ml').scrollHeight;
          }
          function startReplay(){if(busy)return;if(!moves.length){cmt={t:'এখনো কোনো চাল নেই',c:'g2'};render();return;}rep=moves.length;render();}
          function pairsFor(i,rev){
           const m=moves[i],f=m[0],t=m[1],b=snaps[i+1].b;
           const p=[[f,t]];
           if(Math.abs(b[t])===6&&Math.abs(t-f)===2)p.push(t>f?[f+3,f+1]:[f-4,f-1]);
           return rev?p.map(x=>[x[1],x[0]]):p;
          }
          function runAnim(list){
           const bd=$('board');
           for(const a of list){
            const e1=bd.querySelector('[data-s="'+a[0]+'"]'),e2=bd.querySelector('[data-s="'+a[1]+'"]');
            const pc=e2&&e2.querySelector('.pc');
            if(!e1||!pc)continue;
            const r1=e1.getBoundingClientRect(),r2=e2.getBoundingClientRect();
            const base=pc.classList.contains('rot')?' rotate(180deg)':'';
            pc.style.transition='none';
            pc.style.zIndex=9;
            pc.style.transform='translate('+(r1.left-r2.left)+'px,'+(r1.top-r2.top)+'px)'+base;
            pc.getBoundingClientRect();
            pc.style.transition='transform .25s ease-out';
            pc.style.transform=base||'none';
           }
          }
          function rp(d){
           if(rep<0)return;
           const o=rep;rep=Math.max(0,Math.min(moves.length,rep+d));
           if(rep-o===1)anim=pairsFor(o,false);else if(rep-o===-1)anim=pairsFor(rep,true);
           render();
          }
          function endReplay(){rep=-1;lastTick=Date.now();render();}
          function undo(){
           if(busy||rep>=0||!moves.length||S.mode==='hh')return;
           let k=(S.mode==='ai'&&turn===S.hc)?2:1;k=Math.min(k,moves.length);
           const n=moves.length-k;
           rebuild(moves.slice(0,n),tms.slice(0,n+1),tms[n]);
           save();render();
           if(S.mode==='ai'&&turn!==S.hc)aiMove();
          }
          function rebuild(list,tl,T0){
           GID++;busy=false;setup();turn=1;moves=[];sans=[];snaps=[{b:B.slice(),f:-1,t:-1}];tms=[tl[0].slice()];keys=[key()];over=null;rep=-1;sel=-1;selMoves=[];hintMove=null;cmt=null;
           for(let i=0;i<list.length;i++){
            const f=list[i][0],t=list[i][1],pr=list[i][2]||0;
            const m=legal(turn).find(x=>x.f===f&&x.t===t&&(x.pr||0)===pr);
            if(!m)break;
            T=tl[i+1]?tl[i+1].slice():[T[0],T[1]];
            apply(m);
           }
           T=T0.slice();
           if(S.mode==='ai')updEval();else curEval=0;
          }
          function newGame(){
           GID++;
           S.hc=S.mode==='ai'?(Math.random()<.5?1:-1):1;
           setup();turn=1;moves=[];sans=[];snaps=[{b:B.slice(),f:-1,t:-1}];T=[S.tc,S.tc];tms=[[S.tc,S.tc]];keys=[key()];
           over=null;hints=0;busy=false;rep=-1;sel=-1;selMoves=[];hintMove=null;cmt=null;curEval=0;started=true;lastTick=Date.now();
           document.body.classList.toggle('hh',S.mode==='hh');
           save();render();say('start');
           if(S.mode==='ai'&&S.hc===-1)aiMove();
          }
          function save(){
           try{localStorage.setItem('daba_game',JSON.stringify({S:S,m:moves,tm:tms,T:T,h:hints,o:over}));}catch(e){}
          }
          function load(){
           try{
            const d=JSON.parse(localStorage.getItem('daba_game')||'null');
            if(!d||!d.m||!d.tm)return false;
            S=Object.assign(S,d.S);
            document.body.classList.toggle('hh',S.mode==='hh');
            rebuild(d.m,d.tm,d.T);
            hints=d.h||0;if(d.o)over=d.o;
            started=true;return true;
           }catch(e){return false;}
          }
          function modal(h){$('mod').innerHTML='<div class="bx">'+h+'</div>';$('mod').style.display='flex';}
          function closeMod(){$('mod').style.display='none';}
          function openNew(cc){
           modal('<h3>🆕 নতুন খেলা</h3><label>খেলার ধরন</label><select id="mMode" onchange="mm()"><option value="ai">🤖 কম্পিউটারের সাথে</option><option value="hh">👥 বন্ধুর সাথে (একই ফোনে)</option></select>'+
           '<div id="aiOpt"><label>কঠিনতা</label><select id="mLv"><option value="1">শিশু</option><option value="2">সহজ</option><option value="3">মাঝারি</option><option value="4">কঠিন</option></select>'+
           '<label>রোবটের চরিত্র</label><select id="mPs"><option value="0">👴 গম্ভীর দাদু</option><option value="1">😜 ফাজিল বন্ধু</option><option value="2">😺 ঘুমকাতুরে বিড়াল</option></select></div>'+
           '<label>প্রত্যেকের সময়</label><select id="mTc"><option value="300">৫ মিনিট</option><option value="600">১০ মিনিট</option><option value="900">১৫ মিনিট</option></select>'+
           '<p class="sm" id="mNote"></p><button onclick="startNew()">▶ খেলা শুরু</button>'+(cc?'<button onclick="closeMod()">বাতিল</button>':''));
           $('mMode').value=S.mode;$('mLv').value=S.lv;$('mPs').value=S.ps;$('mTc').value=S.tc;mm();
          }
          function mm(){
           const ai=$('mMode').value==='ai';
           $('aiOpt').style.display=ai?'block':'none';
           $('mNote').textContent=ai?'সাদা না কালো — সেটা এলোমেলোভাবে ঠিক হবে।':'দুজন একই ফোনে খেলবেন। ওপরের খেলোয়াড়ের ঘুঁটি উল্টো দেখাবে। কোনো সাহায্য থাকবে না, শুধু ঘড়ি।';
          }
          function startNew(){
           S.mode=$('mMode').value;S.lv=+$('mLv').value;S.ps=+$('mPs').value;S.tc=+$('mTc').value;
           try{localStorage.setItem('daba_set',JSON.stringify(S));}catch(e){}
           closeMod();newGame();
          }
          function showResult(extra){
           if(!over)return;
           modal('<h3>'+resTxt()+'</h3>'+(extra||'')+'<p class="sm">চালের তালিকা (PGN):</p><textarea id="pg" readonly>'+pgn()+'</textarea><button onclick="cp()">📋 কপি</button><button onclick="closeMod();startReplay()">🔁 রিপ্লে</button><button onclick="openNew(true)">🆕 নতুন খেলা</button><button onclick="closeMod()">বন্ধ</button><p class="sm" id="cpm"></p>');
          }
          function showPgn(){
           modal('<h3>📜 চালের তালিকা (PGN)</h3><textarea id="pg" readonly>'+pgn()+'</textarea><button onclick="cp()">📋 কপি</button><button onclick="closeMod()">বন্ধ</button><p class="sm" id="cpm"></p>');
          }
          function cp(){
           const t=$('pg');t.select();
           let ok=false;try{ok=document.execCommand('copy');}catch(e){}
           $('cpm').textContent=ok?'কপি হয়েছে ✔':'লেখাটি চেপে ধরে কপি করুন';
          }
          function about(){
           modal('<div style="text-align:center"><div class="logo" style="margin:0 auto 8px;width:64px;height:64px;font-size:44px">♚</div><h3>দাবা গুরু</h3><p class="sm">বাংলায় দাবা খেলার অ্যাপ</p></div><p><b>নির্মাতা (Creator):</b><br>Mohammod Abdul Awal</p><p><b>Student:</b><br>Department of English,<br>National University</p><p><b>Mail:</b><br><a href="mailto:awal.sorkar.144@gmail.com">awal.sorkar.144@gmail.com</a></p><button onclick="closeMod()">বন্ধ</button>');
          }
          function toggleDark(){
           const d=document.body.classList.toggle('dark');
           try{localStorage.setItem('daba_dark',d?'1':'0');}catch(e){}
          }
          function fit(){
           const w=Math.floor(Math.min(innerWidth-56,innerHeight*0.56,480));
           $('board').style.width=w+'px';$('board').style.height=w+'px';$('ev').style.height=w+'px';
           document.documentElement.style.setProperty('--sz',(w/8*0.8)+'px');
          }
          setInterval(()=>{
           const now=Date.now(),dt=Math.min((now-lastTick)/1000,1);lastTick=now;
           if(!started||over||rep>=0)return;
           const i=turn===1?0:1;
           T[i]-=dt;
           if(T[i]<=0){T[i]=0;updClocks();finish({w:-turn,why:'সময় শেষ'});render();return;}
           updClocks();
           if(++sv%20===0)save();
          },250);
          window.addEventListener('resize',fit);
          window.onload=()=>{
           $('board').onclick=e=>{const el=e.target.closest('.sq');if(el)clickSq(+el.dataset.s);};
           try{
            if(localStorage.getItem('daba_dark')==='1')document.body.classList.add('dark');
            const s=JSON.parse(localStorage.getItem('daba_set')||'null');if(s)S=Object.assign(S,s);
           }catch(e){}
           setup();snaps=[{b:B.slice(),f:-1,t:-1}];
           fit();
           if(load()){render();if(S.mode==='ai'&&!over&&turn!==S.hc)aiMove();}
           else{render();openNew(false);}
           lastTick=Date.now();
          };
          </script></body></html>
          EOF

      - name: Create Gradle wrapper
        run: |
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat > gradlew << 'EOF'
          #!/bin/sh
          APP_HOME=$(cd "$(dirname "$0")" && pwd -P)
          exec java -Dorg.gradle.appname=gradlew -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew
          ls -la gradle/wrapper

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DabaGuru-APK
          path: app/build/outputs/apk/debug/*.apk
