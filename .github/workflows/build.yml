          cat > app/src/main/java/com/awal/retrolens/Fx.java << 'EOF'
          package com.awal.retrolens;

          import android.graphics.Bitmap;
          import android.graphics.BitmapShader;
          import android.graphics.Canvas;
          import android.graphics.LinearGradient;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;

          import java.util.Random;

          /** Draws leak / vignette / grain effects. Used for live preview and saved photo. */
          public class Fx {
              private static Bitmap noise;

              private static Bitmap noise() {
                  if (noise == null) {
                      int n = 160;
                      int[] px = new int[n * n];
                      Random q = new Random(7);
                      for (int i = 0; i < px.length; i++) {
                          int v = q.nextInt(256);
                          px[i] = 0xFF000000 | (v << 16) | (v << 8) | v;
                      }
                      noise = Bitmap.createBitmap(px, n, n, Bitmap.Config.ARGB_8888);
                  }
                  return noise;
              }

              public static void draw(Canvas c, int w, int h, Filter f, float grainScale) {
                  if (w <= 0 || h <= 0) return;
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                  if (f.leakColor != 0) {
                      float x0 = 0, y0 = 0, x1 = 0, y1 = 0;
                      switch (f.leakSide) {
                          case 0: x0 = 0; x1 = w * .6f; break;
                          case 1: x0 = w; x1 = w * .4f; break;
                          case 2: y0 = 0; y1 = h * .5f; break;
                          default: y0 = h; y1 = h * .5f; break;
                      }
                      p.setShader(new LinearGradient(x0, y0, x1, y1, f.leakColor,
                              f.leakColor & 0x00FFFFFF, Shader.TileMode.CLAMP));
                      c.drawRect(0, 0, w, h, p);
                      p.setShader(null);
                  }

                  if (f.vig > 0f) {
                      float rad = (float) Math.hypot(w, h) / 2f;
                      int a = (int) (Math.min(1f, f.vig) * 255f);
                      p.setShader(new RadialGradient(w / 2f, h / 2f, rad,
                              new int[]{0x00000000, 0x00000000, (a << 24)},
                              new float[]{0f, .5f, 1f}, Shader.TileMode.CLAMP));
                      c.drawRect(0, 0, w, h, p);
                      p.setShader(null);
                  }

                  if (f.grain > 0f) {
                      BitmapShader s = new BitmapShader(noise(), Shader.TileMode.REPEAT, Shader.TileMode.REPEAT);
                      Matrix m = new Matrix();
                      m.setScale(grainScale, grainScale);
                      s.setLocalMatrix(m);
                      p.setShader(s);
                      p.setAlpha((int) (f.grain * 0.45f * 255f));
                      c.drawRect(0, 0, w, h, p);
                      p.setShader(null);
                  }
              }
          }
