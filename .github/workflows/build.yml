name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
      - name: Create project
        run: |
          mkdir -p app app/src/main app/src/main/java/com/awal/player app/src/main/res/drawable app/src/main/res/layout app/src/main/res/values gradle/wrapper
          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'AwalPlayer'
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.awal.player'
            compileSdk 34
            defaultConfig {
              applicationId 'com.awal.player'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
          }
          dependencies {
            implementation 'androidx.media3:media3-exoplayer:1.2.1'
            implementation 'androidx.media3:media3-ui:1.2.1'
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <application
              android:label="Awal Player"
              android:icon="@drawable/ic_launcher"
              android:allowBackup="false"
              android:theme="@style/AppTheme">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTop"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <data android:mimeType="video/*"/>
                  <data android:mimeType="audio/*"/>
                </intent-filter>
              </activity>
              <service
                android:name=".PlayService"
                android:exported="false"
                android:foregroundServiceType="mediaPlayback"/>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#0F1115">
            <LinearLayout
              android:id="@+id/lib"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">
              <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:gravity="center_vertical"
                android:paddingLeft="16dp"
                android:paddingTop="12dp"
                android:paddingRight="8dp"
                android:paddingBottom="4dp">
                <TextView
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:text="Awal Player"
                  android:textColor="#FFFFFF"
                  android:textSize="22sp"
                  android:textStyle="bold"/>
                <TextView
                  android:id="@+id/browse"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:background="?android:attr/selectableItemBackground"
                  android:padding="10dp"
                  android:text="Browse"
                  android:textColor="#4FC3F7"
                  android:textSize="14sp"/>
                <TextView
                  android:id="@+id/about"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:background="?android:attr/selectableItemBackground"
                  android:padding="10dp"
                  android:text="About"
                  android:textColor="#4FC3F7"
                  android:textSize="14sp"/>
              </LinearLayout>
              <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content">
                <TextView
                  android:id="@+id/tabV"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:background="?android:attr/selectableItemBackground"
                  android:gravity="center"
                  android:padding="14dp"
                  android:text="VIDEOS"
                  android:textSize="13sp"
                  android:textStyle="bold"/>
                <TextView
                  android:id="@+id/tabA"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:background="?android:attr/selectableItemBackground"
                  android:gravity="center"
                  android:padding="14dp"
                  android:text="SONGS"
                  android:textSize="13sp"
                  android:textStyle="bold"/>
              </LinearLayout>
              <FrameLayout
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1">
                <ListView
                  android:id="@+id/list"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:divider="@null"
                  android:listSelector="@android:color/transparent"
                  android:scrollbars="none"/>
                <TextView
                  android:id="@+id/empty"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:gravity="center"
                  android:textColor="#8A8FA3"
                  android:textSize="15sp"
                  android:visibility="gone"/>
              </FrameLayout>
            </LinearLayout>
            <FrameLayout
              android:id="@+id/play"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000"
              android:visibility="gone">
              <com.awal.player.RingView
                android:id="@+id/ring"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:visibility="gone"/>
              <androidx.media3.ui.PlayerView
                android:id="@+id/pv"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                app:shutter_background_color="#00000000"
                app:surface_type="texture_view"/>
              <HorizontalScrollView
                android:id="@+id/bar"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:background="#99000000"
                android:scrollbars="none">
                <LinearLayout
                  android:id="@+id/row"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"/>
              </HorizontalScrollView>
            </FrameLayout>
          </FrameLayout>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="96dp" android:height="96dp"
            android:viewportWidth="96" android:viewportHeight="96">
            <path android:fillColor="#1565C0" android:pathData="M48,4a44,44 0 1,0 0,88a44,44 0 1,0 0,-88z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M38,28L38,68L70,48z"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_stat.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp" android:height="24dp"
            android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M8,5v14l11,-7z"/>
          </vector>
          EOF
          cat > app/src/main/java/com/awal/player/PlayService.java << 'EOF'
          package com.awal.player;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import androidx.core.app.NotificationCompat;

          public class PlayService extends Service {
            @Override public IBinder onBind(Intent i) { return null; }

            @Override public int onStartCommand(Intent i, int flags, int id) {
              if (Build.VERSION.SDK_INT >= 26) {
                getSystemService(NotificationManager.class).createNotificationChannel(
                    new NotificationChannel("bg", "Playback", NotificationManager.IMPORTANCE_LOW));
              }
              PendingIntent pi = PendingIntent.getActivity(this, 0,
                  new Intent(this, MainActivity.class)
                      .addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NEW_TASK),
                  PendingIntent.FLAG_IMMUTABLE);
              Notification n = new NotificationCompat.Builder(this, "bg")
                  .setSmallIcon(R.drawable.ic_stat)
                  .setContentTitle("Awal Player")
                  .setContentText("Playing in background")
                  .setContentIntent(pi)
                  .setOngoing(true)
                  .build();
              if (Build.VERSION.SDK_INT >= 29) {
                startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
              } else {
                startForeground(1, n);
              }
              return START_NOT_STICKY;
            }
          }
          EOF
          cat > app/src/main/java/com/awal/player/MainActivity.java << 'EOF'
          package com.awal.player;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentUris;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.media.audiofx.Visualizer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.ScaleGestureDetector;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AlertDialog;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.media3.common.AudioAttributes;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MediaMetadata;
          import androidx.media3.common.MimeTypes;
          import androidx.media3.common.Player;
          import androidx.media3.common.Tracks;
          import androidx.media3.common.util.RepeatModeUtil;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.AspectRatioFrameLayout;
          import androidx.media3.ui.PlayerView;
          import androidx.media3.ui.TrackSelectionDialogBuilder;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {
            static class M { Uri uri; String title, artist, sub; }

            ExoPlayer player;
            PlayerView pv;
            RingView ring;
            View bar, content, libView, playView, empty, tabV, tabA;
            Visualizer viz;
            List<M> vids = new ArrayList<>(), auds = new ArrayList<>();
            Ad ad = new Ad();
            boolean bg, micAsked;
            int mode, tab;
            float peak = 25f, scale = 1f, tx, ty, lx = -1, ly;

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              setContentView(R.layout.activity_main);
              libView = findViewById(R.id.lib);
              playView = findViewById(R.id.play);
              ring = findViewById(R.id.ring);
              pv = findViewById(R.id.pv);
              bar = findViewById(R.id.bar);
              empty = findViewById(R.id.empty);
              tabV = findViewById(R.id.tabV);
              tabA = findViewById(R.id.tabA);
              ListView list = findViewById(R.id.list);

              player = new ExoPlayer.Builder(this).build();
              player.setAudioAttributes(new AudioAttributes.Builder()
                  .setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MOVIE).build(), true);
              player.setHandleAudioBecomingNoisy(true);
              player.setWakeMode(C.WAKE_MODE_LOCAL);
              pv.setPlayer(player);
              pv.setShowShuffleButton(true);
              pv.setRepeatToggleModes(RepeatModeUtil.REPEAT_TOGGLE_MODE_ONE | RepeatModeUtil.REPEAT_TOGGLE_MODE_ALL);
              int id = getResources().getIdentifier("exo_content_frame", "id", getPackageName());
              content = id != 0 ? pv.findViewById(id) : pv;
              pv.setControllerVisibilityListener(
                  (PlayerView.ControllerVisibilityListener) v -> bar.setVisibility(v));

              player.addListener(new Player.Listener() {
                @Override public void onTracksChanged(Tracks t) { mode(t); }
                @Override public void onMediaItemTransition(MediaItem m, int r) {
                  if (m != null) ring.setTitle(m.mediaMetadata.title, m.mediaMetadata.artist);
                  scale = 1f;
                  zoom();
                }
                @Override public void onIsPlayingChanged(boolean p) {
                  ring.setActive(p);
                  vizOn(p);
                }
                @Override public void onAudioSessionIdChanged(int sid) { attachViz(sid); }
              });

              final ScaleGestureDetector sg = new ScaleGestureDetector(this,
                  new ScaleGestureDetector.SimpleOnScaleGestureListener() {
                    @Override public boolean onScale(ScaleGestureDetector d) {
                      scale = Math.max(1f, Math.min(5f, scale * d.getScaleFactor()));
                      zoom();
                      return true;
                    }
                  });
              pv.setOnTouchListener((v, e) -> {
                sg.onTouchEvent(e);
                if (e.getPointerCount() > 1 || sg.isInProgress()) { lx = -1; return true; }
                if (scale > 1f) {
                  boolean mv = e.getActionMasked() == MotionEvent.ACTION_MOVE;
                  if (mv && lx >= 0) { tx += e.getX() - lx; ty += e.getY() - ly; zoom(); }
                  lx = e.getX(); ly = e.getY();
                  return mv;
                }
                return false;
              });

              String[] names = {"\u2190", "Audio", "Subs", "+Sub", "Zoom", "BG"};
              Runnable[] acts = {
                  this::closePlayer,
                  () -> tracks(C.TRACK_TYPE_AUDIO),
                  () -> tracks(C.TRACK_TYPE_TEXT),
                  () -> pick(2),
                  this::fit,
                  this::background
              };
              LinearLayout row = findViewById(R.id.row);
              for (int i = 0; i < names.length; i++) {
                Button btn = new Button(this, null, android.R.attr.borderlessButtonStyle);
                btn.setText(names[i]);
                btn.setTextColor(Color.WHITE);
                final Runnable r = acts[i];
                btn.setOnClickListener(v -> r.run());
                row.addView(btn);
              }

              list.setAdapter(ad);
              list.setOnItemClickListener((a, v, i, l) -> play(tab == 0 ? vids : auds, i));
              tabV.setOnClickListener(v -> { setTab(0); list.setSelection(0); });
              tabA.setOnClickListener(v -> { setTab(1); list.setSelection(0); });
              empty.setOnClickListener(v -> askStorage());
              findViewById(R.id.browse).setOnClickListener(v -> pick(1));
              findViewById(R.id.about).setOnClickListener(v -> about());

              setTab(0);
              if (!hasStorage()) askStorage();
              handle(getIntent());
            }

            @Override protected void onNewIntent(Intent i) { super.onNewIntent(i); handle(i); }

            int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density + .5f); }

            boolean granted(String p) {
              return ContextCompat.checkSelfPermission(this, p) == PackageManager.PERMISSION_GRANTED;
            }

            boolean hasStorage() {
              return Build.VERSION.SDK_INT >= 33
                  ? granted(Manifest.permission.READ_MEDIA_AUDIO) && granted(Manifest.permission.READ_MEDIA_VIDEO)
                  : granted(Manifest.permission.READ_EXTERNAL_STORAGE);
            }

            void askStorage() {
              ActivityCompat.requestPermissions(this, Build.VERSION.SDK_INT >= 33
                  ? new String[] {Manifest.permission.READ_MEDIA_AUDIO,
                      Manifest.permission.READ_MEDIA_VIDEO, Manifest.permission.POST_NOTIFICATIONS}
                  : new String[] {Manifest.permission.READ_EXTERNAL_STORAGE}, 1);
            }

            @Override public void onRequestPermissionsResult(int rc, String[] p, int[] r) {
              super.onRequestPermissionsResult(rc, p, r);
              if (rc == 1) scan();
              if (rc == 2) attachViz(player.getAudioSessionId());
            }

            void scan() {
              if (!hasStorage()) { setTab(tab); return; }
              new Thread(() -> {
                List<M> v = q(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, false);
                List<M> a = q(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, true);
                runOnUiThread(() -> { vids = v; auds = a; setTab(tab); });
              }).start();
            }

            List<M> q(Uri base, boolean audio) {
              List<M> r = new ArrayList<>();
              String[] pr = audio
                  ? new String[] {"_id", "title", "artist", "duration"}
                  : new String[] {"_id", "_display_name", "duration"};
              String sel = audio ? "is_ringtone=0 AND is_notification=0 AND is_alarm=0" : null;
              String ord = audio ? "title ASC" : "date_added DESC";
              try (Cursor c = getContentResolver().query(base, pr, sel, null, ord)) {
                while (c != null && c.moveToNext()) {
                  M m = new M();
                  m.uri = ContentUris.withAppendedId(base, c.getLong(0));
                  m.title = strip(c.getString(1));
                  String ar = audio ? c.getString(2) : null;
                  m.artist = ar == null || ar.contains("unknown") ? "" : ar;
                  m.sub = (m.artist.isEmpty() ? "" : m.artist + " \u00B7 ") + fmt(c.getLong(audio ? 3 : 2));
                  r.add(m);
                }
              } catch (Exception e) { }
              return r;
            }

            String strip(String t) {
              if (t == null) return "Unknown";
              int i = t.lastIndexOf('.');
              return i > 0 && t.length() - i <= 5 ? t.substring(0, i) : t;
            }

            String fmt(long ms) {
              long s = ms / 1000, h = s / 3600, m = s % 3600 / 60;
              return h > 0 ? String.format(Locale.US, "%d:%02d:%02d", h, m, s % 60)
                  : String.format(Locale.US, "%d:%02d", m, s % 60);
            }

            void setTab(int t) {
              tab = t;
              ((TextView) tabV).setTextColor(t == 0 ? 0xFF4FC3F7 : 0xFF8A8FA3);
              ((TextView) tabA).setTextColor(t == 1 ? 0xFF4FC3F7 : 0xFF8A8FA3);
              ad.d = t == 0 ? vids : auds;
              ad.notifyDataSetChanged();
              empty.setVisibility(ad.d.isEmpty() ? View.VISIBLE : View.GONE);
              ((TextView) empty).setText(hasStorage() ? "No media found" : "Tap to allow media access");
            }

            class Ad extends BaseAdapter {
              List<M> d = new ArrayList<>();
              public int getCount() { return d.size(); }
              public Object getItem(int i) { return d.get(i); }
              public long getItemId(int i) { return i; }
              public View getView(int i, View cv, ViewGroup p) {
                if (cv == null) {
                  LinearLayout row = new LinearLayout(MainActivity.this);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(16), dp(10), dp(16), dp(10));
                  TextView ic = new TextView(MainActivity.this);
                  ic.setId(1);
                  ic.setGravity(Gravity.CENTER);
                  ic.setTextColor(Color.WHITE);
                  ic.setTextSize(16);
                  GradientDrawable g = new GradientDrawable(
                      GradientDrawable.Orientation.TL_BR, new int[] {0xFF4FC3F7, 0xFF7C4DFF});
                  g.setShape(GradientDrawable.OVAL);
                  ic.setBackground(g);
                  row.addView(ic, new LinearLayout.LayoutParams(dp(44), dp(44)));
                  LinearLayout col = new LinearLayout(MainActivity.this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, -2, 1f);
                  lp.leftMargin = dp(14);
                  row.addView(col, lp);
                  col.addView(tv(2, 15, 0xFFFFFFFF));
                  col.addView(tv(3, 12, 0xFF8A8FA3));
                  cv = row;
                }
                M m = d.get(i);
                ((TextView) cv.findViewById(1)).setText(tab == 0 ? "\u25BA" : "\u266A");
                ((TextView) cv.findViewById(2)).setText(m.title);
                ((TextView) cv.findViewById(3)).setText(m.sub);
                return cv;
              }
            }

            TextView tv(int id, int sp, int color) {
              TextView t = new TextView(this);
              t.setId(id);
              t.setTextSize(sp);
              t.setTextColor(color);
              t.setSingleLine();
              t.setEllipsize(TextUtils.TruncateAt.END);
              return t;
            }

            void handle(Intent i) {
              if (i != null && Intent.ACTION_VIEW.equals(i.getAction()) && i.getData() != null) {
                Uri u = i.getData();
                open(Collections.singletonList(new MediaItem.Builder().setUri(u).setMediaMetadata(
                    new MediaMetadata.Builder().setTitle(strip(name(u))).build()).build()), 0);
              }
            }

            void play(List<M> l, int start) {
              List<MediaItem> it = new ArrayList<>();
              for (M m : l) {
                it.add(new MediaItem.Builder().setUri(m.uri).setMediaMetadata(new MediaMetadata.Builder()
                    .setTitle(m.title).setArtist(m.artist).build()).build());
              }
              open(it, start);
            }

            void open(List<MediaItem> it, int start) {
              player.setMediaItems(it, start, 0);
              player.prepare();
              player.play();
              libView.setVisibility(View.GONE);
              playView.setVisibility(View.VISIBLE);
            }

            void closePlayer() {
              player.stop();
              player.clearMediaItems();
              playView.setVisibility(View.GONE);
              ring.setVisibility(View.GONE);
              libView.setVisibility(View.VISIBLE);
            }

            @Override public void onBackPressed() {
              if (playView.getVisibility() == View.VISIBLE) closePlayer();
              else super.onBackPressed();
            }

            void mode(Tracks t) {
              if (t.isEmpty()) return;
              boolean audio = !t.containsType(C.TRACK_TYPE_VIDEO);
              ring.setVisibility(audio ? View.VISIBLE : View.GONE);
              pv.setControllerShowTimeoutMs(audio ? 0 : 5000);
              pv.setControllerHideOnTouch(!audio);
              pv.showController();
              if (audio && !micAsked && !granted(Manifest.permission.RECORD_AUDIO)) {
                micAsked = true;
                ActivityCompat.requestPermissions(this, new String[] {Manifest.permission.RECORD_AUDIO}, 2);
              }
            }

            void attachViz(int sid) {
              try { if (viz != null) viz.release(); } catch (Exception e) { }
              viz = null;
              ring.setSynthetic(true);
              if (sid == 0 || !granted(Manifest.permission.RECORD_AUDIO)) return;
              try {
                Visualizer v = new Visualizer(sid);
                v.setCaptureSize(Visualizer.getCaptureSizeRange()[1]);
                v.setDataCaptureListener(new Visualizer.OnDataCaptureListener() {
                  public void onWaveFormDataCapture(Visualizer x, byte[] w, int r) { }
                  public void onFftDataCapture(Visualizer x, byte[] f, int r) {
                    float s = 0;
                    for (int k = 1; k <= 4; k++) s += (float) Math.hypot(f[2 * k], f[2 * k + 1]);
                    s /= 4;
                    peak = Math.max(s, peak * 0.997f);
                    float l = Math.min(1f, s / Math.max(peak, 25f));
                    ring.setLevel(l * l);
                  }
                }, Visualizer.getMaxCaptureRate(), false, true);
                v.setEnabled(player.isPlaying());
                viz = v;
                ring.setSynthetic(false);
              } catch (Exception e) { viz = null; }
            }

            void vizOn(boolean on) {
              try { if (viz != null) viz.setEnabled(on); } catch (Exception e) { }
            }

            String name(Uri u) {
              try (Cursor c = getContentResolver().query(u, null, null, null, null)) {
                if (c != null && c.moveToFirst()) {
                  int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                  if (i >= 0 && c.getString(i) != null) return c.getString(i);
                }
              } catch (Exception e) { }
              return "media";
            }

            String mime(String n) {
              n = n.toLowerCase();
              if (n.endsWith(".vtt")) return MimeTypes.TEXT_VTT;
              if (n.endsWith(".ass") || n.endsWith(".ssa")) return MimeTypes.TEXT_SSA;
              if (n.endsWith(".ttml") || n.endsWith(".xml")) return MimeTypes.APPLICATION_TTML;
              return MimeTypes.APPLICATION_SUBRIP;
            }

            void pick(int rc) {
              Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT)
                  .addCategory(Intent.CATEGORY_OPENABLE).setType("*/*");
              if (rc == 1) i.putExtra(Intent.EXTRA_MIME_TYPES, new String[] {"video/*", "audio/*"});
              else i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
              startActivityForResult(i, rc);
            }

            @Override protected void onActivityResult(int rc, int res, Intent d) {
              super.onActivityResult(rc, res, d);
              if (res != RESULT_OK || d == null) return;
              if (rc == 1 && d.getData() != null) {
                Uri u = d.getData();
                open(Collections.singletonList(new MediaItem.Builder().setUri(u).setMediaMetadata(
                    new MediaMetadata.Builder().setTitle(strip(name(u))).build()).build()), 0);
              } else if (rc == 2 && player.getCurrentMediaItem() != null) {
                List<Uri> us = new ArrayList<>();
                if (d.getClipData() != null) {
                  for (int i = 0; i < d.getClipData().getItemCount(); i++)
                    us.add(d.getClipData().getItemAt(i).getUri());
                } else if (d.getData() != null) {
                  us.add(d.getData());
                }
                MediaItem cur = player.getCurrentMediaItem();
                List<MediaItem.SubtitleConfiguration> l = new ArrayList<>();
                if (cur.localConfiguration != null) l.addAll(cur.localConfiguration.subtitleConfigurations);
                boolean first = l.isEmpty();
                for (int k = 0; k < us.size(); k++) {
                  String n = name(us.get(k));
                  l.add(new MediaItem.SubtitleConfiguration.Builder(us.get(k))
                      .setMimeType(mime(n)).setLabel(n)
                      .setSelectionFlags(first && k == 0 ? C.SELECTION_FLAG_DEFAULT : 0).build());
                }
                int idx = player.getCurrentMediaItemIndex();
                long pos = player.getCurrentPosition();
                player.replaceMediaItem(idx, cur.buildUpon().setSubtitleConfigurations(l).build());
                player.seekTo(idx, pos);
              }
            }

            void tracks(int type) {
              if (!player.getCurrentTracks().containsType(type)) {
                Toast.makeText(this, "No tracks", Toast.LENGTH_SHORT).show();
                return;
              }
              new TrackSelectionDialogBuilder(this,
                  type == C.TRACK_TYPE_AUDIO ? "Audio" : "Subtitles", player, type)
                  .setShowDisableOption(type == C.TRACK_TYPE_TEXT)
                  .build().show();
            }

            void fit() {
              mode = (mode + 1) % 3;
              scale = 1f;
              zoom();
              int[] m = {AspectRatioFrameLayout.RESIZE_MODE_FIT,
                  AspectRatioFrameLayout.RESIZE_MODE_ZOOM, AspectRatioFrameLayout.RESIZE_MODE_FILL};
              pv.setResizeMode(m[mode]);
            }

            void zoom() {
              float mx = (scale - 1f) * content.getWidth() / 2f;
              float my = (scale - 1f) * content.getHeight() / 2f;
              tx = Math.max(-mx, Math.min(mx, tx));
              ty = Math.max(-my, Math.min(my, ty));
              content.setScaleX(scale);
              content.setScaleY(scale);
              content.setTranslationX(tx);
              content.setTranslationY(ty);
            }

            void background() {
              bg = true;
              ContextCompat.startForegroundService(this, new Intent(this, PlayService.class));
              moveTaskToBack(true);
            }

            void about() {
              new AlertDialog.Builder(this)
                  .setTitle("Awal Player")
                  .setMessage("Creator: Mohammod Abdul Awal\n"
                      + "Student: Department of English, National University\n"
                      + "Mail: awal.sorkar.144@gmail.com")
                  .setPositiveButton("OK", null)
                  .show();
            }

            @Override protected void onStart() {
              super.onStart();
              bg = false;
              stopService(new Intent(this, PlayService.class));
              vizOn(player.isPlaying());
              if (hasStorage()) scan();
            }

            @Override protected void onStop() {
              super.onStop();
              vizOn(false);
              if (!bg) player.pause();
            }

            @Override protected void onDestroy() {
              super.onDestroy();
              try { if (viz != null) viz.release(); } catch (Exception e) { }
              player.release();
              stopService(new Intent(this, PlayService.class));
            }
          }
