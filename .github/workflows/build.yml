name: Build Awal Launcher APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/awal/launcher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p gradle/wrapper

      - name: settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AwalLauncher"
          include ':app'
          EOF

      - name: root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.2' apply false
          }
          EOF

      - name: gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=false
          EOF

      - name: gradle wrapper props
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Download gradle wrapper jar
        run: curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar

      - name: gradlew
        run: |
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          APP_HOME=`pwd -P`
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec "$JAVA_HOME/bin/java" -Xmx64m -Xms64m -Dorg.gradle.appname="gradlew" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x gradlew

      - name: app build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.awal.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.awal.launcher"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { debug { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          EOF

      - name: device_admin.xml
        run: |
          cat > app/src/main/res/xml/device_admin.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies><force-lock/></uses-policies>
          </device-admin>
          EOF

      - name: AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES"/>
              <uses-feature android:name="android.hardware.location.gps" android:required="false"/>
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false"/>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Awal Launcher"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:launchMode="singleTask" android:screenOrientation="portrait"
                      android:stateNotNeeded="true">
                      <intent-filter android:priority="1">
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".PatternLockActivity" android:exported="false" android:theme="@style/AppTheme"/>
                  <activity android:name=".PatternSetupActivity" android:exported="false" android:theme="@style/AppTheme"/>
                  <activity android:name=".SpeedometerActivity" android:exported="false" android:theme="@style/AppTheme"/>
                  <activity android:name=".CompassActivity" android:exported="false" android:theme="@style/AppTheme"/>
                  <activity android:name=".DockManagerActivity" android:exported="false" android:theme="@style/AppTheme"/>
                  <receiver android:name=".AdminReceiver" android:exported="true"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin"/>
                      <intent-filter><action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/></intent-filter>
                  </receiver>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="text_white">#FFFFFFFF</color>
              <color name="text_dim">#CCFFFFFF</color>
              <color name="accent_blue">#4FC3F7</color>
              <color name="bg_dark">#CC000015</color>
          </resources>
          EOF

      - name: strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Awal Launcher</string></resources>
          EOF

      - name: styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:colorBackgroundCacheHint">@null</item>
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:windowTranslucentNavigation">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: drawables
        run: |
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1565C0" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#90CAF9" android:pathData="M54,20C35.2,20 20,35.2 20,54s15.2,34 34,34 34,-15.2 34,-34S72.8,20 54,20z"/>
              <path android:fillColor="#1565C0" android:pathData="M54,34C42.9,34 34,42.9 34,54s8.9,20 20,20 20,-8.9 20,-20S65.1,34 54,34z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,44C48.5,44 44,48.5 44,54s4.5,10 10,10 10,-4.5 10,-10S59.5,44 54,44z"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/glass_card.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#2AFFFFFF"/>
              <stroke android:width="1dp" android:color="#55FFFFFF"/>
              <corners android:radius="20dp"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/glass_circle.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#33FFFFFF"/>
              <stroke android:width="1dp" android:color="#66FFFFFF"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/dock_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#44FFFFFF"/>
              <stroke android:width="1dp" android:color="#66FFFFFF"/>
              <corners android:radius="32dp"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/red_circle.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#FFEF5350"/>
          </shape>
          EOF

      - name: layouts
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/rootLayout"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="@color/bg_dark">
              <LinearLayout android:id="@+id/statusBar"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:paddingTop="44dp" android:paddingHorizontal="20dp" android:paddingBottom="4dp">
                  <TextView android:id="@+id/statusTime"
                      android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                      android:textColor="@color/text_white" android:textSize="14sp" android:fontFamily="sans-serif-medium" android:text="12:00"/>
                  <TextView android:id="@+id/statusDate"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/text_dim" android:textSize="13sp" android:text="Mon, Jan 1"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/clockPanel"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_below="@id/statusBar"
                  android:orientation="vertical" android:paddingHorizontal="20dp" android:paddingBottom="8dp">
                  <TextView android:id="@+id/bigClock"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/text_white" android:textSize="72sp"
                      android:fontFamily="sans-serif-thin" android:text="12:00" android:letterSpacing="-0.05"/>
                  <TextView android:id="@+id/fullDate"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/text_dim" android:textSize="15sp" android:text="Monday, January 1"/>
              </LinearLayout>
              <HorizontalScrollView android:id="@+id/widgetScroll"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_below="@id/clockPanel"
                  android:scrollbars="none" android:paddingHorizontal="12dp" android:paddingBottom="8dp">
                  <LinearLayout android:id="@+id/widgetRow"
                      android:layout_width="wrap_content" android:layout_height="130dp"
                      android:orientation="horizontal" android:gravity="center_vertical"/>
              </HorizontalScrollView>
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/appGrid"
                  android:layout_width="match_parent" android:layout_height="match_parent"
                  android:layout_below="@id/widgetScroll" android:layout_above="@id/dockArea"
                  android:padding="4dp" android:clipToPadding="false"/>
              <LinearLayout android:id="@+id/dockArea"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:orientation="vertical" android:paddingBottom="20dp" android:paddingHorizontal="16dp">
                  <LinearLayout android:id="@+id/dockRow"
                      android:layout_width="match_parent" android:layout_height="80dp"
                      android:orientation="horizontal" android:gravity="center"
                      android:background="@drawable/dock_bg" android:padding="8dp"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="52dp"
                      android:orientation="horizontal" android:gravity="center" android:layout_marginTop="8dp">
                      <TextView android:id="@+id/powerBtn"
                          android:layout_width="52dp" android:layout_height="52dp"
                          android:gravity="center" android:text="⏻" android:textSize="22sp"
                          android:textColor="@color/text_white" android:background="@drawable/glass_circle"/>
                  </LinearLayout>
              </LinearLayout>
          </RelativeLayout>
          EOF

          cat > app/src/main/res/layout/item_app.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content" android:layout_height="wrap_content"
              android:orientation="vertical" android:gravity="center" android:padding="6dp">
              <FrameLayout android:layout_width="56dp" android:layout_height="56dp">
                  <ImageView android:id="@+id/appIcon"
                      android:layout_width="52dp" android:layout_height="52dp"
                      android:layout_gravity="center" android:scaleType="fitCenter"/>
                  <TextView android:id="@+id/deleteBadge"
                      android:layout_width="20dp" android:layout_height="20dp"
                      android:layout_gravity="top|start"
                      android:gravity="center" android:text="✕"
                      android:textColor="#FFFFFFFF" android:textSize="11sp"
                      android:background="@drawable/red_circle"
                      android:visibility="gone"/>
                  <ImageView android:id="@+id/lockBadge"
                      android:layout_width="18dp" android:layout_height="18dp"
                      android:layout_gravity="bottom|end" android:visibility="gone"/>
              </FrameLayout>
              <TextView android:id="@+id/appName"
                  android:layout_width="68dp" android:layout_height="wrap_content"
                  android:gravity="center" android:textColor="#FFFFFFFF"
                  android:textSize="10sp" android:maxLines="1" android:ellipsize="end"
                  android:layout_marginTop="3dp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_pattern.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:gravity="center"
              android:background="@color/bg_dark" android:padding="32dp">
              <ImageView android:id="@+id/appIconBig"
                  android:layout_width="72dp" android:layout_height="72dp"
                  android:scaleType="fitCenter" android:layout_marginBottom="12dp"/>
              <TextView android:id="@+id/patternTitle"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textColor="#FFFFFFFF" android:textSize="20sp"
                  android:text="Draw Pattern" android:layout_marginBottom="8dp"/>
              <TextView android:id="@+id/patternMsg"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textColor="#CCFFFFFF" android:textSize="14sp" android:layout_marginBottom="24dp"/>
              <com.awal.launcher.PatternView
                  android:id="@+id/patternView"
                  android:layout_width="280dp" android:layout_height="280dp"/>
              <TextView android:id="@+id/btnCancel"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="Cancel" android:textColor="@color/accent_blue"
                  android:textSize="16sp" android:padding="16dp" android:layout_marginTop="16dp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_speedometer.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:gravity="center"
              android:background="#FF000015" android:padding="24dp">
              <TextView android:id="@+id/speedValue"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="0" android:textSize="96sp"
                  android:textColor="#FFFFFFFF" android:fontFamily="sans-serif-thin"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="km/h" android:textSize="24sp" android:textColor="#CC4FC3F7"/>
              <TextView android:id="@+id/maxSpeed"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="Max: 0 km/h" android:textSize="16sp"
                  android:textColor="#CCFFFFFF" android:layout_marginTop="16dp"/>
              <TextView android:id="@+id/gpsStatus"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="Waiting for GPS..." android:textSize="13sp"
                  android:textColor="#88FFFFFF" android:layout_marginTop="8dp"/>
              <TextView android:id="@+id/btnReset"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="Reset Max" android:textColor="#FF4FC3F7"
                  android:textSize="16sp" android:padding="16dp" android:layout_marginTop="24dp"
                  android:background="@drawable/glass_card"/>
              <TextView android:id="@+id/btnBack"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="← Back" android:textColor="#CCFFFFFF"
                  android:textSize="14sp" android:padding="12dp" android:layout_marginTop="8dp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_compass.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:gravity="center"
              android:background="#FF000015" android:padding="24dp">
              <TextView android:id="@+id/compassDirection"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="N" android:textSize="72sp"
                  android:textColor="#FF4FC3F7" android:fontFamily="sans-serif-thin"/>
              <com.awal.launcher.CompassView
                  android:id="@+id/compassView"
                  android:layout_width="280dp" android:layout_height="280dp"
                  android:layout_marginTop="8dp"/>
              <TextView android:id="@+id/compassDegree"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="0°" android:textSize="28sp"
                  android:textColor="#CCFFFFFF" android:layout_marginTop="8dp"/>
              <TextView android:id="@+id/btnBack"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="← Back" android:textColor="#CCFFFFFF"
                  android:textSize="14sp" android:padding="16dp" android:layout_marginTop="16dp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_dock_manager.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#EE000015">
              <LinearLayout android:layout_width="match_parent" android:layout_height="56dp"
                  android:orientation="horizontal" android:gravity="center_vertical"
                  android:paddingHorizontal="16dp" android:paddingTop="8dp">
                  <TextView android:id="@+id/btnDockBack"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="← " android:textColor="#FF4FC3F7" android:textSize="20sp" android:padding="8dp"/>
                  <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                      android:text="Manage Dock" android:textColor="#FFFFFFFF" android:textSize="18sp"/>
              </LinearLayout>
              <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="Current Dock Apps (tap to remove):"
                  android:textColor="#CCFFFFFF" android:textSize="13sp"
                  android:paddingHorizontal="16dp" android:paddingVertical="8dp"/>
              <LinearLayout android:id="@+id/currentDockView"
                  android:layout_width="match_parent" android:layout_height="80dp"
                  android:orientation="horizontal" android:background="#33FFFFFF"
                  android:gravity="center" android:paddingHorizontal="8dp"/>
              <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="All Apps (tap to add to dock):"
                  android:textColor="#CCFFFFFF" android:textSize="13sp"
                  android:paddingHorizontal="16dp" android:paddingTop="16dp" android:paddingBottom="8dp"/>
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/allAppsForDock"
                  android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"
                  android:padding="4dp" android:clipToPadding="false"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/item_dock_app.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content" android:layout_height="wrap_content"
              android:orientation="vertical" android:gravity="center" android:padding="8dp">
              <ImageView android:id="@+id/dockIcon"
                  android:layout_width="48dp" android:layout_height="48dp"
                  android:scaleType="fitCenter"/>
              <TextView android:id="@+id/dockName"
                  android:layout_width="64dp" android:layout_height="wrap_content"
                  android:gravity="center" android:textColor="#FFFFFFFF"
                  android:textSize="10sp" android:maxLines="1" android:ellipsize="end"
                  android:layout_marginTop="2dp"/>
          </LinearLayout>
          EOF

      - name: Java sources
        run: |
          cat > app/src/main/java/com/awal/launcher/AppInfo.java << 'EOF'
          package com.awal.launcher;
          import android.graphics.drawable.Drawable;
          public class AppInfo {
              public String label,packageName;
              public Drawable icon;
              public int launchCount;
              public boolean patternLocked;
              public AppInfo(String l,String p,Drawable i,int c,boolean lk){label=l;packageName=p;icon=i;launchCount=c;patternLocked=lk;}
          }
          EOF

          cat > app/src/main/java/com/awal/launcher/AdminReceiver.java << 'EOF'
          package com.awal.launcher;
          import android.app.admin.DeviceAdminReceiver;
          import android.content.Context;
          import android.content.Intent;
          public class AdminReceiver extends DeviceAdminReceiver {
              @Override public void onEnabled(Context c,Intent i){}
              @Override public void onDisabled(Context c,Intent i){}
          }
          EOF

          cat > app/src/main/java/com/awal/launcher/BootReceiver.java << 'EOF'
          package com.awal.launcher;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          public class BootReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context c,Intent i){
                  if(Intent.ACTION_BOOT_COMPLETED.equals(i.getAction())){
                      Intent it=new Intent(c,MainActivity.class);it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);c.startActivity(it);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/awal/launcher/WeatherData.java << 'EOF'
          package com.awal.launcher;
          public class WeatherData {
              public String day,condition,icon;
              public int tempHigh,tempLow;
              public WeatherData(String d,String c,int h,int l,String i){day=d;condition=c;tempHigh=h;tempLow=l;icon=i;}
          }
          EOF

      - name: WeatherManager.java
        run: |
          cat > app/src/main/java/com/awal/launcher/WeatherManager.java << 'EOF'
          package com.awal.launcher;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Handler;
          import android.os.Looper;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          public class WeatherManager {
              private static final String PREFS="wp",KEY="wj",LAST="wl";
              private static final long GAP=24*60*60*1000L;
              private Context ctx;
              private ExecutorService exec=Executors.newSingleThreadExecutor();
              public interface Callback{void onWeather(List<WeatherData> d);}
              public WeatherManager(Context c){ctx=c;}
              public void get(String loc,Callback cb){
                  SharedPreferences p=ctx.getSharedPreferences(PREFS,Context.MODE_PRIVATE);
                  String cached=p.getString(KEY,null);
                  if(cached!=null&&System.currentTimeMillis()-p.getLong(LAST,0)<GAP){cb.onWeather(parse(cached));return;}
                  exec.execute(()->{
                      try{
                          URL url=new URL("https://wttr.in/"+loc.replace(" ","+")+"?format=j1");
                          HttpURLConnection c=(HttpURLConnection)url.openConnection();
                          c.setConnectTimeout(5000);c.setReadTimeout(5000);
                          BufferedReader br=new BufferedReader(new InputStreamReader(c.getInputStream()));
                          StringBuilder sb=new StringBuilder();String ln;
                          while((ln=br.readLine())!=null)sb.append(ln);
                          String json=sb.toString();
                          p.edit().putString(KEY,json).putLong(LAST,System.currentTimeMillis()).apply();
                          List<WeatherData> list=parse(json);
                          new Handler(Looper.getMainLooper()).post(()->cb.onWeather(list));
                      }catch(Exception e){
                          if(cached!=null)new Handler(Looper.getMainLooper()).post(()->cb.onWeather(parse(cached)));
                          else new Handler(Looper.getMainLooper()).post(()->cb.onWeather(fallback()));
                      }
                  });
              }
              private List<WeatherData> parse(String json){
                  List<WeatherData> list=new ArrayList<>();
                  try{
                      JSONArray days=new JSONObject(json).getJSONArray("weather");
                      String[] names={"Today","Tomorrow","Day 3","Day 4","Day 5","Day 6","Day 7"};
                      for(int i=0;i<Math.min(7,days.length());i++){
                          JSONObject d=days.getJSONObject(i);
                          int hi=Integer.parseInt(d.getString("maxtempC"));
                          int lo=Integer.parseInt(d.getString("mintempC"));
                          JSONArray h=d.getJSONArray("hourly");
                          String desc=h.getJSONObject(4).getJSONArray("weatherDesc").getJSONObject(0).getString("value");
                          int code=Integer.parseInt(h.getJSONObject(4).getString("weatherCode"));
                          list.add(new WeatherData(names[i],desc,hi,lo,ic(code)));
                      }
                  }catch(Exception e){return fallback();}
                  return list;
              }
              private String ic(int c){
                  if(c>=200&&c<300)return"⛈";if(c>=300&&c<400)return"🌦";
                  if(c>=500&&c<600)return"🌧";if(c>=600&&c<700)return"❄";
                  if(c==800)return"☀";if(c>800)return"⛅";return"🌤";
              }
              private List<WeatherData> fallback(){
                  List<WeatherData> l=new ArrayList<>();
                  for(String d:new String[]{"Today","Tomorrow","Day 3","Day 4","Day 5","Day 6","Day 7"})
                      l.add(new WeatherData(d,"--",0,0,"🌤"));
                  return l;
              }
          }
          EOF

