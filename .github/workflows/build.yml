name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
      - name: Create project
        run: |
          mkdir -p app app/src/main app/src/main/java/com/awal/player app/src/main/res/drawable app/src/main/res/layout gradle/wrapper
          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'AwalPlayer'
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.awal.player'
            compileSdk 34
            defaultConfig {
              applicationId 'com.awal.player'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
          }
          dependencies {
            implementation 'androidx.media3:media3-exoplayer:1.2.1'
            implementation 'androidx.media3:media3-ui:1.2.1'
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            <application
              android:label="Awal Player"
              android:icon="@drawable/ic_launcher"
              android:allowBackup="false"
              android:theme="@style/Theme.AppCompat.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTop"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <data android:mimeType="video/*"/>
                  <data android:mimeType="audio/*"/>
                </intent-filter>
              </activity>
              <service
                android:name=".PlayService"
                android:exported="false"
                android:foregroundServiceType="mediaPlayback"/>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#000000">
            <androidx.media3.ui.PlayerView
              android:id="@+id/pv"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              app:surface_type="texture_view"/>
            <HorizontalScrollView
              android:id="@+id/bar"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="#99000000"
              android:scrollbars="none">
              <LinearLayout
                android:id="@+id/row"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:orientation="horizontal"/>
            </HorizontalScrollView>
          </FrameLayout>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="96dp" android:height="96dp"
            android:viewportWidth="96" android:viewportHeight="96">
            <path android:fillColor="#1565C0" android:pathData="M48,4a44,44 0 1,0 0,88a44,44 0 1,0 0,-88z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M38,28L38,68L70,48z"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_stat.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp" android:height="24dp"
            android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M8,5v14l11,-7z"/>
          </vector>
          EOF
          cat > app/src/main/java/com/awal/player/PlayService.java << 'EOF'
          package com.awal.player;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import androidx.core.app.NotificationCompat;

          public class PlayService extends Service {
            @Override public IBinder onBind(Intent i) { return null; }

            @Override public int onStartCommand(Intent i, int flags, int id) {
              if (Build.VERSION.SDK_INT >= 26) {
                getSystemService(NotificationManager.class).createNotificationChannel(
                    new NotificationChannel("bg", "Playback", NotificationManager.IMPORTANCE_LOW));
              }
              PendingIntent pi = PendingIntent.getActivity(this, 0,
                  new Intent(this, MainActivity.class)
                      .addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NEW_TASK),
                  PendingIntent.FLAG_IMMUTABLE);
              Notification n = new NotificationCompat.Builder(this, "bg")
                  .setSmallIcon(R.drawable.ic_stat)
                  .setContentTitle("Awal Player")
                  .setContentText("Playing in background")
                  .setContentIntent(pi)
                  .setOngoing(true)
                  .build();
              if (Build.VERSION.SDK_INT >= 29) {
                startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
              } else {
                startForeground(1, n);
              }
              return START_NOT_STICKY;
            }
          }
          EOF
          cat > app/src/main/java/com/awal/player/MainActivity.java << 'EOF'
          package com.awal.player;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.view.MotionEvent;
          import android.view.ScaleGestureDetector;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          import androidx.appcompat.app.AlertDialog;
          import androidx.core.content.ContextCompat;
          import androidx.media3.common.AudioAttributes;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MimeTypes;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.AspectRatioFrameLayout;
          import androidx.media3.ui.PlayerView;
          import androidx.media3.ui.TrackSelectionDialogBuilder;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
            ExoPlayer player;
            PlayerView pv;
            View bar, content;
            Uri video;
            List<Uri> subs = new ArrayList<>();
            boolean bg;
            int mode;
            float scale = 1f, tx, ty, lx = -1, ly;

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              setContentView(R.layout.activity_main);
              pv = findViewById(R.id.pv);
              bar = findViewById(R.id.bar);
              player = new ExoPlayer.Builder(this).build();
              player.setAudioAttributes(new AudioAttributes.Builder()
                  .setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MOVIE).build(), true);
              player.setHandleAudioBecomingNoisy(true);
              player.setWakeMode(C.WAKE_MODE_LOCAL);
              pv.setPlayer(player);
              int id = getResources().getIdentifier("exo_content_frame", "id", getPackageName());
              content = id != 0 ? pv.findViewById(id) : pv;
              pv.setControllerVisibilityListener(
                  (PlayerView.ControllerVisibilityListener) v -> bar.setVisibility(v));

              final ScaleGestureDetector sg = new ScaleGestureDetector(this,
                  new ScaleGestureDetector.SimpleOnScaleGestureListener() {
                    @Override public boolean onScale(ScaleGestureDetector d) {
                      scale = Math.max(1f, Math.min(5f, scale * d.getScaleFactor()));
                      zoom();
                      return true;
                    }
                  });
              pv.setOnTouchListener((v, e) -> {
                sg.onTouchEvent(e);
                if (e.getPointerCount() > 1 || sg.isInProgress()) { lx = -1; return true; }
                if (scale > 1f) {
                  boolean mv = e.getActionMasked() == MotionEvent.ACTION_MOVE;
                  if (mv && lx >= 0) { tx += e.getX() - lx; ty += e.getY() - ly; zoom(); }
                  lx = e.getX(); ly = e.getY();
                  return mv;
                }
                return false;
              });

              String[] names = {"Open", "Audio", "Subs", "+Sub", "Zoom", "BG", "About"};
              Runnable[] acts = {
                  () -> pick(1),
                  () -> tracks(C.TRACK_TYPE_AUDIO),
                  () -> tracks(C.TRACK_TYPE_TEXT),
                  () -> { if (video != null) pick(2); },
                  this::fit,
                  this::background,
                  this::about
              };
              LinearLayout row = findViewById(R.id.row);
              for (int i = 0; i < names.length; i++) {
                Button btn = new Button(this, null, android.R.attr.borderlessButtonStyle);
                btn.setText(names[i]);
                btn.setTextColor(Color.WHITE);
                final Runnable r = acts[i];
                btn.setOnClickListener(v -> r.run());
                row.addView(btn);
              }

              if (Build.VERSION.SDK_INT >= 33) {
                requestPermissions(new String[] {Manifest.permission.POST_NOTIFICATIONS}, 0);
              }
              handle(getIntent());
            }

            @Override protected void onNewIntent(Intent i) { super.onNewIntent(i); handle(i); }

            void handle(Intent i) {
              if (i != null && Intent.ACTION_VIEW.equals(i.getAction()) && i.getData() != null) {
                video = i.getData();
                subs.clear();
                load(0);
              }
            }

            void load(long pos) {
              List<MediaItem.SubtitleConfiguration> l = new ArrayList<>();
              for (int k = 0; k < subs.size(); k++) {
                Uri s = subs.get(k);
                String n = name(s);
                l.add(new MediaItem.SubtitleConfiguration.Builder(s)
                    .setMimeType(mime(n)).setLabel(n)
                    .setSelectionFlags(k == 0 ? C.SELECTION_FLAG_DEFAULT : 0).build());
              }
              player.setMediaItem(new MediaItem.Builder().setUri(video).setSubtitleConfigurations(l).build(), pos);
              player.prepare();
              player.play();
            }

            String name(Uri u) {
              try (Cursor c = getContentResolver().query(u, null, null, null, null)) {
                if (c != null && c.moveToFirst()) {
                  int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                  if (i >= 0 && c.getString(i) != null) return c.getString(i);
                }
              } catch (Exception e) { }
              return "subtitle";
            }

            String mime(String n) {
              n = n.toLowerCase();
              if (n.endsWith(".vtt")) return MimeTypes.TEXT_VTT;
              if (n.endsWith(".ass") || n.endsWith(".ssa")) return MimeTypes.TEXT_SSA;
              if (n.endsWith(".ttml") || n.endsWith(".xml")) return MimeTypes.APPLICATION_TTML;
              return MimeTypes.APPLICATION_SUBRIP;
            }

            void pick(int rc) {
              Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT)
                  .addCategory(Intent.CATEGORY_OPENABLE).setType("*/*");
              if (rc == 1) i.putExtra(Intent.EXTRA_MIME_TYPES, new String[] {"video/*", "audio/*"});
              else i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
              startActivityForResult(i, rc);
            }

            @Override protected void onActivityResult(int rc, int res, Intent d) {
              super.onActivityResult(rc, res, d);
              if (res != RESULT_OK || d == null) return;
              if (rc == 1 && d.getData() != null) {
                video = d.getData();
                subs.clear();
                load(0);
              } else if (rc == 2 && video != null) {
                if (d.getClipData() != null) {
                  for (int i = 0; i < d.getClipData().getItemCount(); i++)
                    subs.add(d.getClipData().getItemAt(i).getUri());
                } else if (d.getData() != null) {
                  subs.add(d.getData());
                }
                load(player.getCurrentPosition());
              }
            }

            void tracks(int type) {
              if (!player.getCurrentTracks().containsType(type)) {
                Toast.makeText(this, "No tracks", Toast.LENGTH_SHORT).show();
                return;
              }
              new TrackSelectionDialogBuilder(this,
                  type == C.TRACK_TYPE_AUDIO ? "Audio" : "Subtitles", player, type)
                  .setShowDisableOption(type == C.TRACK_TYPE_TEXT)
                  .build().show();
            }

            void fit() {
              mode = (mode + 1) % 3;
              scale = 1f;
              zoom();
              int[] m = {AspectRatioFrameLayout.RESIZE_MODE_FIT,
                  AspectRatioFrameLayout.RESIZE_MODE_ZOOM, AspectRatioFrameLayout.RESIZE_MODE_FILL};
              pv.setResizeMode(m[mode]);
            }

            void zoom() {
              float mx = (scale - 1f) * content.getWidth() / 2f;
              float my = (scale - 1f) * content.getHeight() / 2f;
              tx = Math.max(-mx, Math.min(mx, tx));
              ty = Math.max(-my, Math.min(my, ty));
              content.setScaleX(scale);
              content.setScaleY(scale);
              content.setTranslationX(tx);
              content.setTranslationY(ty);
            }

            void background() {
              bg = true;
              ContextCompat.startForegroundService(this, new Intent(this, PlayService.class));
              moveTaskToBack(true);
            }

            void about() {
              new AlertDialog.Builder(this)
                  .setTitle("Awal Player")
                  .setMessage("Creator: Mohammod Abdul Awal\n"
                      + "Student: Department of English, National University\n"
                      + "Mail: awal.sorkar.144@gmail.com")
                  .setPositiveButton("OK", null)
                  .show();
            }

            @Override protected void onStart() {
              super.onStart();
              bg = false;
              stopService(new Intent(this, PlayService.class));
            }

            @Override protected void onStop() {
              super.onStop();
              if (!bg) player.pause();
            }

            @Override protected void onDestroy() {
              super.onDestroy();
              player.release();
              stopService(new Intent(this, PlayService.class));
            }
          }
          EOF
      - name: Gradle wrapper
        run: |
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat > gradlew << 'EOF'
          #!/bin/sh
          D=$(cd "$(dirname "$0")" && pwd)
          exec java -classpath "$D/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew
      - name: Build
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AwalPlayer-apk
          path: app/build/outputs/apk/debug/*.apk
