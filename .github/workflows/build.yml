     """;
     final Cb rdy;GLR(Cb c){rdy=c;}
     int oes,pO,p2,W,H;SurfaceTexture st;final float[] stm=new float[16],m=new float[16];
     volatile int fi,bw=1440,bh=1080,rot=90,ri,sy,ts,pad,gap;
     volatile float wb,scroll;
     volatile boolean front,mir=true,dro,strip,paused,nf;
     volatile EGLSurface rs;EGLDisplay ed;EGLContext ec;int rw,rh;
     final FloatBuffer q=ByteBuffer.allocateDirect(32).order(ByteOrder.nativeOrder()).asFloatBuffer();
     static int sh(int t,String s){int i=GLES20.glCreateShader(t);GLES20.glShaderSource(i,s);GLES20.glCompileShader(i);Log.i("GLR",GLES20.glGetShaderInfoLog(i));return i;}
     static int prog(String f){int p=GLES20.glCreateProgram();GLES20.glAttachShader(p,sh(GLES20.GL_VERTEX_SHADER,VS));GLES20.glAttachShader(p,sh(GLES20.GL_FRAGMENT_SHADER,f));GLES20.glLinkProgram(p);return p;}
     static int L(int p,String n){return GLES20.glGetUniformLocation(p,n);}
     static void par(int t){GLES20.glTexParameteri(t,GLES20.GL_TEXTURE_MIN_FILTER,GLES20.GL_LINEAR);GLES20.glTexParameteri(t,GLES20.GL_TEXTURE_MAG_FILTER,GLES20.GL_LINEAR);GLES20.glTexParameteri(t,GLES20.GL_TEXTURE_WRAP_S,GLES20.GL_CLAMP_TO_EDGE);GLES20.glTexParameteri(t,GLES20.GL_TEXTURE_WRAP_T,GLES20.GL_CLAMP_TO_EDGE);}
     public void onSurfaceCreated(GL10 g,EGLConfig c){
     q.put(new float[]{-1,-1,1,-1,-1,1,1,1}).position(0);rs=null;Matrix.setIdentityM(stm,0);
     pO=prog(FS.replace("@X","#extension GL_OES_EGL_image_external : require").replace("@S","samplerExternalOES"));
     p2=prog(FS.replace("@X","").replace("@S","sampler2D"));
     int[] t=new int[1];GLES20.glGenTextures(1,t,0);oes=t[0];GLES20.glBindTexture(X,oes);par(X);
     st=new SurfaceTexture(oes);st.setOnFrameAvailableListener(s->nf=true);rdy.on(st);}
     public void onSurfaceChanged(GL10 g,int w,int h){W=w;H=h;}
     void mat(float a){boolean r90=rot%180!=0;float uw=r90?bh:bw,uh=r90?bw:bh,ua=uw/uh,fx=1,fy=1;if(a>ua)fy=ua/a;else fx=a/ua;
     System.arraycopy(stm,0,m,0,16);Matrix.translateM(m,0,.5f,.5f,0);Matrix.rotateM(m,0,rot,0,0,1);Matrix.scaleM(m,0,front&&mir?-fx:fx,fy,1);Matrix.translateM(m,0,-.5f,-.5f,0);}
     void draw(int p,int tg,int tx,int x,int y,int w,int h,float a,float[] f,float dr,float wv){
