import 'dart:io';
import 'package:flutter/material.dart';
import 'package:file_picker/file_picker.dart';
import 'package:hive_flutter/hive_flutter.dart';
import 'package:path/path.dart' as p;
import '../main.dart';
import 'pdf_viewer_screen.dart';
import 'docx_viewer_screen.dart';
import 'pptx_viewer_screen.dart';

class HomeScreen extends StatefulWidget {
  const HomeScreen({super.key});
  @override
  State<HomeScreen> createState() => _HomeScreenState();
}

class _HomeScreenState extends State<HomeScreen> {
  final _searchCtrl = TextEditingController();
  String _query = '';

  Future<void> _pickFile() async {
    final result = await FilePicker.platform.pickFiles(
      type: FileType.custom,
      allowedExtensions: ['pdf', 'docx', 'pptx'],
    );
    if (result != null && result.files.single.path != null) {
      _openFile(result.files.single.path!);
    }
  }

  void _openFile(String path) {
    if (!File(path).existsSync()) {
      ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('File not found or deleted.')));
      return;
    }
    final box = Hive.box('recentFiles');
    final List recents = box.get('list', defaultValue: []);
    recents.remove(path);
    recents.insert(0, path);
    if (recents.length > 100) {
      final removed = recents.removeLast();
      Hive.box('filePositions').delete(removed);
    }
    box.put('list', recents);
    setState(() {});
    final ext = p.extension(path).toLowerCase();
    Widget screen;
    if (ext == '.pdf') {
      screen = PdfViewerScreen(filePath: path);
    } else if (ext == '.docx') {
      screen = DocxViewerScreen(filePath: path);
    } else {
      screen = PptxViewerScreen(filePath: path);
    }
    Navigator.push(context, MaterialPageRoute(builder: (_) => screen));
  }

  @override
  Widget build(BuildContext context) {
    final box = Hive.box('recentFiles');
    final List recents = box.get('list', defaultValue: []);
    final filtered = _query.isEmpty
        ? recents
        : recents
            .where((f) =>
                p.basename(f.toString()).toLowerCase().contains(_query))
            .toList();
    final appState = DocReaderApp.of(context);
    return Scaffold(
      appBar: AppBar(
        title: const Text('DocReader'),
        actions: [
          IconButton(
            icon: Icon(appState?.isDark == true
                ? Icons.light_mode
                : Icons.dark_mode),
            onPressed: () => appState?.toggleTheme(),
          ),
        ],
      ),
      body: Column(
        children: [
          Padding(
            padding: const EdgeInsets.all(12),
            child: TextField(
              controller: _searchCtrl,
              decoration: InputDecoration(
                hintText: 'Search recent files...',
                prefixIcon: const Icon(Icons.search),
                border: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(12)),
                suffixIcon: _query.isNotEmpty
                    ? IconButton(
                        icon: const Icon(Icons.clear),
                        onPressed: () {
                          _searchCtrl.clear();
                          setState(() => _query = '');
                        })
                    : null,
              ),
              onChanged: (v) => setState(() => _query = v.toLowerCase()),
            ),
          ),
          Expanded(
            child: filtered.isEmpty
                ? Center(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Icon(Icons.folder_open,
                            size: 80, color: Colors.grey),
                        const SizedBox(height: 12),
                        Text('No recent files',
                            style: Theme.of(context).textTheme.titleMedium),
                        const SizedBox(height: 8),
                        const Text('Creator: Mohammod Abdul Awal\n'
                            'Dept. of English, National University\n'
                            'awal.sorkar.144@gmail.com',
                            textAlign: TextAlign.center,
                            style: TextStyle(fontSize: 12, color: Colors.grey)),
                      ],
                    ),
                  )
                : ListView.builder(
                    itemCount: filtered.length,
                    itemBuilder: (_, i) {
                      final path = filtered[i].toString();
                      final name = p.basename(path);
                      final ext = p.extension(path).toLowerCase();
                      final icon = ext == '.pdf'
                          ? Icons.picture_as_pdf
                          : ext == '.docx'
                              ? Icons.description
                              : Icons.slideshow;
                      return ListTile(
                        leading: Icon(icon, color: Colors.indigo),
                        title: Text(name,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis),
                        subtitle: Text(path,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: const TextStyle(fontSize: 11)),
                        trailing: IconButton(
                          icon: const Icon(Icons.delete_outline,
                              color: Colors.red),
                          onPressed: () {
                            final list = box.get('list', defaultValue: []);
                            list.remove(path);
                            box.put('list', list);
                            setState(() {});
                          },
                        ),
                        onTap: () => _openFile(path),
                      );
                    },
                  ),
          ),
        ],
      ),
      floatingActionButton: FloatingActionButton.extended(
        onPressed: _pickFile,
        icon: const Icon(Icons.add),
        label: const Text('Open File'),
      ),
    );
  }
}
