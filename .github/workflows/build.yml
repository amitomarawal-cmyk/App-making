      - name: PatternView.java
        run: |
          cat > app/src/main/java/com/awal/launcher/PatternView.java << 'EOF'
          package com.awal.launcher;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.util.AttributeSet;
          import android.view.MotionEvent;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;
          public class PatternView extends View {
              public interface PatternListener{void onComplete(List<Integer> p);}
              private Paint cp,lp,ap,glow;
              private List<Integer> sel=new ArrayList<>(),ord=new ArrayList<>();
              private float tx,ty;
              private boolean drawing;
              private PatternListener listener;
              private int state=0;
              private float[] cx=new float[9],cy=new float[9];
              public PatternView(Context c){super(c);init();}
              public PatternView(Context c,AttributeSet a){super(c,a);init();}
              private void init(){
                  cp=new Paint(Paint.ANTI_ALIAS_FLAG);cp.setStyle(Paint.Style.STROKE);cp.setStrokeWidth(2f);cp.setColor(0x66FFFFFF);
                  lp=new Paint(Paint.ANTI_ALIAS_FLAG);lp.setStyle(Paint.Style.STROKE);lp.setStrokeWidth(4f);lp.setColor(0xFF4FC3F7);lp.setShadowLayer(8f,0,0,0x884FC3F7);
                  ap=new Paint(Paint.ANTI_ALIAS_FLAG);ap.setStyle(Paint.Style.FILL);ap.setColor(0xFF4FC3F7);
                  glow=new Paint(Paint.ANTI_ALIAS_FLAG);glow.setStyle(Paint.Style.FILL);glow.setColor(0x334FC3F7);
                  setLayerType(LAYER_TYPE_SOFTWARE,null);
              }
              public void setListener(PatternListener l){listener=l;}
              public void setError(){state=2;lp.setColor(0xFFEF5350);lp.setShadowLayer(8f,0,0,0x88EF5350);ap.setColor(0xFFEF5350);invalidate();postDelayed(this::reset,700);}
              public void reset(){sel.clear();ord.clear();drawing=false;state=0;lp.setColor(0xFF4FC3F7);lp.setShadowLayer(8f,0,0,0x884FC3F7);ap.setColor(0xFF4FC3F7);invalidate();}
              @Override protected void onSizeChanged(int w,int h,int ow,int oh){
                  float pw=w/3f,ph=h/3f;
                  for(int i=0;i<9;i++){cx[i]=pw*(i%3)+pw/2;cy[i]=ph*(i/3)+ph/2;}
              }
              @Override protected void onDraw(Canvas c){
                  for(int i=0;i<9;i++){
                      boolean active=sel.contains(i);
                      int col=state==2?(active?0xFFEF5350:0x66FFFFFF):(active?0xFF4FC3F7:0x66FFFFFF);
                      cp.setColor(col);
                      if(active){c.drawCircle(cx[i],cy[i],36f,glow);}
                      c.drawCircle(cx[i],cy[i],28f,cp);
                      if(active)c.drawCircle(cx[i],cy[i],10f,ap);
                  }
                  Path path=new Path();
                  for(int k=0;k<ord.size();k++){int idx=ord.get(k);if(k==0)path.moveTo(cx[idx],cy[idx]);else path.lineTo(cx[idx],cy[idx]);}
                  if(drawing&&!ord.isEmpty())path.lineTo(tx,ty);
                  c.drawPath(path,lp);
              }
              @Override public boolean onTouchEvent(MotionEvent e){
                  switch(e.getAction()){
                      case MotionEvent.ACTION_DOWN:drawing=true;sel.clear();ord.clear();hit(e.getX(),e.getY());break;
                      case MotionEvent.ACTION_MOVE:tx=e.getX();ty=e.getY();hit(e.getX(),e.getY());invalidate();break;
                      case MotionEvent.ACTION_UP:drawing=false;invalidate();
                          if(listener!=null&&ord.size()>=4)listener.onComplete(new ArrayList<>(ord));
                          else{state=2;invalidate();postDelayed(this::reset,700);}break;
                  }
                  return true;
              }
              private void hit(float x,float y){
                  for(int i=0;i<9;i++)if(!sel.contains(i)&&Math.hypot(x-cx[i],y-cy[i])<38){sel.add(i);ord.add(i);invalidate();break;}
              }
          }
