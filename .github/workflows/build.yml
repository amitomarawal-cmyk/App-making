name: Build Awal Launcher APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/awal/launcher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle/wrapper

      - name: settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AwalLauncher"
          include ':app'
          EOF

      - name: root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.2' apply false
          }
          EOF

      - name: gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=false
          EOF

      - name: gradle wrapper props
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Download gradle wrapper jar
        run: |
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar

      - name: gradlew
        run: |
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          APP_HOME=`pwd -P`
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec "$JAVA_HOME/bin/java" -Xmx64m -Xms64m -Dorg.gradle.appname="gradlew" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x gradlew

      - name: app build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.awal.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.awal.launcher"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          EOF

      - name: AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Awal Launcher"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:launchMode="singleTask" android:screenOrientation="portrait"
                      android:stateNotNeeded="true">
                      <intent-filter android:priority="1">
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".PatternLockActivity" android:exported="false"
                      android:theme="@style/AppTheme"/>
                  <activity android:name=".PatternSetupActivity" android:exported="false"
                      android:theme="@style/AppTheme"/>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="glass_white">#33FFFFFF</color>
              <color name="glass_border">#55FFFFFF</color>
              <color name="text_white">#FFFFFFFF</color>
              <color name="text_dim">#CCFFFFFF</color>
              <color name="accent_blue">#4FC3F7</color>
              <color name="bg_dark">#CC000015</color>
              <color name="dock_bg">#44FFFFFF</color>
              <color name="pattern_default">#88FFFFFF</color>
              <color name="pattern_set">#FF4FC3F7</color>
              <color name="pattern_error">#FFEF5350</color>
          </resources>
          EOF

      - name: strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Awal Launcher</string>
              <string name="creator">Mohammod Abdul Awal\nDept. of English, National University\nawal.sorkar.144@gmail.com</string>
          </resources>
          EOF

      - name: styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:colorBackgroundCacheHint">@null</item>
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:windowTranslucentNavigation">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: ic_launcher drawable
        run: |
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1565C0"
                  android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#90CAF9"
                  android:pathData="M54,20C35.2,20 20,35.2 20,54s15.2,34 34,34 34,-15.2 34,-34S72.8,20 54,20z"/>
              <path android:fillColor="#1565C0"
                  android:pathData="M54,34C42.9,34 34,42.9 34,54s8.9,20 20,20 20,-8.9 20,-20S65.1,34 54,34z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M54,44C48.5,44 44,48.5 44,54s4.5,10 10,10 10,-4.5 10,-10S59.5,44 54,44z"/>
          </vector>
          EOF

      - name: glass_card drawable
        run: |
          cat > app/src/main/res/drawable/glass_card.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#2AFFFFFF"/>
              <stroke android:width="1dp" android:color="#55FFFFFF"/>
              <corners android:radius="20dp"/>
          </shape>
          EOF

      - name: glass_circle drawable
        run: |
          cat > app/src/main/res/drawable/glass_circle.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#33FFFFFF"/>
              <stroke android:width="1dp" android:color="#66FFFFFF"/>
          </shape>
          EOF

      - name: dock_bg drawable
        run: |
          cat > app/src/main/res/drawable/dock_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#44FFFFFF"/>
              <stroke android:width="1dp" android:color="#66FFFFFF"/>
              <corners android:radius="32dp"/>
          </shape>
          EOF

      - name: activity_main layout
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/rootLayout"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_dark">

              <LinearLayout
                  android:id="@+id/statusBar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:paddingTop="44dp"
                  android:paddingHorizontal="20dp"
                  android:paddingBottom="4dp">
                  <TextView android:id="@+id/statusTime"
                      android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:textColor="@color/text_white" android:textSize="14sp"
                      android:fontFamily="sans-serif-medium" android:text="12:00"/>
                  <TextView android:id="@+id/statusDate"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/text_dim" android:textSize="13sp"
                      android:text="Mon, Jan 1"/>
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/clockPanel"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_below="@id/statusBar"
                  android:orientation="vertical"
                  android:paddingHorizontal="20dp"
                  android:paddingBottom="8dp">
                  <TextView android:id="@+id/bigClock"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/text_white" android:textSize="72sp"
                      android:fontFamily="sans-serif-thin" android:text="12:00"
                      android:letterSpacing="-0.05"/>
                  <TextView android:id="@+id/fullDate"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textColor="@color/text_dim" android:textSize="15sp"
                      android:text="Monday, January 1"/>
              </LinearLayout>

              <HorizontalScrollView
                  android:id="@+id/widgetScroll"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_below="@id/clockPanel"
                  android:scrollbars="none"
                  android:paddingHorizontal="12dp"
                  android:paddingBottom="8dp">
                  <LinearLayout
                      android:id="@+id/widgetRow"
                      android:layout_width="wrap_content"
                      android:layout_height="130dp"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"/>
              </HorizontalScrollView>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/appGrid"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_below="@id/widgetScroll"
                  android:layout_above="@id/dockArea"
                  android:padding="4dp"
                  android:clipToPadding="false"/>

              <LinearLayout
                  android:id="@+id/dockArea"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:orientation="vertical"
                  android:paddingBottom="20dp"
                  android:paddingHorizontal="16dp">

                  <LinearLayout
                      android:id="@+id/dockRow"
                      android:layout_width="match_parent"
                      android:layout_height="80dp"
                      android:orientation="horizontal"
                      android:gravity="center"
                      android:background="@drawable/dock_bg"
                      android:padding="8dp"/>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="52dp"
                      android:orientation="horizontal"
                      android:gravity="center"
                      android:layout_marginTop="8dp">
                      <TextView android:id="@+id/powerBtn"
                          android:layout_width="52dp" android:layout_height="52dp"
                          android:gravity="center" android:text="⏻"
                          android:textSize="22sp" android:textColor="@color/text_white"
                          android:background="@drawable/glass_circle"/>
                  </LinearLayout>
              </LinearLayout>
          </RelativeLayout>
          EOF

      - name: item_app layout
        run: |
          cat > app/src/main/res/layout/item_app.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="6dp">
              <FrameLayout android:layout_width="56dp" android:layout_height="56dp">
                  <ImageView android:id="@+id/appIcon"
                      android:layout_width="52dp" android:layout_height="52dp"
                      android:layout_gravity="center"
                      android:scaleType="fitCenter"/>
                  <ImageView android:id="@+id/lockBadge"
                      android:layout_width="18dp" android:layout_height="18dp"
                      android:layout_gravity="bottom|end"
                      android:visibility="gone"/>
