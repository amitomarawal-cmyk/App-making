name: Build APK
on:
 push:
 workflow_dispatch:
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-java@v5
    with:
     distribution: temurin
     java-version: '17'
  - name: Licenses
    run: |
     mkdir -p $ANDROID_HOME/licenses
     echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
     echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
     echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
     echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
  - name: Project
    run: |
     mkdir -p gradle/wrapper app/src/main/java/com/awal/fusioncam app/src/main/res/drawable
     cat > settings.gradle << 'EOF'
     pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
     dependencyResolutionManagement{repositories{google();mavenCentral()}}
     rootProject.name="FusionCam"
     include ':app'
     EOF
     cat > build.gradle << 'EOF'
     plugins{id 'com.android.application' version '8.1.4' apply false}
     EOF
     cat > gradle.properties << 'EOF'
     org.gradle.jvmargs=-Xmx3g
     EOF
     cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
     distributionBase=GRADLE_USER_HOME
     distributionPath=wrapper/dists
     distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
     zipStoreBase=GRADLE_USER_HOME
     zipStorePath=wrapper/dists
     EOF
     curl -fsL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
     cat > gradlew << 'EOF'
     #!/bin/sh
     exec java -classpath "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
     EOF
     chmod +x gradlew
     cat > app/build.gradle << 'EOF'
     plugins{id 'com.android.application'}
     android{
     namespace 'com.awal.fusioncam'
     compileSdk 34
     defaultConfig{applicationId "com.awal.fusioncam";minSdk 26;targetSdk 34;versionCode 1;versionName "1.0"}
     compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}
     lint{abortOnError false}
     }
     EOF
     cat > app/src/main/AndroidManifest.xml << 'EOF'
     <?xml version="1.0" encoding="utf-8"?>
     <manifest xmlns:android="http://schemas.android.com/apk/res/android">
     <uses-permission android:name="android.permission.CAMERA"/>
     <uses-permission android:name="android.permission.RECORD_AUDIO"/>
     <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
     <uses-feature android:name="android.hardware.camera" android:required="false"/>
     <application android:label="FusionCam" android:icon="@drawable/ic_logo" android:largeHeap="true" android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen">
     <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
     <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
     </activity>
     </application>
     </manifest>
     EOF
     cat > app/src/main/res/drawable/ic_logo.xml << 'EOF'
     <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
     <path android:fillColor="#111827" android:pathData="M0,0h108v108h-108z"/>
     <path android:fillColor="#FFFFFF" android:pathData="M44,54m-26,0a26,26 0 1,1 52,0a26,26 0 1,1 -52,0"/>
     <path android:fillColor="#F59E0B" android:pathData="M64,54m-26,0a26,26 0 1,1 52,0a26,26 0 1,1 -52,0"/>
     <path android:fillColor="#111827" android:pathData="M54,54m-11,0a11,11 0 1,1 22,0a11,11 0 1,1 -22,0"/>
     </vector>
     EOF
