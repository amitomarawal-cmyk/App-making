package com.awal.pdfreader;
import android.content.Context;
import android.graphics.*;
import android.util.AttributeSet;
import android.view.MotionEvent;
import android.view.View;
import java.util.ArrayList;
import java.util.List;
public class DrawingView extends View {
    private Paint paint = new Paint();
    private Path currentPath = new Path();
    private List<Path> paths = new ArrayList<>();
    private List<Paint> paints = new ArrayList<>();
    public DrawingView(Context ctx, AttributeSet attrs) {
        super(ctx, attrs);
        paint.setColor(Color.RED);
        paint.setStrokeWidth(5f);
        paint.setStyle(Paint.Style.STROKE);
        paint.setAntiAlias(true);
        setBackgroundColor(Color.TRANSPARENT);
    }
    @Override
    protected void onDraw(Canvas canvas) {
        for (int i = 0; i < paths.size(); i++) canvas.drawPath(paths.get(i), paints.get(i));
        canvas.drawPath(currentPath, paint);
    }
    @Override
    public boolean onTouchEvent(MotionEvent e) {
        if (e.getPointerCount() > 1) return false;
        switch (e.getAction()) {
            case MotionEvent.ACTION_DOWN:
                currentPath = new Path(); currentPath.moveTo(e.getX(), e.getY()); break;
            case MotionEvent.ACTION_MOVE:
                currentPath.lineTo(e.getX(), e.getY()); break;
            case MotionEvent.ACTION_UP:
                paths.add(currentPath); paints.add(new Paint(paint)); break;
        }
        invalidate();
        return true;
    }
    public void clear() { paths.clear(); paints.clear(); currentPath = new Path(); invalidate(); }
}
