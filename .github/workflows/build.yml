              static void copy(InputStream in, File out) throws IOException {
                  OutputStream o = new FileOutputStream(out);
                  try {
                      byte[] b = new byte[65536];
                      int r;
                      while ((r = in.read(b)) > 0) o.write(b, 0, r);
                  } finally {
                      o.close();
                      in.close();
                  }
              }

              static void prune(File dir, String keep) {
                  File[] fs = dir.listFiles();
                  if (fs == null) return;
                  ArrayList<File> l = new ArrayList<>();
                  long now = System.currentTimeMillis();
                  for (File f : fs) {
                      String nm = f.getName();
                      if ((nm.endsWith(".src") || nm.endsWith(".dec")) && now - f.lastModified() > 600000L) f.delete();
                      else if (nm.endsWith(".pdf") && !nm.equals(keep + ".pdf")) l.add(f);
                  }
                  if (l.size() < 12) return;
                  Collections.sort(l, new java.util.Comparator<File>() {
                      public int compare(File a, File b) {
                          return Long.compare(a.lastModified(), b.lastModified());
                      }
                  });
                  for (int i = 0; i < l.size() - 11; i++) l.get(i).delete();
              }

              String queryName(Uri u) {
                  String n = null;
                  if ("content".equals(u.getScheme())) {
