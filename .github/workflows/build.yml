import 'package:flutter/material.dart';
import 'package:pdfx/pdfx.dart';
import 'package:hive_flutter/hive_flutter.dart';

class PdfViewerScreen extends StatefulWidget {
  final String filePath;
  const PdfViewerScreen({super.key, required this.filePath});
  @override
  State<PdfViewerScreen> createState() => _PdfViewerScreenState();
}

class _PdfViewerScreenState extends State<PdfViewerScreen> {
  PdfControllerPinch? _controller;
  int _currentPage = 1;
  int _totalPages = 0;
  bool _loading = true;
  String? _error;

  @override
  void initState() {
    super.initState();
    _initPdf();
  }

  Future<void> _initPdf() async {
    try {
      final saved = Hive.box('filePositions').get(widget.filePath);
      final initialPage = (saved is Map ? saved['page'] as int? : null) ?? 1;
      _controller = PdfControllerPinch(
        document: PdfDocument.openFile(widget.filePath),
        initialPage: initialPage,
      );
      setState(() => _loading = false);
    } catch (e) {
      setState(() {
        _error = 'Cannot open PDF: $e';
        _loading = false;
      });
    }
  }

  void _savePosition(int page) {
    Hive.box('filePositions').put(widget.filePath, {'page': page});
  }

  @override
  void dispose() {
    _controller?.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: Text(_totalPages > 0
            ? 'Page $_currentPage / $_totalPages'
            : 'PDF Viewer'),
        actions: [
          if (_controller != null)
            IconButton(
              icon: const Icon(Icons.first_page),
              onPressed: () => _controller?.jumpToPage(1),
            ),
        ],
      ),
      body: _loading
          ? const Center(child: CircularProgressIndicator())
          : _error != null
              ? Center(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Icon(Icons.error_outline,
                            size: 60, color: Colors.red),
                        const SizedBox(height: 12),
                        Text(_error!,
                            textAlign: TextAlign.center,
                            style:
                                const TextStyle(color: Colors.red)),
                      ],
                    ),
                  ),
                )
              : PdfViewPinch(
                  controller: _controller!,
                  onDocumentLoaded: (doc) =>
                      setState(() => _totalPages = doc.pagesCount),
                  onPageChanged: (page) {
                    setState(() => _currentPage = page);
                    _savePosition(page);
                  },
                ),
    );
  }
}
