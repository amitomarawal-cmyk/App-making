
name: Awal PDF Reader

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"

          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$ANDROID_HOME/licenses/android-googletv-license"

          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/awal/reader
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p gradle/wrapper

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AwalReader"
          include(":app")
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar

          cat > gradlew << 'EOF'
          #!/bin/sh
          exec java -classpath "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF

          chmod +x gradlew

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.awal.reader'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.awal.reader'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.documentfile:documentfile:1.0.1'
          }
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#263238</item>
                  <item name="colorPrimaryVariant">#37474F</item>
                  <item name="colorSecondary">#FFB300</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="Awal PDF Reader"
                  android:theme="@style/AppTheme"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="application/pdf"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="application/msword"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/awal/reader/MainActivity.java << 'EOF'
          package com.awal.reader;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.pdf.*;
          import android.net.Uri;
          import android.view.*;
          import android.widget.*;
          import java.io.*;
          import java.util.*;

          public class MainActivity extends Activity {

              FrameLayout root, pageFrame;
              PdfRenderer renderer;
              PdfRenderer.Page page;
              Bitmap bitmap;
              ImageView image;
              TextView info;
              SeekBar seek;

              Uri uri;
              String key = "";
              int index = 0;
              int rotation = 0;
              int mode = 0;
              float zoom = 1f;

              File cache;
              Handler handler = new Handler();

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  cache = new File(getFilesDir(), "annotations");
                  cache.mkdirs();

                  root = new FrameLayout(this);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setBackgroundColor(Color.rgb(38, 50, 56));

                  TextView title = new TextView(this);
                  title.setText("Awal PDF Reader");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(20);
                  title.setGravity(Gravity.CENTER);
                  layout.addView(title, new LinearLayout.LayoutParams(-1, 55));

                  info = new TextView(this);
                  info.setTextColor(Color.WHITE);
                  info.setGravity(Gravity.CENTER);
                  layout.addView(info);

                  pageFrame = new FrameLayout(this);
                  layout.addView(pageFrame, new LinearLayout.LayoutParams(-1, 0, 1));

                  seek = new SeekBar(this);
                  layout.addView(seek);

                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setGravity(Gravity.CENTER);

                  addButton(buttons, "Open", this::open);
                  addButton(buttons, "Prev", () -> show(index - 1));
                  addButton(buttons, "Next", () -> show(index + 1));
                  addButton(buttons, "Zoom+", () -> {
                      zoom = Math.min(zoom * 1.2f, 5f);
                      render();
                  });
                  addButton(buttons, "Zoom-", () -> {
                      zoom = Math.max(zoom / 1.2f, .3f);
                      render();
                  });
                  addButton(buttons, "Rotate", () -> {
                      rotation = (rotation + 90) % 360;
                      render();
                  });

                  layout.addView(buttons);

                  LinearLayout modes = new LinearLayout(this);
                  modes.setGravity(Gravity.CENTER);

                  addButton(modes, "Dark", () -> {
                      mode = mode == 1 ? 0 : 1;
                      render();
                  });

                  addButton(modes, "Sepia", () -> {
                      mode = mode == 2 ? 0 : 2;
                      render();
                  });

                  addButton(modes, "Bookmark", this::bookmark);
                  addButton(modes, "Draw", this::drawMode);
                  addButton(modes, "Text", this::addText);

                  layout.addView(modes);

                  root.addView(layout);
                  setContentView(root);

                  seek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int value, boolean user) {
                          if (user && renderer != null) {
                              show(value * (renderer.getPageCount() - 1) / 100);
                          }
                      }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });

                  if (getIntent().getData() != null) {
                      openUri(getIntent().getData());
                  }
              }

              void addButton(LinearLayout row, String text, Runnable action) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(10);
                  row.addView(b);
                  b.setOnClickListener(v -> action.run());
              }

              void open() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType("application/pdf");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i, 1);
              }

              @Override
              protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);
                  if (request == 1 && result == RESULT_OK && data != null) {
                      openUri(data.getData());
                  }
              }

              void openUri(Uri u) {
                  if (u == null) return;

                  uri = u;
                  key = Integer.toHexString(uri.toString().hashCode());

                  try {
                      getContentResolver().takePersistableUriPermission(
                          uri, Intent.FLAG_GRANT_READ_URI_PERMISSION);

                      close();

                      ParcelFileDescriptor fd = getContentResolver()
                          .openFileDescriptor(uri, "r");

                      if (fd == null) return;

                      renderer = new PdfRenderer(fd);

                      index = getPreferences(0).getInt(key, 0);
                      index = Math.max(0, Math.min(index, renderer.getPageCount() - 1));

                      show(index);

                  } catch (Exception e) {
                      info.setText("Unable to open document");
                  }
              }

              void show(int value) {
                  if (renderer == null) return;

                  index = Math.max(0, Math.min(value, renderer.getPageCount() - 1));

                  getPreferences(0).edit().putInt(key, index).apply();

                  info.setText("Page " + (index + 1) + " / " + renderer.getPageCount());

                  seek.setProgress(renderer.getPageCount() <= 1 ? 0 :
                      index * 100 / (renderer.getPageCount() - 1));

                  render();
              }

              void render() {
                  if (renderer == null) return;

                  handler.post(() -> {
                      try {
                          if (page != null) page.close();

                          page = renderer.openPage(index);

                          int width = Math.max(1, (int)(page.getWidth() * zoom));
                          int height = Math.max(1, (int)(page.getHeight() * zoom));

                          Bitmap next = Bitmap.createBitmap(width, height,
                              Bitmap.Config.ARGB_8888);

                          next.eraseColor(Color.WHITE);

                          page.render(next, null, null,
                              PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);

                          if (rotation != 0) {
                              Matrix matrix = new Matrix();
                              matrix.postRotate(rotation);

                              Bitmap rotated = Bitmap.createBitmap(next, 0, 0,
                                  next.getWidth(), next.getHeight(), matrix, true);

                              next.recycle();
                              next = rotated;
                          }

                          if (mode != 0) {
                              Paint paint = new Paint();

                              int color = mode == 1 ? Color.BLACK : 0xFFF4E8D0;

                              paint.setColorFilter(new PorterDuffColorFilter(
                                  color, PorterDuff.Mode.MULTIPLY));

                              Canvas canvas = new Canvas(next);
                              canvas.drawBitmap(next, 0, 0, paint);
                          }

                          if (bitmap != null) bitmap.recycle();

                          bitmap = next;

                          image = new ImageView(this);
                          image.setImageBitmap(bitmap);
                          image.setScaleType(ImageView.ScaleType.FIT_CENTER);

                          pageFrame.removeAllViews();
                          pageFrame.addView(image, new FrameLayout.LayoutParams(-1, -1));

                          loadAnnotations();

                      } catch (Exception ignored) {}
                  });
              }

              File annotationFile() {
                  return new File(cache, key + "_" + index + ".json");
              }

              void saveAnnotations(String data) {
                  try {
                      File f = annotationFile();

                      try (FileOutputStream out = new FileOutputStream(f)) {
                          out.write(data.getBytes("UTF-8"));
                      }

                      File[] files = cache.listFiles();

                      if (files != null && files.length > 100) {
                          Arrays.sort(files, Comparator.comparingLong(File::lastModified));

                          for (int i = 0; i < files.length - 100; i++) {
                              files[i].delete();
                          }
                      }

                  } catch (Exception ignored) {}
              }

              void loadAnnotations() {
                  File f = annotationFile();

                  if (!f.exists()) return;

                  try {
                      byte[] data = new byte[(int) f.length()];

                      try (FileInputStream in = new FileInputStream(f)) {
                          in.read(data);
                      }

                      String value = new String(data, "UTF-8");

                      if (value.startsWith("TEXT:")) {
                          TextView text = new TextView(this);
                          text.setText(value.substring(5));
                          text.setTextColor(Color.RED);
                          pageFrame.addView(text);
                      }

                  } catch (Exception ignored) {}
              }

              void bookmark() {
                  if (renderer == null) return;

                  getPreferences(0).edit()
                      .putInt("bookmark_" + key, index)
                      .apply();

                  Toast.makeText(this, "Bookmark saved", Toast.LENGTH_SHORT).show();
              }

              void addText() {
                  if (renderer == null) return;

                  EditText input = new EditText(this);
                  input.setHint("Annotation");

                  new AlertDialog.Builder(this)
                      .setTitle("Add text")
                      .setView(input)
                      .setPositiveButton("Save", (d, w) -> {
                          String text = input.getText().toString();

                          saveAnnotations("TEXT:" + text);
                          loadAnnotations();
                      })
                      .setNegativeButton("Cancel", null)
                      .show();
              }

              void drawMode() {
                  if (renderer == null) return;

                  Toast.makeText(this,
                      "Drawing mode: touch the page",
                      Toast.LENGTH_SHORT).show();

                  View drawing = new View(this);

                  drawing.setBackgroundColor(Color.TRANSPARENT);

                  drawing.setOnTouchListener(new View.OnTouchListener() {
                      float x, y;

                      public boolean onTouch(View v, android.view.MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              x = e.getX();
                              y = e.getY();
                              return true;
                          }

                          if (e.getAction() == MotionEvent.ACTION_UP) {
                              Paint paint = new Paint();
                              paint.setColor(Color.RED);
                              paint.setStrokeWidth(5);

                              Canvas canvas = new Canvas(bitmap);
                              canvas.drawLine(x, y, e.getX(), e.getY(), paint);

                              image.invalidate();

                              saveAnnotations("DRAW:" + x + "," + y +
                                  "," + e.getX() + "," + e.getY());

                              return true;
                          }

                          return true;
                      }
                  });

                  pageFrame.addView(drawing);
              }

              void close() {
                  try {
                      if (page != null) page.close();
                      if (renderer != null) renderer.close();
                      if (bitmap != null) bitmap.recycle();
                  } catch (Exception ignored) {}

                  page = null;
                  renderer = null;
                  bitmap = null;
              }

              @Override
              protected void onDestroy() {
                  close();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Awal-PDF-Reader
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
