                  android:text="Cancel"
                  android:textColor="@color/accent_blue"
                  android:textSize="16sp"
                  android:padding="16dp"
                  android:layout_marginTop="16dp"/>
          </LinearLayout>
          EOF

      - name: AppInfo.java
        run: |
          cat > app/src/main/java/com/awal/launcher/AppInfo.java << 'EOF'
          package com.awal.launcher;
          import android.graphics.drawable.Drawable;
          public class AppInfo {
              public String label, packageName;
              public Drawable icon;
              public int launchCount;
              public boolean patternLocked;
              public AppInfo(String l, String p, Drawable i, int c, boolean locked) {
                  label=l; packageName=p; icon=i; launchCount=c; patternLocked=locked;
              }
          }
          EOF

      - name: PatternView.java
        run: |
          cat > app/src/main/java/com/awal/launcher/PatternView.java << 'EOF'
          package com.awal.launcher;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.util.AttributeSet;
          import android.view.MotionEvent;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;

          public class PatternView extends View {
              public interface PatternListener { void onComplete(List<Integer> pattern); }
              private Paint circlePaint, linePaint, activePaint;
              private List<Integer> selected = new ArrayList<>();
              private List<Integer> order = new ArrayList<>();
              private float touchX, touchY;
              private boolean drawing;
              private PatternListener listener;
              private int state = 0; // 0=default,1=set,2=error
              private static final int COLS=3, ROWS=3;
              private float[] cx = new float[9], cy = new float[9];

              public PatternView(Context c) { super(c); init(); }
              public PatternView(Context c, AttributeSet a) { super(c,a); init(); }

              private void init() {
                  circlePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  circlePaint.setStyle(Paint.Style.STROKE);
                  circlePaint.setStrokeWidth(2f);
                  circlePaint.setColor(0x88FFFFFF);
                  linePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  linePaint.setStyle(Paint.Style.STROKE);
                  linePaint.setStrokeWidth(3f);
                  linePaint.setColor(0xFF4FC3F7);
                  activePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  activePaint.setStyle(Paint.Style.FILL);
                  activePaint.setColor(0xFF4FC3F7);
              }

              public void setListener(PatternListener l) { listener=l; }
              public void setError() { state=2; linePaint.setColor(0xFFEF5350); activePaint.setColor(0xFFEF5350); invalidate(); postDelayed(this::reset,600); }
              public void reset() { selected.clear(); order.clear(); drawing=false; state=0; linePaint.setColor(0xFF4FC3F7); activePaint.setColor(0xFF4FC3F7); invalidate(); }

              @Override
              protected void onSizeChanged(int w, int h, int ow, int oh) {
                  float pw=w/3f, ph=h/3f;
                  for(int i=0;i<9;i++) { cx[i]=pw*(i%3)+pw/2; cy[i]=ph*(i/3)+ph/2; }
              }

              @Override
              protected void onDraw(Canvas c) {
                  float r=28f;
                  for(int i=0;i<9;i++) {
                      circlePaint.setColor(selected.contains(i)?0xFF4FC3F7:0x88FFFFFF);
                      if(state==2) circlePaint.setColor(selected.contains(i)?0xFFEF5350:0x88FFFFFF);
                      c.drawCircle(cx[i],cy[i],r,circlePaint);
                      if(selected.contains(i)) c.drawCircle(cx[i],cy[i],8f,activePaint);
                  }
                  Path path = new Path();
                  for(int k=0;k<order.size();k++) {
                      int idx=order.get(k);
                      if(k==0) path.moveTo(cx[idx],cy[idx]);
                      else path.lineTo(cx[idx],cy[idx]);
                  }
                  if(drawing && !order.isEmpty()) path.lineTo(touchX,touchY);
                  c.drawPath(path,linePaint);
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  switch(e.getAction()) {
                      case MotionEvent.ACTION_DOWN: drawing=true; selected.clear(); order.clear(); checkHit(e.getX(),e.getY()); break;
                      case MotionEvent.ACTION_MOVE: touchX=e.getX(); touchY=e.getY(); checkHit(e.getX(),e.getY()); invalidate(); break;
                      case MotionEvent.ACTION_UP:
                          drawing=false; invalidate();
                          if(listener!=null && order.size()>=4) listener.onComplete(new ArrayList<>(order));
                          else if(order.size()<4) { state=2; invalidate(); postDelayed(this::reset,600); }
                          break;
                  }
                  return true;
              }

              private void checkHit(float x, float y) {
                  for(int i=0;i<9;i++) {
                      if(!selected.contains(i)) {
                          float d=(float)Math.hypot(x-cx[i],y-cy[i]);
                          if(d<36f) { selected.add(i); order.add(i); invalidate(); break; }
                      }
                  }
              }
          }
          EOF

      - name: PatternLockActivity.java
        run: |
          cat > app/src/main/java/com/awal/launcher/PatternLockActivity.java << 'EOF'
          package com.awal.launcher;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.drawable.Drawable;
          import android.os.Bundle;
          import android.widget.ImageView;
          import android.widget.TextView;
          import java.util.List;

          public class PatternLockActivity extends Activity {
              private PatternView pv;
              private TextView msg;
              private String savedPattern;
              private String pkg;

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_pattern);
                  pkg = getIntent().getStringExtra("package");
                  SharedPreferences prefs = getSharedPreferences("patterns", MODE_PRIVATE);
                  savedPattern = prefs.getString("pattern_"+pkg, null);
                  pv = findViewById(R.id.patternView);
                  msg = findViewById(R.id.patternMsg);
                  TextView title = findViewById(R.id.patternTitle);
                  title.setText("Draw Pattern to Unlock");
                  try {
                      Drawable icon = getPackageManager().getApplicationIcon(pkg);
                      ((ImageView)findViewById(R.id.appIconBig)).setImageDrawable(icon);
                  } catch(PackageManager.NameNotFoundException ignored){}
                  pv.setListener(pattern -> {
                      String p = listToStr(pattern);
                      if(p.equals(savedPattern)) {
                          setResult(RESULT_OK);
                          finish();
                      } else {
                          msg.setText("Wrong pattern. Try again.");
                          pv.setError();
                      }
                  });
                  findViewById(R.id.btnCancel).setOnClickListener(v -> finish());
              }

              private String listToStr(List<Integer> l) {
                  StringBuilder sb=new StringBuilder();
                  for(int i:l) sb.append(i);
                  return sb.toString();
              }
          }
          EOF

      - name: PatternSetupActivity.java
        run: |
          cat > app/src/main/java/com/awal/launcher/PatternSetupActivity.java << 'EOF'
          package com.awal.launcher;
          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.widget.TextView;
          import java.util.List;

          public class PatternSetupActivity extends Activity {
              private PatternView pv;
              private TextView msg, title;
              private String firstPattern;
              private String pkg;
              private int step = 1;

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_pattern);
                  pkg = getIntent().getStringExtra("package");
                  pv = findViewById(R.id.patternView);
                  msg = findViewById(R.id.patternMsg);
                  title = findViewById(R.id.patternTitle);
                  title.setText("Set Pattern Lock");
                  msg.setText("Draw a pattern (min 4 dots)");
                  pv.setListener(pattern -> {
                      String p = listToStr(pattern);
                      if(step==1) {
                          firstPattern=p; step=2;
                          pv.reset();
                          title.setText("Confirm Pattern");
                          msg.setText("Draw the same pattern again");
                      } else {
                          if(p.equals(firstPattern)) {
                              SharedPreferences prefs = getSharedPreferences("patterns", MODE_PRIVATE);
                              prefs.edit().putString("pattern_"+pkg, p).apply();
                              setResult(RESULT_OK);
                              finish();
                          } else {
                              step=1; firstPattern=null;
                              msg.setText("Patterns don't match. Start again.");
                              title.setText("Set Pattern Lock");
                              pv.setError();
                          }
                      }
                  });
                  findViewById(R.id.btnCancel).setOnClickListener(v -> finish());
              }

              private String listToStr(List<Integer> l) {
                  StringBuilder sb=new StringBuilder();
                  for(int i:l) sb.append(i);
                  return sb.toString();
              }
          }
          EOF

      - name: WeatherData.java
        run: |
