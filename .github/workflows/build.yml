              Paint bmpPaint, pagePaint, ink, tp, thumbPaint, pillBg, pillText;
              Path path = new Path();
              RectF rect = new RectF(), rect2 = new RectF(), pr = new RectF();
              Store.Stroke cur;

              public PdfView(Context c) {
                  super(c);
                  dens = c.getResources().getDisplayMetrics().density;
                  gap = 10 * dens;
                  int mem = (int) Math.max(24L << 20, Runtime.getRuntime().maxMemory() / 5);
                  cache = new LruCache<Integer, Bitmap>(mem) {
