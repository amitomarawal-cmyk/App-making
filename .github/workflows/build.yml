     cat > app/src/main/java/com/awal/fusioncam/Hdr.java << 'EOF'
     package com.awal.fusioncam;
     import android.graphics.Bitmap;
     class Hdr{
     static int cl(int i,int n){return i<0?0:i>=n?n-1:i;}
     static void box(float[] a,float[] t,int w,int h,int r){float inv=1f/(2*r+1);
     for(int y=0;y<h;y++){int o=y*w;float s=0;for(int i=-r;i<=r;i++)s+=a[o+cl(i,w)];for(int x=0;x<w;x++){t[o+x]=s*inv;s+=a[o+cl(x+r+1,w)]-a[o+cl(x-r,w)];}}
     for(int x=0;x<w;x++){float s=0;for(int i=-r;i<=r;i++)s+=t[cl(i,h)*w+x];for(int y=0;y<h;y++){a[y*w+x]=s*inv;s+=t[cl(y+r+1,h)*w+x]-t[cl(y-r,h)*w+x];}}}
     static void blur(float[] a,float[] t,int w,int h,int r){box(a,t,w,h,r);box(a,t,w,h,r);}
     static float[] lum(int[] p){float[] l=new float[p.length];for(int i=0;i<p.length;i++){int c=p[i];l[i]=((c>>16&255)*.299f+(c>>8&255)*.587f+(c&255)*.114f)/255f;}return l;}
     static float[] wgt(int[] p,float[] L,int w,int h){float[] o=new float[p.length];
     for(int y=0;y<h;y++)for(int x=0;x<w;x++){int i=y*w+x;float c=L[i];
     float lp=Math.abs(L[y*w+cl(x-1,w)]+L[y*w+cl(x+1,w)]+L[cl(y-1,h)*w+x]+L[cl(y+1,h)*w+x]-4*c);
     int q=p[i],r=q>>16&255,g=q>>8&255,b=q&255;float s=(Math.max(r,Math.max(g,b))-Math.min(r,Math.min(g,b)))/255f;float d=c-.5f;
     o[i]=(lp+.03f)*(s+.25f)*((float)Math.exp(-d*d/.06f)+.002f);}
     return o;}
     static Bitmap fuse(Bitmap A,Bitmap B){int w=A.getWidth(),h=A.getHeight();
     if(B.getWidth()!=w||B.getHeight()!=h)B=Bitmap.createScaledBitmap(B,w,h,true);
     int n=w*h;int[] pa=new int[n],pb=new int[n];A.getPixels(pa,0,w,0,0,w,h);B.getPixels(pb,0,w,0,0,w,h);A.recycle();B.recycle();
     float[] wa=wgt(pa,lum(pa),w,h),wb=wgt(pb,lum(pb),w,h);
     for(int i=0;i<n;i++)wa[i]=wa[i]/(wa[i]+wb[i]);wb=null;
     float[] t=new float[n],wd=wa.clone();int m=Math.max(w,h);
     blur(wa,t,w,h,m/18);blur(wd,t,w,h,2);
     int[] out=new int[n];float[] b0=new float[n],b1=new float[n];int rb=m/120+2;
     for(int ch=0;ch<3;ch++){int sh=16-8*ch;
     for(int i=0;i<n;i++){b0[i]=pa[i]>>sh&255;b1[i]=pb[i]>>sh&255;}
     blur(b0,t,w,h,rb);blur(b1,t,w,h,rb);
     for(int i=0;i<n;i++){float s=wa[i],d=wd[i];float o0=pa[i]>>sh&255,o1=pb[i]>>sh&255;
     float v=s*b0[i]+(1-s)*b1[i]+d*(o0-b0[i])+(1-d)*(o1-b1[i]);int k=v<0?0:v>255?255:(int)(v+.5f);out[i]|=k<<sh;}}
     for(int i=0;i<n;i++)out[i]|=0xFF000000;
     Bitmap r=Bitmap.createBitmap(w,h,Bitmap.Config.ARGB_8888);r.setPixels(out,0,w,0,0,w,h);return r;}
     }
     EOF
     cat > app/src/main/java/com/awal/fusioncam/GLR.java << 'EOF'
     package com.awal.fusioncam;
     import android.graphics.Bitmap;
     import android.graphics.SurfaceTexture;
     import android.opengl.*;
     import android.util.Log;
     import android.view.Surface;
     import java.nio.*;
     import javax.microedition.khronos.egl.EGLConfig;
     import javax.microedition.khronos.opengles.GL10;
     class GLR implements GLSurfaceView.Renderer{
