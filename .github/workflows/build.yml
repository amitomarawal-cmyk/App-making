          package com.awal.depthlens;
          import android.content.ContentValues;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.*;
          import android.provider.MediaStore;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.File;
          import java.io.OutputStream;
          import java.util.concurrent.*;
          import java.util.concurrent.atomic.AtomicInteger;

          public class EditorActivity extends AppCompatActivity {
              volatile Bitmap src, cur;
              volatile byte[] mask;
              volatile Processor.Depth dep;
              volatile boolean bg = true;
              volatile int preset = 0;
              ImageView iv;
              SeekBar sb;
              TextView tv;
              final AtomicInteger seq = new AtomicInteger();
              final ExecutorService ex = Executors.newSingleThreadExecutor();
              final Handler h = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xFF000000);
                  root.setPadding(0, (int) (30 * getResources().getDisplayMetrics().density), 0, 0);
                  iv = new ImageView(this);
                  iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  root.addView(iv, new LinearLayout.LayoutParams(-1, 0, 1f));
                  tv = new TextView(this);
                  tv.setTextColor(0xFFFFFFFF);
                  tv.setPadding(24, 8, 24, 0);
                  tv.setText("Loading...");
                  root.addView(tv, -1, -2);
                  sb = new SeekBar(this);
                  sb.setMax(100);
                  sb.setProgress(60);
                  root.addView(sb, -1, -2);
                  LinearLayout row = new LinearLayout(this);
                  final Button b1 = new Button(this), b2 = new Button(this), b3 = new Button(this);
                  b1.setText("Background");
                  b2.setText("Auto AI");
                  b3.setText("Save");
                  row.addView(b1, new LinearLayout.LayoutParams(0, -2, 1f));
                  row.addView(b2, new LinearLayout.LayoutParams(0, -2, 1f));
                  row.addView(b3, new LinearLayout.LayoutParams(0, -2, 1f));
                  root.addView(row, -1, -2);
                  setContentView(root);

                  final File f = new File(getIntent().getStringExtra("p"));
                  ex.execute(() -> {
                      Bitmap b = Processor.load(f, Processor.MAX);
                      if (b == null) return;
                      File m = new File(f.getPath() + ".m");
                      if (m.exists()) mask = Processor.readMask(m, b.getWidth() * b.getHeight());
                      dep = Processor.readDepth(new File(f.getPath() + ".d"));
                      src = b;
                      h.post(() -> {
                          tv.setText(mask != null ? "Depth ready" : "Depth not ready yet: using simple gradient");
                          draw();
                      });
                  });
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) { draw(); }
                      public void onStartTrackingTouch(SeekBar s) { }
                      public void onStopTrackingTouch(SeekBar s) { }
                  });
                  b1.setOnClickListener(v -> {
                      bg = !bg;
                      b1.setText(bg ? "Background" : "Foreground");
                      draw();
                  });
                  b2.setOnClickListener(v -> {
                      if (src == null) return;
                      ex.execute(() -> {
                          final int p = Blur.analyze(src);
                          preset = p;
                          h.post(() -> {
                              tv.setText("AI scene: " + Blur.NAMES[p]);
                              sb.setProgress(Blur.PS[p]);
                              draw();
                          });
                      });
                  });
                  b3.setOnClickListener(v -> save());
              }

              void draw() {
                  if (src == null) return;
                  final int id = seq.incrementAndGet();
                  final float st = sb.getProgress() / 100f;
                  ex.execute(() -> {
                      if (id != seq.get()) return;
                      final Processor.Depth dp = dep;
                      final Bitmap r = Blur.render(src, mask, dp != null ? dp.d : null, dp != null ? dp.w : 0, dp != null ? dp.h : 0, st, bg, preset);
                      if (id == seq.get()) h.post(() -> { cur = r; iv.setImageBitmap(r); });
                  });
              }

              void save() {
                  final Bitmap b = cur;
                  if (b == null) return;
                  ex.execute(() -> {
                      String msg;
                      try {
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Images.Media.DISPLAY_NAME, "DepthLens_" + System.currentTimeMillis() + ".jpg");
                          v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                          v.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/DepthLens");
                          Uri u = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                          OutputStream o = getContentResolver().openOutputStream(u);
                          b.compress(Bitmap.CompressFormat.JPEG, 95, o);
                          o.close();
                          msg = "Saved to Pictures/DepthLens";
                      } catch (Exception e) {
                          msg = "Save failed";
                      }
                      final String m = msg;
                      h.post(() -> Toast.makeText(this, m, Toast.LENGTH_SHORT).show());
                  });
              }
          }
