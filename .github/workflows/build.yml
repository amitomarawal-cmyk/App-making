                  scroller = new OverScroller(c);
                  gd = new GestureDetector(c, new GL());
                  gd.setIsLongpressEnabled(false);
                  sd = new ScaleGestureDetector(c, new SL());
                  bmpPaint = new Paint(Paint.FILTER_BITMAP_FLAG);
                  pagePaint = new Paint();
                  pagePaint.setColor(Color.WHITE);
                  ink = new Paint(Paint.ANTI_ALIAS_FLAG);
                  ink.setStyle(Paint.Style.STROKE);
                  ink.setStrokeCap(Paint.Cap.ROUND);
                  ink.setStrokeJoin(Paint.Join.ROUND);
                  tp = new Paint(Paint.ANTI_ALIAS_FLAG);
                  thumbPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  thumbPaint.setColor(0xCC3A7BEF);
                  pillBg = new Paint(Paint.ANTI_ALIAS_FLAG);
                  pillBg.setColor(0xCC202020);
                  pillText = new Paint(Paint.ANTI_ALIAS_FLAG);
                  pillText.setColor(Color.WHITE);
                  pillText.setTextAlign(Paint.Align.CENTER);
                  pillText.setTextSize(14 * dens);
              }

              public void open(final File f, Store.Doc d, Host h) {
                  doc = d;
                  host = h;
                  rot = d.rot & 3;
                  theme = d.mode >= 0 && d.mode < BG.length ? d.mode : 0;
                  applyTheme();
                  worker = new Thread(new Runnable() {
                      public void run() {
                          loop(f);
                      }
                  });
                  worker.start();
              }

              void fail(final String m) {
                  post(new Runnable() {
                      public void run() {
                          if (alive && host != null) host.onFail(m);
                      }
                  });
              }

              void loop(File f) {
                  try {
                      pfd = ParcelFileDescriptor.open(f, ParcelFileDescriptor.MODE_READ_ONLY);
                      renderer = new PdfRenderer(pfd);
                      final int cnt = renderer.getPageCount();
                      if (cnt <= 0) {
                          fail("ফাইল খোলা যায়নি");
                          return;
                      }
                      final int[] w = new int[cnt], h = new int[cnt];
                      for (int i = 0; i < cnt && alive; i++) {
                          PdfRenderer.Page p = renderer.openPage(i);
                          w[i] = Math.max(1, p.getWidth());
                          h[i] = Math.max(1, p.getHeight());
                          p.close();
                      }
                      if (!alive) return;
                      post(new Runnable() {
                          public void run() {
                              if (!alive) return;
                              pw = w;
                              ph = h;
                              n = cnt;
                              top = new float[n];
                              hh = new float[n];
                              ready = true;
                              settle();
                              if (host != null) host.onReady(n);
                              invalidate();
                          }
                      });
                      while (true) {
                          Req r;
                          synchronized (lock) {
                              while (alive && wanted.isEmpty()) lock.wait();
                              if (!alive) break;
                              r = wanted.remove(0);
                              inflight = r.key;
                          }
                          try {
                              render(r);
                          } catch (OutOfMemoryError e) {
                              cache.evictAll();
                              failed.add(r.key);
                          } catch (Throwable e) {
                              failed.add(r.key);
                          }
                          inflight = -1;
                          postInvalidate();
                      }
                  } catch (SecurityException e) {
                      if (alive) fail("PASSWORD");
                  } catch (Throwable e) {
                      if (alive) fail("ফাইল খোলা যায়নি");
                  } finally {
                      try {
                          if (renderer != null) renderer.close();
                      } catch (Throwable t) {
                      }
                      try {
                          if (pfd != null) pfd.close();
                      } catch (Throwable t) {
                      }
                  }
              }

              void render(Req r) throws Exception {
                  PdfRenderer.Page pg = renderer.openPage(r.page);
                  try {
                      float pwp = pg.getWidth(), php = pg.getHeight();
                      boolean odd = (r.rot & 1) == 1;
                      float dw = odd ? php : pwp;
                      Matrix m = new Matrix();
                      m.postRotate(90 * r.rot);
                      if (r.rot == 1) m.postTranslate(php, 0);
                      else if (r.rot == 2) m.postTranslate(pwp, php);
                      else if (r.rot == 3) m.postTranslate(0, pwp);
                      Bitmap b = Bitmap.createBitmap(r.w, r.h, Bitmap.Config.ARGB_8888);
                      b.eraseColor(Color.WHITE);
                      if (r.type == 0) {
                          float k = r.w / dw;
                          m.postScale(k, k);
                      } else {
                          float k = r.docW * r.s / dw;
                          m.postScale(k, k);
                          m.postTranslate(-r.rl * r.s, -r.rt * r.s);
                      }
                      pg.render(b, null, m, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                      if (r.type == 0) {
                          cache.put(r.key, b);
                      } else {
                          Detail d = new Detail();
                          d.b = b;
                          d.rot = r.rot;
                          d.s = r.s;
                          d.rl = r.rl;
                          d.rt = r.rt;
                          d.rr = r.rr;
                          d.rb = r.rb;
                          synchronized (details) {
                              details.put(r.page, d);
                          }
                      }
                  } finally {
                      pg.close();
                  }
              }

              public void destroy() {
                  alive = false;
                  synchronized (lock) {
                      lock.notifyAll();
                  }
                  cache.evictAll();
              }

              public void trim() {
                  cache.evictAll();
                  synchronized (details) {
                      details.clear();
                  }
                  invalidate();
              }

              void applyTheme() {
                  float[] m = CM[theme];
                  ColorMatrixColorFilter f = m == null ? null : new ColorMatrixColorFilter(new ColorMatrix(m));
                  bmpPaint.setColorFilter(f);
                  pagePaint.setColorFilter(f);
              }

              public void setTheme(int t) {
                  theme = t;
                  applyTheme();
                  invalidate();
              }

              public void setTool(int t) {
                  tool = t;
                  busy = false;
                  cur = null;
                  invalidate();
              }

              public void setPen(int col, int wi) {
                  penColor = col;
                  penWidth = WIDTHS[wi];
                  textSize = TSIZES[wi];
              }

              void clearDetails() {
                  synchronized (details) {
                      details.clear();
                  }
              }

              void relayout() {
                  if (!ready || getWidth() == 0) return;
                  docW = getWidth();
                  float y = gap;
                  boolean odd = (rot & 1) == 1;
                  for (int i = 0; i < n; i++) {
                      float dw = odd ? ph[i] : pw[i], dh = odd ? pw[i] : ph[i];
                      hh[i] = docW * dh / dw;
                      top[i] = y;
                      y += hh[i] + gap;
                  }
                  docH = y;
              }

              void settle() {
                  if (!ready || restored || getWidth() == 0 || getHeight() == 0) return;
                  relayout();
                  restored = true;
                  int p = Math.max(0, Math.min(n - 1, doc.page));
                  applyState(p, doc.frac, doc.zoom <= 0 ? 1f : doc.zoom, doc.txn);
              }

              void applyState(int p, float frac, float z, float txn) {
                  p = Math.max(0, Math.min(n - 1, p));
                  s = Math.max(MIN, Math.min(MAX, z));
                  tx = txn * getWidth();
                  ty = -(top[p] + frac * hh[p]) * s;
                  clampPos();
                  notifyPage();
                  invalidate();
              }

              float[] capture() {
                  float vt = -ty / s;
                  int p = findPage(vt);
                  return new float[]{p, (vt - top[p]) / hh[p], s, tx / docW};
              }

              @Override
              protected void onSizeChanged(int w, int h, int ow, int oh) {
                  super.onSizeChanged(w, h, ow, oh);
                  if (!ready) return;
                  cache.evictAll();
                  clearDetails();
                  if (!restored) {
                      settle();
                      return;
                  }
                  float[] st = capture();
                  relayout();
                  applyState((int) st[0], st[1], st[2], st[3]);
              }

              int findPage(float y) {
                  int lo = 0, hi = n - 1;
                  while (lo < hi) {
                      int mid = (lo + hi + 1) >>> 1;
                      if (top[mid] <= y) lo = mid;
                      else hi = mid - 1;
                  }
                  return lo;
              }

              void clampPos() {
                  float W = getWidth(), H = getHeight(), cw = docW * s, ch = docH * s;
                  if (cw <= W) tx = (W - cw) / 2;
                  else tx = Math.max(W - cw, Math.min(0, tx));
                  if (ch <= H) ty = 0;
                  else ty = Math.max(H - ch, Math.min(0, ty));
              }

              void toScreen(int p, float nx, float ny) {
                  float u = nx, v = ny;
                  switch (rot) {
                      case 1: u = 1 - ny; v = nx; break;
                      case 2: u = 1 - nx; v = 1 - ny; break;
                      case 3: u = ny; v = 1 - nx; break;
                      default: break;
                  }
                  ox = tx + u * docW * s;
                  oy = ty + (top[p] + v * hh[p]) * s;
              }

              void mapTo(int p, float x, float y) {
                  float u = Math.max(0, Math.min(1, (x - tx) / s / docW));
                  float v = Math.max(0, Math.min(1, ((y - ty) / s - top[p]) / hh[p]));
                  switch (rot) {
                      case 1: hx = v; hy = 1 - u; break;
                      case 2: hx = 1 - u; hy = 1 - v; break;
                      case 3: hx = 1 - v; hy = u; break;
                      default: hx = u; hy = v; break;
                  }
              }

              int hitPage(float x, float y) {
                  float dx = (x - tx) / s, dy = (y - ty) / s;
                  if (dx < 0 || dx > docW) return -1;
                  int p = findPage(dy);
                  if (dy < top[p] || dy > top[p] + hh[p]) return -1;
                  mapTo(p, x, y);
                  return p;
              }

              int key(int p, int t) {
                  return (p * 4 + rot) * 4 + t;
              }

              void add(ArrayList<Req> l, Req q) {
                  if (!failed.contains(q.key) && q.key != inflight) l.add(q);
              }

              Req base(int i, int t, int[] tw) {
                  Req q = new Req();
                  q.type = 0;
                  q.page = i;
                  q.tier = t;
                  q.key = key(i, t);
                  q.rot = rot;
                  q.w = tw[t];
                  q.h = Math.max(1, Math.round(tw[t] * hh[i] / docW));
                  return q;
              }

              int curPage() {
                  float H = getHeight();
                  if (docH * s > H && -ty + H >= docH * s - 2) return n - 1;
                  return findPage((-ty + H * 0.25f) / s);
              }

              public int current() {
                  return ready && restored ? curPage() : 0;
              }

              void notifyPage() {
                  if (!ready || !restored || host == null) return;
                  final int p = curPage();
                  if (p != lastPage) {
                      lastPage = p;
                      post(new Runnable() {
                          public void run() {
                              if (alive && host != null) host.onPage(p);
                          }
                      });
                  }
              }

              void touch() {
                  lastMove = System.currentTimeMillis();
                  notifyPage();
                  invalidate();
              }

              void changed() {
                  if (host != null) host.onChanged();
              }

              public void go(int p) {
                  if (!ready || !restored) return;
                  applyState(p, 0, s, tx / docW);
                  lastMove = System.currentTimeMillis();
              }

              public void rotate() {
                  if (!ready || !restored) return;
                  float[] st = capture();
                  rot = (rot + 1) & 3;
                  cache.evictAll();
                  clearDetails();
                  failed.clear();
                  relayout();
                  applyState((int) st[0], st[1], st[2], st[3]);
                  doc.rot = rot;
              }

              public void sync() {
                  if (doc == null) return;
                  if (ready && restored) {
                      float[] st = capture();
                      doc.page = (int) st[0];
                      doc.frac = st[1];
                      doc.zoom = st[2];
                      doc.txn = st[3];
                      doc.pages = n;
                  }
                  doc.rot = rot;
                  doc.mode = theme;
              }

              public void addText(int p, float x, float y, String t) {
                  if (t == null || t.trim().isEmpty()) return;
                  Store.Txt o = new Store.Txt();
                  o.page = p;
                  o.x = x;
                  o.y = y;
                  o.t = t;
                  o.color = penColor;
                  o.size = textSize;
                  doc.texts.add(o);
                  history.add(o);
                  invalidate();
                  changed();
              }

              public void editText(Store.Txt o, String t) {
                  if (t == null || t.trim().isEmpty()) doc.texts.remove(o);
                  else o.t = t;
                  invalidate();
                  changed();
              }

              public void undo() {
                  while (!history.isEmpty()) {
                      Object o = history.remove(history.size() - 1);
                      boolean ok;
                      if (o instanceof Store.Stroke) ok = doc.strokes.remove(o);
                      else ok = doc.texts.remove(o);
                      if (ok) {
                          invalidate();
                          changed();
                          return;
                      }
                  }
              }

              void drawNotes(Canvas c, int p) {
                  for (Store.Stroke st : doc.strokes) {
                      if (st.page != p || st.n < 2) continue;
                      path.rewind();
                      for (int k = 0; k < st.n; k += 2) {
                          toScreen(p, st.p[k], st.p[k + 1]);
                          if (k == 0) path.moveTo(ox, oy);
                          else path.lineTo(ox, oy);
                      }
                      if (st.n == 2) path.lineTo(ox + 0.1f, oy);
                      ink.setColor(st.color);
                      ink.setStrokeWidth(Math.max(1f, st.w * docW * s));
                      c.drawPath(path, ink);
                  }
                  for (Store.Txt t : doc.texts) {
                      if (t.page != p) continue;
                      toScreen(p, t.x, t.y);
                      tp.setColor(t.color);
                      tp.setTextSize(Math.max(6f, t.size * docW * s));
                      float lh = tp.getFontSpacing();
                      String[] ls = t.t.split("\n");
                      c.save();
                      c.translate(ox, oy);
                      c.rotate(90 * rot);
                      for (int k = 0; k < ls.length; k++) c.drawText(ls[k], 0, -tp.ascent() + k * lh, tp);
                      c.restore();
                  }
              }

              float thumbH() {
                  return 48 * dens;
              }

              void pill(Canvas c, String t, float cx, float cy) {
                  float w = pillText.measureText(t) + 24 * dens, h = 30 * dens;
                  pr.set(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2);
                  c.drawRoundRect(pr, h / 2, h / 2, pillBg);
                  c.drawText(t, cx, cy + pillText.getTextSize() * 0.35f, pillText);
              }

              @Override
              protected void onDraw(Canvas c) {
                  c.drawColor(BG[theme]);
                  if (!ready || !restored) return;
                  float W = getWidth(), H = getHeight();
                  float vt = -ty / s, vb = (H - ty) / s;
                  int a = Math.max(0, findPage(vt) - 1), b = Math.min(n - 1, findPage(vb) + 1);
                  synchronized (details) {
                      if (s <= 1.3f) {
                          details.clear();
                      } else {
                          Iterator<Integer> it = details.keySet().iterator();
                          while (it.hasNext()) {
                              int k = it.next();
                              if (k < a || k > b) it.remove();
                          }
                      }
                  }
                  float pwid = docW * s;
                  int need = pwid <= W * 0.45f ? 1 : 2;
                  int bw = (int) Math.min(W, 1600f);
                  int[] tw = {Math.max(96, bw / 6), Math.max(96, bw / 2), bw};
                  ArrayList<Req> r0 = new ArrayList<>(), r1 = new ArrayList<>(), r2 = new ArrayList<>();
                  boolean zoomed = s > 1.3f && !sd.isInProgress() && !thumbDrag;
                  for (int i = a; i <= b; i++) {
                      float sy = ty + top[i] * s, sh = hh[i] * s;
                      boolean vis = sy + sh > 0 && sy < H;
                      if (!vis && thumbDrag) continue;
                      Bitmap bm = null;
                      int got = -1;
                      int[] order = need == 1 ? new int[]{1, 2, 0} : new int[]{2, 1, 0};
                      for (int t : order) {
                          Bitmap x = cache.get(key(i, t));
                          if (x != null) {
                              bm = x;
                              got = t;
                              break;
                          }
                      }
                      if (cache.get(key(i, 0)) == null) add(vis ? r0 : r2, base(i, 0, tw));
                      boolean have = got == need || (need == 1 && got == 2);
                      if (!have && !thumbDrag) add(vis ? r1 : r2, base(i, need, tw));
                      if (!vis) continue;
                      rect.set(tx, sy, tx + pwid, sy + sh);
                      if (bm == null) c.drawRect(rect, pagePaint);
                      else c.drawBitmap(bm, null, rect, bmpPaint);
                      if (s > 1.3f) {
                          Detail dt;
                          synchronized (details) {
                              dt = details.get(i);
                          }
                          if (dt != null && dt.rot == rot) {
                              rect2.set(tx + dt.rl * s, sy + dt.rt * s, tx + dt.rr * s, sy + dt.rb * s);
                              c.drawBitmap(dt.b, null, rect2, bmpPaint);
                          }
                          if (zoomed) {
                              float vl = Math.max(0, -tx / s), vr = Math.min(docW, (W - tx) / s);
                              float vp = Math.max(0, vt - top[i]), vq = Math.min(hh[i], vb - top[i]);
                              boolean ok = dt != null && dt.rot == rot && Math.abs(s / dt.s - 1) < 0.12f
                                      && dt.rl <= vl + 1 && dt.rt <= vp + 1 && dt.rr >= vr - 1 && dt.rb >= vq - 1;
                              if (!ok && vr > vl && vq > vp) {
                                  float mw = (vr - vl) * 0.08f, mh = (vq - vp) * 0.08f;
                                  Req q = new Req();
                                  q.type = 1;
                                  q.page = i;
                                  q.rot = rot;
                                  q.s = s;
                                  q.docW = docW;
                                  q.rl = Math.max(0, vl - mw);
                                  q.rr = Math.min(docW, vr + mw);
                                  q.rt = Math.max(0, vp - mh);
                                  q.rb = Math.min(hh[i], vq + mh);
                                  q.w = (int) Math.ceil((q.rr - q.rl) * s);
                                  q.h = (int) Math.ceil((q.rb - q.rt) * s);
                                  q.key = 0x40000000 | (i << 2) | rot;
                                  if (q.w > 0 && q.h > 0 && (long) q.w * q.h <= 6000000L) add(r1, q);
                              }
                          }
                      }
                      c.save();
                      c.clipRect(rect);
                      drawNotes(c, i);
                      c.restore();
                  }
                  float ch = docH * s;
                  boolean recent = System.currentTimeMillis() - lastMove < 1000;
                  if (ch > H) {
                      float th = thumbH(), tt = (-ty) / (ch - H) * (H - th);
                      rect.set(W - 12 * dens, tt, W - 3 * dens, tt + th);
                      c.drawRoundRect(rect, 5 * dens, 5 * dens, thumbPaint);
                      if (thumbDrag) pill(c, (curPage() + 1) + " / " + n, W - 80 * dens, tt + th / 2);
                  }
                  if (recent && !thumbDrag) {
                      pill(c, (curPage() + 1) + " / " + n, W / 2, H - 36 * dens);
                      postInvalidateDelayed(400);
                  }
                  r0.addAll(r1);
                  r0.addAll(r2);
                  synchronized (lock) {
                      wanted = r0;
                      lock.notify();
                  }
              }

              @Override
              public void computeScroll() {
                  if (scroller.computeScrollOffset()) {
                      tx = scroller.getCurrX();
                      ty = scroller.getCurrY();
                      clampPos();
                      touch();
                  }
              }

              boolean hitThumb(float x, float y) {
                  float H = getHeight(), ch = docH * s;
                  if (ch <= H) return false;
                  float th = thumbH(), tt = (-ty) / (ch - H) * (H - th);
                  return x > getWidth() - 36 * dens && y > tt - 16 * dens && y < tt + th + 16 * dens;
              }

              void dragThumb(float y) {
                  float H = getHeight(), ch = docH * s, th = thumbH();
                  float f = Math.max(0, Math.min(1, (y - th / 2) / (H - th)));
                  ty = -f * (ch - H);
                  clampPos();
                  touch();
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  if (!ready || !restored) return true;
                  int a = e.getActionMasked();
                  float x = e.getX(), y = e.getY();
                  if (a == MotionEvent.ACTION_DOWN) {
                      scroller.forceFinished(true);
                      if (hitThumb(x, y)) {
                          thumbDrag = true;
                          dragThumb(y);
                          return true;
                      }
                  }
                  if (thumbDrag) {
                      if (a == MotionEvent.ACTION_MOVE) {
                          dragThumb(y);
                      } else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                          thumbDrag = false;
                          invalidate();
                      }
                      return true;
                  }
                  gd.onTouchEvent(e);
                  sd.onTouchEvent(e);
                  if (tool == PEN || tool == ERASE) annotate(e, a);
                  return true;
              }

              void abort() {
                  if (cur != null && cur.n < 12) doc.strokes.remove(cur);
                  cur = null;
                  busy = false;
                  invalidate();
              }

              void annotate(MotionEvent e, int a) {
                  float x = e.getX(), y = e.getY();
                  switch (a) {
                      case MotionEvent.ACTION_DOWN:
                          busy = false;
                          if (tool == PEN) {
                              int p = hitPage(x, y);
                              if (p >= 0) {
                                  cur = new Store.Stroke();
                                  cur.page = p;
                                  cur.color = penColor;
                                  cur.w = penWidth;
                                  cur.add(hx, hy);
                                  doc.strokes.add(cur);
                                  history.add(cur);
                                  busy = true;
                                  invalidate();
                              }
                          } else {
                              busy = true;
                              erase(x, y);
                          }
                          break;
                      case MotionEvent.ACTION_MOVE:
                          if (!busy) break;
                          if (e.getPointerCount() > 1) {
                              abort();
                              break;
                          }
                          if (tool == PEN && cur != null) {
                              for (int k = 0; k < e.getHistorySize(); k++) {
                                  mapTo(cur.page, e.getHistoricalX(k), e.getHistoricalY(k));
                                  cur.add(hx, hy);
                              }
                              mapTo(cur.page, x, y);
                              cur.add(hx, hy);
                              invalidate();
                          } else if (tool == ERASE) {
                              erase(x, y);
                          }
                          break;
                      case MotionEvent.ACTION_POINTER_DOWN:
                          if (busy) abort();
                          break;
                      case MotionEvent.ACTION_UP:
                          if (busy) changed();
                          busy = false;
                          cur = null;
                          break;
                      case MotionEvent.ACTION_CANCEL:
                          abort();
                          break;
                      default:
                          break;
                  }
              }

              void erase(float x, float y) {
                  int p = hitPage(x, y);
                  if (p < 0) return;
                  float rad = 14 * dens;
                  boolean any = false;
                  for (int i = doc.strokes.size() - 1; i >= 0; i--) {
                      Store.Stroke st = doc.strokes.get(i);
                      if (st.page != p) continue;
                      for (int k = 0; k + 1 < st.n; k += 2) {
                          toScreen(p, st.p[k], st.p[k + 1]);
                          if (Math.abs(ox - x) < rad && Math.abs(oy - y) < rad) {
                              doc.strokes.remove(i);
                              any = true;
                              break;
                          }
                      }
                  }
                  for (int i = doc.texts.size() - 1; i >= 0; i--) {
                      Store.Txt t = doc.texts.get(i);
                      if (t.page != p) continue;
                      toScreen(p, t.x, t.y);
                      if (Math.abs(ox - x) < rad * 3 && Math.abs(oy - y) < rad * 3) {
                          doc.texts.remove(i);
                          any = true;
                      }
                  }
                  if (any) invalidate();
              }

              void textTap(float x, float y) {
                  int p = hitPage(x, y);
                  if (p < 0 || host == null) return;
                  float nx = hx, ny = hy;
                  Store.Txt hit = null;
