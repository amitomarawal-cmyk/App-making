     float w=uP[12],wi=uP[13];vec2 q=vec2(u.x*uAs,u.y);
     if(abs(w-1.)<.5||abs(w-5.)<.5){float r=0.;
     for(int i=0;i<2;i++){float fi=float(i);float sc=70.+fi*45.;vec2 g=vec2(q.x*sc+q.y*sc*.12,q.y*sc*.22+uTm*(14.+fi*5.));vec2 id=floor(g),f=fract(g);float x=abs(f.x-.5);
     r+=(1.-smoothstep(0.,.12,x))*smoothstep(0.,.25,f.y)*(1.-smoothstep(.3,1.,f.y))*step(.6,h(id+fi*7.));}
     c=mix(c,vec3(.85,.9,1.),min(r,1.)*.4*min(wi,1.));c*=1.-.12*min(wi,1.);
     if(w>4.5)c+=step(.97,h(vec2(floor(uTm*2.5),3.)))*(.4+.3*sin(uTm*50.));}
     if(abs(w-2.)<.5){float s=0.;
     for(int i=0;i<3;i++){float fi=float(i);float sc=9.+fi*8.;vec2 g=vec2(q.x*sc+sin(uTm*.6+fi*2.)*.6,q.y*sc+uTm*(.5+fi*.3));vec2 id=floor(g),f=fract(g)-.5;vec2 o=vec2(h(id+3.)-.5,h(id+9.)-.5)*.5;
     s+=(1.-smoothstep(0.,.15-fi*.03,length(f-o)))*step(.45,h(id+fi*13.));}
     c=mix(c,vec3(1.),min(s,1.)*.9*min(wi,1.));}
     if(abs(w-3.)<.5){float fg=nz(q*3.+vec2(uTm*.1,0.))*.6+nz(q*7.-vec2(uTm*.07,0.))*.4;c=mix(c,vec3(.82,.85,.88),clamp(wi*(.3+.5*fg),0.,.9));}
     if(abs(w-4.)<.5){float g=(1.-smoothstep(0.,.9,distance(u,vec2(.1+.1*sin(uTm*.4),.9))))*(.7+.3*sin(uTm*.9));c+=vec3(1.,.5,.15)*g*.5*wi;c+=vec3(1.,.6,.2)*(1.-smoothstep(0.,.8,distance(u,vec2(.95,.05))))*.2*wi;}
     if(abs(w-6.)<.5){float sc=step(.9965,h(vec2(floor(u.x*250.),floor(uTm*12.))))*step(.3,h(vec2(floor(uTm*12.),1.)));float ds=step(.9985,h(floor(q*200.)+floor(uTm*10.)));c=mix(c,vec3(.95),clamp(sc*.5+ds*.7,0.,1.)*wi);}
     c*=1.+uP[18]*(h(vec2(floor(uTm*14.),0.))-.5)*2.;
     c*=1.-uP[11]*.35*(.5+.5*sin(u.y*1000.));
     c+=(h(floor(u*vec2(360.,360./uAs))+fract(uTm)*10.)-.5)*uP[8];
     c*=1.-uP[7]*smoothstep(.3,.95,distance(u,vec2(.5))*1.35);
