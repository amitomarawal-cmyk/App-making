package com.awal.pdfreader;
import android.content.Context;
import android.content.SharedPreferences;
import org.json.JSONArray;
import org.json.JSONObject;
import java.util.ArrayList;
import java.util.List;
public class RecentFilesManager {
    private static final String PREF = "recent_files";
    private static final String KEY = "files";
    private static final int MAX = 100;
    private SharedPreferences prefs;
    public RecentFilesManager(Context ctx) {
        prefs = ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE);
    }
    public List<RecentFile> getAll() {
        List<RecentFile> list = new ArrayList<>();
        try {
            JSONArray arr = new JSONArray(prefs.getString(KEY, "[]"));
            for (int i = 0; i < arr.length(); i++) {
                JSONObject o = arr.getJSONObject(i);
                list.add(new RecentFile(o.getString("path"), o.getString("name"),
                    o.getInt("lastPage"), o.getLong("lastOpened")));
            }
        } catch (Exception ignored) {}
        return list;
    }
    public void addOrUpdate(String path, String name, int lastPage) {
        List<RecentFile> list = getAll();
        list.removeIf(f -> f.path.equals(path));
        list.add(0, new RecentFile(path, name, lastPage, System.currentTimeMillis()));
        if (list.size() > MAX) list = list.subList(0, MAX);
        save(list);
    }
    public void remove(String path) {
        List<RecentFile> list = getAll();
        list.removeIf(f -> f.path.equals(path));
        save(list);
    }
    private void save(List<RecentFile> list) {
        try {
            JSONArray arr = new JSONArray();
            for (RecentFile f : list) {
                JSONObject o = new JSONObject();
                o.put("path", f.path); o.put("name", f.name);
                o.put("lastPage", f.lastPage); o.put("lastOpened", f.lastOpened);
                arr.put(o);
            }
            prefs.edit().putString(KEY, arr.toString()).apply();
        } catch (Exception ignored) {}
    }
    public int getLastPage(String path) {
        for (RecentFile f : getAll()) if (f.path.equals(path)) return f.lastPage;
        return 0;
    }
}
