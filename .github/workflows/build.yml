name: Build Awal Keyboard APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/awal/keyboard app/src/main/res/values app/src/main/res/xml app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 gradle/wrapper

          cat > settings.gradle <<'EOF'
          pluginManagement {
           repositories {
            google()
            mavenCentral()
            gradlePluginPortal()
           }
          }
          dependencyResolutionManagement {
           repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
           repositories {
            google()
            mavenCentral()
           }
          }
          rootProject.name = "AwalKeyboard"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
           id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
           id 'com.android.application'
          }
          android {
           namespace 'com.awal.keyboard'
           compileSdk 34
           defaultConfig {
            applicationId 'com.awal.keyboard'
            minSdk 26
            targetSdk 34
            versionCode 1
            versionName '1.0'
           }
           buildTypes {
            release {
             minifyEnabled false
            }
           }
           compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
           }
          }
          tasks.withType(JavaCompile).configureEach {
           options.encoding = 'UTF-8'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <application
            android:label="@string/app_name"
            android:icon="@mipmap/ic_launcher"
            android:allowBackup="true"
            android:theme="@android:style/Theme.Material.Light.NoActionBar">
            <activity android:name=".MainActivity" android:exported="true">
             <intent-filter>
              <action android:name="android.intent.action.MAIN"/>
              <category android:name="android.intent.category.LAUNCHER"/>
             </intent-filter>
            </activity>
            <service
             android:name=".KeyboardService"
             android:label="@string/app_name"
             android:permission="android.permission.BIND_INPUT_METHOD"
             android:exported="true">
             <intent-filter>
              <action android:name="android.view.InputMethod"/>
             </intent-filter>
             <meta-data android:name="android.view.im" android:resource="@xml/method"/>
            </service>
           </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/method.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
           android:settingsActivity="com.awal.keyboard.MainActivity"/>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
           <string name="app_name">Awal Keyboard</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
           <gradient android:startColor="#1E6FD9" android:endColor="#0D47A1" android:angle="270"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
           android:width="108dp"
           android:height="108dp"
           android:viewportWidth="108"
           android:viewportHeight="108">
           <path
            android:fillColor="#FFFFFF"
            android:pathData="M30,40L78,40Q82,40 82,44L82,64Q82,68 78,68L30,68Q26,68 26,64L26,44Q26,40 30,40Z"/>
           <path
