              }

              public static final int VIEW = 0, PEN = 1, TEXT = 2, ERASE = 3;
              public static final String[] MODES = {"সাধারণ", "ডার্ক", "সেপিয়া", "গ্রে", "সবুজ (চোখ আরাম)", "নাইট", "নীল"};
              static final float MIN = 0.25f, MAX = 8f;
              static final int[] BG = {0xFF6E7378, 0xFF0B0B0B, 0xFF6B5A44, 0xFF505050, 0xFF4F6B54, 0xFF000000, 0xFF566A82};
              static final float[][] CM = {
                  null,
                  {-0.9f, 0, 0, 0, 229.5f, 0, -0.9f, 0, 0, 229.5f, 0, 0, -0.9f, 0, 229.5f, 0, 0, 0, 1, 0},
                  {0.287f, 0.563f, 0.109f, 0, 0, 0.263f, 0.517f, 0.100f, 0, 0, 0.203f, 0.399f, 0.078f, 0, 0, 0, 0, 0, 1, 0},
                  {0.299f, 0.587f, 0.114f, 0, 0, 0.299f, 0.587f, 0.114f, 0, 0, 0.299f, 0.587f, 0.114f, 0, 0, 0, 0, 0, 1, 0},
