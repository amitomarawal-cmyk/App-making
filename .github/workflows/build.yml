      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/awal/pdfreader/MainActivity.java << 'EOF'
          package com.awal.pdfreader;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.database.Cursor;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.google.android.material.floatingactionbutton.FloatingActionButton;
          import java.util.List;
          public class MainActivity extends AppCompatActivity {
              private static final int REQ_PICK = 1001;
              private static final int REQ_PERM = 1002;
              private RecentFilesManager manager;
              private RecentAdapter adapter;
              private List<RecentFile> files;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  manager = new RecentFilesManager(this);
                  files = manager.getAll();
                  RecyclerView rv = findViewById(R.id.rv_recent);
                  rv.setLayoutManager(new LinearLayoutManager(this));
                  adapter = new RecentAdapter(files, new RecentAdapter.OnItemClick() {
                      @Override public void onOpen(RecentFile f) { openPdf(Uri.parse(f.path), f.name); }
                      @Override public void onDelete(RecentFile f, int pos) {
                          manager.remove(f.path); adapter.remove(pos);
                      }
                  });
                  rv.setAdapter(adapter);
                  FloatingActionButton fab = findViewById(R.id.fab_open);
                  fab.setOnClickListener(v -> checkPermAndPick());
                  Intent intent = getIntent();
                  if (Intent.ACTION_VIEW.equals(intent.getAction()) && intent.getData() != null) {
                      openPdf(intent.getData(), getFileName(intent.getData()));
                  }
              }
              @Override
              protected void onResume() {
                  super.onResume();
                  files.clear();
                  files.addAll(manager.getAll());
                  adapter.notifyDataSetChanged();
              }
              private void checkPermAndPick() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      pickPdf();
                  } else if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE)
                      == PackageManager.PERMISSION_GRANTED) {
                      pickPdf();
                  } else {
                      ActivityCompat.requestPermissions(this,
                          new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, REQ_PERM);
                  }
              }
              private void pickPdf() {
                  Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                  intent.setType("application/pdf");
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(Intent.createChooser(intent, "Select PDF"), REQ_PICK);
              }
              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_PICK && res == RESULT_OK && data != null && data.getData() != null) {
                      Uri uri = data.getData();
                      openPdf(uri, getFileName(uri));
                  }
              }
              private void openPdf(Uri uri, String name) {
                  Intent i = new Intent(this, PdfViewerActivity.class);
                  i.putExtra("uri", uri.toString());
                  i.putExtra("name", name);
                  startActivity(i);
              }
              private String getFileName(Uri uri) {
                  String name = "document.pdf";
                  try (Cursor c = getContentResolver().query(uri, null, null, null, null)) {
                      if (c != null && c.moveToFirst()) {
                          int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0) name = c.getString(idx);
                      }
                  } catch (Exception ignored) {}
                  return name;
              }
          }
          EOF

      - name: Create PdfViewerActivity
        run: |
          cat > app/src/main/java/com/awal/pdfreader/PdfViewerActivity.java << 'EOF'
          package com.awal.pdfreader;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Surface;
          import android.view.View;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import com.github.barteksc.pdfviewer.PDFView;
          import com.github.barteksc.pdfviewer.listener.*;
          import com.github.barteksc.pdfviewer.scroll.DefaultScrollHandle;
          import com.github.barteksc.pdfviewer.util.FitPolicy;
          public class PdfViewerActivity extends AppCompatActivity {
              private PDFView pdfView;
              private DrawingView drawingView;
              private TextView tvTitle, tvPage;
              private SeekBar seekbar;
              private ProgressBar progressBar;
              private RecentFilesManager manager;
              private String uriStr, fileName;
              private int currentPage = 0, totalPages = 0;
              private int rotation = 0;
              private boolean drawMode = false;
              private static final int MODE_DAY = 0, MODE_DARK = 1, MODE_SEPIA = 2,
                  MODE_NIGHT_BLUE = 3, MODE_GREEN = 4;
              private int currentMode = MODE_DAY;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_pdf_viewer);
                  pdfView = findViewById(R.id.pdfView);
                  drawingView = findViewById(R.id.drawing_view);
                  tvTitle = findViewById(R.id.tv_title);
                  tvPage = findViewById(R.id.tv_page);
                  seekbar = findViewById(R.id.seekbar_page);
                  progressBar = findViewById(R.id.progress_bar);
                  manager = new RecentFilesManager(this);
                  Intent intent = getIntent();
                  if (Intent.ACTION_VIEW.equals(intent.getAction()) && intent.getData() != null) {
                      uriStr = intent.getData().toString();
                      fileName = intent.getData().getLastPathSegment();
                  } else {
                      uriStr = intent.getStringExtra("uri");
                      fileName = intent.getStringExtra("name");
                  }
                  if (fileName == null) fileName = "Document";
                  tvTitle.setText(fileName);
                  currentPage = manager.getLastPage(uriStr);
                  loadPdf();
                  setupButtons();
              }
              private void loadPdf() {
                  progressBar.setVisibility(View.VISIBLE);
                  Uri uri = Uri.parse(uriStr);
                  pdfView.fromUri(uri)
                      .defaultPage(currentPage)
                      .enableSwipe(true)
                      .swipeHorizontal(false)
                      .enableDoubletap(true)
                      .onLoad(nbPages -> {
                          totalPages = nbPages;
                          progressBar.setVisibility(View.GONE);
                          seekbar.setMax(Math.max(0, totalPages - 1));
                          seekbar.setProgress(currentPage);
                          updatePageLabel();
                      })
                      .onPageChange((page, pageCount) -> {
                          currentPage = page;
                          totalPages = pageCount;
                          seekbar.setProgress(page);
                          updatePageLabel();
                          manager.addOrUpdate(uriStr, fileName, page);
                      })
                      .onError(t -> {
                          progressBar.setVisibility(View.GONE);
                          Toast.makeText(this, "Error loading PDF", Toast.LENGTH_SHORT).show();
                      })
                      .enableAnnotationRendering(true)
                      .scrollHandle(new DefaultScrollHandle(this))
                      .spacing(4)
                      .pageFitPolicy(FitPolicy.WIDTH)
                      .pageSnap(false)
                      .autoSpacing(true)
                      .pageFling(false)
                      .nightMode(currentMode == MODE_DARK || currentMode == MODE_NIGHT_BLUE || currentMode == MODE_GREEN)
                      .load();
              }
              private void applyMode() {
                  switch (currentMode) {
                      case MODE_DAY:
                          pdfView.setBackgroundColor(Color.WHITE); break;
                      case MODE_DARK:
                          pdfView.setBackgroundColor(Color.parseColor("#121212")); break;
                      case MODE_SEPIA:
                          pdfView.setBackgroundColor(Color.parseColor("#F5E6C8")); break;
                      case MODE_NIGHT_BLUE:
                          pdfView.setBackgroundColor(Color.parseColor("#0A1628")); break;
                      case MODE_GREEN:
                          pdfView.setBackgroundColor(Color.parseColor("#0D2B0D")); break;
                  }
                  loadPdf();
              }
              private void setupButtons() {
                  findViewById(R.id.btn_back).setOnClickListener(v -> finish());
                  findViewById(R.id.btn_rotate).setOnClickListener(v -> {
                      rotation = (rotation + 90) % 360;
                      pdfView.setRotation(rotation);
                  });
                  findViewById(R.id.btn_bookmark).setOnClickListener(v -> showBookmarks());
                  findViewById(R.id.btn_draw).setOnClickListener(v -> toggleDrawMode());
                  findViewById(R.id.btn_mode).setOnClickListener(v -> showModeDialog());
                  findViewById(R.id.btn_prev).setOnClickListener(v -> {
                      if (currentPage > 0) pdfView.jumpTo(currentPage - 1, true);
                  });
                  findViewById(R.id.btn_next).setOnClickListener(v -> {
                      if (currentPage < totalPages - 1) pdfView.jumpTo(currentPage + 1, true);
                  });
                  findViewById(R.id.btn_fast_up).setOnClickListener(v -> {
                      int target = Math.max(0, currentPage - 10);
                      pdfView.jumpTo(target, true);
                  });
                  findViewById(R.id.btn_fast_down).setOnClickListener(v -> {
                      int target = Math.min(totalPages - 1, currentPage + 10);
                      pdfView.jumpTo(target, true);
                  });
                  seekbar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar s, int p, boolean user) {
                          if (user) pdfView.jumpTo(p, true);
                      }
                      @Override public void onStartTrackingTouch(SeekBar s) {}
                      @Override public void onStopTrackingTouch(SeekBar s) {}
                  });
              }
              private void toggleDrawMode() {
                  drawMode = !drawMode;
                  drawingView.setVisibility(drawMode ? View.VISIBLE : View.GONE);
                  Toast.makeText(this, drawMode ? "Draw mode ON (1 finger=draw, 2=zoom)"
                      : "Draw mode OFF", Toast.LENGTH_SHORT).show();
              }
              private void showModeDialog() {
                  String[] modes = {"Day", "Dark", "Sepia", "Night Blue", "Green"};
                  new AlertDialog.Builder(this)
                      .setTitle("Reading Mode")
                      .setSingleChoiceItems(modes, currentMode, (d, which) -> {
                          currentMode = which;
                          d.dismiss();
                          applyMode();
                      })
                      .show();
              }
              private void showBookmarks() {
                  Toast.makeText(this, "PDF bookmarks shown in scroll handle", Toast.LENGTH_SHORT).show();
              }
              private void updatePageLabel() {
                  tvPage.setText((currentPage + 1) + " / " + totalPages);
              }
              @Override
              protected void onPause() {
                  super.onPause();
                  if (uriStr != null) manager.addOrUpdate(uriStr, fileName, currentPage);
              }
          }
          EOF

