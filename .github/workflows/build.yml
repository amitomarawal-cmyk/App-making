                  open.setTextColor(0xFFFFFFFF);
                  open.setTextSize(16);
                  open.setGravity(Gravity.CENTER);
                  open.setBackgroundColor(0xFF1F6FEB);
                  open.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          pick();
                      }
                  });
                  LinearLayout.LayoutParams olp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(50));
                  olp.setMargins(dp(16), dp(16), dp(16), dp(8));
                  root.addView(open, olp);

                  TextView rec = new TextView(this);
                  rec.setText("সাম্প্রতিক ফাইল");
                  rec.setTextColor(0xFF55627A);
                  rec.setTextSize(13);
                  rec.setPadding(dp(16), dp(8), dp(16), dp(4));
                  root.addView(rec);

                  TextView empty = new TextView(this);
                  empty.setText("এখনো কোনো ফাইল খোলা হয়নি");
                  empty.setTextColor(0xFF8892A6);
                  empty.setGravity(Gravity.CENTER);
                  list = new ListView(this);
                  ad = new BaseAdapter() {
                      public int getCount() {
                          return items.size();
                      }

                      public Object getItem(int i) {
                          return items.get(i);
                      }

                      public long getItemId(int i) {
                          return i;
                      }

                      public View getView(int i, View v, ViewGroup p) {
                          TextView t = v instanceof TextView ? (TextView) v : new TextView(MainActivity.this);
                          Store.Entry e = items.get(i);
                          t.setText(e.name + "\nপৃষ্ঠা " + (e.page + 1) + " / " + e.pages);
                          t.setTextColor(0xFF1F2A3C);
                          t.setTextSize(15);
                          t.setPadding(dp(16), dp(12), dp(16), dp(12));
                          return t;
                      }
                  };
                  list.setAdapter(ad);
                  list.setEmptyView(empty);
                  list.setOnItemClickListener(new AdapterView.OnItemClickListener() {
                      public void onItemClick(AdapterView<?> p, View v, int i, long id) {
                          Store.Entry e = items.get(i);
                          Intent it = new Intent(MainActivity.this, ReaderActivity.class);
                          it.setData(Uri.parse(e.uri == null ? "" : e.uri));
                          it.putExtra("key", e.key);
                          it.putExtra("name", e.name);
                          it.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          startActivity(it);
                      }
                  });
                  list.setOnItemLongClickListener(new AdapterView.OnItemLongClickListener() {
                      public boolean onItemLongClick(AdapterView<?> p, View v, int i, long id) {
                          final Store.Entry e = items.get(i);
                          new AlertDialog.Builder(MainActivity.this).setTitle(e.name).setMessage("এই ফাইলের সংরক্ষিত ডেটা মুছবেন?")
                                  .setPositiveButton("মুছুন", new DialogInterface.OnClickListener() {
                                      public void onClick(DialogInterface d, int w) {
                                          Store.delete(MainActivity.this, e.key);
                                          refresh();
                                      }
                                  }).setNegativeButton("বাতিল", null).show();
                          return true;
                      }
                  });
                  root.addView(empty, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1));
                  root.addView(list, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1));

                  TextView about = new TextView(this);
                  about.setText("Creator: Mohammod Abdul Awal\nStudent: Department of English, National University\nMail: awal.sorkar.144@gmail.com");
                  about.setTextColor(0xFF55627A);
                  about.setTextSize(12);
                  about.setGravity(Gravity.CENTER);
                  about.setBackgroundColor(0xFFE6EBF5);
                  about.setPadding(dp(12), dp(10), dp(12), dp(10));
                  root.addView(about, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  setContentView(root);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
              }

              void refresh() {
                  items.clear();
                  items.addAll(Store.list(this));
                  ad.notifyDataSetChanged();
              }

              void pick() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(i, 1);
              }

              @Override
              protected void onActivityResult(int rc, int res, Intent d) {
                  super.onActivityResult(rc, res, d);
                  if (rc == 1 && res == RESULT_OK && d != null && d.getData() != null) {
                      Uri u = d.getData();
                      try {
                          getContentResolver().takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } catch (Exception e) {
                      }
                      Intent it = new Intent(this, ReaderActivity.class);
                      it.setData(u);
                      it.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(it);
                  }
              }
          }
