      - name: MainActivity.java
        run: |
          cat > app/src/main/java/com/awal/launcher/MainActivity.java << 'EOF'
          package com.awal.launcher;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.media.AudioManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.GestureDetector;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.recyclerview.widget.GridLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final int REQ_PATTERN=101, REQ_SETUP=102;
              private Handler handler=new Handler();
              private TextView bigClock,fullDate,statusTime,statusDate;
              private RecyclerView appGrid;
              private AppAdapter adapter;
              private List<AppInfo> appList=new ArrayList<>();
              private SharedPreferences usagePrefs,patternPrefs;
              private WeatherManager weatherMgr;
              private LinearLayout dockRow,widgetRow;
              private GestureDetector powerGesture;
              private AudioManager audioMgr;
              private AppInfo pendingLaunch;

              private Runnable tick=new Runnable(){@Override public void run(){clock();handler.postDelayed(this,1000);}};

              @Override protected void onCreate(Bundle s){
                  super.onCreate(s);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  setContentView(R.layout.activity_main);
                  usagePrefs=getSharedPreferences("usage",MODE_PRIVATE);
                  patternPrefs=getSharedPreferences("patterns",MODE_PRIVATE);
                  audioMgr=(AudioManager)getSystemService(AUDIO_SERVICE);
                  weatherMgr=new WeatherManager(this);
                  bigClock=findViewById(R.id.bigClock);
                  fullDate=findViewById(R.id.fullDate);
                  statusTime=findViewById(R.id.statusTime);
                  statusDate=findViewById(R.id.statusDate);
                  appGrid=findViewById(R.id.appGrid);
                  dockRow=findViewById(R.id.dockRow);
                  widgetRow=findViewById(R.id.widgetRow);
                  appGrid.setLayoutManager(new GridLayoutManager(this,4));
                  adapter=new AppAdapter(appList,this::onAppClick,this::onAppLongClick);
                  appGrid.setAdapter(adapter);
                  setupWidgets();
                  setupPower();
                  loadApps();
                  loadWeather();
              }

              private void setupWidgets(){
                  String[][] w={{"☀","weather"},{"🗓","calendar"},{"🧮","calc"},{"🧭","compass"},{"🚗","speed"}};
                  for(String[] item:w){
                      LinearLayout card=new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setGravity(android.view.Gravity.CENTER);
                      GradientDrawable bg=new GradientDrawable();
                      bg.setCornerRadius(20*getResources().getDisplayMetrics().density);
                      bg.setColor(0x2AFFFFFF);
                      bg.setStroke(1,(int)0x55FFFFFF);
                      card.setBackground(bg);
                      LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(120,130);
                      lp.setMargins(8,0,8,0);
                      card.setLayoutParams(lp);
                      TextView tv=new TextView(this);
                      tv.setText(item[0]);tv.setTextSize(32);
                      tv.setGravity(android.view.Gravity.CENTER);
                      card.addView(tv);
                      TextView label=new TextView(this);
                      label.setTextColor(0xCCFFFFFF);
                      label.setTextSize(10);
                      label.setGravity(android.view.Gravity.CENTER);
                      if("weather".equals(item[1]))label.setTag("weather_label");
                      card.addView(label);
                      final String type=item[1];
                      card.setOnClickListener(v->handleWidget(type));
                      widgetRow.addView(card);
                  }
              }

              private void handleWidget(String t){
                  if("calendar".equals(t)){showCalendar();}
                  else if("weather".equals(t)){showWeatherFull();}
                  else{new AlertDialog.Builder(this).setTitle(t.toUpperCase())
                      .setMessage("Feature active.\nMore detail in full version.")
                      .setPositiveButton("OK",null).show();}
              }

              private void showCalendar(){
                  new AlertDialog.Builder(this)
                      .setTitle("Calendar")
                      .setMessage(buildCalendar())
                      .setPositiveButton("OK",null).show();
              }

              private String buildCalendar(){
                  java.util.Calendar c=java.util.Calendar.getInstance();
                  java.text.SimpleDateFormat mf=new java.text.SimpleDateFormat("MMMM yyyy",Locale.ENGLISH);
                  StringBuilder sb=new StringBuilder(mf.format(c.getTime())+"\n\nSu Mo Tu We Th Fr Sa\n");
                  int today=c.get(java.util.Calendar.DAY_OF_MONTH);
                  c.set(java.util.Calendar.DAY_OF_MONTH,1);
                  int first=c.get(java.util.Calendar.DAY_OF_WEEK)-1;
                  int max=c.getActualMaximum(java.util.Calendar.DAY_OF_MONTH);
                  int col=0;
                  for(int i=0;i<first;i++){sb.append("   ");col++;}
                  for(int d=1;d<=max;d++){
                      sb.append(d==today?String.format("[%2d]",d):String.format(" %2d ",d));
                      if(++col%7==0)sb.append("\n");
                  }
                  return sb.toString();
              }

              private List<WeatherData> cachedWeather;
              private void showWeatherFull(){
                  if(cachedWeather==null){new AlertDialog.Builder(this).setMessage("Loading...").show();return;}
                  StringBuilder sb=new StringBuilder("7-Day Forecast\n\n");
                  for(WeatherData d:cachedWeather)
                      sb.append(d.icon+" "+d.day+": "+d.condition+" "+d.tempHigh+"°/"+d.tempLow+"°C\n");
                  new AlertDialog.Builder(this).setTitle("Weather").setMessage(sb).setPositiveButton("OK",null).show();
              }

              private void setupPower(){
                  TextView powerBtn=findViewById(R.id.powerBtn);
                  powerGesture=new GestureDetector(this,new GestureDetector.SimpleOnGestureListener(){
                      @Override public boolean onFling(MotionEvent e1,MotionEvent e2,float vx,float vy){
                          float dx=e2.getX()-e1.getX(),dy=e2.getY()-e1.getY();
                          if(Math.abs(dx)>Math.abs(dy)){
                              audioMgr.adjustStreamVolume(AudioManager.STREAM_MUSIC,
                                  dx>0?AudioManager.ADJUST_RAISE:AudioManager.ADJUST_LOWER,
                                  AudioManager.FLAG_SHOW_UI);
                          } else {
                              try{
                                  int cur=android.provider.Settings.System.getInt(getContentResolver(),android.provider.Settings.System.SCREEN_BRIGHTNESS);
                                  int next=dy<0?Math.min(255,cur+25):Math.max(0,cur-25);
                                  android.provider.Settings.System.putInt(getContentResolver(),android.provider.Settings.System.SCREEN_BRIGHTNESS,next);
                              }catch(Exception ignored){}
                          }
                          return true;
                      }
                  });
                  powerBtn.setOnTouchListener((v,ev)->{powerGesture.onTouchEvent(ev);return false;});
                  powerBtn.setOnClickListener(v->{
                      android.app.KeyguardManager km=(android.app.KeyguardManager)getSystemService(KEYGUARD_SERVICE);
                      moveTaskToBack(true);
                  });
              }

              private void loadApps(){
                  new Thread(()->{
                      Intent intent=new Intent(Intent.ACTION_MAIN,null);
                      intent.addCategory(Intent.CATEGORY_LAUNCHER);
                      PackageManager pm=getPackageManager();
                      List<ResolveInfo> res=pm.queryIntentActivities(intent,0);
                      List<AppInfo> list=new ArrayList<>();
                      List<AppInfo> dock=new ArrayList<>();
                      String[] dockPkgs={"com.android.dialer","com.android.messaging",
                          "com.android.chrome","com.android.camera2","com.android.settings"};
                      for(ResolveInfo ri:res){
                          String pkg=ri.activityInfo.packageName;
                          if(pkg.equals(getPackageName()))continue;
                          String lbl=ri.loadLabel(pm).toString();
                          int cnt=usagePrefs.getInt(pkg,0);
                          boolean locked=patternPrefs.getString("pattern_"+pkg,null)!=null;
                          AppInfo ai=new AppInfo(lbl,pkg,ri.loadIcon(pm),cnt,locked);
                          list.add(ai);
                          for(String dp:dockPkgs){if(pkg.contains(dp.split("\\.")[2]))dock.add(ai);}
                      }
                      Collections.sort(list,(a,b)->{
                          if(b.launchCount!=a.launchCount)return b.launchCount-a.launchCount;
                          return a.label.compareToIgnoreCase(b.label);
                      });
                      final List<AppInfo> dockFinal=dock.size()>5?dock.subList(0,5):dock;
                      runOnUiThread(()->{
                          appList.clear();appList.addAll(list);adapter.update(appList);
                          buildDock(dockFinal,pm);
                      });
                  }).start();
              }

              private void buildDock(List<AppInfo> dock, PackageManager pm){
                  dockRow.removeAllViews();
                  for(AppInfo a:dock){
                      LinearLayout cell=new LinearLayout(this);
                      cell.setOrientation(LinearLayout.VERTICAL);
                      cell.setGravity(android.view.Gravity.CENTER);
                      LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(0,LinearLayout.LayoutParams.MATCH_PARENT,1f);
                      cell.setLayoutParams(lp);
                      ImageView iv=new ImageView(this);
                      iv.setImageDrawable(a.icon);
                      iv.setLayoutParams(new LinearLayout.LayoutParams(52,52));
                      iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      cell.addView(iv);
                      cell.setOnClickListener(v->onAppClick(a));
                      dockRow.addView(cell);
                  }
              }

              private void onAppClick(AppInfo a){
                  if(a.patternLocked){
                      pendingLaunch=a;
                      Intent i=new Intent(this,PatternLockActivity.class);
                      i.putExtra("package",a.packageName);
                      startActivityForResult(i,REQ_PATTERN);
                  } else { launchApp(a); }
              }

              private void onAppLongClick(AppInfo a){
                  String[] opts=a.patternLocked?
                      new String[]{"Open","Remove Pattern Lock"}:
                      new String[]{"Open","Set Pattern Lock"};
                  new AlertDialog.Builder(this)
                      .setTitle(a.label)
                      .setItems(opts,(d,which)->{
                          if(which==0){onAppClick(a);}
                          else if(a.patternLocked){
                              patternPrefs.edit().remove("pattern_"+a.packageName).apply();
                              a.patternLocked=false;
                              adapter.update(appList);
                          } else {
                              pendingLaunch=null;
                              Intent i=new Intent(this,PatternSetupActivity.class);
                              i.putExtra("package",a.packageName);
                              startActivityForResult(i,REQ_SETUP);
                          }
                      }).show();
              }

              @Override protected void onActivityResult(int req,int res,Intent data){
                  if(req==REQ_PATTERN && res==RESULT_OK && pendingLaunch!=null){
                      launchApp(pendingLaunch); pendingLaunch=null;
                  } else if(req==REQ_SETUP && res==RESULT_OK){
                      for(AppInfo a:appList){
                          a.patternLocked=patternPrefs.getString("pattern_"+a.packageName,null)!=null;
                      }
                      adapter.update(appList);
                  }
              }

              private void launchApp(AppInfo a){
                  int c=usagePrefs.getInt(a.packageName,0)+1;
                  usagePrefs.edit().putInt(a.packageName,c).apply();
                  a.launchCount=c;
                  Collections.sort(appList,(x,y)->{
                      if(y.launchCount!=x.launchCount)return y.launchCount-x.launchCount;
                      return x.label.compareToIgnoreCase(y.label);
                  });
                  adapter.update(new ArrayList<>(appList));
                  Intent i=getPackageManager().getLaunchIntentForPackage(a.packageName);
                  if(i!=null)startActivity(i);
              }

              private void loadWeather(){
                  SharedPreferences p=getSharedPreferences("launcher_prefs",MODE_PRIVATE);
                  String loc=p.getString("weather_location","Dhaka");
                  weatherMgr.get(loc,data->{
                      cachedWeather=data;
                      if(!data.isEmpty()){
                          WeatherData t=data.get(0);
                          View wCard=widgetRow.getChildAt(0);
                          if(wCard instanceof LinearLayout){
                              View label=((LinearLayout)wCard).getChildAt(1);
                              if(label instanceof TextView)
                                  ((TextView)label).setText(t.icon+t.tempHigh+"°C");
                          }
                      }
                  });
              }

              private void clock(){
                  Date now=new Date();
                  bigClock.setText(new SimpleDateFormat("HH:mm",Locale.ENGLISH).format(now));
                  fullDate.setText(new SimpleDateFormat("EEEE, MMMM d",Locale.ENGLISH).format(now));
                  statusTime.setText(new SimpleDateFormat("HH:mm",Locale.ENGLISH).format(now));
                  statusDate.setText(new SimpleDateFormat("EEE, MMM d",Locale.ENGLISH).format(now));
              }

              @Override protected void onResume(){super.onResume();handler.post(tick);loadApps();}
              @Override protected void onPause(){super.onPause();handler.removeCallbacks(tick);}
          }
          EOF

