      - name: Create DrawingView.java
        run: |
          cat > app/src/main/java/com/awal/pdfreader/DrawingView.java << 'EOF'
          package com.awal.pdfreader;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.util.AttributeSet;
          import android.view.MotionEvent;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;

          public class DrawingView extends View {
              private Paint paint;
              private Path currentPath;
              private List<DrawingStroke> strokes = new ArrayList<>();
              private boolean drawingEnabled = false;
              private int currentPage = 0;
              private int strokeColor = Color.RED;
              private float strokeWidth = 5f;

              public static class DrawingStroke {
                  public Path path;
                  public Paint paint;
                  public int page;
                  public DrawingStroke(Path p, Paint paint, int page) {
                      this.path = p; this.paint = paint; this.page = page;
                  }
              }

              public DrawingView(Context ctx) { super(ctx); init(); }
              public DrawingView(Context ctx, AttributeSet attrs) { super(ctx, attrs); init(); }

              private void init() {
                  paint = new Paint();
                  paint.setAntiAlias(true);
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeJoin(Paint.Join.ROUND);
                  paint.setStrokeCap(Paint.Cap.ROUND);
                  paint.setColor(strokeColor);
                  paint.setStrokeWidth(strokeWidth);
                  setBackgroundColor(Color.TRANSPARENT);
              }

              public void setDrawingEnabled(boolean enabled) {
                  this.drawingEnabled = enabled;
              }

              public void setCurrentPage(int page) { this.currentPage = page; }

              public void setColor(int color) { strokeColor = color; paint.setColor(color); }

              public void addStrokes(List<DrawingStroke> saved) { strokes.addAll(saved); invalidate(); }

              public List<DrawingStroke> getStrokes() { return strokes; }

              @Override
              protected void onDraw(Canvas canvas) {
                  for (DrawingStroke s : strokes) {
                      if (s.page == currentPage) canvas.drawPath(s.path, s.paint);
                  }
                  if (currentPath != null) canvas.drawPath(currentPath, paint);
              }

              @Override
              public boolean onTouchEvent(MotionEvent event) {
                  if (!drawingEnabled) return false;
                  float x = event.getX(), y = event.getY();
                  switch (event.getAction()) {
                      case MotionEvent.ACTION_DOWN:
                          currentPath = new Path();
                          currentPath.moveTo(x, y);
                          return true;
                      case MotionEvent.ACTION_MOVE:
                          if (currentPath != null) { currentPath.lineTo(x, y); invalidate(); }
                          return true;
                      case MotionEvent.ACTION_UP:
                          if (currentPath != null) {
                              Paint p = new Paint(paint);
                              strokes.add(new DrawingStroke(currentPath, p, currentPage));
                              currentPath = null;
                              invalidate();
                          }
                          return true;
                  }
                  return false;
              }
          }
          EOF

      - name: Create ViewerActivity.java
        run: |
          cat > app/src/main/java/com/awal/pdfreader/ViewerActivity.java << 'EOF'
          package com.awal.pdfreader;

          import android.app.AlertDialog;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.EditText;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import com.github.barteksc.pdfviewer.PDFView;
          import com.github.barteksc.pdfviewer.listener.OnPageChangeListener;
          import com.github.barteksc.pdfviewer.listener.OnLoadCompleteListener;

          public class ViewerActivity extends AppCompatActivity {
              private PDFView pdfView;
              private DrawingView drawingView;
              private TextView tvPageInfo;
              private SeekBar seekBarPage;
              private View pageScrollPanel;
              private SharedPreferences prefs;
              private String fileUri;
              private int totalPages = 1;
              private int currentPage = 0;
              private int rotation = 0;
              private int currentMode = 0;
              private boolean drawingEnabled = false;
              private boolean scrollPanelVisible = false;

              private static final int[] BG_COLORS = {
                  Color.WHITE,
                  Color.parseColor("#F5E6C8"),
                  Color.parseColor("#1A1A2E"),
                  Color.parseColor("#121212"),
                  Color.parseColor("#1B4332")
              };
              private static final String[] MODE_NAMES = {"Normal", "Sepia", "Night", "Dark", "Green"};

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  setContentView(R.layout.activity_viewer);

                  prefs = getSharedPreferences("pdf_reader", MODE_PRIVATE);
                  fileUri = getIntent().getStringExtra("uri");
                  if (fileUri == null && getIntent().getData() != null) {
                      fileUri = getIntent().getData().toString();
                  }

                  pdfView = findViewById(R.id.pdfView);
                  drawingView = new DrawingView(this);
                  tvPageInfo = findViewById(R.id.tvPageInfo);
                  seekBarPage = findViewById(R.id.seekBarPage);
                  pageScrollPanel = findViewById(R.id.pageScrollPanel);

                  findViewById(R.id.btnBack).setOnClickListener(v -> onBackPressed());
                  findViewById(R.id.btnDraw).setOnClickListener(v -> toggleDraw());
                  findViewById(R.id.btnText).setOnClickListener(v -> addText());
                  findViewById(R.id.btnRotate).setOnClickListener(v -> rotatePdf());
                  findViewById(R.id.btnMode).setOnClickListener(v -> showModeDialog());
                  findViewById(R.id.btnBookmark).setOnClickListener(v -> showBookmarks());
                  findViewById(R.id.btnToggleScroll).setOnClickListener(v -> toggleScrollPanel());

                  seekBarPage.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar sb, int p, boolean user) {
                          if (user) pdfView.jumpTo(p, true);
                      }
                      public void onStartTrackingTouch(SeekBar sb) {}
                      public void onStopTrackingTouch(SeekBar sb) {}
                  });

                  currentPage = prefs.getInt("page_" + fileUri, 0);
                  if (fileUri != null) loadPdf();
              }

              private void loadPdf() {
                  try {
                      Uri uri = Uri.parse(fileUri);
                      pdfView.fromUri(uri)
                          .defaultPage(currentPage)
                          .enableSwipe(true)
                          .swipeHorizontal(false)
                          .enableDoubletap(true)
                          .enableAnnotationRendering(true)
                          .spacing(4)
                          .pageFling(false)
                          .pageSnap(false)
                          .autoSpacing(false)
                          .onPageChange((page, count) -> {
                              currentPage = page;
                              totalPages = count;
                              tvPageInfo.setText((page + 1) + " / " + count);
                              seekBarPage.setMax(count - 1);
                              seekBarPage.setProgress(page);
                              if (drawingView != null) drawingView.setCurrentPage(page);
                              prefs.edit().putInt("page_" + fileUri, page).apply();
                          })
                          .onLoad(nbPages -> {
                              totalPages = nbPages;
                              seekBarPage.setMax(nbPages - 1);
                              tvPageInfo.setText((currentPage + 1) + " / " + nbPages);
                          })
                          .load();
                  } catch (Exception e) {
                      Toast.makeText(this, "Cannot open file", Toast.LENGTH_SHORT).show();
                  }
              }

              private void toggleDraw() {
                  drawingEnabled = !drawingEnabled;
                  drawingView.setDrawingEnabled(drawingEnabled);
                  pdfView.setTag(drawingEnabled ? "drawing" : null);
                  Toast.makeText(this, drawingEnabled ? "Draw mode ON" : "Draw mode OFF", Toast.LENGTH_SHORT).show();
              }

              private void addText() {
                  EditText et = new EditText(this);
                  new AlertDialog.Builder(this)
                      .setTitle("Add Text")
                      .setView(et)
                      .setPositiveButton("Add", (d, w) -> {
                          String text = et.getText().toString();
                          if (!text.isEmpty()) {
                              Toast.makeText(this, "Text added: " + text, Toast.LENGTH_SHORT).show();
                          }
                      })
                      .setNegativeButton("Cancel", null)
                      .show();
              }

              private void rotatePdf() {
                  rotation = (rotation + 90) % 360;
                  loadPdf();
              }

              private void showModeDialog() {
                  new AlertDialog.Builder(this)
                      .setTitle("View Mode")
                      .setItems(MODE_NAMES, (d, which) -> {
                          currentMode = which;
                          pdfView.setBackgroundColor(BG_COLORS[which]);
                      })
                      .show();
              }

              private void showBookmarks() {
                  Toast.makeText(this, "Bookmarks: Use PDF outline in file", Toast.LENGTH_SHORT).show();
              }

              private void toggleScrollPanel() {
                  scrollPanelVisible = !scrollPanelVisible;
                  pageScrollPanel.setVisibility(scrollPanelVisible ? View.VISIBLE : View.GONE);
              }

              @Override
              public void onBackPressed() {
                  prefs.edit().putInt("page_" + fileUri, currentPage).apply();
                  super.onBackPressed();
              }
          }
          EOF

