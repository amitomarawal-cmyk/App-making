name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/icontrol/launcher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/anim
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p gradle/wrapper

      - name: Create build.gradle (root)
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          rootProject.name = "iControl Launcher"
          include ':app'
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.icontrol.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.icontrol.launcher"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission"
                  xmlns:tools="http://schemas.android.com/tools"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.iControlLauncher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".LockScreenActivity" android:exported="false"
                      android:screenOrientation="portrait"/>
                  <activity android:name=".AboutActivity" android:exported="false"/>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/icontrol/launcher/MainActivity.java << 'EOF'
          package com.icontrol.launcher;
          import android.app.WallpaperManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.drawable.Drawable;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.GridLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import java.util.Timer;
          import java.util.TimerTask;
          public class MainActivity extends AppCompatActivity {
              private RecyclerView appGrid;
              private TextView clockText, dateText;
              private Timer clockTimer;
              private View controlCenterPanel;
              private boolean ccVisible = false;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  setContentView(R.layout.activity_main);
                  appGrid = findViewById(R.id.app_grid);
                  clockText = findViewById(R.id.clock_text);
                  dateText = findViewById(R.id.date_text);
                  controlCenterPanel = findViewById(R.id.control_center_panel);
                  findViewById(R.id.lock_btn).setOnClickListener(v -> {
                      startActivity(new Intent(this, LockScreenActivity.class));
                      overridePendingTransition(R.anim.fade_in, R.anim.fade_out);
                  });
                  findViewById(R.id.swipe_indicator).setOnClickListener(v -> toggleCC());
                  controlCenterPanel.setOnClickListener(v -> toggleCC());
                  loadWallpaper();
                  loadApps();
                  startClock();
              }
              private void loadWallpaper() {
                  try {
                      Drawable w = WallpaperManager.getInstance(this).getDrawable();
                      if (w != null) ((android.widget.ImageView)findViewById(R.id.wallpaper_view)).setImageDrawable(w);
                  } catch (Exception ignored) {}
              }
              private void loadApps() {
                  List<AppInfo> apps = new ArrayList<>();
                  PackageManager pm = getPackageManager();
                  Intent i = new Intent(Intent.ACTION_MAIN, null);
                  i.addCategory(Intent.CATEGORY_LAUNCHER);
                  for (ResolveInfo ri : pm.queryIntentActivities(i, 0)) {
                      if (ri.activityInfo.packageName.equals(getPackageName())) continue;
                      AppInfo a = new AppInfo();
                      a.label = ri.loadLabel(pm).toString();
                      a.packageName = ri.activityInfo.packageName;
                      a.icon = ri.loadIcon(pm);
                      apps.add(a);
                  }
                  appGrid.setLayoutManager(new GridLayoutManager(this, 4));
                  appGrid.setAdapter(new AppAdapter(this, apps));
              }
              private void startClock() {
                  clockTimer = new Timer();
                  clockTimer.scheduleAtFixedRate(new TimerTask() {
                      @Override public void run() {
                          runOnUiThread(() -> {
                              Date now = new Date();
                              if (clockText != null) clockText.setText(new SimpleDateFormat("h:mm", Locale.getDefault()).format(now));
                              if (dateText != null) dateText.setText(new SimpleDateFormat("EEEE, MMMM d", Locale.getDefault()).format(now));
                          });
                      }
                  }, 0, 1000);
              }
              private void toggleCC() {
                  if (ccVisible) {
                      controlCenterPanel.animate().translationY(-800).alpha(0f).setDuration(300).withEndAction(() -> controlCenterPanel.setVisibility(View.GONE)).start();
                      ccVisible = false;
                  } else {
                      controlCenterPanel.setVisibility(View.VISIBLE);
                      controlCenterPanel.setAlpha(0f);
                      controlCenterPanel.animate().translationY(0).alpha(1f).setDuration(300).start();
                      ccVisible = true;
                  }
              }
              @Override public void onBackPressed() { if (ccVisible) toggleCC(); }
              @Override protected void onDestroy() { super.onDestroy(); if (clockTimer != null) clockTimer.cancel(); }
          }
          EOF

      - name: Create AppInfo.java
        run: |
          cat > app/src/main/java/com/icontrol/launcher/AppInfo.java << 'EOF'
          package com.icontrol.launcher;
          import android.graphics.drawable.Drawable;
          public class AppInfo {
              public String label, packageName;
              public Drawable icon;
          }
          EOF

      - name: Create AppAdapter.java
        run: |
          cat > app/src/main/java/com/icontrol/launcher/AppAdapter.java << 'EOF'
          package com.icontrol.launcher;
          import android.content.Context;
          import android.content.Intent;
          import android.view.*;
          import android.widget.*;
          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.RecyclerView;
          import java.util.List;
          public class AppAdapter extends RecyclerView.Adapter<AppAdapter.VH> {
              private Context ctx; private List<AppInfo> apps;
              public AppAdapter(Context c, List<AppInfo> a) { ctx=c; apps=a; }
              @NonNull @Override public VH onCreateViewHolder(@NonNull ViewGroup p, int t) {
                  return new VH(LayoutInflater.from(ctx).inflate(R.layout.item_app, p, false));
              }
              @Override public void onBindViewHolder(@NonNull VH h, int pos) {
                  AppInfo app = apps.get(pos);
                  h.icon.setImageDrawable(app.icon);
                  h.name.setText(app.label);
                  h.itemView.setOnClickListener(v -> {
                      Intent i = ctx.getPackageManager().getLaunchIntentForPackage(app.packageName);
                      if (i != null) ctx.startActivity(i);
                  });
              }
              @Override public int getItemCount() { return apps.size(); }
              static class VH extends RecyclerView.ViewHolder {
                  ImageView icon; TextView name;
                  VH(View v) { super(v); icon=v.findViewById(R.id.app_icon); name=v.findViewById(R.id.app_name); }
              }
          }
          EOF

      - name: Create LockScreenActivity.java
        run: |
          cat > app/src/main/java/com/icontrol/launcher/LockScreenActivity.java << 'EOF'
          package com.icontrol.launcher;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import java.text.SimpleDateFormat;
          import java.util.*;
          public class LockScreenActivity extends AppCompatActivity {
              private TextView lockClock, lockDate;
              private Timer timer;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON|WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  setContentView(R.layout.activity_lock_screen);
                  lockClock = findViewById(R.id.lock_clock);
                  lockDate = findViewById(R.id.lock_date);
                  findViewById(R.id.lock_root).setOnClickListener(v -> { finish(); overridePendingTransition(R.anim.slide_up, R.anim.fade_out); });
                  timer = new Timer();
                  timer.scheduleAtFixedRate(new TimerTask() {
                      @Override public void run() {
                          runOnUiThread(() -> {
                              Date now = new Date();
                              lockClock.setText(new SimpleDateFormat("h:mm", Locale.getDefault()).format(now));
                              lockDate.setText(new SimpleDateFormat("EEEE, MMMM d", Locale.getDefault()).format(now));
                          });
                      }
                  }, 0, 1000);
              }
              @Override public void onBackPressed() {}
              @Override protected void onDestroy() { super.onDestroy(); if(timer!=null) timer.cancel(); }
          }
          EOF

      - name: Create AboutActivity.java
        run: |
          cat > app/src/main/java/com/icontrol/launcher/AboutActivity.java << 'EOF'
          package com.icontrol.launcher;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class AboutActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) { super.onCreate(s); setContentView(R.layout.activity_about); }
          }
          EOF

      - name: Create BootReceiver.java
        run: |
          cat > app/src/main/java/com/icontrol/launcher/BootReceiver.java << 'EOF'
          package com.icontrol.launcher;
          import android.content.*;
          public class BootReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context ctx, Intent i) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(i.getAction())) {
                      Intent l = new Intent(ctx, MainActivity.class);
                      l.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      ctx.startActivity(l);
                  }
              }
          }
          EOF

      - name: Create Layouts
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000000">
              <ImageView android:id="@+id/wallpaper_view" android:layout_width="match_parent"
                  android:layout_height="match_parent" android:scaleType="centerCrop" android:src="@drawable/default_wallpaper"/>
              <View android:layout_width="match_parent" android:layout_height="match_parent" android:background="#33000000"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent"
                  android:orientation="vertical" android:paddingTop="60dp">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="vertical" android:gravity="center" android:paddingTop="20dp" android:paddingBottom="10dp">
                      <TextView android:id="@+id/clock_text" android:layout_width="wrap_content"
                          android:layout_height="wrap_content" android:text="9:41" android:textColor="#FFFFFF"
                          android:textSize="52sp" android:fontFamily="sans-serif-thin"/>
                      <TextView android:id="@+id/date_text" android:layout_width="wrap_content"
                          android:layout_height="wrap_content" android:text="Monday, June 5"
                          android:textColor="#E0FFFFFF" android:textSize="16sp" android:paddingTop="4dp"/>
                  </LinearLayout>
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/app_grid"
                      android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"
                      android:paddingStart="10dp" android:paddingEnd="10dp" android:clipToPadding="false"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:gravity="center" android:paddingBottom="40dp" android:orientation="vertical">
                      <View android:id="@+id/lock_btn" android:layout_width="50dp" android:layout_height="50dp"
                          android:background="@drawable/lock_btn_bg"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="Lock" android:textColor="#AAFFFFFF" android:textSize="11sp" android:paddingTop="4dp"/>
                  </LinearLayout>
              </LinearLayout>
              <View android:id="@+id/swipe_indicator" android:layout_width="match_parent"
                  android:layout_height="60dp" android:layout_gravity="top" android:background="@android:color/transparent"/>
              <LinearLayout android:id="@+id/control_center_panel" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:orientation="vertical"
                  android:background="@drawable/control_center_bg" android:padding="20dp"
                  android:layout_gravity="top" android:visibility="gone" android:elevation="16dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="Control Centre" android:textColor="#FFFFFF" android:textSize="20sp"
                      android:fontFamily="sans-serif-medium" android:paddingBottom="16dp"/>
                  <GridLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:columnCount="4" android:useDefaultMargins="true">
                      <LinearLayout android:layout_width="70dp" android:layout_height="70dp"
                          android:orientation="vertical" android:gravity="center"
                          android:background="@drawable/control_btn_bg" android:layout_margin="5dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📶" android:textSize="22sp"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Wi-Fi" android:textColor="#FFFFFF" android:textSize="9sp"/>
                      </LinearLayout>
                      <LinearLayout android:layout_width="70dp" android:layout_height="70dp"
                          android:orientation="vertical" android:gravity="center"
                          android:background="@drawable/control_btn_bg" android:layout_margin="5dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔵" android:textSize="22sp"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Bluetooth" android:textColor="#FFFFFF" android:textSize="9sp"/>
                      </LinearLayout>
                      <LinearLayout android:layout_width="70dp" android:layout_height="70dp"
                          android:orientation="vertical" android:gravity="center"
                          android:background="@drawable/control_btn_bg" android:layout_margin="5dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="✈️" android:textSize="22sp"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Airplane" android:textColor="#FFFFFF" android:textSize="9sp"/>
                      </LinearLayout>
                      <LinearLayout android:layout_width="70dp" android:layout_height="70dp"
                          android:orientation="vertical" android:gravity="center"
                          android:background="@drawable/control_btn_bg" android:layout_margin="5dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔦" android:textSize="22sp"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Torch" android:textColor="#FFFFFF" android:textSize="9sp"/>
                      </LinearLayout>
                  </GridLayout>
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:text="iControl • Creator: Mohammod Abdul Awal • Dept. of English, National University"
                      android:textColor="#80FFFFFF" android:textSize="10sp" android:gravity="center" android:paddingTop="14dp"/>
              </LinearLayout>
          </FrameLayout>
          EOF

          cat > app/src/main/res/layout/activity_lock_screen.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/lock_root" android:layout_width="match_parent"
