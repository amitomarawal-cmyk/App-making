import 'dart:io';
import 'dart:isolate';
import 'package:flutter/material.dart';
import 'package:archive/archive_io.dart';
import 'package:xml/xml.dart';
import 'package:hive_flutter/hive_flutter.dart';

Future<List<String>> _parseDocx(String path) async {
  final bytes = File(path).readAsBytesSync();
  final archive = ZipDecoder().decodeBytes(bytes);
  final docFile = archive.findFile('word/document.xml');
  if (docFile == null) return ['Could not parse document.'];
  final xmlStr = String.fromCharCodes(docFile.content as List<int>);
  final doc = XmlDocument.parse(xmlStr);
  final paragraphs = doc.findAllElements('w:p');
  final lines = <String>[];
  for (final p in paragraphs) {
    final runs = p.findAllElements('w:t');
    final text = runs.map((r) => r.innerText).join();
    if (text.trim().isNotEmpty) lines.add(text);
  }
  return lines.isEmpty ? ['(No text content found)'] : lines;
}

List<List<String>> _paginate(List<String> lines, int linesPerPage) {
  final pages = <List<String>>[];
  for (var i = 0; i < lines.length; i += linesPerPage) {
    pages.add(lines.sublist(
        i, i + linesPerPage > lines.length ? lines.length : i + linesPerPage));
  }
  return pages;
}

class DocxViewerScreen extends StatefulWidget {
  final String filePath;
  const DocxViewerScreen({super.key, required this.filePath});
  @override
  State<DocxViewerScreen> createState() => _DocxViewerScreenState();
}

class _DocxViewerScreenState extends State<DocxViewerScreen> {
  List<List<String>> _pages = [];
  int _currentPage = 0;
  bool _loading = true;
  String? _error;
  late PageController _pageCtrl;

  @override
  void initState() {
    super.initState();
    final saved = Hive.box('filePositions').get(widget.filePath);
    _currentPage = (saved is Map ? saved['page'] as int? : null) ?? 0;
    _pageCtrl = PageController(initialPage: _currentPage);
    _load();
  }

  Future<void> _load() async {
    try {
      final lines = await Isolate.run(() => _parseDocx(widget.filePath));
      final pages = _paginate(lines, 30);
      setState(() {
        _pages = pages;
        _loading = false;
      });
    } catch (e) {
      setState(() {
        _error = 'Cannot open DOCX: $e';
        _loading = false;
      });
    }
  }

  void _savePosition(int page) {
    Hive.box('filePositions').put(widget.filePath, {'page': page});
  }

  @override
  void dispose() {
    _pageCtrl.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: Text(_pages.isNotEmpty
            ? 'Page ${_currentPage + 1} / ${_pages.length}'
            : 'DOCX Viewer'),
      ),
      body: _loading
          ? const Center(
              child: Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  CircularProgressIndicator(),
                  SizedBox(height: 12),
                  Text('Parsing document...'),
                ],
              ),
            )
          : _error != null
              ? Center(
                  child: Text(_error!,
                      style: const TextStyle(color: Colors.red),
                      textAlign: TextAlign.center))
              : _pages.isEmpty
                  ? const Center(child: Text('Empty document'))
                  : PageView.builder(
                      controller: _pageCtrl,
                      itemCount: _pages.length,
                      onPageChanged: (i) {
                        setState(() => _currentPage = i);
                        _savePosition(i);
                      },
                      itemBuilder: (_, pageIdx) {
                        final lines = _pages[pageIdx];
                        return Container(
                          margin: const EdgeInsets.all(16),
                          padding: const EdgeInsets.all(20),
                          decoration: BoxDecoration(
                            color:
                                Theme.of(context).brightness == Brightness.dark
                                    ? Colors.grey[850]
                                    : Colors.white,
                            borderRadius: BorderRadius.circular(8),
                            boxShadow: [
                              BoxShadow(
                                  color: Colors.black.withOpacity(0.1),
                                  blurRadius: 8,
                                  offset: const Offset(0, 2))
                            ],
                          ),
                          child: SingleChildScrollView(
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: lines
                                  .map((l) => Padding(
                                        padding: const EdgeInsets.symmetric(
                                            vertical: 3),
                                        child: Text(l,
                                            style:
                                                const TextStyle(fontSize: 15)),
                                      ))
                                  .toList(),
                            ),
                          ),
                        );
                      },
                    ),
      bottomNavigationBar: _pages.isNotEmpty
          ? BottomAppBar(
              child: Row(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  IconButton(
                      icon: const Icon(Icons.chevron_left),
                      onPressed: _currentPage > 0
                          ? () => _pageCtrl.previousPage(
                              duration: const Duration(milliseconds: 300),
                              curve: Curves.easeInOut)
                          : null),
                  Text('${_currentPage + 1} / ${_pages.length}',
                      style: const TextStyle(fontSize: 16)),
                  IconButton(
                      icon: const Icon(Icons.chevron_right),
                      onPressed: _currentPage < _pages.length - 1
                          ? () => _pageCtrl.nextPage(
                              duration: const Duration(milliseconds: 300),
                              curve: Curves.easeInOut)
                          : null),
                ],
              ),
            )
          : null,
    );
  }
}
