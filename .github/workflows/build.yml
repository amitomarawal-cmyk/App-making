          .logo{width:38px;height:38px;border-radius:50%;background:#3e2723;color:#ffca28;font-size:26px;display:flex;align-items:center;justify-content:center;border:2px solid #ffca28}
          .ttl{flex:1;font-weight:700;font-size:20px;line-height:1}
          .ttl small{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:3px}
          button,select{font:inherit}
