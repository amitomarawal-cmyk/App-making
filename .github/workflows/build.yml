      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/awal/pdfreader/MainActivity.java << 'EOF'
          package com.awal.pdfreader;

          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;
          import com.google.android.material.floatingactionbutton.FloatingActionButton;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              private static final int FILE_PICK_CODE = 1001;
              private RecyclerView recyclerView;
              private TextView tvEmpty;
              private FileAdapter adapter;
              private List<FileItem> fileItems = new ArrayList<>();
              private SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  prefs = getSharedPreferences("pdf_reader", MODE_PRIVATE);
                  recyclerView = findViewById(R.id.recyclerView);
                  tvEmpty = findViewById(R.id.tvEmpty);
                  FloatingActionButton fab = findViewById(R.id.fabOpen);
                  adapter = new FileAdapter(fileItems, this::openFile, this::deleteFile);
                  recyclerView.setLayoutManager(new LinearLayoutManager(this));
                  recyclerView.setAdapter(adapter);
                  fab.setOnClickListener(v -> pickFile());
                  loadRecentFiles();
              }

              private void pickFile() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("*/*");
                  String[] mimes = {"application/pdf", "application/msword",
                      "application/vnd.openxmlformats-officedocument.wordprocessingml.document"};
                  intent.putExtra(Intent.EXTRA_MIME_TYPES, mimes);
                  startActivityForResult(intent, FILE_PICK_CODE);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == FILE_PICK_CODE && res == RESULT_OK && data != null) {
                      Uri uri = data.getData();
                      if (uri != null) {
                          getContentResolver().takePersistableUriPermission(uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          openFile(uri.toString());
                      }
                  }
              }

              private void openFile(String uriStr) {
                  addToRecent(uriStr);
                  Intent intent = new Intent(this, ViewerActivity.class);
                  intent.putExtra("uri", uriStr);
                  startActivity(intent);
              }

              private void deleteFile(int position) {
                  fileItems.remove(position);
                  adapter.notifyItemRemoved(position);
                  saveRecentFiles();
                  updateEmptyState();
              }

              private void addToRecent(String uriStr) {
                  for (int i = 0; i < fileItems.size(); i++) {
                      if (fileItems.get(i).uri.equals(uriStr)) {
                          FileItem item = fileItems.remove(i);
                          fileItems.add(0, item);
                          adapter.notifyDataSetChanged();
                          saveRecentFiles();
                          return;
                      }
                  }
                  String name = getFileName(uriStr);
                  FileItem item = new FileItem(uriStr, name, System.currentTimeMillis());
                  fileItems.add(0, item);
                  if (fileItems.size() > 100) fileItems.remove(fileItems.size() - 1);
                  adapter.notifyDataSetChanged();
                  saveRecentFiles();
                  updateEmptyState();
              }

              private String getFileName(String uriStr) {
                  try {
                      Uri uri = Uri.parse(uriStr);
                      android.database.Cursor cursor = getContentResolver().query(uri, null, null, null, null);
                      if (cursor != null && cursor.moveToFirst()) {
                          int idx = cursor.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0) {
                              String name = cursor.getString(idx);
                              cursor.close();
                              return name;
                          }
                          cursor.close();
                      }
                  } catch (Exception e) { }
                  return uriStr.substring(uriStr.lastIndexOf('/') + 1);
              }

              private void saveRecentFiles() {
                  try {
                      JSONArray arr = new JSONArray();
                      for (FileItem item : fileItems) {
                          JSONObject obj = new JSONObject();
                          obj.put("uri", item.uri);
                          obj.put("name", item.name);
                          obj.put("time", item.lastOpened);
                          arr.put(obj);
                      }
                      prefs.edit().putString("recent_files", arr.toString()).apply();
                  } catch (Exception e) { }
              }

              private void loadRecentFiles() {
                  try {
                      String json = prefs.getString("recent_files", "[]");
                      JSONArray arr = new JSONArray(json);
                      fileItems.clear();
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject obj = arr.getJSONObject(i);
                          fileItems.add(new FileItem(obj.getString("uri"), obj.getString("name"), obj.getLong("time")));
                      }
                      adapter.notifyDataSetChanged();
                  } catch (Exception e) { }
                  updateEmptyState();
              }

              private void updateEmptyState() {
                  tvEmpty.setVisibility(fileItems.isEmpty() ? View.VISIBLE : View.GONE);
                  recyclerView.setVisibility(fileItems.isEmpty() ? View.GONE : View.VISIBLE);
              }
          }
          EOF

      - name: Create FileItem.java
        run: |
          cat > app/src/main/java/com/awal/pdfreader/FileItem.java << 'EOF'
          package com.awal.pdfreader;

          public class FileItem {
              public String uri;
              public String name;
              public long lastOpened;
              public int lastPage;

              public FileItem(String uri, String name, long lastOpened) {
                  this.uri = uri;
                  this.name = name;
                  this.lastOpened = lastOpened;
                  this.lastPage = 0;
              }
          }
          EOF

      - name: Create FileAdapter.java
        run: |
          cat > app/src/main/java/com/awal/pdfreader/FileAdapter.java << 'EOF'
          package com.awal.pdfreader;

          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.ImageButton;
          import android.widget.TextView;
          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.RecyclerView;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class FileAdapter extends RecyclerView.Adapter<FileAdapter.VH> {
              private List<FileItem> items;
              private OnFileClickListener clickListener;
              private OnFileDeleteListener deleteListener;

              public interface OnFileClickListener { void onFileClick(String uri); }
              public interface OnFileDeleteListener { void onFileDelete(int position); }

              public FileAdapter(List<FileItem> items, OnFileClickListener cl, OnFileDeleteListener dl) {
                  this.items = items;
                  this.clickListener = cl;
                  this.deleteListener = dl;
              }

              @NonNull @Override
              public VH onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                  View v = LayoutInflater.from(parent.getContext()).inflate(R.layout.item_file, parent, false);
                  return new VH(v);
              }

              @Override
              public void onBindViewHolder(@NonNull VH h, int position) {
                  FileItem item = items.get(position);
                  h.tvName.setText(item.name);
                  boolean isPdf = item.name.toLowerCase().endsWith(".pdf");
                  h.tvIcon.setText(isPdf ? "📕" : "📝");
                  String date = new SimpleDateFormat("dd MMM, HH:mm", Locale.getDefault()).format(new Date(item.lastOpened));
                  h.tvInfo.setText(date);
                  h.tvLastPage.setText(item.lastPage > 0 ? "Last: Page " + (item.lastPage + 1) : "");
                  h.itemView.setOnClickListener(v -> clickListener.onFileClick(item.uri));
                  h.btnDelete.setOnClickListener(v -> deleteListener.onFileDelete(h.getAdapterPosition()));
              }

              @Override public int getItemCount() { return items.size(); }

              static class VH extends RecyclerView.ViewHolder {
                  TextView tvName, tvInfo, tvLastPage, tvIcon;
                  ImageButton btnDelete;
                  VH(View v) {
                      super(v);
                      tvName = v.findViewById(R.id.tvFileName);
                      tvInfo = v.findViewById(R.id.tvFileInfo);
                      tvLastPage = v.findViewById(R.id.tvLastPage);
                      tvIcon = v.findViewById(R.id.tvFileIcon);
                      btnDelete = v.findViewById(R.id.btnDelete);
                  }
              }
          }
