      - name: Create RecentFile model
        run: |
          cat > app/src/main/java/com/awal/pdfreader/RecentFile.java << 'EOF'
          package com.awal.pdfreader;
          public class RecentFile {
              public String path, name;
              public int lastPage;
              public long lastOpened;
              public RecentFile(String path, String name, int lastPage, long lastOpened) {
                  this.path = path; this.name = name;
                  this.lastPage = lastPage; this.lastOpened = lastOpened;
