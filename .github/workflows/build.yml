                      if(SensorManager.getRotationMatrix(R,I,grav,geom)){
                          float[] or=new float[3];SensorManager.getOrientation(R,or);
                          float deg=(float)Math.toDegrees(or[0]);if(deg<0)deg+=360;
                          cv.setBearing(deg);degTV.setText(String.format("%.0f°",deg));
                          dirTV.setText(DIRS[(int)((deg+22.5)/45)%8]);
                      }
                  }
              }
