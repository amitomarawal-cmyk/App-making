              }

              @Override
              protected void onPause() {
                  super.onPause();
                  save();
              }

              @Override
              public void onLowMemory() {
                  super.onLowMemory();
                  view.trim();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  h.removeCallbacks(saver);
                  view.destroy();
              }
          }
