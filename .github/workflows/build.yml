          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Bundle;
          import android.widget.TextView;
          public class CompassActivity extends Activity implements SensorEventListener {
              private SensorManager sm;
              private Sensor acc,mag;
              private float[] grav,geom;
              private CompassView cv;
              private TextView degTV,dirTV;
              private static final String[] DIRS={"N","NE","E","SE","S","SW","W","NW"};
              @Override protected void onCreate(Bundle s){
                  super.onCreate(s);setContentView(R.layout.activity_compass);
                  cv=findViewById(R.id.compassView);degTV=findViewById(R.id.compassDegree);dirTV=findViewById(R.id.compassDirection);
                  sm=(SensorManager)getSystemService(SENSOR_SERVICE);
                  acc=sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);mag=sm.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD);
                  findViewById(R.id.btnBack).setOnClickListener(v->finish());
              }
              @Override protected void onResume(){super.onResume();sm.registerListener(this,acc,SensorManager.SENSOR_DELAY_UI);sm.registerListener(this,mag,SensorManager.SENSOR_DELAY_UI);}
              @Override protected void onPause(){super.onPause();sm.unregisterListener(this);}
              @Override public void onSensorChanged(SensorEvent e){
                  if(e.sensor.getType()==Sensor.TYPE_ACCELEROMETER)grav=e.values.clone();
                  if(e.sensor.getType()==Sensor.TYPE_MAGNETIC_FIELD)geom=e.values.clone();
                  if(grav!=null&&geom!=null){
                      float[] R=new float[9],I=new float[9];
                      if(SensorManager.getRotationMatrix(R,I,grav,geom)){
                          float[] or=new float[3];SensorManager.getOrientation(R,or);
                          float deg=(float)Math.toDegrees(or[0]);if(deg<0)deg+=360;
                          cv.setBearing(deg);degTV.setText(String.format("%.0f°",deg));
                          dirTV.setText(DIRS[(int)((deg+22.5)/45)%8]);
                      }
                  }
              }
              @Override public void onAccuracyChanged(Sensor s,int a){}
          }
