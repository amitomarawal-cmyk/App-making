              public interface OnLongClick{void on(AppInfo a);}
              public AppAdapter(List<AppInfo> a,OnClick c,OnLongClick l){apps=a;click=c;longClick=l;}
              public void update(List<AppInfo> a){apps=a;notifyDataSetChanged();}

